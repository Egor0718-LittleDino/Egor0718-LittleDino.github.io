⽩（GLUT4）的作⽤","胰島素增加肝臟hexokinase的活性","胰島素增加肝外組織hexokinase的活性"],"a":[1],"ch":["14"],"sec":"14.1","fbt":""},{"id":"M-108-1_90","t":"M","y":108,"q":"下列何者不是細胞內acetyl-CoA的主要來源？","o":["fatty acids","ketogenic amino acids","pyrimidine","pyruvate"],"a":[2],"ch":["16"],"sec":"","fbt":""},{"id":"M-108-1_91","t":"M","y":108,"q":"下列有關glutathione（GSH）的敘述，何者錯誤 ？","o":["由Glu、Cys及Gly三種胺基酸組成","某些種類的leukotriene的⽣合成需要glutathione的參與","GSH被氧化時，經由雙硫鍵的形成產⽣glutathione disulfide（GSSG）","glutathione reductase利⽤ATP可直接將GSSG還原成2個GSH"],"a":[3],"ch":["22"],"sec":"","fbt":"Figure 22-29","ex":["GSH 是 γ-Glu-Cys-Gly 三胜肽（Glu 以 γ-羧基形成胜肽鍵），敘述正確。","LTC4 等 cysteinyl leukotriene 的生成需要 GSH 接上，敘述正確。","兩分子 GSH 的 Cys 硫醇基氧化形成雙硫鍵成 GSSG，敘述正確。","glutathione reductase 用的還原力是 NADPH（經 FAD 傳遞），不是 ATP，故此敘述錯誤。"]},{"id":"M-108-1_92","t":"M","y":108,"q":"下列那⼀種胺基酸為腎上腺素（epinephrine）⽣合成的前驅物？","o":["glycine","tryptophan","histidine","tyrosine"],"a":[3],"ch":["22"],"sec":"","fbt":"Figure 22-31","ex":["甘胺酸是血基質、嘌呤、glutathione 與肌酸的前驅物。","色胺酸走 serotonin 與菸鹼酸。","組胺酸脫羧成組織胺。","酪胺酸 → DOPA → dopamine → norepinephrine → epinephrine。"]},{"id":"M-108-1_93","t":"M","y":108,"q":"下列何種物質可經由轉氨基作⽤（transamination）直接合成glutamic acid？","o":["α-ketoglutarate","pyruvate","acetoacetate","oxaloacetate"],"a":[0],"ch":["18"],"sec":"","fbt":"Figure 18-4","ex":["α-ketoglutarate 接受胺基後直接變成 glutamate，這是所有轉胺反應匯集胺基的共同受體。","丙酮酸接受胺基後生成 alanine。","acetoacetate 是酮體，不是轉胺反應的胺基受體。","oxaloacetate 接受胺基後生成 aspartate。"]},{"id":"M-108-1_94","t":"M","y":108,"q":"下列那⼀種胺基酸是⾎清素（serotonin）⽣合成的前驅物？","o":["arginine","glutamic acid","tryptophan","tyrosine"],"a":[2],"ch":["22"],"sec":"","fbt":"Figure 22-31","ex":["精胺酸是 NO 與尿素的前驅物。","穀胺酸脫羧成 GABA。","色胺酸經 tryptophan hydroxylase 與脫羧酶生成血清素。","酪胺酸走兒茶酚胺、甲狀腺素與黑色素。"]},{"id":"M-108-1_95","t":"M","y":108,"q":"下列關於ATP synthase的敘述，何者錯誤？","o":["位於粒線體內膜","使⽤粒線體內膜兩側的氫離⼦濃度差合成ATP","ATP會在粒線體內膜及外膜之間的間隙中形成","合成ATP的過程中涉及ATP synthase之四級結構變化"],"a":[2],"ch":["19"],"sec":"19.2","fbt":""},{"id":"M-108-1_96","t":"M","y":108,"q":"下列關於電⼦傳遞鏈的敘述，何者錯誤？","o":["氧分⼦（O2）為電⼦最終的接受者","NADH的氧化發⽣於complex I","Coenzyme Q（CoQ）可協助將電⼦由complex I傳遞⾄complex II","Cytochrome c（Cyt c）可協助將電⼦由complex III傳遞⾄complex IV"],"a":[2],"ch":["19"],"sec":"19.1","fbt":""},{"id":"M-108-1_97","t":"M","y":108,"q":"下列何種情況會刺激DNA合成所需酵素的⽣成，進⽽使細胞週期從G1期進入S期？","o":["p53蛋⽩質被活化","p21蛋⽩質⼤量產⽣","CDK2磷酸化retinoblastoma protein（pRb）","形成pRb-E2F複合體"],"a":[2],"ch":["12"],"sec":"12.1","fbt":"","ex":["p53 活化會誘導 p21 → 抑制 CDK → 細胞週期停滯，不會進入 S 期。","p21 是 CDK 抑制蛋白，大量產生會阻止 G1／S 轉換。","cyclin E–CDK2 磷酸化 pRb，使 E2F 釋出，啟動 DNA 合成所需酵素的轉錄，推動 G1 → S。","pRb–E2F 複合體會把 E2F 關住，阻止進入 S 期。"]},{"id":"M-108-1_98","t":"M","y":108,"q":"下列何種蛋⽩質與G蛋⽩（G protein）的訊息傳遞路徑無關？","o":["類固醇受體（steroid receptors）","腺苷酸環化酶（adenylyl cyclase）","磷脂酶C（phospholipase C）","Ras蛋⽩"],"a":[0],"ch":["12"],"sec":"12.2、12.8","fbt":"","ex":["類固醇受體是核內轉錄因子，不經 G 蛋白傳訊，故與 G 蛋白路徑無關。","adenylyl cyclase 是 Gs／Gi 的下游效應物。","phospholipase C 是 Gq 的下游效應物。","Ras 屬於小 GTP 結合蛋白（small GTPase）家族，是 G 蛋白的一員。"]},{"id":"M-108-1_99","t":"M","y":108,"q":"攜鈣素（Calmodulin）不具有下列那種特性？","o":["與鈣離⼦結合會改變其構型","含有⼀個兩性（amphipathic）的β層（β-sheet）能與標靶蛋⽩質（target protein）相互作⽤","調節許多蛋⽩激酶（protein kinase）的活性","以螺旋-環-螺旋結構（helix-loop-helix motif）與鈣離⼦結合"],"a":[1],"ch":["12"],"sec":"12.2","fbt":"","ex":["結合鈣後構型改變、露出疏水面，是 calmodulin 的基本性質。","calmodulin 是以兩性的 α 螺旋（不是 β 層）與標靶蛋白結合，故此性質它不具有。","calmodulin 調節 CaM kinase 等許多蛋白激酶的活性。","以 EF hand 的 helix-loop-helix motif 結合鈣離子。"]},{"id":"M-108-2_100","t":"M","y":108,"q":"下列何者不適合利用 restriction fragment length polymorphism（RFLP）分析？","o":["DNA指紋鑑定（DNA fingerprinting）","疾病基因之定位","可能遺傳缺陷的產前篩選","建立cDNA library"],"a":[3],"ch":["9"],"sec":"","fbt":"","ex":["RFLP 比較不同個體限制酶切片段的長度差異，是經典的 DNA 指紋鑑定方法。","RFLP 標記可用於與疾病基因連鎖分析而定位基因。","若致病突變剛好改變限制酶切點（如鐮刀型貧血），RFLP 可用於產前診斷。","建立 cDNA library 要先抽 mRNA、用反轉錄酶做成 cDNA 再接入載體，與限制酶切片段長度的多態性分析無關。"]},{"id":"M-108-2_74","t":"M","y":108,"q":"下列有關蛋白質結構的敘述，何者正確？","o":["mRNA的選擇性剪切（alternative splicing）不會影響蛋白質的一級結構","點突變（point mutation）不會導致蛋白質二級結構的改變","β-摺板（β-sheet）與α-螺旋（α-helix）在蛋白質結構分類上屬於三級結構","某些蛋白質可能以一種以上的四級結構存在"],"a":[3],"ch":["4"],"sec":"","fbt":""},{"id":"M-108-2_75","t":"M","y":108,"q":"下列有關雙硫鍵（disulfide bond）的敘述，何者錯誤？","o":["甲硫胺酸（methionine）側鏈的硫原子可參與雙硫鍵的形成","蛋白質中的雙硫鍵會在強還原劑的作用下發生斷裂","蛋白質中的雙硫鍵可增加其結構的熱穩定性","雙硫鍵異構酶（disulfide isomerase）可幫助蛋白質摺疊"],"a":[0],"ch":["3"],"sec":"","fbt":"Figure 3-7"},{"id":"M-108-2_76","t":"M","y":108,"q":"以NaOH強鹼滴定含有甘胺酸（glycine）的溶液，在pH＝12時，完成滴定過程，此時甘胺酸的主要化學式為何？","o":["NH3\n+—CH2—COOH","NH2—CH2—COO-+—COO-","NH2—CH3+—CH2—COO-","NH3"],"a":[1],"ch":["3"],"sec":"","fbt":"Fgure 3-10"},{"id":"M-108-2_77","t":"M","y":108,"q":"一位女性病患素食多年，患有惡性貧血（pernicious anemia），判斷她有某種含金屬離子的水溶性維生素缺乏症。關於此維生素的特性，下列敘述何者正確？","o":["此維生素須含有氰基，方能直接參與酵素反應形態","此維生素須含有一鐵離子才帶有活性","此維生素含有鈷離子","小腸壁的細胞會分泌一種結合蛋白質，促進此維生素的吸收"],"a":[2],"ch":["17"],"sec":"","fbt":"Box 17-2","ex":["氰基鈷胺素是人工合成的穩定型式；體內真正的輔酶型是 methylcobalamin 與 5′-deoxyadenosylcobalamin，並不需要氰基。","它含的是鈷離子，不是鐵離子。","維生素 B12（鈷胺素）的咕啉環中心配位一個鈷離子，是人體唯一含金屬的維生素。","促進 B12 吸收的內在因子（intrinsic factor）由「胃」的壁細胞分泌，之後在迴腸末端吸收；惡性貧血正是自體免疫破壞壁細胞／內在因子所致，不是小腸壁細胞分泌。"]},{"id":"M-108-2_78","t":"M","y":108,"q":"紅血球生成素（erythropoietin; EPO）的作用機制牽涉到JAK-STAT（Janus kinase-signal transducers and activators of transcription）系統。下列敘述何者正確？","o":["EPO受體為JAK蛋白質","EPO與受體結合後，受體蛋白質會被JAK磷酸化","EPO與受體結合後，受體蛋白質會被STAT磷酸化","EPO與受體結合形成的 complex 會移入細胞核內，調控特定基因的表現"],"a":[1],"ch":["23"],"sec":"","fbt":"Figure 23-37","ex":["EPO 受體本身沒有激酶活性，它是「結合」JAK 的受體，兩者不是同一個蛋白。","EPO 使受體二聚化，使結合其上的 JAK 彼此靠近而互相活化，JAK 再把受體的酪胺酸磷酸化，製造出 STAT 的停泊位。","STAT 是被 JAK 磷酸化的「受質」，不是去磷酸化受體的激酶，方向反了。","進入細胞核的是被磷酸化後二聚化的 STAT，不是 EPO-受體複合體。"]},{"id":"M-108-2_79","t":"M","y":108,"q":"人類雙股DNA在中性pH水溶液中，溫度由37℃加熱到95℃時，下列敘述何者錯誤？","o":["UV 260 nm的吸光度增加","N-醣苷共價鍵（N-glycosidic bond）發生斷裂現象","雙股螺旋結構解開（unwinds）","DNA不會由水溶液中沉澱出來"],"a":[1],"ch":["8"],"sec":"8.3","fbt":"","ex":["解鏈後鹼基暴露，260 nm 吸光度上升（高色度效應），敘述正確。","N-醣苷鍵（鹼基與糖之間）在中性 pH、95℃ 下相當穩定；要酸性條件或更劇烈處理才會去嘌呤，故此敘述錯誤。","加熱到 95℃ 足以破壞鹼基對的氫鍵與堆疊力，雙股解開，敘述正確。","DNA 高度親水、帶負電，加熱不會從水溶液中沉澱出來，敘述正確。"]},{"id":"M-108-2_80","t":"M","y":108,"q":"細胞內DNA複製過程中，為何需要RNA引子（primer）？","o":["提供DNA聚合酶合成反應所需要的3'-端磷酸基","提供DNA聚合酶合成反應所需要的3'-端羥基（OH）","提供DNA聚合酶合成反應所需要的5'-端羥基（OH）","提供DNA聚合酶合成反應所需要的5'-端磷酸基"],"a":[1],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-108-2_81","t":"M","y":108,"q":"在人類細胞中每一條染色體有幾個複製原點（replication origin）？","o":["1","2","3",">3"],"a":[3],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-108-2_82","t":"M","y":108,"q":"下列有關真核細胞Ras蛋白質之敘述，何者錯誤？","o":["基因突變後容易致癌","Ras蛋白質經修飾後會結合至細胞膜上","Ras蛋白質利用其N端氨基與法尼基（farnesyl）之官能基結合","修飾Ras蛋白質之法尼基（farnesyl）之官能基的合成和膽固醇（cholesterol）的合成使用同一前驅物"],"a":[2],"ch":["12"],"sec":"12.11","fbt":"","ex":["ras 基因突變是人類腫瘤最常見的致癌突變之一。","Ras 經 prenylation（farnesylation）後錨定在細胞膜內側。","farnesyl 是接在 Ras C 端 CaaX motif 半胱胺酸的硫醇基上形成 thioether，不是 N 端的胺基，故此敘述錯誤。","farnesyl 與膽固醇同樣來自 mevalonate／isoprenoid 路徑，共用前驅物。"]},{"id":"M-108-2_83","t":"M","y":108,"q":"下列那一種RNA聚合酶（RNA polymerase）對α-amanitin最敏感？","o":["RNA polymerase I","RNA polymerase II","RNA polymerase III","reverse transcriptase"],"a":[1],"ch":["27"],"sec":"","fbt":""},{"id":"M-108-2_84","t":"M","y":108,"q":"脊椎動物中，由下列那種酵素合成5S rRNA與tRNA？","o":["RNA polymerase I","RNA polymerase II","RNA polymerase III","ribosomal RNase"],"a":[2],"ch":["27"],"sec":"","fbt":""},{"id":"M-108-2_85","t":"M","y":108,"q":"琉璃醣醛酸（hyaluronic acid）是人體含量最多的黏多醣，其分子組成含有下列何種重複單位？","o":["galactose和N-acetylgalactosamine","glucose和fructose","D-glucuronic acid和N-acetylglucosamine","D-glucuronic acid和N-acetylgalactosamine"],"a":[2],"ch":["7"],"sec":"","fbt":""},{"id":"M-108-2_86","t":"M","y":108,"q":"有關胰島素（insulin）之作用，下列何者正確？","o":["抑制phosphodiesterase活性，使cAMP無法轉變成AMP","減少肝細胞之fructose-2,6-bisphosphate濃度","抑制肝細胞之糖解作用（glycolysis）","刺激葡萄糖被送入肌肉細胞"],"a":[3],"ch":["15"],"sec":"","fbt":""},{"id":"M-108-2_87","t":"M","y":108,"q":"下列何種醣類代謝產物會影響氧分子與血紅蛋白（hemoglobin）的親和力？","o":["1,3-bisphosphoglycerate","2,3-bisphosphoglycerate","fructose 1,6-bisphosphate","fructose 2,6-bisphosphate"],"a":[1],"ch":["5"],"sec":"","fbt":""},{"id":"M-108-2_88","t":"M","y":108,"q":"下列何者無法經由受質階層磷酸化（substrate-level phosphorylation）直接合成ATP（或GTP）？","o":["2-phosphoglycerate","phosphoenolpyruvate","succinyl-CoA","1, 3-bisphosphoglycerate"],"a":[0],"ch":["14"],"sec":"","fbt":""},{"id":"M-108-2_89","t":"M","y":108,"q":"奇數碳的脂肪酸經過β-oxidation後，最後產生的三碳產物會以何種形式直接進入檸檬酸循環（citric acid cycle）？","o":["α-ketoglutarate","succinyl-CoA","oxaloacetate","propionyl-CoA"],"a":[1],"ch":["17"],"sec":"","fbt":"","ex":["α-ketoglutarate 不是 propionyl-CoA 的代謝終點。","奇數碳脂肪酸最後剩下三碳的 propionyl-CoA，必須經 propionyl-CoA carboxylase（需生物素）羧化成 D-methylmalonyl-CoA，再經消旋與 methylmalonyl-CoA mutase（需 B12）異構成 succinyl-CoA，才能直接併入檸檬酸循環。","oxaloacetate 不是這條路的產物。","propionyl-CoA 本身無法直接進入檸檬酸循環，必須先轉成 succinyl-CoA。"]},{"id":"M-108-2_90","t":"M","y":108,"q":"在糖蛋白質（glycoproteins）中，下列何組胺基酸直接參與糖與蛋白質共價鍵的形成？","o":["甘胺酸、蘇氨酸和絲氨酸（Gly, Thr & Ser）","天門冬醯胺、蘇氨酸和絲氨酸（Asn, Thr & Ser）","麩胺醯胺、絲氨酸和酪氨酸（Gln, Ser & Tyr）","離胺酸、組織胺酸和麩胺酸（Lys, His & Glu）"],"a":[1],"ch":["7"],"sec":"","fbt":""},{"id":"M-108-2_91","t":"M","y":108,"q":"下列關於血型糖蛋白（glycophorin）之敘述，何者錯誤？","o":["它是紅血球胞膜上的一種鑲嵌穿膜蛋白質（integral membrane protein）","其寡糖連接在該蛋白質之細胞質面（cytoplasmic face）的胺基酸殘基上","它含有一個由非極性胺基酸組成的胜肽片段所形成的穿膜螺旋","血型糖蛋白上帶有決定人類ABO血型的寡糖"],"a":[1],"ch":["7"],"sec":"","fbt":""},{"id":"M-108-2_92","t":"M","y":108,"q":"下列何者為葡萄糖從小腸腔運輸至其上皮細胞內的機制？","o":["促進性擴散作用（facilitated diffusion）","與鈉離子交換運輸（antiport）","與鈉離子共同運輸（symport）","初級主動運輸作用（primary active transport）"],"a":[2],"ch":["11"],"sec":"","fbt":"","ex":["促進性擴散（GLUT2）是在基底側把葡萄糖送出上皮細胞，不是從腸腔攝入。","腸腔側不是與鈉離子交換（反向運輸）。","腸腔側由 SGLT1 把 Na+ 與葡萄糖「同方向」一起帶入（共同運輸／symport），靠的是 Na+-K+ ATPase 建立的鈉梯度，屬二級主動運輸，能逆濃度梯度把葡萄糖吸乾淨。","它本身不直接水解 ATP，不是初級主動運輸（提供動力的 Na+ 幫浦才是）。"]},{"id":"M-108-2_93","t":"M","y":108,"q":"葡萄糖生成性（glucogenic）胺基酸可在酵素作用下直接轉變為克氏循環（TCA cycle）的中間產物，下列何者錯誤？","o":["麩胺酸（glutamate）→α-酮基戊二酸（α-ketoglutarate）","組胺酸（histidine）→ 琥珀醯基輔酶A（succinyl-CoA）","天冬胺酸（aspartate）→草醯乙酸（oxaloacetate）","酪胺酸（tyrosine）→反丁烯二酸（fumarate）"],"a":[1],"ch":["16"],"sec":"","fbt":""},{"id":"M-108-2_94","t":"M","y":108,"q":"若長期攝取含有大量蛋白質但極少量澱粉的食物，則人體會出現下列何種症狀？","o":["尿液中的尿素含量會顯著減少","體內會累積大量脂肪","血液中酮體（ketone bodies）的含量會大幅升高","極可能導致代謝性鹼中毒（metabolic alkalosis）"],"a":[2],"ch":["17"],"sec":"17.3","fbt":"","ex":["高蛋白飲食使胺基酸脫胺增加，尿素生成與排出會「增加」而非減少。","碳水化合物極少、能量多由蛋白質供應時，不會大量累積脂肪。","缺乏澱粉時草醯乙酸被抽去做糖質新生，TCA 循環無法消化大量 acetyl-CoA，肝臟轉而把 acetyl-CoA 做成酮體，血中酮體顯著上升（生酮飲食的原理）。","酮體是酸性代謝物，大量累積造成的是代謝性「酸」中毒，不是鹼中毒。"]},{"id":"M-108-2_95","t":"M","y":108,"q":"下列粒線體電子傳遞鏈中，那一種酵素參與電子傳遞鏈最後階段的反應？","o":["cytochrome oxidase","succinate dehydrogenase","ubiquinone:cytochrome c oxidoreductase","NADH dehydrogenase"],"a":[0],"ch":["19"],"sec":"","fbt":""},{"id":"M-108-2_96","t":"M","y":108,"q":"下列有關被荷爾蒙活化的phospholipase C之敍述，何者錯誤？","o":["其受質是phosphatidylinositol 4,5-bisphosphate","催化產物之一是diacylglycerol，可活化protein kinase C","由G protein連結之受器所活化","催化產物之一是inositol trisphosphate，可減少細胞質內鈣離子濃度"],"a":[3],"ch":["12"],"sec":"","fbt":"","ex":["PLC 的受質是 phosphatidylinositol 4,5-bisphosphate（PIP2）。","DAG 留在膜上活化 protein kinase C。","由 Gq 連結的 GPCR 活化 PLCβ。","IP3 開啟內質網的 IP3 受體使鈣「釋出」，是增加細胞質鈣濃度，不是減少，故此敘述錯誤。"]},{"id":"M-108-2_97","t":"M","y":108,"q":"有關糖皮質激素-受體複合物（glucocorticoid-receptor complex）影響轉錄的敘述，下列何者錯誤？","o":["主要是與其它轉錄因子（transcription factor）結合，進而抑制基因表現","激素-受體複合物是在細胞內形成","結合在它們可辨識的DNA序列上來影響激素反應基因（hormone responsive gene）的轉錄","受體具有典型的DNA結合區域（DNA-binding domain），與激素結合區域（hormone binding domain）不同"],"a":[0],"ch":["28"],"sec":"","fbt":""},{"id":"M-108-2_98","t":"M","y":108,"q":"下列何者是導致突變的Ras蛋白（Ras mutant）持續活化（constitutive activation）的主要原因？","o":["增加與GDP結合的親和力","不受GTPase-activating proteins（GAP）的調節","降低細胞膜受體與激素的結合能力","增加細胞膜受體與G蛋白的結合能力"],"a":[1],"ch":["12"],"sec":"","fbt":"","ex":["增加與 GDP 的親和力會讓 Ras 偏向關閉狀態，不會持續活化。","致癌性 Ras 突變（G12、G13、Q61）破壞 GAP 促進的 GTP 水解，使 Ras 鎖在 GTP-bound 活化型。","受體與激素結合能力下降只會減弱上游訊號。","Ras 的活化靠 Grb2-Sos 這類 GEF，不是靠受體與三聚體 G 蛋白的結合。"]},{"id":"M-108-2_99","t":"M","y":108,"q":"建立人類的genomic library不可能需要下列那一種材料？","o":["DNA ligase","bacteriophage lambda","reverse transcriptase","restriction enzymes"],"a":[2],"ch":["9"],"sec":"9.2","fbt":"","ex":["接合 DNA 片段與載體需要 DNA ligase。","λ 噬菌體是建立基因體庫常用的載體。","genomic library 直接取基因體 DNA 切碎後選殖，不經 RNA，因此不需要反轉錄酶（需要它的是 cDNA library）。","切割基因體 DNA 與載體都要用限制酶。"]},{"id":"M-107-1_100","t":"M","y":107,"q":"下列有關聚合酶鏈鎖反應(polymerase chain reaction; PCR)的敘述,何者錯誤?","o":["擴大的DNA片段(amplified DNA fragments)是可以被選殖的","同一組引子(primers)通常可以同時擴增多個基因體中的位點","被擴增DNA片段的範圍(DNA boundaries)是取決於一對引子在DNA模板的相對位置","一根毛髮上的毛囊(hair follicle)所萃取出的DNA就足夠為PCR的模板"],"a":[1],"ch":["9"],"sec":"9.1","fbt":"","ex":["PCR 產物兩端可設計限制酶切點或用 TA cloning 接入載體，確實可以被選殖，敘述正確。","一對引子只會擴增它們之間那一段；要同時擴增多個位點必須設計多對引子（multiplex PCR），故此敘述錯誤。","擴增範圍的兩端就是兩段引子在模板上的位置，敘述正確。","PCR 靈敏度極高，單一毛囊的細胞即足夠作為模板，這正是其在法醫鑑定上的價值，敘述正確。"]},{"id":"M-107-1_74","t":"M","y":107,"q":"下列那一種胺基酸最有可能在蛋白質結構中參與順式胜肽鍵(cis peptide bond)的形成?","o":["組胺酸(histidine)","丙胺酸(alanine)","脯胺酸(proline)","甘胺酸(glycine)"],"a":[2],"ch":["4"],"sec":"4.2","fbt":"Figure 4-8"},{"id":"M-107-1_75","t":"M","y":107,"q":"下列何者為形成蛋白質二級結構(如α-螺旋)的最主要原因?","o":["疏水性(hydrophobic)交互作用","靜電作用","分子內氫鍵(hydrogen bond)","兩條α-螺旋鏈之間的雙硫鍵(disulfide bond)"],"a":[2],"ch":["4"],"sec":"4.2","fbt":"Figure 4-4"},{"id":"M-107-1_76","t":"M","y":107,"q":"以凝膠電泳法(gel electrophoresis)分離蛋白質時,加入SDS(sodium dodecyl sulfate)的目的為何?","o":["用以決定一個蛋白質的等電點(isoelectric point)","用以決定一個蛋白質的特異活性(specific activity)","用以保護蛋白質的生物結構和活性","用以決定蛋白質分子量"],"a":[3],"ch":["3"],"sec":"3.3","fbt":"Figure 3-19"},{"id":"M-107-1_77","t":"M","y":107,"q":"懷孕前期常需補充葉酸(folic acid),下列有關葉酸的敘述,何者錯誤?","o":["葉酸參與核苷酸deoxythymidine 5'-monophosphate(dTMP)的合成","葉酸為構成輔酶A(coenzyme A)的基本元素之一","四氫葉酸(H4 folate)為一種具有生物活性的葉酸型式","四氫葉酸(H4 folate)是由6-methylpterin、p-aminobenzoate與glutamate所組成"],"a":[1],"ch":["18","22"],"sec":"22.4","fbt":"Figure 16-3","ex":["N5,N10-methylene-THF 提供一碳單位給 thymidylate synthase 合成 dTMP，敘述正確。","輔酶 A 由泛酸（維生素 B5）、cysteamine 與 ADP 組成，與葉酸完全無關，故此敘述錯誤。","四氫葉酸（H4 folate）才是具生物活性、能攜帶一碳單位的型式，敘述正確。","葉酸由 pterin（蝶呤）、p-aminobenzoate 與 glutamate 三部分組成，敘述正確。"]},{"id":"M-107-1_78","t":"M","y":107,"q":"下列關於鋅離子(zinc ion)的敘述,何者錯誤?","o":["鋅離子可與leucine結合後形成leucine zipper,為RNA聚合酶的主要輔助因子","味覺素(gustin)為含鋅離子的唾液蛋白質,缺乏時會抑制味蕾發育與味覺敏銳度","鋅離子參與T細胞與單核球分泌細胞素(cytokines)的過程,缺乏時動物的免疫力會下降","在鉛中毒中,鉛會取代δ-aminolevulinate dehydratase中的鋅離子,會抑制血基質(heme)的合成"],"a":[0],"ch":["22","28"],"sec":"28.1、 22.3","fbt":"","ex":["leucine zipper 是靠白胺酸每七個殘基重複而形成的二聚化 motif，與鋅無關（含鋅的是 zinc finger）；而且這類 motif 屬轉錄因子的 DNA 結合／二聚化模組，不是 RNA 聚合酶的主要輔因子，故此敘述錯誤。","gustin 是含鋅的唾液蛋白，缺鋅會影響味蕾發育與味覺，敘述正確。","鋅參與免疫細胞的細胞素分泌，缺乏會使免疫力下降，敘述正確。","鉛會取代 δ-aminolevulinate dehydratase 的鋅而抑制血基質合成，是鉛中毒貧血的機制，敘述正確。"]},{"id":"M-107-1_80","t":"M","y":107,"q":"下列關於戊糖磷酸途徑(pentose phosphate pathway)的敘述,何者錯誤?","o":["產生NADPH供還原反應使用","產物可轉換成ribose-5-phosphate供核苷酸合成使用","反應中glucose-6-phosphate dehydrogenase缺乏會導致蠶豆症的發生","該反應速率限制酵素(rate limiting enzyme)為6-phospho-gluco-lactonase"],"a":[3],"ch":["14"],"sec":"14.5","fbt":""},{"id":"M-107-1_81","t":"M","y":107,"q":"AZT(3'-azido-2',3'-dideoxythymidine)可用以治療human immunodeficiency virus(HIV)的感染,其作用是:","o":["病毒蛋白質水解酶(protease)的抑制劑","DNA polymerase的競爭性抑制劑","反轉錄酵素(reverse transcriptase)合成DNA鏈的終止者","RNase H的抑制劑"],"a":[2],"ch":["26"],"sec":"26.3","fbt":"Box 26-2"},{"id":"M-107-1_82","t":"M","y":107,"q":"下列有關VJ recombination的敘述,何者錯誤?","o":["參與抗體多樣性的生成","其反應機制與同源重組(homologous recombination)相似","recombination activating gene 1(RAG1)參與作用","recombination activating gene 2(RAG2)參與作用"],"a":[1],"ch":["25"],"sec":"25.3","fbt":"Figure 25-43"},{"id":"M-107-1_83","t":"M","y":107,"q":"當原核生物之DNA受到大量損害進行DNA修補時,須生產修補(repair)相關之蛋白質,此時下列何種蛋白質會被分解,以啟動修補蛋白質基因之轉錄?","o":["RecA","LexA","UvrA","Lac repressor"],"a":[1],"ch":["28"],"sec":"28.2","fbt":"Figure 28-21"},{"id":"M-107-1_85","t":"M","y":107,"q":"下列那一種真核細胞調控蛋白質(eukaryotic regulatory proteins)會與增強子(enhancer)結合,以促進基因轉錄?","o":["轉錄活化子(transcription activators)","輔活化子(coactivators)","TATA-結合蛋白(TATA-binding proteins; TBP)","基準轉錄因子(basal transcription factors)"],"a":[0],"ch":["28"],"sec":"28.3","fbt":""},{"id":"M-107-1_86","t":"M","y":107,"q":"遺傳密碼(codon)與反密碼(anticodon)的相互作用是經由那一種化學鍵相結合?","o":["氫鍵(hydrogen bond)","離子鍵(ionic bond)","肽鍵(peptide bond)","縮醛鍵(acetal bond)"],"a":[0],"ch":["27"],"sec":"27.1","fbt":"Figure 27-8"},{"id":"M-107-1_87","t":"M","y":107,"q":"在動物細胞內,下列何者為葡萄糖進行無氧糖解(anaerobic glycolysis)之淨產物?","o":["ATP和pyruvate","ATP和lactate","NAD+和ethanol","ATP和acetyl-CoA"],"a":[1],"ch":["14"],"sec":"14.3","fbt":""},{"id":"M-107-1_88","t":"M","y":107,"q":"下列關於克式循環(Krebs cycle,亦稱citric acid cycle或TCA cycle)的敘述,何者正確?","o":["在克式循環過程中,oxaloacetate淨消耗(net consumption)為零","在克式循環過程中,不涉及受質階層磷酸化(substrate-level phosphorylation)","一次的克式循環會產生一個分子的二氧化碳","一次的克式循環會產生四個分子的FADH2"],"a":[0],"ch":["16"],"sec":"16.2","fbt":""},{"id":"M-107-1_89","t":"M","y":107,"q":"D-glucose是還原糖(reducing sugar),其anomeric carbon可被氧化,下列何者為其氧化產物?","o":["dextrose","D-sorbitol","D-gluconic acid","D-glucuronic acid"],"a":[2],"ch":["7"],"sec":"7.1","fbt":"Figure 7-9"},{"id":"M-107-1_90","t":"M","y":107,"q":"脂肪酸生合成之速率決定步驟(rate-limiting step)為:","o":["從acetate合成acetyl-CoA","acetyl-CoA與malonyl-CoA的縮合反應(condensation)","acetyl-CoA carboxylase所催化合成malonyl-CoA的反應步驟","使malonate轉變為malonyl-CoA的反應步驟"],"a":[2],"ch":["21"],"sec":"21.1","fbt":"","ex":["由 acetate 活化成 acetyl-CoA 不是脂肪酸合成路徑的限速點。","縮合反應由 fatty acid synthase 催化，不是限速步驟。","acetyl-CoA carboxylase 把 acetyl-CoA 羧化成 malonyl-CoA，是脂肪酸合成的第一步與速率決定步驟，受 citrate 活化、palmitoyl-CoA 抑制、胰島素／AMPK 的磷酸化調控。","細胞內沒有把游離 malonate 轉成 malonyl-CoA 的主要途徑。"]},{"id":"M-107-1_91","t":"M","y":107,"q":"心血管疾病的病人使用aspirin預防血栓發生,減少中風及心肌梗塞,下列敘述何者錯誤?","o":["aspirin抑制cyclooxygenase","可減少thromboxanes合成","可減少prostaglandins合成","可減少膽固醇的生合成"],"a":[3],"ch":["6","10"],"sec":"10.3、 6.5","fbt":"Figure 12-15","ex":["aspirin 乙醯化 COX 活性位的 Ser530 而不可逆抑制之，敘述正確。","血小板 COX-1 被抑制後 TXA2 下降，血小板不易聚集，敘述正確。","前列腺素同樣來自 COX 路徑，也會減少（這也是胃黏膜保護下降而易潰瘍的原因），敘述正確。","膽固醇由 HMG-CoA reductase 路徑合成，與 COX 無關；降膽固醇是 statin 的作用，故此敘述錯誤。"]},{"id":"M-107-1_92","t":"M","y":107,"q":"膜蛋白質最常以共價鍵結合下列何種脂質(lipid),而附著在細胞膜外層上?","o":["硬脂酸(stearic acid)","神經鞘氨醇(sphingosine)","糖基化磷脂醯肌醇(glycosyl phosphatidylinositol; GPI)","磷脂醯肌醇(phosphatidylinositol)"],"a":[2],"ch":["11"],"sec":"11.1","fbt":"","ex":["硬脂酸不是膜蛋白的共價脂質錨。","神經鞘氨醇是鞘脂的骨架，不是蛋白質的錨。","GPI 錨以共價鍵接在蛋白質 C 端，把蛋白固定在細胞膜「外層」，是外側膜蛋白最常見的錨定方式（陣發性夜間血紅素尿症就是 GPI 錨合成缺陷）。","phosphatidylinositol 本身是膜脂，不是蛋白質的共價錨（要加上糖鏈成 GPI 才是）。"]},{"id":"M-107-1_93","t":"M","y":107,"q":"下列何者是細菌和植物合成芳香族胺基酸(aromatic amino acids)過程中,重要的中間產物?","o":["purine","chorismate","pyrimidine","p-aminobenzoic acid"],"a":[1],"ch":["22"],"sec":"22.2","fbt":"","ex":["嘌呤是核苷酸的鹼基，與芳香族胺基酸合成無關。","chorismate 是 shikimate 路徑的分支點，往下分別通往 Phe／Tyr 與 Trp，是細菌與植物合成芳香族胺基酸的關鍵中間產物（人類沒有這條路，所以它們是必需胺基酸）。","嘧啶同樣與芳香族胺基酸合成無關。","p-aminobenzoate 是 chorismate 的下游分支（通往葉酸），不是合成芳香族胺基酸的中間產物。"]},{"id":"M-107-1_94","t":"M","y":107,"q":"Glutathione在細胞內參與氧化還原反應,它是由那三種胺基酸所構成之三胜肽(tripeptide)?","o":["methionine, glutamate, cysteine","glutamate, cysteine, glycine","alanine, methionine, glutamate","arginine, aspartic acid, methionine"],"a":[1],"ch":["22"],"sec":"22.3","fbt":"Figure 22-29","ex":["組成中沒有 methionine。","GSH 的組成正是 glutamate、cysteine、glycine（γ-Glu-Cys-Gly），其中 Cys 的硫醇基是氧化還原的活性中心。","組成中沒有 alanine 與 methionine。","組成中沒有 arginine、aspartate 與 methionine。"]},{"id":"M-107-1_95","t":"M","y":107,"q":"粒線體氧化磷酸化的過程所產生H2O2,可由下列那一種酵素去除?","o":["glutathione reductase","glutathione peroxidase","superoxide dismutase","pyruvate dehydrogenase"],"a":[1],"ch":["19"],"sec":"19.1","fbt":""},{"id":"M-107-1_96","t":"M","y":107,"q":"腫瘤缺氧時,缺氧性誘導轉錄因子(hypoxia inducible transcription factor-1, HIF-1)會被活化,下列相關敘述何者錯誤?","o":["HIF-1的活性可以被延胡索酸(fumarate)誘發","HIF-1可以刺激糖解反應(glycolysis),讓腫瘤細胞可以在缺氧環境下存活","HIF-1也會增加血管內皮細胞生長素(vascular endothelial growth factor, VEGF)表達,促進腫瘤血管新生","HIF-1活化不會減少活性氧化物(reactive oxygen species, ROS)的形成"],"a":[3],"ch":["14","16","19"],"sec":"19.3","fbt":"Box 14.1"},{"id":"M-107-1_97","t":"M","y":107,"q":"動物緊張時,血糖可能會升高,此生理反應包含一聯串的訊息傳遞過程,包括protein kinase A磷酸化,以致於活化glycogenolysis,下列有關此訊息傳遞過程之敘述何者錯誤?","o":["norepinephrine及epinephrine作用於細胞膜上受體","受體直接活化Ras","活化G protein,進而活化adenylyl cyclase","增加cAMP,進而活化protein kinase A"],"a":[1],"ch":["15"],"sec":"15.5","fbt":"Figure 15-37"},{"id":"M-107-1_98","t":"M","y":107,"q":"胰島素可經由MAP kinase cascade影響其調控基因的表現,參與的訊息傳遞分子依其作用之先後排序,下列何者正確?","o":["insulin receptor,IRS-1,Grb2-Sos,Ras-Raf-1,MEK,ERK","insulin receptor,Ras-Raf-1,Grb2-Sos,ERK,IRS-1,MEK","insulin receptor,Grb2-Sos,Ras-Raf-1,MEK,IRS-1,ERK","insulin receptor,IRS-1,Grb2-Sos,Ras-Raf-1,ERK,MEK"],"a":[0],"ch":["12"],"sec":"12.4","fbt":"Figure 12-19","ex":["正確順序：insulin receptor 自磷酸化 → IRS-1 → Grb2-Sos（GEF）→ Ras-Raf-1 → MEK → ERK。","Ras-Raf-1 不可能排在 IRS-1 與 Grb2-Sos 之前。","Grb2-Sos 要先由 IRS-1 上的磷酸酪胺酸招募，順序顛倒了。","MEK 必須在 ERK 之前，因為是 MEK 磷酸化 ERK。"]},{"id":"M-107-1_99","t":"M","y":107,"q":"血中腎上腺素(epineprine)濃度上升時會抑制肝臟或肌肉的何種代謝作用?","o":["肝臟的糖解作用(glycolysis)","肌肉的糖解作用(glycolysis)","肝臟的葡萄糖新生作用(gluconeogenesis)","肌肉的肝糖分解作用(glycogenolysis)"],"a":[0],"ch":["15","23"],"sec":"23.3、5.5","fbt":"Figure 15-44","ex":["腎上腺素在肝臟經 cAMP-PKA 使 PFK-2／FBPase-2 磷酸化，果糖 2,6-雙磷酸下降，糖解被抑制而糖質新生被促進 —— 肝臟的任務是「輸出」葡萄糖。","在肌肉，腎上腺素反而促進糖解以供應收縮所需的 ATP（肌肉沒有升糖素受體，也沒有 glucose 6-phosphatase）。","腎上腺素在肝臟是「促進」糖質新生。","腎上腺素在肌肉是「促進」肝醣分解。"]},{"id":"M-107-2_100","t":"M","y":107,"q":"與利用質體（plasmid）作為選殖基因載體相比，下列何者是利用yeast artificial chromosome（YAC）作為載體的優點？","o":["在宿主細胞中，重組DNA分子放大效果最佳","送入任何宿主細胞之效率佳","使基因在宿主細胞中蛋白質合成效率更好","有選殖更大DNA片段之功能"],"a":[3],"ch":["9"],"sec":"9.1","fbt":"","ex":["放大效果最佳的是高拷貝數的小質體，不是 YAC。","YAC 必須送進酵母菌，宿主範圍反而比質體窄。","YAC 以酵母為宿主，蛋白質表現並非其長處。","YAC 具有酵母的著絲粒、端粒與複製起點，可穩定攜帶數百 kb 到 1 Mb 的外來 DNA；相較之下質體只能帶約 15 kb，所以 YAC 最大的優點就是選殖超大片段（人類基因體計畫即大量使用）。"]},{"id":"M-107-2_74","t":"M","y":107,"q":"下列何種蛋白質結構的變異，是導致成骨不全症（osteogenesis imperfecta）的原因？","o":["纖黏蛋白（fibronectin）","骨橋蛋白（osteopontin）","角質蛋白（keratin）","膠原蛋白（collagen）"],"a":[3],"ch":["4"],"sec":"4.3","fbt":""},{"id":"M-107-2_75","t":"M","y":107,"q":"在某些蛋白質中含有-Ser-Gly-Pro-Gly-的胺基酸序列，最有可能形成下列何種蛋白質的二級結構？","o":["β-turn","α-helix","β-sheet","zinc finger"],"a":[0],"ch":["4"],"sec":"4.2","fbt":"Figure 4-7"},{"id":"M-107-2_76","t":"M","y":107,"q":"下列那個實驗技術可用於評估蛋白質的分子量？","o":["十二烷基硫酸鈉聚丙烯醯胺凝膠電泳（SDS polyacrylamide gel electrophoresis）","等電聚焦分離凝膠電泳（isoelectric focusing gel electrophoresis）","離子交換樹脂管柱層析法（ion-exchange chromatography）","紫外-可見光分光度法（ultraviolet-visible spectroscopy）"],"a":[0],"ch":["3"],"sec":"3.3","fbt":"Figure 3-19"},{"id":"M-107-2_77","t":"M","y":107,"q":"乙醯輔酶A（acetyl coenzyme A）分子中，乙醯基與coenzyme A之鍵結為：","o":["amide","Schiff 's base","acid anhydride","thioester"],"a":[3],"ch":["16"],"sec":"16.1","fbt":"Figure 16-6"},{"id":"M-107-2_78","t":"M","y":107,"q":"生雞蛋的蛋白中之avidin會影響人類腸道對下列何種維生素的吸收？","o":["folate","biotin","cobalamin","pyridoxine"],"a":[1],"ch":["5"],"sec":"5.1","fbt":"Table 5-1"},{"id":"M-107-2_79","t":"M","y":107,"q":"DNA的序列中，下列何者較易被甲基化？","o":["TATA box","CpG site","CAAT box","Telomere"],"a":[1],"ch":["8"],"sec":"8.3","fbt":"Figure 8-5","ex":["TATA box 是轉錄起始的基本啟動子元件，不是甲基化的主要標的。","哺乳類 DNA 甲基化幾乎都發生在 CpG 二核苷酸的 C 上（5-methylcytosine）；啟動子區的 CpG island 甲基化會使基因沉默。","CAAT box 是啟動子元件，不是甲基化標的。","端粒是染色體末端的重複序列，不是 DNA 甲基化的典型位點。"]},{"id":"M-107-2_80","t":"M","y":107,"q":"下列何者是B-型 DNA雙螺旋的最適詮釋？","o":["右旋；每一鹼基對之間的間距為3.6 Å","右旋；每一鹼基對之間的間距為3.4 Å","左旋；每一鹼基對之間的間距為3.4 Å","左旋；每一鹼基對之間的間距為3.6 Å"],"a":[1],"ch":["8"],"sec":"8.2","fbt":"Figure 8-17","ex":["B 型 DNA 是右旋沒錯，但間距是 3.4 Å 不是 3.6 Å。","B 型 DNA 為右旋雙螺旋，相鄰鹼基對間距 3.4 Å，每圈約 10.5 bp、長約 34 Å，是生理條件下的主要構型。","B 型是右旋，不是左旋（左旋的是 Z 型 DNA）。","B 型既不是左旋，間距也不是 3.6 Å。"]},{"id":"M-107-2_81","t":"M","y":107,"q":"下列何種酵素不直接參與大腸桿菌的methyl-directed mismatch repair？","o":["DNA glycosylase","DNA helicase Ⅱ","DNA ligase","DNA polymerase Ⅲ"],"a":[0],"ch":["25"],"sec":"25.2","fbt":"Figure 25-23"},{"id":"M-107-2_82","t":"M","y":107,"q":"大腸桿菌（E. coli）在DNA複製過程中，延遲股（lagging strand）之合成，下列敘述何者正確？","o":["主要是由DNA聚合酶Ⅰ型負責催化反應","是一種持續性的合成反應","由 3'端向5' 端的方向進行合成反應","需先合成岡崎片段（Okazaki fragment）"],"a":[3],"ch":["25"],"sec":"25.1","fbt":"Figure 25-4"},{"id":"M-107-2_83","t":"M","y":107,"q":"在第一型內含子（group I intron）剪接（splicing）的過程中，需要下列何者協助？","o":["鳥嘌呤核苷（guanine nucleoside）或鳥嘌呤核苷酸（guanine nucleotide）","接合酶（ligase）","小核RNAs（small nuclear RNAs）和接合酶（ligase）","ATP、NAD+和小核RNAs（small nuclear RNAs）"],"a":[0],"ch":["26"],"sec":"26.2","fbt":"Figure 26-14"},{"id":"M-107-2_84","t":"M","y":107,"q":"在網狀紅血球（reticulocytes）缺乏鐵時會抑制血紅素（hemoglobin）之合成，其作用機轉主要是：","o":["對cAMP responsive element binding protein（CREBP）進行磷酸化","對steroid responsive element binding protein（SREBP）進行磷酸化","對真核起始因子2（eIF2）進行磷酸化","對真核起始因子4E（eIF4E）進行磷酸化"],"a":[2],"ch":["28"],"sec":"28.3","fbt":""},{"id":"M-107-2_85","t":"M","y":107,"q":"假設由900核苷酸配對（base pairs）所組成的DNA片段，不含非轉譯部分（untranslated region）。其相對應的mRNA所轉譯產生的多胜肽（polypeptide）之分子量約為多少？","o":["900","5,000","30,000","100,000"],"a":[2],"ch":["3"],"sec":"3.3","fbt":""},{"id":"M-107-2_86","t":"M","y":107,"q":"關於真核生物基因表現的敘述，下列何者錯誤？","o":["mRNA的表現主要是由RNA polymerase II負責","mRNA的3'端會進行磷酸化（phosphorylation）以穩定其結構","DNA上之CpG island的甲基化可造成基因無法表現","histones上的乙醯化程度可影響基因的表現"],"a":[1],"ch":["8","26","28"],"sec":"26.2","fbt":"","ex":["真核 mRNA 由 RNA polymerase II 轉錄，敘述正確。","mRNA 的 3′ 端加的是 poly(A) 尾（腺苷酸聚合），5′ 端加的是 7-methylguanosine 帽；並不是「磷酸化」，故此敘述錯誤。","啟動子區 CpG island 高度甲基化會使基因無法表現，敘述正確。","組織蛋白乙醯化中和離胺酸正電、鬆開染色質而促進轉錄，敘述正確。"]},{"id":"M-107-2_87","t":"M","y":107,"q":"將一莫耳（mole）葡萄糖經由糖解作用（glycolysis）產生兩莫耳丙酮酸（pyruvate）的過程中，淨需要：","o":["四莫耳ATP","一莫耳NAD+","一莫耳磷酸根（inorganic phosphate）","兩莫耳ADP"],"a":[3],"ch":["14"],"sec":"14.1","fbt":"Figure 14-2"},{"id":"M-107-2_88","t":"M","y":107,"q":"下列醣類分子均為葡萄糖聚合物，何者具有（β1→4）glycosidic bond？","o":["amylose","glycogen","cellulose","dextran"],"a":[2],"ch":["7"],"sec":"7.2","fbt":"Figure 7-14"},{"id":"M-107-2_89","t":"M","y":107,"q":"遇緊急狀況時，腎上腺素（epinephrine）分泌增加，調控肝臟及骨骼肌的醣類代謝以提升血糖及骨骼肌運 動，下列相關敘述何者錯誤？","o":["增加骨骼肌的肝醣分解（glycogenolysis）","增加骨骼肌的糖解作用（glycolysis）","增加肝臟的糖解作用（glycolysis）","增加肝臟的糖質新生作用（gluconeogenesis）"],"a":[2],"ch":["15"],"sec":"15.5","fbt":"Figure 15-44"},{"id":"M-107-2_90","t":"M","y":107,"q":"嵌入型的膜蛋白（integral membrane protein）能夠被下列何種溶液萃取出來？","o":["鹼性或酸性的緩衝溶液","能移除陽離子的螯合劑（chelating agent）溶液","含介面活性劑（surfactant）的溶液","高濃度的鹽溶液"],"a":[2],"ch":["11"],"sec":"11.2","fbt":"","ex":["調整 pH 只能洗下周邊蛋白。","螯合劑移除二價陽離子也只對周邊蛋白有效。","嵌入型膜蛋白的穿膜區深埋在疏水區，必須用界面活性劑（如 Triton X-100、SDS）打散脂雙層並包覆其疏水面，才能萃取出來。","高鹽溶液同樣只能移除靠靜電附著的周邊蛋白。"]},{"id":"M-107-2_91","t":"M","y":107,"q":"關於通過細胞膜的促進性擴散作用（facilitated diffusion），下列敘述何者正確？","o":["經由專一性膜蛋白質的作用，降低溶質通過細胞膜的活化能","經由專一性膜蛋白質的作用，增加擴散性溶質之穿膜濃度梯度的大小","被運載溶質的極性會影響脂雙層之特性","細胞利用此機轉運輸氧氣、氮氣或甲烷等氣體通過細胞膜"],"a":[0],"ch":["11"],"sec":"11.3","fbt":"","ex":["促進性擴散靠專一性載體蛋白提供另一條能量較低的路徑，降低溶質脫水與穿越疏水核心的活化能，但不改變反應的方向與平衡。","載體不會改變兩側的濃度差；濃度梯度是驅動力而非結果。","被運送溶質不會因此改變脂雙層的性質。","氧氣、氮氣、甲烷這類小而非極性的分子直接穿膜擴散，不需要載體。"]},{"id":"M-107-2_92","t":"M","y":107,"q":"下列何者不是血小板活化因子（platelet activating factor）的特性？","o":["它是一種醚甘油磷酯（ether glycerophospholipid）","其結構含有一個烷基（alkyl group）以醚鏈（ether linkage）鍵結在甘油的C1位置","其結構含有一個醋酸鹽基（acetate group）以酯鏈（ester linkage）鍵結在甘油的C2位置","它比縮醛磷脂（plasmalogen）更不易溶於水"],"a":[3],"ch":["10"],"sec":"10.2","fbt":"Figure 10-9","ex":["PAF 的 C1 接的是醚鍵而非酯鍵，屬醚甘油磷酯，敘述正確。","C1 以醚鍵接一條長鏈烷基（通常 16 碳），敘述正確。","C2 以酯鍵接一個短短的乙醯基，這是 PAF 的結構特徵，敘述正確。","正因為 C2 只接兩碳的乙醯基而非長鏈脂肪酸，PAF 的水溶性比一般磷脂與縮醛磷脂「高」得多，才能作為血中傳遞的訊息分子，故此敘述錯誤。"]},{"id":"M-107-2_93","t":"M","y":107,"q":"在哺乳類細胞中，N5-甲基四氫葉酸（N5-methyl tetrahydrofolate；N5-methyl H4 folate）直接參與下列那一 種胺基酸的生合成？","o":["isoleucine","leucine","lysine","methionine"],"a":[3],"ch":["22"],"sec":"22.2","fbt":"Figure 22-17","ex":["isoleucine 是必需胺基酸，人體不合成。","leucine 是必需胺基酸，人體不合成。","lysine 是必需胺基酸，人體不合成。","N5-methyl-THF 經 methionine synthase（需 B12）把甲基交給 homocysteine，生成 methionine —— 這是人體唯一能「再生」甲硫胺酸的反應，也是葉酸與 B12 缺乏時 folate trap 的所在。"]},{"id":"M-107-2_94","t":"M","y":107,"q":"下列那一組胺基酸直接參與肌酸（creatine）的生合成？","o":["tyrosine, glycine, glutamine","glutamate, cysteine, glycine","glycine, arginine, methionine","aspartate, glycine, cysteine"],"a":[2],"ch":["22"],"sec":"22.3","fbt":"Figure 22-28","ex":["組成中沒有 tyrosine 與 glutamine。","這是 glutathione 的組成，不是肌酸。","肌酸由 arginine 與 glycine 先經 AGAT 生成 guanidinoacetate，再由 SAM（來自 methionine）甲基化而成，三者缺一不可。","組成中沒有 aspartate 與 cysteine。"]},{"id":"M-107-2_95","t":"M","y":107,"q":"在粒線體中，NADH經由電子傳遞鏈（electron transport chain）進行氧化時，氫離子（H+）如何移轉？","o":["由粒線體內外膜間的間隙運送至細胞質","由細胞質運送至粒線體內外膜間的間隙","由粒線體內外膜間的間隙運送至粒線體基質（matrix）","由粒線體基質（matrix）運送至粒線體內外膜間的間隙"],"a":[3],"ch":["19"],"sec":"19.2","fbt":"Figure 19-19"},{"id":"M-107-2_96","t":"M","y":107,"q":"在電子傳遞鏈中，下列何種物質會將其所攜帶的 氯離子-碳酸氫鹽交換器(chloride-bicarbonate exchanger)"],"a":[0],"ch":["11"],"sec":"11.3","fbt":"","ex":["肌漿網的鈣幫浦 SERCA 在運送循環中會形成磷酸化的天門冬胺酸中間物，是典型的 P-type ATPase（Na+-K+ ATPase、H+-K+ ATPase 也是）。","紅血球 GLUT1 是促進性擴散的載體，不水解 ATP。","小腸的 Na+-葡萄糖共同運輸屬二級主動運輸，不直接水解 ATP。","氯離子-碳酸氫鹽交換器是被動的反向運輸（antiport），不耗 ATP。"]},{"id":"M-106-1_43","t":"M","y":106,"q":"關於脂肪組織之脂肪代謝,下列敘述何者錯誤?","o":["脂肪組織脂肪分解,釋放出來的脂肪酸,可供給其他組織產生能量","脂肪組織脂肪分解,分解出來的脂肪酸,釋放至血液與血清白蛋白(serum albumin)結合","脂肪組織脂肪分解,釋放出來的脂肪酸可送到肝臟內再合成三酸甘油酯,所以肥胖病患易合併脂肪肝","空腹時,釋放出來的脂肪酸送到肝臟內合成三酸甘油酯,包裝成乳糜微粒(chylomicron)分泌至血液中"],"a":[3],"ch":["17"],"sec":"17.1","fbt":"Figure 17-1","ex":["脂解釋出的脂肪酸經血流送往其他組織氧化供能，敘述正確。","脂肪酸不溶於水，在血中與血清白蛋白結合運送，敘述正確。","大量脂肪酸湧入肝臟再酯化成三酸甘油酯，是肥胖合併脂肪肝的機轉，敘述正確。","乳糜微粒只由「小腸」分泌、裝載食物來源的脂質；肝臟合成的三酸甘油酯是包裝成 VLDL，故此敘述錯誤。"]},{"id":"M-106-1_44","t":"M","y":106,"q":"腦中核酸分解所形成之氨(ammonia),主要轉化為下列何種物質,再經由血液運送至肝臟或腎臟?","o":["尿酸(uric acid)","尿素(urea)","天冬醯胺(asparagine)","麩胺醯胺(glutamine)"],"a":[3],"ch":["18"],"sec":"18.2","fbt":"Figure 18-10","ex":["尿酸是嘌呤分解的終產物，不是氨的運送形式。","尿素只在肝臟合成，腦無法製造。","天冬醯胺不是運氨的主要形式。","腦中 glutamine synthetase 把氨接到麩胺酸上形成麩醯胺（無毒、中性、易於血中運送），再送往肝或腎處理；這也是高血氨時腦內 glutamine 堆積造成腦水腫的原因。"]},{"id":"M-106-1_45","t":"M","y":106,"q":"胺甲醯麩胺酸(carbamoyl glutamate)常用於治療醋醯麩胺酸合成酶(N-acetylglutamate synthetase)缺乏所造成的尿素循環(urea cycle)障礙疾病,其藥理作用主要為何?","o":["提供尿素循環所需的中間產物,增進整個尿素循環的效率","做為胺甲醯磷酸合成酶(carbamoyl phosphate synthetase I)的異位活化劑(allosteric activator),增進尿素循環的效率","與甘胺酸(glycine)和麩胺醯胺(glutamine)結合成衍生物排出體外,減少尿素循環的負擔","促進精胺酸(arginine)的合成,防止精胺酸缺乏"],"a":[1],"ch":["18"],"sec":"18.2","fbt":"","ex":["它不是提供循環中間產物（補中間產物的是 arginine 或 citrulline）。","N-acetylglutamate 是 carbamoyl phosphate synthetase I 的「必需」異位活化劑；合成酶缺乏時酵素無法啟動。carbamoyl glutamate（carglumic acid）是它的穩定類似物，直接取代其位置活化 CPS I。","與 glycine、glutamine 結合排氮的是 sodium benzoate 與 phenylbutyrate 的機制，不是本藥。","本藥的作用不是促進精胺酸合成（補 arginine 是另一種輔助治療）。"]},{"id":"M-106-1_46","t":"M","y":106,"q":"Cytochromes含有那種金屬離子?","o":["Fe2+","Mg2+","Co2+","Ni2+"],"a":[0],"ch":["19"],"sec":"19.1","fbt":"Figure 19-4"},{"id":"M-106-1_47","t":"M","y":106,"q":"下列那一種酵素參與克式循環(Krebs cycle,亦稱citric acid cycle或TCA cycle)的反應,是位於粒線體內膜上且直接參與電子傳遞鏈?","o":["succinate dehydrogenase","isocitrate dehydrogenase","alpha-ketoglutarate dehydrogenase complex","malate dehydrogenase"],"a":[0],"ch":["19"],"sec":"19.1","fbt":""},{"id":"M-106-1_48","t":"M","y":106,"q":"蛋白激酶A(Protein kinase A)具有下列何種特性?","o":["與cyclic AMP共價鍵結合而活化","與cyclic AMP共價鍵結合而抑制","cyclic AMP與酵素的異位性結合位(allosteric site)結合而使酵素活化","受到cyclic AMP的競爭性抑制"],"a":[2],"ch":["12"],"sec":"12.2","fbt":"Figure 12-6","ex":["cAMP 是以非共價方式結合，不是共價鍵。","既非共價結合，且 cAMP 的作用是活化而非抑制。","cAMP 結合在調節次單元（R2）的異位性位點，使 R2 與催化次單元（C2）解離，釋出有活性的 C 次單元。","不是競爭性抑制 —— cAMP 不與 ATP 或蛋白受質競爭活性位。"]},{"id":"M-106-1_49","t":"M","y":106,"q":"有關胰島素受體(insulin receptor)訊息傳遞的敘述,下列何者正確?","o":["胰島素受體是nuclear hormone receptor","胰島素受體利用cAMP進行訊息傳遞","胰島素受體會磷酸化自己及其受質(substrate)","胰島素受體在胰島素刺激前,是一種活化的磷酸激酶"],"a":[2],"ch":["12"],"sec":"12.4","fbt":"Figure 12-19","ex":["胰島素受體是細胞膜上的 receptor tyrosine kinase，不是核內荷爾蒙受體。","胰島素不以 cAMP 傳訊；相反地它會使細胞內 PKA 活性下降。","胰島素結合後受體先自我磷酸化 tyrosine，再磷酸化 IRS-1 等受質，開啟 PI3K-Akt 與 MAPK 兩條下游。","未受刺激前受體的激酶活性是關閉的，必須胰島素結合才活化。"]},{"id":"M-106-1_50","t":"M","y":106,"q":"利用polymerase chain reaction(PCR)技術放大DNA,在溫度循環過程中反應溫度高達95℃之目的為何?","o":["形成單股模板(template)DNA","使primer與模板(template)結合","增加DNA polymerase活性","便於產物之純化"],"a":[0],"ch":["8"],"sec":"8.3","fbt":"","ex":["95℃ 的變性步驟是把雙股解開成單股，讓引子有機會結合。","引子黏合（annealing）發生在較低的 50–65℃。","95℃ 反而會讓一般聚合酶失活；Taq 只是耐得住，不是因此活性增加。","與產物純化無關。"]},{"id":"M-106-2_100","t":"M","y":106,"q":"大腸桿菌DNA複製(DNA replication)的DNA聚合酶無法用於聚合酶鏈鎖反應(polymerase chain reaction;PCR)的主要原因為何?","o":["熱穩定性(thermal stability)差","DNA模板(template)的選擇性差","不具有3'核酸外切酶(3' exonuclease)活性","DNA合成的準確性不足"],"a":[0],"ch":["8"],"sec":"8.3","fbt":"","ex":["大腸桿菌 DNA 聚合酶在 95℃ 的變性步驟就會變性失活，每一循環都得重新加酵素；改用嗜熱菌的 Taq 聚合酶才讓 PCR 自動化成為可能。","模板選擇性不是問題所在。","3′→5′ 外切酶（校對）活性大腸桿菌 Pol I 反而有，不是缺點。","準確性不是它不能用於 PCR 的主因。"]},{"id":"M-106-2_68","t":"M","y":106,"q":"胰臟β細胞的細胞膜表面是那一種葡萄糖轉運蛋白(glucose transporter, GLUT)負責將葡萄糖導入細胞內?","o":["GLUT1","GLUT2","GLUT3","GLUT4"],"a":[1],"ch":["11"],"sec":"11.3","fbt":"Table 11-3","ex":["GLUT1 主要在紅血球與腦血管內皮，Km 低。","胰臟 β 細胞用的是高 Km（約 15–20 mM）的 GLUT2，使葡萄糖進入速率隨血糖線性上升，細胞才能「感測」血糖高低而調節胰島素分泌；肝臟與小腸基底側也是 GLUT2。","GLUT3 主要在神經元，Km 很低以確保優先供糖。","GLUT4 在肌肉與脂肪，受胰島素調控而移到細胞膜。"]},{"id":"M-106-2_69","t":"M","y":106,"q":"下列何者不屬於胰島素在數秒內會產生的急性作用?","o":["刺激胰島素敏感性細胞合成蛋白質作用","增加胰島素敏感性細胞對葡萄糖的吸收作用","增加鉀離子進入胰島素敏感性細胞內","增加胰島素敏感性細胞的胺基酸吸收作用"],"a":[0],"ch":[],"sec":"","fbt":""},{"id":"M-106-2_70","t":"M","y":106,"q":"下列那一個腺體所分泌之激素多為脂溶性?","o":["胃(stomach)","心臟(heart)","胰臟(pancreas)","腎上腺皮質(adrenal cortex)"],"a":[3],"ch":["21"],"sec":"21.4","fbt":"","ex":["胃分泌 gastrin，屬胜肽激素，水溶性。","心臟分泌心房利鈉肽（ANP），屬胜肽激素，水溶性。","胰臟分泌胰島素與升糖素，皆為蛋白質／胜肽，水溶性。","腎上腺皮質分泌的皮質醇、醛固酮與性類固醇都由膽固醇衍生，屬脂溶性類固醇激素，可直接穿膜作用於核內受體。"]},{"id":"M-106-2_71","t":"M","y":106,"q":"下列何種激素最不可能促進骨骼質量(bone mass)的增加?","o":["growth hormone","testosterone","estrogen","cortisol"],"a":[3],"ch":[],"sec":"","fbt":""},{"id":"M-106-2_74","t":"M","y":106,"q":"酵素反應在受質濃度極低時,所測得的初始反應速率會與受質濃度成正比,此反應速率常數應為下列何者?","o":["k cat","k cat×Km","V max/Km","1/Km"],"a":[2],"ch":["6"],"sec":"6.3","fbt":"Figure 6-12"},{"id":"M-106-2_75","t":"M","y":106,"q":"下列那一個胺基酸不會吸收波長為280 nm的紫外光?","o":["苯丙胺酸(phenylalanine)","天冬醯胺(asparagine)","酪胺酸（tyrosine）","色胺酸(tryptophan)"],"a":[1],"ch":["3"],"sec":"3.1","fbt":""},{"id":"M-106-2_76","t":"M","y":106,"q":"最常見於蛋白質之三級結構內部的共價交互作用為:","o":["氫鍵(hydrogen bond)","凡德瓦爾力(van der Waals interaction)","離子交互作用(ionic interaction)","雙硫鍵(disulfide bond)"],"a":[3],"ch":["4"],"sec":"4.1","fbt":""},{"id":"M-106-2_77","t":"M","y":106,"q":"丙酮酸脫氫酶複合物(pyruvate dehydrogenase complex)含有下列那些輔酶參與其催化反應?","o":["thiamine pyrophosphate(TPP)、NAD+及硫辛酸(lipoic acid)","FAD、NAD+及生物素(biotin)","酪胺酸(tyrosine)","thiamine pyrophosphate(TPP)、NAD+及生物素(biotin)"],"a":[0],"ch":["16"],"sec":"16.1","fbt":""},{"id":"M-106-2_78","t":"M","y":106,"q":"膽固醇是下列何種維生素(vitamin)合成的前驅物?","o":["A","D","E","K"],"a":[1],"ch":["10"],"sec":"10.3","fbt":"Figure 10-19","ex":["維生素 A 來自 β-胡蘿蔔素等類胡蘿蔔素。","皮膚中的 7-dehydrocholesterol（膽固醇合成路徑的中間物）經紫外線 B 開環成維生素 D3，再由肝臟 25-羥化、腎臟 1α-羥化成活性型 calcitriol。","維生素 E 是植物來源的生育醇。","維生素 K 是萘醌類，不由膽固醇合成。"]},{"id":"M-106-2_79","t":"M","y":106,"q":"在A、B兩種未知的細菌雙股DNA中,我們測得其胸腺嘧啶(thymidine)的成分分別占了16%與31%,下列敘述何者錯誤?","o":["A細菌的腺嘌呤(adenosine)約占其DNA組成的16%","A細菌的胞嘧啶(cytosine)約占其DNA組成的34%","B細菌的胞嘧啶(cytosine)約占其DNA組成的31%","推測A細菌比B細菌更有可能是在高溫溫泉地生存"],"a":[2],"ch":["8"],"sec":"8.2","fbt":"","ex":["依 Chargaff 法則 A = T，A 菌 T 佔 16% 則 A 也約 16%，敘述正確。","A 菌 A+T = 32%，G+C = 68%，而 G = C，故 C 約 34%，敘述正確。","B 菌 A+T = 62%，G+C = 38%，G = C 各約 19% 而非 31%，故此敘述錯誤。","A 菌 GC 含量 68% 遠高於 B 菌的 38%；GC 間有三個氫鍵且堆疊較佳，Tm 較高，較可能生活在高溫環境，敘述正確。"]},{"id":"M-106-2_80","t":"M","y":106,"q":"下列那一個分子最不可能經由嘌呤回收(purine salvage)途徑再利用?","o":["adenine","guanine","xanthine","hypoxanthine"],"a":[2],"ch":["22"],"sec":"22.4","fbt":"","ex":["adenine 可由 adenine phosphoribosyltransferase（APRT）回收成 AMP。","guanine 可由 HGPRT 回收成 GMP。","xanthine 沒有對應的 phosphoribosyltransferase，只能被 xanthine oxidase 進一步氧化成尿酸排掉，最不可能被回收再利用。","hypoxanthine 可由 HGPRT 回收成 IMP。"]},{"id":"M-106-2_81","t":"M","y":106,"q":"AZT(3'-azido-2',3'-dideoxythymidine)臨床上被用為治療感染HIV-1病毒之病患。主要作用為下列何者?","o":["反轉錄酶(reverse transcriptase)的不可逆抑制劑","DNA聚合酶甲型(DNA polymerase α)的競爭性抑制劑","做為反轉錄酶(reverse transcriptase)催化DNA合成反應中的鏈終結者(chain terminator)","RNase A活性的抑制劑"],"a":[2],"ch":["26"],"sec":"26.3","fbt":"Box 26-2"},{"id":"M-106-2_82","t":"M","y":106,"q":"在人類細胞中,DNA複製(DNA replication)時是以何種物質為初始引子(primer)?","o":["DNA","RNA","蛋白質","不需引子"],"a":[1],"ch":["25"],"sec":"25.1","fbt":"Figure 25-5"},{"id":"M-106-2_83","t":"M","y":106,"q":"大腸桿菌的乳糖操縱子(lac operon)上含有β-半乳糖苷酶(β-galactosidase),透性酶(permease),乙醯基轉移酶(transacetylase)基因。此外在該操縱子的上游有一調控基因I(I gene)。請配對下列各基因(a~c)之功能?","o":["a-I, b-III, c-II","a-II, b-III, c-I","a-II, b-I, c-III","a-III, b-I, c-II"],"a":[3],"ch":["28"],"sec":"28.1","fbt":""},{"id":"M-106-2_84","t":"M","y":106,"q":"RecA蛋白質是SOS反應(SOS response) 的主要調控因子,其作用機制為何?","o":["與聚合全酶(polymerase holoenzyme)結合,可使LexA抑制子(repressor)脫離操縱基因(operator)","使操縱基因(operator)彎曲,致使LexA抑制子(repressor)與操縱子(operon)分離","使LexA抑制子(repressor)自我裂解(self-cleavage),並解除其對操縱子(operon)的抑制作用","與LexA抑制子(repressor)競爭結合到操縱基因(operator)上,同時扮演活化子(activator)的功能"],"a":[2],"ch":["28"],"sec":"28.2","fbt":"Figure 28-21"},{"id":"M-106-2_85","t":"M","y":106,"q":"關於原核細胞蛋白質合成的啟始階段(initiation stage),下列敘述何者正確?","o":["fMet-tRNAifMet可同時使用在蛋白質合成的啟始(initiation)與延伸(elongation)階段","fMet-tRNAifMet結合在80S起始複合體的P位置(P site)","mRNA 5'端的Shine-Dalgarno sequence會與30S核糖體(30S ribosome)中的16S rRNA 3'端配對","起始因子(initiation factor)IF1會促進fMet-tRNAifMet結合在A位置"],"a":[2],"ch":["27"],"sec":"27.2","fbt":"Figure 27-13"},{"id":"M-106-2_86","t":"M","y":106,"q":"在細胞中,管家基因 (housekeeping genes)的種類繁多,但個別基因的表現量不同。下列何者是調控管家基因表現的最主要機制?","o":["各基因產物合成率一致,但其降解速率各異","各基因所轉錄的mRNA量一致,但其轉譯的速率各異","各基因的啟動子對RNA聚合酶的親和力各異","各基因表現的程度受到不同的誘導或抑止因子所調節"],"a":[2],"ch":["28"],"sec":"","fbt":""},{"id":"M-106-2_87","t":"M","y":106,"q":"下列那種酶在肌細胞中含量較低,無法有效進行糖合成作用(gluconeogenesis)?","o":["丙酮酸脫氫酶(pyruvate dehydrogenase)","磷酸果糖磷激酶-1(phosphofructokinase-1)","肝醣合成酶(glycogen synthase)","葡萄糖6-磷酸酶(glucose 6-phosphatase)"],"a":[3],"ch":["14"],"sec":"14.4","fbt":""},{"id":"M-106-2_88","t":"M","y":106,"q":"病人無法進食時,因為肝臟可以進行gluconeogenesis,一般仍不至於發生低血糖,下列何種物質無法被轉化為glucose?","o":["lactate","alanine","glycerol","ethanol"],"a":[3],"ch":["14"],"sec":"14.4","fbt":""},{"id":"M-106-2_89","t":"M","y":106,"q":"玻尿酸(hyaluronic acid)是關節滑液的組成之一,是下列何種雙醣分子(disaccharide unit)的聚合物?","o":["galactose及glucose","glucose及N-acetylglucosamine","D-glucuronic acid及fructose","D-glucuronic acid及N-acetylglucosamine"],"a":[3],"ch":["7"],"sec":"7.2","fbt":"Figure 7-22"},{"id":"M-106-2_90","t":"M","y":106,"q":"下列關於類固醇激素受體(steroid hormone receptor)作用的敘述,何者錯誤?","o":["熱休克蛋白(heat shock protein)會與受體之類固醇結合區結合,抑制受體活性","類固醇激素受體不屬於細胞膜上的受體","與類固醇配體(steroidal ligand)結合後構型改變,與熱休克蛋白解離後活化","受體活化後會與DNA上hormone response elements(HREs)結合,幫助基因表現"],"a":[0],"ch":["28"],"sec":"28.3","fbt":"Figure 28-33"},{"id":"M-106-2_91","t":"M","y":106,"q":"在肝臟細胞膜(plasma membrane)中,下列何種脂質含量最低?","o":["膽鹼磷脂(phosphatidylcholine)","鞘磷脂(sphingolipids)","心磷脂(cardiolipin)","膽固醇(cholesterol)"],"a":[2],"ch":["11"],"sec":"1.1","fbt":"","ex":["磷脂醯膽鹼是細胞膜最主要的磷脂。","鞘磷脂在細胞膜外層含量相當高。","心磷脂（雙磷脂醯甘油）幾乎只存在於粒線體內膜，是該膜的標誌脂質；在細胞膜中含量最低。","膽固醇在動物細胞膜含量很高，負責調節流動性。"]},{"id":"M-106-2_92","t":"M","y":106,"q":"下列何種ATPase負責維持哺乳類動物體中最大的離子濃度梯度(gradient)?","o":["鈉離子-鉀離子三磷酸腺苷酶(Na+-K+ ATPase)","紅血球陰離子運輸器(anion transporter)","氫離子-鉀離子三磷酸腺苷酶(H+-K+ ATPase)","鈣離子三磷酸腺苷酶(Ca2+ATPase)"],"a":[2],"ch":["11"],"sec":"11.3","fbt":"","ex":["Na+-K+ ATPase 維持的濃度差約十倍等級。","陰離子運輸器是被動交換，不建立大梯度。","胃壁細胞的 H+-K+ ATPase 把胃液酸化到 pH 約 1，相對於細胞內 pH 7，氫離子濃度差達 10^6 倍，是哺乳類體內最大的離子梯度。","Ca2+ ATPase 維持的細胞質與肌漿網鈣差約 10^3–10^4 倍。"]},{"id":"M-106-2_93","t":"M","y":106,"q":"下列有關尿素循環(urea cycle)的敘述,何者錯誤?","o":["尿素循環主要於肝臟中進行","尿素循環的產物之一為草醯乙酸(oxaloacetate)","尿素循環的一部分反應於粒線體內進行,另一部分反應則在細胞質中進行","在人體中,尿素循環可將含氮的代謝物轉變為尿素"],"a":[1],"ch":["18"],"sec":"18.2","fbt":"Figure 18-10","ex":["尿素循環主要在肝臟（腎與腸有部分酵素），敘述正確。","尿素循環的產物是尿素與 ornithine，另外在 argininosuccinate 裂解時放出 fumarate；草醯乙酸是 fumarate 進入 TCA 之後才生成的，不是循環本身的產物，故此敘述錯誤。","前兩步（CPS I、OTC）在粒線體，後三步在細胞質，敘述正確。","尿素循環正是把含氮廢物轉成尿素排出，敘述正確。"]},{"id":"M-106-2_94","t":"M","y":106,"q":"胺基酸最主要是經由下列何種代謝路徑間接產生葡萄糖(glucose)?","o":["pentose phosphate pathway","urea cycle","oxidative phosphorylation","citric acid cycle"],"a":[3],"ch":["14"],"sec":"14.4","fbt":"Table 14-4"},{"id":"M-106-2_95","t":"M","y":106,"q":"一新生兒發生非常嚴重乳酸中毒(lactic acidosis),進一步檢查發現有丙酮酸脫氫酵素(pyruvatedehydrogenase)缺乏,下列敘述何者正確?","o":["在有氧狀況下,丙酮酸轉化為乳酸(lactic acid)及乙醇(ethanol)","在無氧狀況下,丙酮酸在粒線體轉化為乙醯輔酶A(acetyl-CoA)","丙酮酸脫氫酵素是由三種酵素複合體結合而成","神經系統不會受到影響"],"a":[2],"ch":["16"],"sec":"16.1","fbt":""},{"id":"M-106-2_96","t":"M","y":106,"q":"下列關於人類細胞內受質階層磷酸化(substrate-level phosphorylation)與氧化磷酸化(oxidativephosphorylation)生化反應進行之位點(compartments)分布,何者正確?","o":["受質階層磷酸化只在粒線體中進行,氧化磷酸化在細胞質中進行","受質階層磷酸化只在細胞質中進行,氧化磷酸化在粒線體中進行","受質階層磷酸化可分別在細胞質及粒線體中進行,氧化磷酸化在粒線體中進行","受質階層磷酸化與氧化磷酸化皆只在粒線體中進行"],"a":[2],"ch":["14","16","19"],"sec":"","fbt":""},{"id":"M-106-2_97","t":"M","y":106,"q":"下列關於細胞週期蛋白質(cyclin)之敘述何者錯誤?","o":["在細胞週期中能被活化和分解","是催化蛋白質磷酸化酵素的調控因子","能與泛肽素(ubiquitin)連結","能直接催化蛋白質的磷酸化的一種激酶(kinase)"],"a":[3],"ch":["12"],"sec":"12.1","fbt":"Figure 12-35","ex":["cyclin 在細胞週期中被合成、活化 CDK，再被泛素化降解，是正確敘述。","cyclin 是 CDK（蛋白質磷酸化酵素）的調控次單元，正確。","cyclin 經 APC/C 等 E3 ligase 連上 ubiquitin 而被降解，正確。","cyclin 本身沒有激酶活性；催化磷酸化的是 CDK，cyclin 只負責活化與決定受質專一性，故此敘述錯誤。"]},{"id":"M-106-2_98","t":"M","y":106,"q":"有關ADP-核糖基化(ADP-ribosylation)的修飾以調節其訊息傳遞的敘述,下列何者正確?","o":["Gs的甲型次單元(α subunit),受霍亂毒素(cholera toxin)的修飾","Gs上甲型次單元(α subunit),受pertussin toxin的修飾","細胞膜受體,受pertussin toxin的修飾","磷脂酶(phospholipase)受霍亂毒素(cholera toxin)的修飾"],"a":[0],"ch":["12"],"sec":"12.2","fbt":"Box 12-1","ex":["霍亂毒素把 Gsα 的 Arg 進行 ADP-ribosylation，抑制其 GTP 水解，Gsα 持續活化 adenylyl cyclase。","修飾 Gsα 的是霍亂毒素；pertussis toxin 的目標是 Giα。","pertussis toxin 修飾的是 Giα（使其無法被受體活化），不是細胞膜受體本身。","霍亂毒素不修飾 phospholipase。"]},{"id":"M-106-2_99","t":"M","y":106,"q":"心房利鈉肽(Atrial natriuretic factor: ANF)是調節體液平衡的配體(ligand),其受體為下列何種類型?","o":["第一型受體酪胺酸磷酸酶(receptor tyrosine kinase classⅠ)","第二型受體酪胺酸磷酸酶(receptor tyrosine kinase classⅡ)","膜鑲嵌型鳥苷酸環化酶(guanylyl cyclase)受體","乙型腎上腺素受體(β-adrenergic receptor)"],"a":[2],"ch":["12"],"sec":"12.5","fbt":"","ex":["ANF 受體不是受體酪胺酸激酶。（順帶一提，tyrosine kinase 是激酶，不是選項所寫的磷酸酶。）","同上，ANF 受體不屬 RTK 任何一型。","ANF 受體是膜鑲嵌型 guanylyl cyclase：細胞外結合 ANF，細胞內把 GTP 轉成 cGMP，活化 PKG 而促進排鈉排水。","β-adrenergic receptor 是 GPCR，配體是腎上腺素，與 ANF 無關。"]},{"id":"M-105-1_26","t":"M","y":105,"q":"蛋白質中的平行鏈(parallel β-stranded)結構比反平行鏈(antiparallel β-stranded)結構較不穩定，原因為何？","o":["平行鏈結構的横向相鄰鏈之間所形成的氫鍵鍵結較弱","平行鏈結構缺少雙硫鍵(disulfide bond)與鄰近的鏈鍵結","平行鏈結構不能如反平行鏈堆疊(stacking)成β-折疊層(β-sheet)","平行鏈結構缺少蛋白質-蛋白質結合區域(protein-protein binding domain)以穩定平行鏈結構"],"a":[0],"ch":["4"],"sec":"4.2","fbt":"Figure 4-6"},{"id":"M-105-1_27","t":"M","y":105,"q":"青黴素(penicillin)的殺菌作用是因為它能抑制下列何種酵素的活性？","o":["內醯胺酶(β-lactamase)","轉肽基酶(transpeptidase)","接合酶(ligase)","醛縮酶(aldolase)"],"a":[1],"ch":["6"],"sec":"6.4","fbt":""},{"id":"M-105-1_28","t":"M","y":105,"q":"在水溶液的pH值低於胺基酸的pI值時，該胺基酸的主要性質為何？","o":["呈淨負電荷","呈淨正電荷","呈中性","呈正、負電荷等量"],"a":[1],"ch":["3"],"sec":"3.1","fbt":"Figure 3-10"},{"id":"M-105-1_29","t":"M","y":105,"q":"一位30歲女性主訴有牙齒鬆動、傷口不易癒合等症狀，口腔理學檢查發現牙齦浮腫、牙齦泛紫。根據病史，此病患最可能有下列何種維生素缺乏？","o":["維生素B1","維生素B12","維生素C","維生素A"],"a":[2],"ch":["4"],"sec":"4.3","fbt":"Box 4-3"},{"id":"M-105-1_30","t":"M","y":105,"q":"RNA降解後，CMP與UMP主要會被代謝成下列那一個中間產物？","o":["β-aminoisobutyrate","thymine","uracil","hypoxanthine"],"a":[2],"ch":["18"],"sec":"","fbt":"","ex":["β-aminoisobutyrate 來自胸腺嘧啶（有甲基）的分解。","thymine 來自 DNA，不是 RNA 降解的產物。","RNA 降解得到 CMP 與 UMP；CMP 先脫胺成 UMP，鹼基釋出就是 uracil，再分解成 β-alanine。","hypoxanthine 來自嘌呤（AMP）的分解。"]},{"id":"M-105-1_31","t":"M","y":105,"q":"核酸去嘌呤作用(depurination of nucleotides)是破壞在連接鹼基(base residues)與核糖 (ribose)的化學鍵。這個化學鍵稱為：","o":["氫鍵(hydrogen bond)","糖苷鍵(N-β-glycosyl bond)","磷酸二酯鍵(phosphodiester bond)","醯胺鍵(amide bond)"],"a":[1],"ch":["8"],"sec":"8.1","fbt":"","ex":["氫鍵是鹼基對之間的作用力，不是鹼基與糖的連接。","鹼基的氮原子與糖的 C1′ 之間以 N-β-糖苷鍵相連；去嘌呤作用就是水解這個鍵而留下 AP site。","磷酸二酯鍵連接的是相鄰核苷酸的糖，斷裂會切斷骨架而非去除鹼基。","核酸中沒有連接鹼基與糖的醯胺鍵。"]},{"id":"M-105-1_32","t":"M","y":105,"q":"艾姆氏測試法(Ames test)可用於評估：","o":["細菌之致病性","DNA複製的速率","抗生素的藥效","化合物致突變性的能力"],"a":[3],"ch":["25"],"sec":"25.2","fbt":"Figure 25-20"},{"id":"M-105-1_33","t":"M","y":105,"q":"下列對Okazaki片段的敘述，何者正確？","o":["由於內切酶(endonuclease)作用後所產生的DNA片段","存在於30S核糖體次單元(ribosomal subunit)中的RNA片段","是DNA複製時發生在合成lagging strand的中間產物","意指由3'→ 5'合成的DNA片段"],"a":[2],"ch":["25"],"sec":"25.1","fbt":"Figure 25-4"},{"id":"M-105-1_34","t":"M","y":105,"q":"關於mRNA穩定性的描述，下列何者正確？","o":["mRNA降解的程序主要是從5'到3'的方向","一般而言，細菌mRNA的半衰期較真核細胞mRNA長","一般而言，mRNA降解的速率最少10倍於其合成的速率","在真核細胞中，mRNA的5'cap和3'poly(A) tail可增加其穩定性"],"a":[3],"ch":["26"],"sec":"26.2","fbt":""},{"id":"M-105-1_35","t":"M","y":105,"q":"下列何種突變會使轉譯(translation)過程中蛋白質的合成提前結束？","o":["silent mutation","missense mutation","suppressor mutation","nonsense mutation"],"a":[3],"ch":["27"],"sec":"27.2","fbt":"Box 27-3"},{"id":"M-105-1_36","t":"M","y":105,"q":"胺醯-tRNA合成酶(aminoacyl-tRNA synthetases)是一種活化胺基酸的酵素，其特徵為何？","o":["能辨認特定的tRNA及胺基酸，促進胺醯-tRNA的合成","需要會同其他酵素將胺基酸結合到特定的tRNA上","需要以GTP活化胺基酸後，始能進行胺醯-tRNA的合成","可以將胺基酸直接與tRNA 3'-端結合而形成胺醯-tRNA"],"a":[0],"ch":["27"],"sec":"27.2","fbt":""},{"id":"M-105-1_37","t":"M","y":105,"q":"下列那一種蛋白質具有抑制細胞凋亡(apoptosis)之功能？","o":["Bak","Bax","Bcl-2","FASL"],"a":[2],"ch":["12"],"sec":"","fbt":"","ex":["Bak 是促凋亡的 Bcl-2 家族成員，與 Bax 一起在粒線體外膜成孔。","Bax 促凋亡，在粒線體外膜形成孔道釋出 cytochrome c。","Bcl-2 是抗凋亡蛋白，結合並抑制 Bax／Bak，阻止 cytochrome c 釋出；在 follicular lymphoma 因易位而過度表現。","FasL 是死亡配體，結合 Fas 啟動外在途徑的凋亡。"]},{"id":"M-105-1_38","t":"M","y":105,"q":"下列關於紅血球醣代謝之敘述，何者正確？","o":["由糖解作用(glycolysis)產生的ATP是紅血球主要的能量來源","紅血球中糖解作用(glycolysis)除用於產生能量外並無其他功能","克氏循環(TCA cycle)會消耗少部分紅血球所攜帶的氧氣","紅血球中五碳糖磷酸途徑(pentose phosphate pathway)係在粒線體中進行"],"a":[0],"ch":["14"],"sec":"14.1","fbt":""},{"id":"M-105-1_39","t":"M","y":105,"q":"用餐後血糖進入肝細胞及骨骼肌細胞轉換成肝糖(glycogen)，葡萄糖以下列何種型式直接 參與肝糖合成？","o":["glucose 1-phosphate","glucose 6-phosphate","CMP-glucose","UDP-glucose"],"a":[0,1,3],"ch":["15"],"sec":"15.4","fbt":""},{"id":"M-105-1_40","t":"M","y":105,"q":"百米選手在激烈運動下，骨骼肌內之糖解作用(glycolysis)所產生的NADH，最主要經由下列何種反應再氧化生成NAD+？","o":["α-ketoglutarate反應成為succinyl-CoA","pyruvate反應成為lactate","coenzyme Q反應成為cytochrome b","pyruvate反應成為acetyl-CoA"],"a":[1],"ch":["14"],"sec":"14.3","fbt":""},{"id":"M-105-1_41","t":"M","y":105,"q":"在胰臟β細胞中，下列那個酵素所催化的反應速率會隨血糖上升而明顯提高，且其下游產物 能促進胰島素(insulin)的分泌？","o":["glycogen synthase","glucokinase(或稱hexokinase IV)","phosphorylase kinase","glycogen phosphorylase"],"a":[1],"ch":["15"],"sec":"15.3","fbt":"Figure 15-14"},{"id":"M-105-1_42","t":"M","y":105,"q":"下列何者與促進細胞攝取血液中膽固醇有關？","o":["Apo B-100","Apo C-I","Apo C-II","lipoprotein lipase"],"a":[0],"ch":["21"],"sec":"21.4","fbt":"Figure 21-41","ex":["Apo B-100 是 LDL 表面的主要載脂蛋白，也是 LDL 受體辨識的配體，細胞靠它把 LDL 連同膽固醇吞入。","Apo C-I 參與調節 CETP 與 LCAT，不是 LDL 受體的配體。","Apo C-II 的功能是活化 lipoprotein lipase 分解三酸甘油酯。","lipoprotein lipase 水解乳糜微粒與 VLDL 中的三酸甘油酯，與膽固醇的攝取無關。"]},{"id":"M-105-1_43","t":"M","y":105,"q":"下列何者不屬於穿膜蛋白-細菌視紫蛋白(bacteriorhodopsin)的特性？","o":["它是利用7個α-螺旋結構形成的通道穿過細胞膜","它是利用單一的β-螺旋結構穿過細胞膜","它是藉由穿膜結構與retinal分子結合","它具有光驅動質子運輸(light-driven proton transport)的功能"],"a":[1],"ch":["12"],"sec":"12.3","fbt":"","ex":["bacteriorhodopsin 以 7 個 α 螺旋穿膜，是正確特性。","它不是靠單一 β 螺旋穿膜（而且天然蛋白並沒有「β 螺旋」這種穿膜結構），故此項不屬其特性。","retinal 以 Schiff base 共價接在穿膜區的 Lys 上，是正確特性。","它是光驅動的質子泵，正確特性。"]},{"id":"M-105-1_44","t":"M","y":105,"q":"一種體染色體顯性(autosomal dominant)遺傳疾病稱為familial hyper-cholesterolemia乃是因為low density lipoprotein(LDL)receptor突變所致。下列有關LDL的敘述，何者正確？","o":["LDL receptor只存在肝細胞上","LDL中的膽固醇經由LDL receptor之作用，可提供肝細胞合成bile salts","LDL所含的脂肪以triglyceride為主","LDL是直接由肝臟製造分泌"],"a":[1],"ch":["21"],"sec":"21.4","fbt":"Figure 21-40","ex":["LDL 受體廣泛分布於肝臟以外的許多組織（如腎上腺皮質、性腺等需要膽固醇者），不是只在肝細胞。","肝細胞經 LDL 受體攝入的膽固醇，正是合成膽汁酸（bile salts）的原料，這也是人體排除膽固醇的主要途徑。","LDL 所含脂質以膽固醇與膽固醇酯為主；以三酸甘油酯為主的是乳糜微粒與 VLDL。","LDL 不是肝臟直接分泌，而是 VLDL 在血中被 LPL 水解、經 IDL 逐步代謝而成。"]},{"id":"M-105-1_45","t":"M","y":105,"q":"體內苯丙胺酸羥化酶(phenylalanine hydroxylase)活性的缺失會導致苯丙酮酸尿症 (phenylketonuria)，此疾病患者會出現下列何種症狀？","o":["患者無法自行合成足夠的酪胺酸(tyrosine)","患者尿液中會出現大量的色胺酸(tryptophan)","患者會對苯丙胺酸(phenylalanine)過敏","患者腸道無法吸收足夠的苯丙胺酸(phenylalanine)"],"a":[0],"ch":["18"],"sec":"18.3","fbt":"Figure 18-23","ex":["苯丙胺酸無法羥化成酪胺酸，酪胺酸由「非必需」變成必需，須由飲食補充（也因此黑色素減少、膚色偏淡）。","尿中大量出現的是苯丙酮酸等苯酮酸，不是色胺酸。","PKU 是代謝酵素缺陷，不是對苯丙胺酸過敏。","腸道吸收正常；問題在吸收後無法代謝。"]},{"id":"M-105-1_46","t":"M","y":105,"q":"下列那一種胺基酸是腎上腺素(epinephrine)和正腎上腺素(norepinephrine)生合成的前驅物？","o":["arginine","histidine","tyrosine","tryptophan"],"a":[2],"ch":["22"],"sec":"22.3","fbt":"Figure 22-31","ex":["精胺酸是 NO 與尿素的前驅物。","組胺酸脫羧成組織胺。","酪胺酸經 tyrosine hydroxylase（限速）→ DOPA → dopamine → norepinephrine → epinephrine。","色胺酸走 serotonin 與菸鹼酸。"]},{"id":"M-105-1_47","t":"M","y":105,"q":"下列何者屬於脂溶性的電子傳遞者？","o":["cytochrome c","NADH","FADH2","coenzyme Q"],"a":[0,3],"ch":["19"],"sec":"19.1","fbt":""},{"id":"M-105-1_48","t":"M","y":105,"q":"原始致癌基因(proto-oncogenes)能夠透過下列機制轉變為致癌基因(oncogenes)，何者除外？","o":["化學性誘導突變(chemical-induced mutation)","染色體重組","病毒感染","其啟動區(promoter region)發生突變導致該蛋白質合成量下降"],"a":[3],"ch":["12"],"sec":"12.11","fbt":"","ex":["化學致突變劑可使 proto-oncogene 發生功能獲得突變。","染色體易位可產生融合致癌基因（如 BCR-ABL）或把基因接到強啟動子下。","反轉錄病毒插入啟動子或帶入 v-onc 都可致癌。","啟動區突變使蛋白質「合成量下降」屬於功能喪失，是腫瘤抑制基因失活的模式；proto-oncogene 變成 oncogene 需要的是功能或表現量「上升」，故此項除外。"]},{"id":"M-105-1_49","t":"M","y":105,"q":"有關胰島素(insulin)基因所合成的前激素原(preprohormone)之敘述，下列何者錯誤？","o":["胰島素的前激素原必須在內質網(endoplasmic reticulum)合成","胰島素之A鏈或B鏈分別由兩個基因轉錄轉譯而來","胰島素由多胜肽前驅物經蛋白裂解(proteolytic cleavage)產生","合成後進入分泌顆粒"],"a":[1],"ch":["23"],"sec":"23.1","fbt":"","ex":["分泌性蛋白都在粗糙內質網上合成並送入腔內，敘述正確。","A 鏈與 B 鏈來自「同一個」基因：preproinsulin 先切去訊息胜肽成 proinsulin，再切去中間的 C 胜肽，留下以雙硫鍵相連的 A、B 兩鏈，故此敘述錯誤。","胰島素正是由多胜肽前驅物經蛋白裂解而成，敘述正確。","加工後儲存於分泌顆粒中，與 C 胜肽等莫耳分泌（臨床上用 C 胜肽評估內生胰島素），敘述正確。"]},{"id":"M-105-1_50","t":"M","y":105,"q":"下列那一種分析方法可用於研究蛋白質之交互作用？","o":["DNA microarray analysis","Northern blotting","Southern blotting","Two-hybrid analysis"],"a":[3],"ch":["9"],"sec":"9.2","fbt":"","ex":["DNA microarray 分析的是基因表現量。","Northern blotting 偵測 RNA。","Southern blotting 偵測 DNA。","酵母雙雜交把兩個待測蛋白分別接到轉錄因子的 DNA 結合域與活化域上；只有當兩蛋白結合，兩個域才靠在一起而啟動報導基因 —— 是篩選蛋白質交互作用的經典方法。"]},{"id":"M-105-1_51","t":"M","y":105,"q":"下列何者不是Phase I的代謝反應？","o":["Oxidation","Hydrolysis","Conjugation","Reduction"],"a":[2],"ch":[],"sec":"","fbt":""},{"id":"M-105-2_26","t":"M","y":105,"q":"當氧分子與血紅素(hemoglobin)結合時，此時血基質(heme)中Fe2+上的兩個開放配位鍵(open coordination bonds)與 下列何組物質結合？","o":["一水分子與一胺基酸的側鏈","一氧分子與一胺基酸的側鏈","一氧分子與一水分子","兩個氧分子"],"a":[1],"ch":["5"],"sec":"5.1","fbt":"Figure 5-11"},{"id":"M-105-2_27","t":"M","y":105,"q":"組胺酸(histidine)有三個酸解離常數(pKa)值，分別為1.82、 6.0、 9.17。其中那個官能基團的pKa為1.82 ？","o":["胺基(-NH3 +)","羧基(-COOH)","側鏈異吡唑基(side-chain imidazole group)","α碳原子(α carbon)的氫原子"],"a":[1],"ch":["3"],"sec":"3.1","fbt":"Table 3-1"},{"id":"M-105-2_28","t":"M","y":105,"q":"某酵素的k cat=500 s-１，Km =5 mM，在受質濃度遠高於Km的狀況下，此酵素反應的速率常數約為：","o":["500 s-１","2,500 mM s-１","100 mM-１s -１","0.01 s mM-１"],"a":[0],"ch":["6"],"sec":"6.3","fbt":""},{"id":"M-105-2_29","t":"M","y":105,"q":"維生素C(ascorbic acid)缺乏會導致膠原蛋白(collagen)的修飾不全，是因為下列那個反應受到影響？","o":["proline hydroxylation","serine phosphorylation","cysteine oxidation","lysine methylation"],"a":[0],"ch":["4"],"sec":"4.3","fbt":"Box 4-3"},{"id":"M-105-2_30","t":"M","y":105,"q":"5'-CCAAGTCCATGGACTTGG-3'DNA分子可以形成何種二級結構？","o":["A form","H form","Z form","cruciform"],"a":[3],"ch":["8"],"sec":"8.2","fbt":"Figure 8-19","ex":["A form 是在脫水條件下整段雙螺旋的構型改變，與特定序列無關。","H form 是三股結構，需要 polypurine·polypyrimidine 的鏡像重複序列。","Z form 需要嘌呤與嘧啶交替的序列（如 CGCGCG），本序列不符。","CCAAGTCCATGGACTTGG 的反向互補就是它自己，屬反向重複（palindrome）；這種序列的兩股可以各自回摺配對，形成十字形（cruciform）結構。"]},{"id":"M-105-2_31","t":"M","y":105,"q":"Lambda噬菌體DNA是藉由何種作用嵌入大腸桿菌的基因體DNA中？","o":["同源重組(homologous recombination)","轉位作用(transposition)","特定點重組(site-specific recombination)","非同源性末端接合(non-homologous end joining, NHEJ)"],"a":[2],"ch":["9"],"sec":"9.1","fbt":"Figure 25-38","ex":["同源重組需要長段序列相同，λ 的嵌入不走這條路。","轉位作用是轉位子靠 transposase 跳躍，λ 不是轉位子。","λ 噬菌體由自身的 integrase 辨識噬菌體的 attP 與大腸桿菌的 attB 這兩段短的特定序列，進行交換而嵌入，稱為特定點重組；解離時由 excisionase 協助切出。","NHEJ 是真核細胞修復雙股斷裂的方式，與 λ 的嵌入無關。"]},{"id":"M-105-2_32","t":"M","y":105,"q":"環丁烷嘧啶二聚體(cyclobutane pyrimidine dimer)修復時，下列何者為細菌DNA光解酶(photolyase)的輔助因子 (cofactor)？","o":["pyridoxal phosphate","thiamine pyrophosphate","FADH2","coenzyme A"],"a":[2],"ch":["25"],"sec":"25.2","fbt":"Figure 25-26"},{"id":"M-105-2_33","t":"M","y":105,"q":"蛋白質最常經下列何種轉譯後修飾(post-translational modification)，再送到溶酶體(lysosome)？","o":["糖基化(glycosylation)","磷酸化 (phosphorylation)","蘇素化(sumoylation)","乙醯化(acetylation)"],"a":[0],"ch":["27"],"sec":"27.3","fbt":"Figure 27-43"},{"id":"M-105-2_34","t":"M","y":105,"q":"位在腫瘤中心的癌細胞，常處於缺氧的環境，這些細胞偏好利用下列那一種醣類代謝途徑獲取ATP？","o":["ß-oxidation","glycolysis","tricarboxylic acid cycle","pentose phosphate pathway"],"a":[1],"ch":["14"],"sec":"14.1","fbt":"Box 14-1"},{"id":"M-105-2_35","t":"M","y":105,"q":"下列關於操縱子(operon)的敘述，何者錯誤？","o":["只在真核生物上發現","包含promoter","包含operator","包含structural genes"],"a":[0],"ch":["28"],"sec":"28.1","fbt":""},{"id":"M-105-2_36","t":"M","y":105,"q":"下列何者是蛋白質轉譯之起始胺基酸？","o":["Leucine","Cysteine","methionine","tyrosine"],"a":[2],"ch":["27"],"sec":"27.1","fbt":""},{"id":"M-105-2_37","t":"M","y":105,"q":"下列何者是Cori cycle的主要代謝角色？","o":["將乳酸(lactate)由骨骼肌運送至肝臟","將乳酸(lactate)由肝臟運送至骨骼肌","將葡萄糖由骨骼肌運送至肝臟","將葡萄糖與乳酸(lactate)由肝臟運送至骨骼肌"],"a":[0],"ch":["23"],"sec":"23.2","fbt":"Figure 23-21","ex":["Cori cycle 把骨骼肌無氧糖解產生的乳酸送到肝臟，肝臟再用它做糖質新生，葡萄糖回送肌肉；本質是在組織之間轉移代謝負擔。","方向相反。","葡萄糖是由肝臟送往肌肉，不是反向。","乳酸不是由肝臟送往肌肉。"]},{"id":"M-105-2_38","t":"M","y":105,"q":"下列何種分子不會直接參與克式循環(Krebs cycle，亦稱citric acid cycle或TCA cycle)中的化學反應？","o":["coenzyme A(CoA)","ADP(或GDP)","Glutathione","NAD+"],"a":[2],"ch":["16"],"sec":"16.2","fbt":"Figure 16-7"},{"id":"M-105-2_39","t":"M","y":105,"q":"肝糖磷解酶(glycogen phosphorylase)的活性受到phosphorylase kinase及phosphorylase phosphatase的調節，下列何者是 其發揮調節作用的主要方式？","o":["影響酵素蛋白質分解(protein degradation)","磷酸化-去磷酸化作用(phosphorylation-dephosphorylation)","異位調節作用(allosteric regulation)","影響肝醣代謝酵素與調節蛋白質(regulatory protein)的結合作用"],"a":[1],"ch":["15"],"sec":"15.5","fbt":"Figure 15-36"},{"id":"M-105-2_40","t":"M","y":105,"q":"下列何者不屬於膜上蛋白質之脂質錨定(lipid anchor)？","o":["glycosyl phosphatidylinositol anchor","acetyl anchor","myristoyl anchor","thioether anchor"],"a":[1],"ch":["11"],"sec":"11.1","fbt":"Figure 11-13","ex":["GPI 錨把蛋白固定在膜外層，是標準的脂質錨。","沒有「乙醯錨」這種脂質錨定方式；乙醯化是小分子修飾（如組織蛋白離胺酸），不足以錨住蛋白質。","肉豆蔻醯基（14 碳）接在 N 端甘胺酸上，是常見的脂質錨。","硫醚錨指的是 prenyl 基（farnesyl、geranylgeranyl）接在半胱氨酸硫醇基上，如 Ras，是標準的脂質錨。"]},{"id":"M-105-2_41","t":"M","y":105,"q":"下列何者與主動運輸(active transport)中，提供運輸過程的熱力學驅動力(thermodynamic driving force)無關？","o":["光能的補獲","三磷酸腺苷(ATP)的水解作用","大分子的合成","離子梯度的消耗(depletion of ion gradient)"],"a":[2],"ch":[],"sec":"","fbt":""},{"id":"M-105-2_42","t":"M","y":105,"q":"下列那一類分子透過結合並活化peroxisome proliferator-activated recepter alpha(PPARα)，以調控生酮作用 (ketogenesis)相關基因的表現？","o":["Purine","fatty acids","glucose","pyrimidine"],"a":[1],"ch":["17","23"],"sec":"17.2 23.4","fbt":"Figure 23-43","ex":["嘌呤不是 PPARα 的配體。","PPARα 的天然配體正是脂肪酸與其衍生物；飢餓時湧入肝臟的脂肪酸結合並活化 PPARα，上調 β 氧化與生酮作用相關基因（如粒線體 HMG-CoA synthase）—— fibrate 類降血脂藥也是走這條路。","葡萄糖不是 PPARα 的配體。","嘧啶不是 PPARα 的配體。"]},{"id":"M-105-2_43","t":"M","y":105,"q":"克氏循環(TCA cycle)的中間產物可經由轉氨基作用(transamination)直接生成下列那兩種胺基酸？","o":["精胺酸(arginine)與組胺酸(histidine)","酪胺酸(tyrosine)與脯胺酸(proline)","麩胺酸(glutamate)與天冬胺酸(aspartate)","丙胺酸(alanine)與絲胺酸(serine)"],"a":[2],"ch":["16"],"sec":"16.2","fbt":"Figure 16-16"},{"id":"M-105-2_44","t":"M","y":105,"q":"Ammonium ion(NH4 +)可藉由下列何種方式，由骨骼肌細胞運送到肝細胞代謝？","o":["Krebs cycle","glucose-alanine cycle","urea cycle","citric acid cycle"],"a":[1],"ch":["18"],"sec":"18.1","fbt":"Figure 18-9","ex":["Krebs cycle 是粒線體內的中央代謝，不負責組織間運氨。","肌肉把胺基轉給丙酮酸形成丙胺酸送到肝臟，肝臟取回胺基做尿素、把丙酮酸做成葡萄糖送回肌肉 —— glucose-alanine cycle。","尿素循環只在肝細胞內進行，不是運送方式。","citric acid cycle 就是 Krebs cycle，同樣不是運送途徑。"]},{"id":"M-105-2_45","t":"M","y":105,"q":"分析一個腎臟癌病人的腫瘤時，發現有延胡索酸酵素(fumarase)基因突變，下列敘述何者正確？","o":["延胡索酸(fumarate)因而會在腫瘤組織中大幅下降","缺氧性誘導轉錄因子(hypoxia inducible transcription factor-1, HIF-1)會跟著下降","缺氧性誘導轉錄因子(hypoxia inducible transcription factor-1, HIF-1)會刺激多種糖解酵素(glycolytic enzymes)的產生","缺氧性誘導轉錄因子(hypoxia inducible transcription factor-1, HIF-1)會抑制血管生成(angiogenesis)"],"a":[2],"ch":["19"],"sec":"19.3","fbt":"Figure 19-34"},{"id":"M-105-2_46","t":"M","y":105,"q":"Scatchard分析法能提供下列何種資訊？","o":["酵素的功能放大(enzyme cascades)","酵素的催化反應(catalytic reaction)過程","蛋白質磷酸化(protein phosphorylation)","受體與配體之交互作用(receptor-ligand interactions)"],"a":[3],"ch":["5"],"sec":"5.1","fbt":""},{"id":"M-105-2_47","t":"M","y":105,"q":"下視丘疾病可造成gonadotropin releasing hormone (GnRH) 分泌失調，致使腦下腺luteinizing hormorne(LH)，folliclestimulating hormone(FSH)亦分泌失調，可能造成女性不孕。GnRH作用於G protein coupled receptor後，主要可活化 phospholipase C，下列敘述何者錯誤？","o":["phospholipase C可分解phosphatidylinositol 4,5-bisphosphate(PIP2)","phosphatidylinositol 4,5-bisphosphate(PIP2)被分解為inositol 1,4,5-trisphosphate(IP3)及diacylglycerol(DAG)","diacylglycerol(DAG)可直接活化protein kinase A","inositol 1,4,5-trisphosphate(IP3)可使內質網內之Ca2+釋放"],"a":[2],"ch":["12"],"sec":"12.2","fbt":"Figure 12-11","ex":["PLC 水解 PIP2，正確。","產物正是 IP3 與 DAG，正確。","DAG 活化的是 protein kinase C（需 Ca2+ 協同），不是 protein kinase A，故此敘述錯誤。","IP3 開啟內質網 IP3 受體使鈣釋出，正確。"]},{"id":"M-105-2_48","t":"M","y":105,"q":"常見於癌細胞組織中的腫瘤基因(oncogene)所轉譯之ErbB蛋白質，是經由下列那一個受體(receptor)的訊息傳導路徑而 進行作用？","o":["insulin receptor","platelet-derived growth factor(PDGF)receptor","epidermal growth factor(EGF)receptor","G-protein coupling receptor"],"a":[2],"ch":["12"],"sec":"12.11","fbt":"Figure 12-38","ex":["insulin receptor 雖是 RTK，但不屬 ErbB 家族。","PDGF receptor 是另一個 RTK 家族。","ErbB 就是 EGF 受體家族：ErbB1=EGFR、ErbB2=HER2／neu，在乳癌等過度表現。","ErbB 是受體酪胺酸激酶，不走 GPCR 路徑。"]},{"id":"M-105-2_49","t":"M","y":105,"q":"除了啟動子(promoter)及多選殖位點(multiple cloning sites)外，下列何者是原核細胞表現載體(expression vector)的必要構造？","o":["促進子(enhancer)、操縱子(operator)","致弱子(attenuator)、抑制子(repressor)","促進子(enhancer)、核糖體結合區(ribosome binding site)","核糖體結合區(ribosome binding site)、轉錄終止序列(transcriptional termination sequence)"],"a":[3],"ch":["9"],"sec":"9.1","fbt":"Figure 9-7","ex":["enhancer 是真核的調控元件，原核沒有。","attenuator 與 repressor 是特定操縱子的調控元件，不是表現載體的必要構造。","enhancer 同樣不屬原核系統。","原核要讓基因真正轉譯出蛋白，除了啟動子與選殖位點，還必須有核糖體結合位（Shine-Dalgarno 序列）讓 30S 次單元定位，以及轉錄終止序列讓 RNA 聚合酶正確停下來。"]},{"id":"M-105-2_50","t":"M","y":105,"q":"建立基因剔除鼠(knockout mouse)的過程中，一般以取出實驗動物之何種細胞進行基因剔除？","o":["卵細胞","精細胞","受精卵","胚胎幹細胞"],"a":[3],"ch":[],"sec":"","fbt":""},{"id":"M-105-2_51","t":"M","y":105,"q":"有關於細胞訊息傳遞之機轉，下列何者錯誤？","o":["脂溶性ligand可以直接穿越細胞膜，並且與細胞內receptor結合產生作用","有些transmembrane receptor 本身即具有酵素活性，可以經由與ligand結合後活化","有些transmembrane receptor與ligand結合後，可以活化protein tyrosine kinase","NMDA glutamate receptor屬於GPCR(G-protein coupled receptor)"],"a":[3],"ch":["12"],"sec":"","fbt":"","ex":["脂溶性配體（類固醇、甲狀腺素）可直接穿膜與細胞內受體結合，正確。","受體酵素（RTK、受體型 guanylyl cyclase）本身即具酵素活性，結合配體後活化，正確。","有些受體結合後活化酪胺酸激酶 —— 可以是受體本身，也可以是結合的 JAK，正確。","NMDA 受體是配體門控的陽離子通道（需 glutamate 與 glycine 共同結合並解除 Mg2+ 阻斷），不是 GPCR，故此敘述錯誤。"]},{"id":"M-104-1_29","t":"M","y":104,"q":"一位3個月大的男嬰自出生後便有成長遲緩現象，理學檢查發現有肌無力徵候。血液檢查發現乳酸(lactate)、丙酮酸(pyruvate)、丙胺酸(alanine)上升，並有代謝性酸中毒(metabolic acidosis)現象。根據這些病徵，可優先考慮以何種維生素作為治療？","o":["維生素B6(pyridoxine)","菸鹼酸(niacin)","核黃素(riboflavin)","硫胺(thiamine)"],"a":[3],"ch":["14"],"sec":"14.3","fbt":""},{"id":"M-104-1_30","t":"M","y":104,"q":"下列何種鹼基不存於一般RNA分子？","o":["腺嘌呤(adenine)","尿嘧啶(uracil)","胸腺嘧啶(thymine)","胞嘧啶(cytosine)"],"a":[2],"ch":["8"],"sec":"8.1","fbt":"Table 8-1","ex":["腺嘌呤同時存在於 DNA 與 RNA。","尿嘧啶是 RNA 特有的鹼基。","胸腺嘧啶（5-甲基尿嘧啶）是 DNA 特有的，一般 RNA 中不存在（tRNA 的少數修飾鹼基是例外）。","胞嘧啶同時存在於 DNA 與 RNA。"]},{"id":"M-104-1_31","t":"M","y":104,"q":"下列何種酵素反應不參與DNA聚合酶(polymerase)的校對(proofreading)功能？","o":["3'→5'外切酶(exonuclease)的活性","磷酸二酯鍵(phosphodiester bond)的水解","鹼基配對錯誤(mismatched base pairs)","5'→3'外切酶(exonuclease)的活性"],"a":[2,3],"ch":["25"],"sec":"25.1","fbt":"Table 25-1"},{"id":"M-104-1_32","t":"M","y":104,"q":"許多藥物的合成乃是結合分子生物學與合成化學而得，抗愛滋病的藥物3'-azido-2',3'-dideoxythymidine(AZT)即為其中一項，下列關於AZT的敘述，何者錯誤？","o":["AZT由易被HIV病毒感染的T淋巴球所吸收而轉變為三磷酸根AZT(AZT triphosphate)","HIV病毒的反轉錄酶對於AZT triphosphate有極高的親和力","HIV病毒的DNA進行複製時若3'端加入AZT triphosphate則會終止複製反應","人類T淋巴球的DNA複製酶對AZT triphosphate有高親和力，所以會帶來許多副作用"],"a":[3],"ch":["26"],"sec":"26.3","fbt":"Box 26-2"},{"id":"M-104-1_33","t":"M","y":104,"q":"下列那一種RNA之5'端及3'端之核糖(ribose)，最可能同時具有free 3'-OH？","o":["真核細胞mRNA","原核細胞mRNA","真核細胞rRNA","原核細胞rRNA"],"a":[0],"ch":["26"],"sec":"26.2","fbt":"Figure 26-12"},{"id":"M-104-1_34","t":"M","y":104,"q":"下列那一項不是RNA聚合酶(RNA polymerase)轉錄的特性？","o":["結合DNA的大小涵蓋約35 bp","需要鎂離子(Mg2+)","於5'-OH末端接上核苷酸","從5'往3'方向延長RNA序列"],"a":[2],"ch":["26"],"sec":"26.1","fbt":""},{"id":"M-104-1_35","t":"M","y":104,"q":"CRP(cAMP receptor protein)是lac operon基因表現的一個主要調控因子，下列何者是CRP最適的描述？","o":["CRP協助RNA聚合酶(RNA polymerase)與lac-啟動子(lac-promoter)的結合","CRP與lac operon的結合只能在葡萄糖存在下進行","CRP與lac operon的結合可防止lac-抑制子(lac-repressor)與operator的結合","CRP與lac-抑制子(lac-repressor)競爭operator"],"a":[0],"ch":["28"],"sec":"28.2","fbt":"Figure 28-18"},{"id":"M-104-1_36","t":"M","y":104,"q":"在血基質(heme)的生合成反應過程中，下列何者為速率決定步驟(rate-limiting step)之酵素？","o":["Ferrochelatase","Heme oxygenase","delta-aminolevulinic acid(δ-ALA)synthase","UDP-glucose dehydrogenase"],"a":[2],"ch":["22"],"sec":"22.3","fbt":"","ex":["ferrochelatase 催化最後一步把 Fe2+ 插入 protoporphyrin IX，不是限速步驟（它是鉛中毒受抑制的另一個酵素）。","heme oxygenase 屬血基質「降解」的第一步，不在合成路徑上。","δ-ALA synthase 催化 succinyl-CoA + glycine → δ-ALA，是第一步也是限速步驟，受終產物 heme 的反饋抑制。","UDP-glucose dehydrogenase 屬醣醛酸路徑，與血基質合成無關。"]},{"id":"M-104-1_37","t":"M","y":104,"q":"利用氟-18去氧葡萄糖(18F-2-deoxyglucose)所做的正子造影能有效找出體內癌細胞的正確位置，此方法的原理係基於癌細胞的何種特性？","o":["DNA複製速率比正常細胞快","克氏循環(TCA cycle)速率比正常細胞高","糖解作用(glycolysis)速率比正常細胞高","肝醣合成(glycogen biosynthesis)速率比正常細胞高"],"a":[2],"ch":["14"],"sec":"14.1","fbt":"Box 14-1"},{"id":"M-104-1_38","t":"M","y":104,"q":"Fructose 2,6-bisphosphate是糖解作用(glycolysis)與糖質新生作用(gluconeogenesis)的重要共同異位調解因子(allosteric regulator)，下列有關fructose 2,6-bisphosphate的敘述何者正確？","o":["昇糖激素(glucagon)促進其合成","fructose 2,6-bisphosphatase催化其由fructose 6-phosphate合成","fructose 2,6-bisphosphate活化phosphofructokinase-1","fructose 2,6-bisphosphate增加糖質新生作用(gluconeogenesis)"],"a":[2],"ch":["15"],"sec":"15.3","fbt":"Figure 15-18"},{"id":"M-104-1_39","t":"M","y":104,"q":"Neuraminidase是某些流感病毒的重要酵素之一，此酵素可以切除宿主細胞膜上醣複合物上的那一種糖基？","o":["N-acetylglucosamine","gluconic acid","galactose","sialic acid"],"a":[3],"ch":["7"],"sec":"7.4","fbt":""},{"id":"M-104-1_40","t":"M","y":104,"q":"下列關於固醇調節區域結合蛋白質(sterol regulatory element-binding protein；SREBP)之敘述，何者錯誤？","o":["位於內質網","經由切斷連結的脂肪酸而活化","活化後進入細胞核","做為轉錄因子增加合成膽固醇(cholesterol)的基因表現"],"a":[1],"ch":["21"],"sec":"21.4","fbt":"Figure 21-44","ex":["SREBP 以未活化形式嵌在內質網膜上（與 SCAP 結合），敘述正確。","SREBP 的活化是被 Site-1 與 Site-2 蛋白酶「切斷蛋白質本體」釋出 N 端轉錄域，不是切斷什麼連結的脂肪酸，故此敘述錯誤。","釋出的 N 端片段進入細胞核，敘述正確。","它在核內作為轉錄因子，提高 HMG-CoA reductase 與 LDL receptor 等基因的表現，敘述正確。"]},{"id":"M-104-1_41","t":"M","y":104,"q":"將離子載體(ionophore)，如纈氨黴素(Valinomycin)，加至原核細胞懸浮液，該細胞之膜離子梯度(transmembrane ion gradients)會有下列何種變化？","o":["離子梯度增加","離子梯度減少","離子梯度沒有任何改變","離子梯度無法預期是否會改變"],"a":[0,1,2,3],"ch":["11"],"sec":"11.3","fbt":"Figure 11-42","free":1,"ex":["離子載體讓離子沿梯度自由流動，梯度只會變小不會增加。","valinomycin 包住 K+ 的去水合離子、外殼疏水，像渡輪一樣把 K+ 帶過膜，離子沿電化學梯度流失，跨膜梯度因而「減少」—— 這是本題的標準答案。","梯度必然改變，不會毫無變化。","機制明確，結果是可預期的。（本題官方公告送分，四個選項皆給分。）"]},{"id":"M-104-1_42","t":"M","y":104,"q":"罕見遺傳疾病medium-chain acyl-CoA dehydrogenase基因突變，可能造成脂肪肝、低血糖、octanoic acid在血液中堆積、嗜睡、嘔吐及昏迷。下列有關該酶之功能敘述，何者正確？","o":["該酶之作用是將脂肪酸運入粒線體","該酶作用於ω-oxidation","該酶之作用是將脂肪酸逐步轉化為pyruvate","該酶之作用是將脂肪酸逐步轉化為acetyl-CoA"],"a":[3],"ch":["17"],"sec":"17.2","fbt":"","ex":["把脂肪酸運入粒線體的是 carnitine 穿梭系統（CPT I／II），不是這個脫氫酶。","ω 氧化發生在內質網，由 P450 系統負責。","β 氧化的產物是 acetyl-CoA，不是丙酮酸。","MCAD 是 β 氧化第一步（醯基-CoA 脫氫）中負責中鏈受質的酵素，逐輪把脂肪酸切成 acetyl-CoA。缺乏時中鏈脂肪酸（如辛酸）堆積，禁食時無法生酮供能而出現低酮性低血糖、嗜睡甚至昏迷。"]},{"id":"M-104-1_43","t":"M","y":104,"q":"下列那一種胺基酸無法代謝時會導致甲基丙二酸血症(methylmalonic acidemia)？","o":["Alanine","glycine","isoleucine","histidine"],"a":[2],"ch":["18"],"sec":"18.3","fbt":"Table 18-2","ex":["丙胺酸轉胺成丙酮酸，不經 propionyl-CoA。","甘胺酸走 serine／丙酮酸，不產生 methylmalonyl-CoA。","異白胺酸分解會產生 propionyl-CoA → methylmalonyl-CoA → succinyl-CoA；mutase（需 B12）缺損時 methylmalonic acid 堆積。（同樣走這條的還有 Val、Met、Thr。）","組胺酸分解成 glutamate，不經此路。"]},{"id":"M-104-1_44","t":"M","y":104,"q":"威而剛(Viagra)可透過加強一氧化氮(NO)下游cGMP的訊息傳遞作用，而達到其藥理效果。NO是那一種胺基酸的代謝產物？","o":["Arginine","aspartate","lysine","tryptophan"],"a":[0],"ch":["22"],"sec":"22.3","fbt":"Figure 22-33","ex":["NO synthase 以 arginine 為受質，產生 NO 與 citrulline，需 NADPH 與 BH4。","aspartate 走尿素循環與嘧啶合成，不是 NO 來源。","lysine 是純生酮性必需胺基酸，不是 NO 來源。","tryptophan 走 serotonin 與菸鹼酸。"]},{"id":"M-104-1_45","t":"M","y":104,"q":"參與電子傳遞鏈的蛋白質複合體使用那一種胺基酸形成iron-sulfur center，輔助電子傳遞？","o":["丙胺酸(alanine)","甲硫胺酸(methionine)","色胺酸(tryptophan)","半胱胺酸(cysteine)"],"a":[3],"ch":["19"],"sec":"19.1","fbt":"Figure 19-5"},{"id":"M-104-1_46","t":"M","y":104,"q":"革蘭氏陰性菌分泌的內毒素(endotoxin)會調控小腸Cl-的分泌，其作用是因為活化小腸上皮細胞具有那種酵素活性的受器(receptor)所致？","o":["Tyrosine kinase","Guanylyl cyclase","Tyrosine phosphatase","Serine kinase"],"a":[1],"ch":["12"],"sec":"12.6","fbt":"","ex":["腸上皮分泌 Cl− 的這條軸不是由酪胺酸激酶受體啟動。","大腸桿菌耐熱腸毒素（heat-stable enterotoxin）與內源性 guanylin 一樣，作用於腸上皮膜型 guanylyl cyclase 受體，升高 cGMP 進而促進 Cl− 與水分泌。（嚴格說 endotoxin 指 LPS，本題題幹所指應為腸毒素。）","酪胺酸磷酸酶與此無關。","絲胺酸激酶不是此受體的活性。"]},{"id":"M-104-1_47","t":"M","y":104,"q":"G蛋白耦合受體(G-protein-coupled receptor)是屬於下列那一類型的受體？","o":["寡聚配體門控之離子通道(oligomeric ligand-gated ion channel)","7-穿膜片段受體(7-transmembrane segment receptor)","細胞黏附蛋白受體(cell adhesion protein receptor)","單穿膜片段催化受體(single transmembrane segment catalytic receptor)"],"a":[1],"ch":["12"],"sec":"12.2","fbt":"","ex":["配體門控離子通道（如菸鹼型乙醯膽鹼受體）是另一大類受體。","GPCR 即 7-transmembrane／serpentine 受體，七個 α 螺旋來回穿膜。","細胞黏附蛋白受體如 integrin 屬另一類。","單次穿膜的催化型受體指的是 RTK 等受體酵素。"]},{"id":"M-104-1_48","t":"M","y":104,"q":"有關腎上腺素(epinephrine)與乙型腎上腺素受體(β-adrenergic receptor)結合所產生的結果，下列敘述何者錯誤？","o":["刺激Gs蛋白次單元與GTP結合","增加腺苷酸環化酶(adenylyl cyclase)活性","增加蛋白激酶A(protein kinase A)的酵素活性","促進激素-受體複合物(hormone-receptor complex)的內噬(endocytosis)"],"a":[0,1,2,3],"ch":["12"],"sec":"12.2","fbt":"Figure 12-4","free":1,"ex":["腎上腺素結合 β 受體後，受體作為 GEF 促使 Gsα 以 GTP 置換 GDP —— 這是正確結果。","Gsα-GTP 活化 adenylyl cyclase，使 cAMP 上升 —— 正確結果。","cAMP 結合 PKA 調節次單元，釋出催化次單元而活化 —— 正確結果。","持續刺激後受體被 βARK 磷酸化並結合 β-arrestin，經內噬而去敏化 —— 也是正確結果。本題四個敘述都正確，沒有「錯誤」選項，官方公告送分。"]},{"id":"M-104-1_49","t":"M","y":104,"q":"利用Sanger method定序DNA，使用之試劑dideoxy analog具有下列那一種功能？","o":["可中止DNA合成","水解斷裂DNA之磷酯鍵","是合成引子(primer)的成分","合成沒有5'端磷酸根之DNA"],"a":[0],"ch":["8"],"sec":"8.3","fbt":"","ex":["雙脫氧核苷酸少了 3′-OH，接上後無法再形成磷酸二酯鍵，隨機終止延長而產生一系列長度不同的片段，再依長度分離讀出序列。","它不具水解活性，不會切斷磷酸二酯鍵。","它不是引子的成分；引子是正常的寡核苷酸。","產物的 5′ 端仍有磷酸根，這不是它的作用。"]},{"id":"M-104-1_50","t":"M","y":104,"q":"下列何者是選殖質體(cloning plasmids)的正確描述？","o":["在大腸桿菌DNA複製(replication)時，環狀質體(circular plasmids)不需要複製起點(origin of replication)","可用以選殖約50 Kb鹼基對(kilo-base pairs)的外來DNA","通常不需抗生素抗藥性基因(antibiotic resistant gene)","需要特定限制酶切點(unique restriction enzyme site)以供選殖外來DNA之用"],"a":[3],"ch":["9"],"sec":"9.1","fbt":"","ex":["質體要能在大腸桿菌內自行複製，必須帶有複製起點（ori）。","一般選殖質體的容量約 15 kb 以內；50 kb 要改用 cosmid、BAC 等載體。","抗生素抗藥性基因正是用來篩選出帶有質體的菌落，不可或缺。","載體上必須有「唯一」的限制酶切點（多選殖位點），才能在固定位置切開並插入外來 DNA 而不切碎載體本身。"]},{"id":"M-104-2_26","t":"M","y":104,"q":"蛋白質結構中的β-摺板(β-sheet)與α-螺旋(α-helix)在結構分類上屬於：","o":["一級結構(primary structure)","二級結構(secondary structure)","三級結構(tertiary structure)","四級結構(quaternary structure)"],"a":[1],"ch":["4"],"sec":"4.2","fbt":""},{"id":"M-104-2_27","t":"M","y":104,"q":"下列關於異位調節酵素(allosteric enzymes)的敘述，何者錯誤？","o":["異位調節因子(allosteric effector)會影響此類酵素活性中心的結構","異位調節屬於可逆性(reversible)的活性調控方式","此類酵素大多以單體(monomeric)的方式存在","將此類酵素催化反應之初速度(Vo或Vi)對受質濃度([S])作圖，所得曲線呈S形(sigmoidal shape)"],"a":[2],"ch":["6"],"sec":"6.5","fbt":""},{"id":"M-104-2_28","t":"M","y":104,"q":"下列那一個胺基酸在酸鹼值7.0的電泳(electrophoresis)過程中，朝向陽極移動的速率最快？","o":["丙氨酸(alanine)","離胺酸(lysine)","麩胺醯胺(glutamine)","天冬氨酸(aspartic acid)"],"a":[3],"ch":["3"],"sec":"3.1","fbt":""},{"id":"M-104-2_29","t":"M","y":104,"q":"何種輔酶(coenzyme)不參與α-ketoglutarate轉換成succinyl-CoA之氧化脫羧反應(oxidative decarboxylation)？","o":["Thiamine pyrophosphate","Tetrahydrofolate","FAD","Coenzyme A"],"a":[1],"ch":["16"],"sec":"16.2","fbt":""},{"id":"M-104-2_30","t":"M","y":104,"q":"在紅血球中，下列那一種物質可直接調控血紅素(hemoglobin)中氧分子的釋放？","o":["Dihydroorotate","2,3-bisphosphoglycerate","Fructose-1,6-bisphosphate","Cytochrome oxidase"],"a":[1],"ch":["5"],"sec":"5.1","fbt":""},{"id":"M-104-2_31","t":"M","y":104,"q":"下列何者是胸腺嘧啶(thymine)在細胞內代謝分解之中間產物？","o":["Uric acid","β-alanine","Carbamoyl phosphate","β-aminoisobutyrate"],"a":[3],"ch":["22"],"sec":"22.4","fbt":"","ex":["尿酸是「嘌呤」分解的終產物，與胸腺嘧啶無關。","β-alanine 來自沒有甲基的 cytosine 與 uracil 的分解。","carbamoyl phosphate 是嘧啶「合成」的起點，不是分解產物。","胸腺嘧啶多了一個甲基，分解後得到 β-aminoisobutyrate —— 這就是區分 thymine 與 uracil／cytosine 分解產物的關鍵。"]},{"id":"M-104-2_32","t":"M","y":104,"q":"下列那一個酵素的缺陷，最可能導致嘌呤核苷降解(purine nucleoside degradation)的異常，導致免疫缺陷疾病(immunodeficiency diseases)的發生？","o":["Adenosine deaminase","AMP aminohydrolase","Purine oxidase","Xanthine oxidoreductase"],"a":[0],"ch":["22"],"sec":"22.4","fbt":"","ex":["adenosine deaminase（ADA）缺乏使 deoxyadenosine 堆積、dATP 過量而抑制 ribonucleotide reductase，淋巴球無法製造 dNTP 而死亡，造成嚴重複合型免疫缺乏（SCID）。","AMP aminohydrolase（AMP deaminase）缺乏造成運動後肌痛與無力，不是免疫缺陷。","「purine oxidase」不是標準的酵素名稱。","xanthine oxidoreductase 缺乏造成 xanthinuria（黃嘌呤結石），尿酸反而偏低，不是免疫缺陷。"]},{"id":"M-104-2_33","t":"M","y":104,"q":"有關大腸桿菌(E. coli)DNA之複製過程，下列敘述何者錯誤？","o":["解螺旋酶(helicase)在複製叉(replication fork)上負責解開雙股DNA","DNA連接酶(ligase)在延遲股(lagging strand)上催化磷酸雙酯鍵(phosphodiester bond)的形成","DNA聚合酶I型(DNA polymeraseⅠ)由岡崎片段(Okazaki fragment)的5'端水解RNA","DnaA蛋白與oriC位置的GC rich區域結合"],"a":[3],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-104-2_34","t":"M","y":104,"q":"下列何者與真核細胞轉錄作用無關？","o":["DNA模板(DNA template)","RNA聚合酶(RNA polymerase)","RNA引子(RNA primer)","啟動子(promoter)"],"a":[2],"ch":["26"],"sec":"26.1","fbt":""},{"id":"M-104-2_35","t":"M","y":104,"q":"真核細胞蛋白質合成的啟始階段(initiation stage)需要轉譯起始因子4F(eIF4F)複合物的參與，下列那一種轉譯起始因子不包含於此種複合物中？","o":["eIF4A","eIF4B","eIF4E","eIF4G"],"a":[1],"ch":["27"],"sec":"27.2","fbt":"Figure 27-28"},{"id":"M-104-2_36","t":"M","y":104,"q":"RAS-MAPK訊息傳遞路徑同時可調控細胞死亡與存活的訊號，RAS的活化需要下列那一個分子？","o":["ATP","GTP","NADH","Ca2+"],"a":[1,3],"ch":["12"],"sec":"","fbt":"","ex":["Ras 是 GTP 結合蛋白，不以 ATP 作為開關核苷酸。","Ras 的活化就是由 Sos 這類 GEF 催化、以 GTP 置換 GDP；Ras-GTP 才能活化 Raf-1。這是本題的標準答案。","NADH 與 Ras 的活化無關。","官方答案併計了 D，但 Ras 本身的開關循環並不需要 Ca2+（Ca2+ 是 PKC／calmodulin 那條路的訊息）。一般視為本題更正後的併計選項，作答時以 GTP 為準。"]},{"id":"M-104-2_37","t":"M","y":104,"q":"RecA是救命反應(SOS response)的主要調控蛋白質，導致受LexA repressor調控的基因表現增加，其作用機制為何？","o":["RecA協同DNA聚合酶，將LexA repressor從操縱基因(operator)上移除","RecA直接結合到LexA操縱基因(operator)的位置上，使LexA repressor從操縱基因(operator)上分離","RecA與LexA repressor結合而弱化LexA repressor與操縱基因(operator)結合的親和力(binding affinity)","RecA與LexA repressor結合，引發LexA repressor的自體裂解(self-cleavage)"],"a":[3],"ch":["28"],"sec":"28.2","fbt":"Figure 28-21"},{"id":"M-104-2_38","t":"M","y":104,"q":"肺結核病人常以各種不同藥物一併治療，rifampicin為主要的藥物之一。Rifampicin抑制肺結核桿菌的機轉為抑制下列那一種酶？","o":["去氧核糖核酸聚合酶(DNA polymerase)","細菌核糖核酸聚合酶(bacterial RNA polymerase)","粒線體核糖核酸聚合酶(mitochondrial RNA polymerase)","反轉錄酶(reverse transcriptase)"],"a":[1],"ch":["26"],"sec":"26.1","fbt":""},{"id":"M-104-2_39","t":"M","y":104,"q":"下列那一個代謝途徑不會產生二氧化碳？","o":["五碳糖磷酸途徑(pentose phosphate pathway)","克氏循環(TCA cycle)","從草醯乙酸(oxaloacetate)開始的糖質新生作用(gluconeogenesis)","糖解作用(glycolysis)"],"a":[3],"ch":["14","16"],"sec":"14.1 14.4 14.5 16.2","fbt":"Figure 14-2"},{"id":"M-104-2_40","t":"M","y":104,"q":"在糖解(glycolysis)作用中，那個酵素的功能可將六碳糖分解為兩個三碳糖？","o":["phosphohexose isomerase","aldolase","triose phosphate isomerase","enolase"],"a":[1],"ch":["14"],"sec":"14.1","fbt":"Figure 14-2"},{"id":"M-104-2_41","t":"M","y":104,"q":"下列何種革蘭氏陽性細菌的細胞壁醣複合物(glycoconjugates)之合成，可以被抗生素penicillin所抑制？","o":["glycolipids","proteoglycans","glycoproteins","peptidoglycans"],"a":[3],"ch":["6"],"sec":"6.4","fbt":""},{"id":"M-104-2_42","t":"M","y":104,"q":"在哺乳類動物利用膽鹼(choline)合成磷脂醯絲胺酸(phosphatidylserine)的過程中，需要下列何者？","o":["GTP","CTP","AMP","UMP"],"a":[1],"ch":["21"],"sec":"21.3","fbt":"Figure 21-29","ex":["GTP 不是磷脂合成的活化載體。","這條路（Kennedy pathway）要先把 choline 磷酸化，再由 CTP 活化成 CDP-choline，才能把 phosphocholine 接到 diacylglycerol 上；CTP 是磷脂合成中活化頭基的專用核苷酸。","AMP 不參與此活化步驟。","UMP 攜帶的是糖基（UDP-glucose 等），不是磷脂頭基。"]},{"id":"M-104-2_43","t":"M","y":104,"q":"下列何者為中性(neutral)物質的穿膜促進性擴散作用(facilitated diffusion)之特徵？","o":["這是一種需能反應","主要依賴於膜電位(membrane potential)","當代謝物濃度增加時，輸送速度會有上限","以輸送速度與代謝物濃度作圖，將呈現線性圖"],"a":[2],"ch":["11"],"sec":"11.3","fbt":"","ex":["促進性擴散沿濃度梯度進行，是放能的，不需外加能量。","中性物質不帶電，不受膜電位影響。","載體蛋白的數目有限，濃度升高時全部被佔滿而達到最大速率（Vmax），呈飽和動力學 —— 這正是它與單純擴散最大的區別。","呈飽和的雙曲線（類似 Michaelis-Menten），不是線性；線性的是單純擴散。"]},{"id":"M-104-2_44","t":"M","y":104,"q":"下列關於脂蛋白(lipoprotein)的敘述，何者錯誤？","o":["脂蛋白含脂質與蛋白質，它負責運送膽固醇(cholesterol)、磷脂質(phospholipid)與三酸甘油酯(triacylglycerol)到各組織器官","ApoC-II會促進血液中三酸甘油酯之分解","含蛋白質量最多的脂蛋白是高密度脂蛋白(HDL, high density lipoprotein)","運送肝臟細胞所合成的三酸甘油酯到周邊組織的脂蛋白為乳糜微粒(chylomicrons)"],"a":[3],"ch":["21"],"sec":"21.4","fbt":"","ex":["脂蛋白以疏水核心裝載三酸甘油酯與膽固醇酯，外層為磷脂、游離膽固醇與載脂蛋白，負責血中運輸，敘述正確。","ApoC-II 活化 lipoprotein lipase，促進血中三酸甘油酯水解，敘述正確。","HDL 的密度最高正是因為蛋白質比例最高、脂質最少，敘述正確。","運送「肝臟自行合成」的三酸甘油酯到周邊組織的是 VLDL；乳糜微粒運的是小腸吸收的「食物來源」三酸甘油酯，故此敘述錯誤。"]},{"id":"M-104-2_45","t":"M","y":104,"q":"穀胱甘肽(glutathione)為人體內調節氧化還原之重要物質，下列那一種胺基酸不是作為合成穀胱甘肽之主要骨架？","o":["麩胺酸(glutamate)","離胺酸(lysine)","半胱胺酸(cysteine)","甘胺酸(glycine)"],"a":[1],"ch":["22"],"sec":"22.3","fbt":"Figure 22-29","ex":["麩胺酸是 GSH 的第一個殘基，以 γ-羧基形成特殊的胜肽鍵。","離胺酸不在 GSH 的組成中；GSH 是 γ-Glu-Cys-Gly。","半胱胺酸的硫醇基是 GSH 抗氧化的活性中心。","甘胺酸是 GSH 的第三個殘基。"]},{"id":"M-104-2_46","t":"M","y":104,"q":"一名3個月大男嬰的血清中，苯丙胺酸(phenylalanine)與苯丙酮酸(phenylpyruvate)的濃度較高。若是苯酮尿症(phenylketonuria)，最可能會再出現下列那個檢驗數據？","o":["苯丙胺酸羥化酶(Phenylalanine hydroxylase)活性降低","血清中的黑尿酸(Homogentisic acid)濃度偏高","血清中的維生素B12濃度偏低","血清中的維生素B6濃度偏低"],"a":[0],"ch":["18"],"sec":"18.3","fbt":"","ex":["PKU 的根本原因就是 phenylalanine hydroxylase 活性降低或缺失，血中 Phe 與苯丙酮酸才會堆積。","黑尿酸升高是黑尿症（alkaptonuria，homogentisate dioxygenase 缺乏），不是 PKU。","B12 與 PKU 無關。","B6 與 PKU 無關（但非典型 PKU 要查 BH4）。"]},{"id":"M-104-2_47","t":"M","y":104,"q":"下列關於粒線體ATP synthase的敘述，何者錯誤？","o":["位於粒線體內膜","可利用氫離子濃度梯度(H+ gradient)將ADP轉換為ATP","為氫離子與磷酸根之symporter","此酵素運作時會產生蛋白質四級結構變化"],"a":[2],"ch":["19"],"sec":"19.2","fbt":""},{"id":"M-104-2_48","t":"M","y":104,"q":"有關三聚體G蛋白質偶合受體(trimeric G protein-coupled receptor)，不具下列何種特性？","o":["部分受體利用環狀核苷酸(cyclic nucleotides)作為訊息傳遞者","是一種細胞核受體(nuclear receptor)","此受體會與G蛋白質交互作用","此受體具有許多穿膜結構"],"a":[1],"ch":["12"],"sec":"12.2","fbt":"","ex":["部分 GPCR 以 cAMP 或 cGMP 作為二級訊息，確實具此特性。","GPCR 是細胞膜上的七次穿膜受體，不是細胞核受體，故此特性它不具有。","與三聚體 G 蛋白（αβγ）交互作用正是其定義，具此特性。","具 7 個穿膜螺旋，具此特性。"]},{"id":"M-104-2_49","t":"M","y":104,"q":"下列那一種荷爾蒙與受器(receptor)結合後，會啟動受器之酪胺酸激酶(tyrosine kinase)的活性？","o":["epinephrine","glucagon","insulin","estrogen"],"a":[2],"ch":["12"],"sec":"12.4","fbt":"","ex":["epinephrine 作用於 GPCR（α／β-adrenergic）。","glucagon 作用於 GPCR。","胰島素受體本身就是酪胺酸激酶，結合胰島素後自我磷酸化而活化。","estrogen 作用於核內受體，調控轉錄。"]},{"id":"M-104-2_50","t":"M","y":104,"q":"測定細胞中某種特定mRNA的表現量，下列何種方法最適合？","o":["Gel shift assay","Site-directed mutagenesis","Northern blotting","Southern blotting"],"a":[2],"ch":["9"],"sec":"","fbt":"","ex":["Gel shift（EMSA）測的是蛋白質與 DNA 的結合。","定點突變是用來改變序列，不是定量。","Northern blotting 把 RNA 電泳分離後轉印到膜上，再以標記探針雜交，可同時得到該 mRNA 的「量」與「大小」，是測定特定 mRNA 表現量的經典方法（現今多以 RT-qPCR 取代）。","Southern blotting 偵測的是 DNA。"]},{"id":"M-103-1_26","t":"M","y":103,"q":"下列那一種胺基酸由於其結構的剛性(rigidity)很大，因此在蛋白質的 β-摺板(β-sheet)結構中很 少出現?","o":["甘胺酸(glycine)","絲胺酸(serine)","半胱胺酸(cysteine)","脯胺酸(proline)"],"a":[3],"ch":["4"],"sec":"4.2","fbt":""},{"id":"M-103-1_27","t":"M","y":103,"q":"膠原蛋白(collagen)之羥基化(hydroxylation)修飾反應所需的維生素為:","o":["thiamine","ascorbate","pyridoxal","cobalamin"],"a":[1],"ch":["4"],"sec":"4.3","fbt":"Box 4-3"},{"id":"M-103-1_28","t":"M","y":103,"q":"真核細胞核內的一種纖維狀物質，其由一整套基因體 DNA 與蛋白質所構成，具調控基因表現的功能。 該構造的名稱為何?","o":["染色質(chromatin)","中心粒(centrosome)","基因(gene)","核小體(nucleosome)"],"a":[0],"ch":["24"],"sec":"24.3","fbt":"","ex":["染色質是細胞核中 DNA 與組織蛋白等蛋白質結合而成的纖維狀複合體，其緊密或鬆散的程度直接決定基因能否被轉錄。","中心粒是細胞分裂時組織紡錘體的胞器，不含基因體 DNA。","基因只是 DNA 上的一段序列，不是 DNA 與蛋白質組成的構造。","核小體只是染色質的「基本單元」（147 bp DNA 纏繞八聚體 1.65 圈），不是一整套基因體構成的纖維狀物質。"]},{"id":"M-103-1_29","t":"M","y":103,"q":"Holliday intermediate 的結構會在下列何種反應中出現?","o":["轉錄作用(transcription)","轉譯作用(translation)","轉位作用(transposition)","同源重組(homologous genetic recombination)"],"a":[3],"ch":["25"],"sec":"25.3","fbt":""},{"id":"M-103-1_30","t":"M","y":103,"q":"人類細胞 mRNA 轉譯成蛋白質，下列何種為正確之調節機制?","o":["兩條 mRNA 進行重組(recombination)產生新的蛋白質","將 mRNA 送入核內進行轉譯","和大約 300~500 核苷酸(nucleotides)大小的 DNA 結合而增加製造蛋白質效率","和小於 50 核苷酸(nucleotides)大小的 RNA 結合而減少製造蛋白質效率"],"a":[3],"ch":["27"],"sec":"","fbt":""},{"id":"M-103-1_31","t":"M","y":103,"q":"大腸桿菌 cAMP receptor protein 與 lac 操縱子(operon)DNA 結合後，可產生下列何種效應?","o":["幫助 RNA 聚合酶與 lac 啟動子(promoter)結合的效應","可抑制 lac 操縱子的活性","可避免抑制子(repressor)與 lac 的操縱基因(operator)結合","在葡萄糖的存在下始能與 lac 操縱子結合"],"a":[0],"ch":["28"],"sec":"28.2","fbt":"Figure 28-18"},{"id":"M-103-1_32","t":"M","y":103,"q":"下列關於真核細胞蛋白質合成之敘述，何者正確?","o":["所有蛋白質的 N 端起始胺基酸必為甲硫胺酸(methionine)","所有蛋白質的 N 端起始胺基酸必為色胺酸(tryptophan)","所有蛋白質的 N 端起始胺基酸必為半胱胺酸(cysteine)","所有蛋白質的 N 端起始胺基酸必為組胺酸(histidine)"],"a":[0],"ch":["27"],"sec":"27.1","fbt":""},{"id":"M-103-1_33","t":"M","y":103,"q":"有關真核生物基因啟動子(promoter)之特性，下列敘述何者錯誤?","o":["有些啟動子在開始轉錄位置附近含有 initiator element","有些啟動子含 GC box","有些啟動子含 Pribnow box","有些啟動子含 TATA box"],"a":[2],"ch":["26"],"sec":"26.1","fbt":""},{"id":"M-103-1_34","t":"M","y":103,"q":"由細胞核之基因所表現之蛋白質，下列何者不須 targeting 序列(signal)?","o":["分泌性蛋白質","粒線體蛋白質","膜蛋白質","細胞質蛋白質"],"a":[3],"ch":["27"],"sec":"","fbt":""},{"id":"M-103-1_35","t":"M","y":103,"q":"請在下列各原核細胞 RNA 聚合酶(RNA polymerase)次單元(subunit)中配對出其專一的功能?\n次單元 功能\na. α I 具啟動子序列的專一辨識能力\nb. β II 生合成的延伸(elongation)作用，並能與調控蛋白互動(interaction)\nc. σ III 負責生合成的起始(initiation)與延伸(elongation)作用","o":["a-I, b-II, c-III","a-III, b-II, c-I","a-III, b-I, c-II","a-II, b-III, c-I"],"a":[3],"ch":["26"],"sec":"","fbt":""},{"id":"M-103-1_36","t":"M","y":103,"q":"下列那一個分子不是糖解作用(glycolysis)與糖質新生(gluconeogenesis)共同的中間產物?","o":["磷酸烯醇式丙酮酸(phosphoenolpyruvate)","草醯乙酸(oxaloacetate)","1,3-二磷酸甘油酸(1,3-bisphosphoglycerate)","6-磷酸葡萄糖(glucose 6-phosphate)"],"a":[1],"ch":["14"],"sec":"14.4","fbt":"Figure 14-17"},{"id":"M-103-1_37","t":"M","y":103,"q":"下列何種情況，導致遺傳疾病半乳糖血症(galactosemia)的發生?","o":["缺少 fructokinase","缺少 UDP-glucose:galactose 1-phosphate uridylyltransferase","無法分解 lactose","過度攝取 galactose"],"a":[1],"ch":["14"],"sec":"14.2","fbt":""},{"id":"M-103-1_38","t":"M","y":103,"q":"有關哺乳類動物細胞之 N-linked 醣蛋白(glycoproteins)之敘述，下列何者正確?","o":["N-linked glycoproteins 最主要之 oligosaccharides 是由 glucose 組成","利用 dolichol phosphate 結合 oligosaccharides 協助醣蛋白之合成","N-linked glycoproteins 用以結合 oligosaccharides 之胺基酸是 lysine","N-glycosylation 主要在高基氏體進行"],"a":[1],"ch":["7"],"sec":"7.3","fbt":"Figure 7-30"},{"id":"M-103-1_39","t":"M","y":103,"q":"UDP-glucose 參與下列那個代謝路徑?","o":["五碳糖磷酸途徑(pentose phosphate pathway)","肝醣分解(glycogen degradation)","糖解作用(glycolysis)","半乳糖轉變為葡萄糖(epimerization of galactose to glucose)"],"a":[3],"ch":["14"],"sec":"14.2","fbt":"Figure"},{"id":"M-103-1_40","t":"M","y":103,"q":"所有生物細胞膜內的脂雙層具有下列何種共同特色?","o":["個別的油脂分子能在脂雙層的表面自由地側向擴散(lateral diffusion)","個別的油脂分子能夠快速在脂雙層中的其中一層自由翻轉擴散(flip-flop diffusion)至另外一層","具有極性但不帶電荷之化合物容易經由擴散穿過脂雙層","脂雙層利用鄰近磷脂分子之間的共價鍵而形成穩定結構"],"a":[0],"ch":["11"],"sec":"11.3","fbt":"Figure 11-24","ex":["脂質分子在同一層內的側向擴散非常快（每秒可移動數微米），是所有生物膜共有的流動性特徵。","翻轉（flip-flop）要把極性頭基拖過疏水核心，自發速率極慢（數小時至數天），需要 flippase 等酵素協助。","具極性的化合物即使不帶電，穿過疏水核心仍相當困難，需要載體。","脂雙層靠疏水作用與凡得瓦力這些「非共價」作用維持，磷脂之間沒有共價鍵。"]},{"id":"M-103-1_41","t":"M","y":103,"q":"下列何者不涉及膜融合(membrane fusion)?","o":["細胞內吞作用(endocytosis)","包膜病毒(enveloped virus)進入細胞","葡萄糖進入細胞","細胞外釋作用(exocytosis)"],"a":[2],"ch":["11"],"sec":"11.2","fbt":"Figure 11-21","ex":["內吞作用時囊泡自細胞膜內陷並夾斷，涉及膜融合／分裂。","包膜病毒以其外套膜與宿主膜融合而進入，涉及膜融合。","葡萄糖是由 GLUT 等載體蛋白運過膜，膜本身不融合，故不涉及膜融合。","外釋作用時分泌囊泡與細胞膜融合，涉及膜融合。"]},{"id":"M-103-1_42","t":"M","y":103,"q":"下列何者是細胞運送物質通過細胞膜之促進性擴散作用(facilitated diffusion)的特性?","o":["受到溶質濃度梯度的驅動","需要 ATP 的驅動","通常是一種吸能的(endergonic)反應","通常是一種不可逆的反應"],"a":[0],"ch":["11"],"sec":"11.3","fbt":"","ex":["促進性擴散純粹由溶質的濃度（電化學）梯度驅動，載體只是加速達到平衡。","不需 ATP；需要 ATP 的是主動運輸。","沿梯度進行，ΔG 為負，屬放能（exergonic）反應。","是可逆的，梯度方向反轉時運送方向也會反轉。"]},{"id":"M-103-1_43","t":"M","y":103,"q":"下列何者是配體管制型離子通道(ligand-gated ion channel)如菸鹼性乙醯膽鹼受體(nicotinic acetylcholine receptor)的特性?","o":["在脂雙層中允許離子通透的帶電脂質","碰到特定的離子時才允許配體通過細胞膜","碰到特定的配體時才允許離子通過細胞膜","配體與細胞膜上相對應受體結合需依賴特定離子存在"],"a":[2],"ch":["11"],"sec":"11.3","fbt":"","ex":["它是蛋白質通道，不是帶電脂質。","方向寫反了：是配體打開通道讓「離子」通過，不是離子讓配體通過。","乙醯膽鹼（配體）結合受體後引起構型改變而打開孔道，陽離子才得以通過 —— 這正是配體門控離子通道的定義。","配體與受體的結合不需要特定離子存在。"]},{"id":"M-103-1_44","t":"M","y":103,"q":"那一種胺基酸生合成過程中，tetrahydrofolate 會轉變成 N5, N10-methylenetetrahydrofolate?","o":["serine + homocysteine → cysteine + alpha-ketobutyrate","serine → glycine","glutamate → glutamine","glutamate → proline"],"a":[1],"ch":["22"],"sec":"22.2","fbt":"Figure 22-14","ex":["serine 與 homocysteine 走 cystathionine 生成 cysteine，不經四氫葉酸。","serine hydroxymethyltransferase（需 PLP）把 serine 的羥甲基交給 THF，產生 glycine 與 N5,N10-methylene-THF —— 這是細胞一碳單位最主要的來源。","glutamate → glutamine 由 glutamine synthetase 催化，不涉及葉酸。","glutamate → proline 經還原與環化，不涉及葉酸。"]},{"id":"M-103-1_45","t":"M","y":103,"q":"maple syrup urine disease 是因為下列那個胺基酸無法代謝，造成 α-keto acids 在血液裡累積?","o":["leucine","alanine","glycine","histi
