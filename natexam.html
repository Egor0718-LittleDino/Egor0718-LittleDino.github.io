<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>歷年國考題庫</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f7; --surface:#ffffff; --ink:#18242b; --muted:#5b6b74; --line:#d5dde1;
  --accent:#1f6f8b; --accent-soft:#e3f0f4;
  --good:#1d7a4f; --good-soft:#e2f3ea; --bad:#b3402f; --bad-soft:#f9e7e3;
  --font-body:"IBM Plex Sans","Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11181c; --surface:#1a2328; --ink:#e6edf0; --muted:#9aaab3; --line:#2f3c43;
    --accent:#6fc0da; --accent-soft:#1d3640;
    --good:#6fd3a0; --good-soft:#173527; --bad:#f09a8a; --bad-soft:#3d201b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11181c; --surface:#1a2328; --ink:#e6edf0; --muted:#9aaab3; --line:#2f3c43;
  --accent:#6fc0da; --accent-soft:#1d3640;
  --good:#6fd3a0; --good-soft:#173527; --bad:#f09a8a; --bad-soft:#3d201b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 64px}
header.top{padding:28px 0 12px}
h1{font-size:1.5rem;font-weight:600;margin:0 0 4px;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:.95rem}
nav.site{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:.86rem;margin-bottom:14px}
nav.site a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}
nav.site a:hover{color:var(--accent);border-bottom-color:var(--accent)}
nav.site a[aria-current="page"]{color:var(--ink);font-weight:600}
nav.site a.home{color:var(--accent)}
.site .grp{color:var(--muted);font-size:.78rem;padding:0 2px 0 6px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab,.btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.btn:hover,.tab:hover{border-color:var(--accent)}
select,input[type=search]{font:inherit;font-size:.9rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:100%}
input[type=search]{flex:1 1 180px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.score{display:flex;gap:14px;align-items:center;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.score b{color:var(--ink);font-family:var(--font-mono);font-weight:500}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px;flex-basis:100%}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;margin-top:16px}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:6px}
.num{font-family:var(--font-mono);font-size:.85rem;color:var(--accent)}
.chip{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.chip.y{color:var(--accent);border-color:var(--accent)}
.verdict{margin-left:auto;font-size:.8rem;font-weight:600;border-radius:4px;padding:1px 8px}
.verdict.ok{color:var(--good);background:var(--good-soft)}
.verdict.no{color:var(--bad);background:var(--bad-soft)}
.stem{margin:0 0 12px;font-weight:500;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;width:100%;display:grid;grid-template-columns:28px 1fr;gap:4px 8px;align-items:start;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.letter{font-family:var(--font-mono);font-size:.9rem;color:var(--muted);padding-top:1px}
.q.done .opt{cursor:default}
.q.done .opt:hover{background:var(--surface);border-color:var(--line)}
.q.done .opt.right,.q.done .opt.right:hover{border-color:var(--good);background:var(--good-soft)}
.q.done .opt.wrong,.q.done .opt.wrong:hover{border-color:var(--bad);background:var(--bad-soft)}
.why{grid-column:2;font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.opt.right .why,.opt.wrong .why{color:var(--ink)}
.tag{display:inline-block;font-size:.75rem;font-weight:600;margin-right:6px}
.tag.ok{color:var(--good)} .tag.no{color:var(--bad)}
.noex{color:var(--muted);font-size:.85rem;margin:10px 0 0;border-top:1px dashed var(--line);padding-top:6px}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:22px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.pager b{font-family:var(--font-mono);color:var(--ink);font-weight:500}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.foot{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.meter i{transition:none}}
@media (max-width:420px){.q{padding:14px 12px 12px}.score{gap:10px}}
</style>
</head>

<h1>歷年國考題庫</h1>
  <p class="lede">收錄歷年醫師、牙醫師國考生物化學試題共 1018 題（醫師 935、牙醫師 83，民國 95–113 年），可依考試類別、年度、章節與關鍵字篩選。作答模式自動記分，進度存在本機瀏覽器；看答案模式直接顯示正解。一題多答與送分題已標示。逐選項解析已完成 Ch12（87 題）,其餘章節補寫中。</p>

現，這可能為癌細胞不正常增殖、抗凋亡以及轉移的機制。若要發展對這類癌症的「標靶治療」(target therapy)，由你對RTK signaling 之認識來判斷，下列何者可能不是有效標靶治療藥劑？","o":["可抑制 epidermal growth factor(EGF)與 HER1 結合的單株抗體","可與 HER1 之 extracellular EGF-binding domain 結合，而不引起 intracellular kinase domain 活化的單株抗體","可引發 HER1 dimerization 的單株抗體","可自由穿越細胞膜而 block HER1 intracellular kinase domain 上 ATP-binding site 的小分子化合物"],"a":[2],"ch":["12"],"sec":"","fbt":"","ex":["阻斷 EGF 與 HER1 結合 → 受體無法被活化，是有效策略。","結合細胞外域但不引起細胞內激酶活化（拮抗型單株抗體，如 cetuximab 的概念）→ 佔住位子又不傳訊，是有效策略。","引發 HER1 二聚化等於「活化」受體訊號，會促進癌細胞增殖，所以不可能是有效的標靶治療藥劑。","小分子酪胺酸激酶抑制劑穿膜後競爭細胞內激酶域的 ATP 結合位（gefitinib、erlotinib），是有效策略。"]},{"id":"M-97-1_32","t":"M","y":97,"q":"百日咳桿菌(Bordetella pertussis)會產生百日咳毒素(pertussis toxin)，催化 Giα(即 inhibitory G蛋白 α 次單元)之 ADP-ribosylation，導致 adenylate cyclase 的持續性活化。下列有關 pertussis toxin致病機轉之敘述，何者正確？","o":["pertussis toxin 抑制 Giα 由 GDP 結合態到 GTP 結合態的轉換","pertussis toxin 抑制 Giα 由 GTP 結合態到 GDP 結合態的轉換","pertussis toxin 抑制 Giα 的 GTPase 活性","pertussis toxin 促進 Giα 對 adenylate cyclase 的作用"],"a":[0],"ch":["12"],"sec":"","fbt":"","ex":["pertussis toxin 把 Giα 進行 ADP-ribosylation，使它無法由 GDP 型轉換成 GTP 型，也就是 Gi 無法被受體活化；Gi 失去抑制 adenylate cyclase 的能力，AC 便持續活化。","若抑制 GTP → GDP 的轉換，Gi 會持續活化而更強地抑制 AC，與題幹描述的結果相反。","抑制 GTPase 活性是霍亂毒素對 Gsα 的作用模式，不是 pertussis toxin 對 Giα 的模式。","pertussis toxin 是讓 Giα「失去」對 AC 的抑制作用，不是促進它作用於 AC。"]},{"id":"M-97-1_33","t":"M","y":97,"q":"下列各種與癌症形成有關的基因中，何者並非轉錄因子(transcription factor)基因？","o":["c-myc","p53","bcl-2","以上皆為轉錄因子基因"],"a":[2],"ch":["12"],"sec":"12.11","fbt":"Figure 12-39","ex":["c-myc 是 bHLH-Zip 類的轉錄因子。","p53 是能結合特定 DNA 序列的轉錄因子。","bcl-2 是粒線體外膜上的抗凋亡蛋白，靠結合 Bax／Bak 發揮作用，不是轉錄因子。","因為 bcl-2 不是轉錄因子，所以「以上皆為」不成立。"]},{"id":"M-97-1_34","t":"M","y":97,"q":"下列何種形式之核酸重複(nucleotide repeat)，與遺傳疾病如 fragile X syndrome, Huntington’s disease 等有關?","o":["雙核酸重複(double nucleotide repeat)","三核酸重複(triple nucleotide repeat)","四核酸重複(quadruple nucleotide repeat)","隨意核酸重複(random nucleotide repeat)"],"a":[1],"ch":["9"],"sec":"Problems","fbt":"Problem 5"},{"id":"M-97-1_35","t":"M","y":97,"q":"去氧核糖核酸(DNA)雙股螺旋(double helix)結構為二十世紀最偉大的發現之一。雙股螺旋結構之穩定性主要來自下列何者？","o":["鄰近嘌呤(purine)間之氫鍵","鄰近嘧啶(pyrimidine)間之氫鍵","雙股螺旋結構本身","不同股 DNA 嘌呤(purine)與嘧啶(pyrimidine)間之氫鍵"],"a":[3],"ch":["8"],"sec":"8.2","fbt":""},{"id":"M-97-1_36","t":"M","y":97,"q":"Acetylcholine receptor 屬於下列何種接受器？","o":["G protein coupled receptor","gated ion channel","nuclear receptor","receptor with tyrosine kinase activity"],"a":[0,1],"ch":["12"],"sec":"12.8","fbt":"Figure 12-29","ex":["蕈毒鹼型（muscarinic）乙醯膽鹼受體是 GPCR，正確。","菸鹼型（nicotinic）乙醯膽鹼受體是配體門控陽離子通道，也正確。乙醯膽鹼受體分這兩大類，所以 A、B 都對，官方併計兩個答案。","乙醯膽鹼受體不是核受體。","乙醯膽鹼受體不具酪胺酸激酶活性。"]},{"id":"M-97-1_37","t":"M","y":97,"q":"下列那一種蛋白質不參與人類嗅覺的訊息傳遞？","o":["三體 G 蛋白(trimeric G protein)","cAMP","細胞膜鈣離子通道","STAT 轉錄因子"],"a":[3],"ch":["12"],"sec":"12.3","fbt":"","ex":["嗅覺受體是 GPCR，耦合三體 G 蛋白 Golf，有參與。","Golf 活化 adenylyl cyclase 產生 cAMP 作為二級訊息，有參與。","cAMP 開啟 cAMP-gated 陽離子通道，Na+ 與 Ca2+ 流入造成去極化，有參與。","STAT 是細胞激素 JAK-STAT 路徑的轉錄因子，不參與嗅覺訊息傳遞。"]},{"id":"M-97-1_38","t":"M","y":97,"q":"下列那個化合物水解時，可得到最大負值的自由能變化？","o":["UDP 葡萄糖(UDP-glucose)","葡萄糖-6-磷酸(glucose-6-phosphate)","蘋果酸(malate)","乳糖(lactose)"],"a":[0],"ch":["13"],"sec":"13.1","fbt":"Table 13-4"},{"id":"M-97-1_39","t":"M","y":97,"q":"下列何者與細胞對抗氧化傷害(oxidative damage)之機制無關？","o":["glutathione","alpha-tocopherol","biopterin","catalase"],"a":[2],"ch":["19"],"sec":"","fbt":""},{"id":"M-97-1_40","t":"M","y":97,"q":"Alcohol dehydrogenase(EC 1.1.1.1)催化乙醇(alcohol)及 aldehyde 之反應，屬於何種反應型態？","o":["轉移酶(transferase)","氧化還原酶(oxidoreductase)","水解酶(hydrolase)","連接酶(ligase)"],"a":[1],"ch":["14"],"sec":"14.3","fbt":""},{"id":"M-97-1_41","t":"M","y":97,"q":"何者具有最大催化反應的能力？","o":["脫輔基酶(apoenzyme)","輔酶(coenzyme)","全酶(holoenzyme)","酶原(zymogen)"],"a":[2],"ch":["6"],"sec":"6.1","fbt":""},{"id":"M-97-1_42","t":"M","y":97,"q":"下列何種輔酶能協助單碳基團(one-carbon groups)轉移，如果缺乏時會影響 DNA 的合成？","o":["coenzyme A","lipoate","tetrahydrofolate","pyridoxal phosphate"],"a":[2],"ch":["22"],"sec":"22.4","fbt":"Figure 22-35"},{"id":"M-97-1_43","t":"M","y":97,"q":"人類的粗皮病(pellagra)是由於缺乏下列那種維生素所引起？","o":["生物素(biotin)","泛酸(pantothenic acid)","葉酸(folic acid)","菸鹼酸(niacin)"],"a":[3],"ch":["13"],"sec":"13.4","fbt":""},{"id":"M-97-1_44","t":"M","y":97,"q":"與染色體(chromosome)結合的蛋白質有 1000 多種以上，其中五種蛋白質具有很明顯的胺基酸共識序列(consensus amino acid sequence)，該種蛋白質富含離胺酸(lysine)和精胺酸(arginine)，是染色質(chromatin)的主要結構蛋白，請問該蛋白質為何？","o":["支架蛋白(scaffolding proteins)","核仁蛋白(nucleolus proteins)","組織蛋白(histone proteins)","轉錄因子(transcription factors)"],"a":[2],"ch":["24"],"sec":"24.3","fbt":""},{"id":"M-97-1_45","t":"M","y":97,"q":"引子(primer)是 DNA 複製時的必須材料，下列何者為引子的主要功能？","o":["誘發 DNA 生合成的起點及方向，並決定生合成的終點","可幫助 DNA 雙螺旋的解旋工作，誘發 DNA 的生合成","確定 DNA 生合成的起點及方向，提供一個羥基(-OH)作為 DNA 延伸之用","可決定前導股(leading strand)，但無法決定遲緩股(lagging strand)的形成"],"a":[2],"ch":["25"],"sec":"25.1","fbt":"Figure 25-5"},{"id":"M-97-1_46","t":"M","y":97,"q":"第一型肝醣貯積病(type I glycogen storage disease)是由於 glucose-6-phosphatase 缺失導致，下列何者為其臨床生化特徵？","o":["hyperglycemia","hypouremia","hypolipemia","ketosis"],"a":[3],"ch":["15"],"sec":"15.4","fbt":""},{"id":"M-97-1_47","t":"M","y":97,"q":"在尿素(urea)循環中，尿素由 NH4+和 CO2 形成。氨(ammonia)對人體毒性很大，但尿素則無毒性，而且可溶於水，可由尿中排出體外。下列那一項對 carbamoyl phosphate synthetase I 的敘述錯誤？","o":["它是細胞質內的酵素","它所催化之反應需要 ATP","它以 HCO3-及 NH4+為反應之受質","它所催化之反應形成了 carbamoyl phosphate"],"a":[0],"ch":["18"],"sec":"18.2","fbt":"Figure 18-10"},{"id":"M-97-1_48","t":"M","y":97,"q":"Phenylketonuria 與下列何項酵素缺陷有關？","o":["Branched-chain α-keto acid dehydrogenase complex","Homogentisic acid dioxygenase","Tyrosinase","Phenylalanine hydroxylase"],"a":[3],"ch":["18"],"sec":"18.3","fbt":"Figure 18-24"},{"id":"M-97-1_49","t":"M","y":97,"q":"Methotrexate 可以當作化療之生化機轉為何？","o":["作為 pyridoxal phosphate 的相似物，抑制酵素活性","抑制 dihydrofolate reductase","競爭性抑制 EPSP synthase","直接抑制糖解作用(glycolysis)"],"a":[1],"ch":["22"],"sec":"22.4","fbt":"Figure 22-52"},{"id":"M-97-1_50","t":"M","y":97,"q":"下列有關 E. coli DNA 複製之敘述，何者正確？","o":["複製原點(replication origin)附近有許多富含 GU 之序列","由 DNA 聚合酶 I 負責前導股(leading strand)之合成","需要從一段 RNA 引子(primer)開始合成","單股 DN 生蛋白質分解，以合成葡萄糖來提供能源"],"a":[3],"ch":["23"],"sec":"23.3","fbt":"Figure 23-31"},{"id":"M-97-2_33","t":"M","y":97,"q":"人類癌症中約有三分之一可發現有ras 基因的突變，這些突變造成Ras 持續性活化(constitutive activation)，不受傳訊路徑上游的生長因子受體調控，而一直促進細胞分裂。下列關於Ras 訊息傳導之敘述，何者錯誤？","o":["與GDP 結合的Ras 會活化MAP kinase kinase kinase(MAPKKK)","活化的MAPKKK 啟動一個kinase cascade，依序磷酸化MAP kinase kinase(MAPKK)與MAP kinase(MAPK)","磷酸化的MAPK 是活化態，可磷酸化一些transcription factors","磷酸化的transcription factors(例如Jun 和Fos)，可活化一些調控細胞分裂的基因之表現"],"a":[0],"ch":["12"],"sec":"","fbt":"","ex":["與 GDP 結合的 Ras 是失活型，不會活化 Raf-1（MAPKKK）；要 Ras-GTP 才行，故此敘述錯誤。","活化的 MAPKKK（Raf-1）依序磷酸化 MAPKK（MEK）與 MAPK（ERK），正確。","磷酸化的 ERK 是活化態，可進核磷酸化轉錄因子，正確。","被磷酸化的 Jun、Fos（AP-1）活化細胞分裂相關基因的表現，正確。"]},{"id":"M-97-2_34","t":"M","y":97,"q":"細胞中各種基因的表達常因不同組織而有差異。在一些基因的啟動子(promoter)上常有一些CpG島(CpG island)。同一基因的表達，常因CpG 島受到下列何種修飾(modification)而有不同？","o":["乙烯化(acetylation)","甲基化(methylation)","磷酸化(phosphorylation)","羧化(carboxylation)"],"a":[1],"ch":["8"],"sec":"8.3","fbt":"Figure 8-5"},{"id":"M-97-2_35","t":"M","y":97,"q":"一胺基酸的側鍵為一環狀結構，但其生化性質與脂族側鍵(aliphatic side chain)相類似，由於此環狀結構的剛性，故難以摺疊進蛋白質的結構中，請問這個胺基酸的名稱為何？","o":["組織胺酸(Histidine)","脯胺酸(Proline)","酪胺酸(Tyrosine)","色胺酸(Tryptophan)"],"a":[1],"ch":["3"],"sec":"3.1","fbt":""},{"id":"M-97-2_36","t":"M","y":97,"q":"Tamoxifen 最常應用於治療癌症(如乳癌及其他癌症)，其主要機轉為抑制下列何種荷爾蒙感受體(hormone receptor)之轉錄(transcription)能力？","o":["雄激素感受體(androgen receptor)","雌激素感受體(estrogen receptor)","甲狀腺激素感受體(thyroid hormone receptor)","維生素D 感受體(vitamin D receptor)"],"a":[1],"ch":["28"],"sec":"","fbt":""},{"id":"M-97-2_37","t":"M","y":97,"q":"何者為此DNA 序列的互補股：5’-CGCGAATTCGCG-3’？","o":["5’-GCGCTTAAGCGC-3’","5’-CGCGAATTCGCG-3’","5’-GCGCUUAAGCGC-3’","5’-CGCGAAUUCGCG-3’"],"a":[1],"ch":["8"],"sec":"8.2","fbt":""},{"id":"M-97-2_38","t":"M","y":97,"q":"38 Polymerase chain reaction(PCR)在臨床診斷上是一個很重要的工具，在一般反應過程不需要下列何項？","o":["大量純化的DNA","溫控循環儀","四種去氧核糖核酸","對熱穩定的DNA polymerase"],"a":[0],"ch":["8"],"sec":"8.3","fbt":""},{"id":"M-97-2_39","t":"M","y":97,"q":"神經傳遞之所以具有方向性是因為：","o":["離子通道(ion chann const KEY="natexam-quiz-v1";
const PER=50;
let picks={}, mode="quiz", page=0;
let f={t:"",y:"",ch:"",kw:""};
try{const s=localStorage.getItem(KEY); if(s) picks=JSON.parse(s)||{};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(picks));}catch(e){}}
function el(tag,cls,text){const n=document.createElement(tag); if(cls) n.className=cls; if(text!=null) n.textContent=text; return n;}
const list=document.getElementById("list");
const L="ABCD";
function isRight(it,j){return it.free?true:it.a.indexOf(j)>=0;}
function keyOf(it){return it.id;}

/* ---- 篩選選單 ---- */
const years=[...new Set(NATQ.map(x=>x.y))].sort((a,b)=>b-a);
const chs=[...new Set(NATQ.flatMap(x=>x.ch))].sort((a,b)=>parseFloat(a)-parseFloat(b));
function fillSel(id,opts,allLabel,fmt){
  const s=document.getElementById(id);
  s.append(new Option(allLabel,""));
  opts.forEach(o=>s.append(new Option(fmt?fmt(o):o,o)));
}
fillSel("f-year",years.map(String),"全部年度",v=>v+" 年");
fillSel("f-ch",chs,"全部章節",v=>"Ch"+v);
document.getElementById("f-ch").append(new Option("未分章節","__none__"));

function pass(it){
  if(f.t && it.t!==f.t) return false;
  if(f.y && String(it.y)!==f.y) return false;
  if(f.ch){
    if(f.ch==="__none__"){ if(it.ch.length) return false; }
    else if(it.ch.indexOf(f.ch)<0) return false;
  }
  if(f.kw){
    const s=(it.q+" "+it.o.join(" ")+" "+it.id).toLowerCase();
    if(!s.includes(f.kw)) return false;
  }
  return true;
}

function render(){
  const hits=NATQ.filter(pass);
  const maxPage=Math.max(1,Math.ceil(hits.length/PER));
  if(page>=maxPage) page=maxPage-1;
  if(page<0) page=0;
  list.textContent="";
  const slice=hits.slice(page*PER,(page+1)*PER);
  if(!slice.length) list.append(el("p","empty","沒有符合條件的題目。"));
  slice.forEach(item=>{
    const k=keyOf(item);
    const picked=picks[k];
    const answered=picked!==undefined;
    const reveal = mode==="browse" || answered;
    const card=el("section","q"+(reveal?" done":""));
    const head=el("div","qhead");
    head.append(el("span","num",item.id));
    head.append(el("span","chip y",(item.t==="D"?"牙醫 ":"醫師 ")+item.y+" 年"));
    if(item.ch.length) head.append(el("span","chip","Ch"+item.ch.join("、")+(item.sec?" · "+item.sec:"")));
    else head.append(el("span","chip","未分章節"));
    if(item.fbt) head.append(el("span","chip",item.fbt));
    const ansTxt = item.free ? "送分題" : "正解 "+item.a.map(i=>L[i]).join("、");
    if(mode==="quiz" && answered){
      const ok=isRight(item,picked);
      head.append(el("span","verdict "+(ok?"ok":"no"), ok?(item.free?"送分題":"答對"):"答錯,"+ansTxt));
    } else if(mode==="browse"){
      head.append(el("span","verdict ok",ansTxt));
    }
    card.append(head, el("p","stem",item.q));
    const opts=el("div","opts");
    item.o.forEach((o,j)=>{
      const b=el("button","opt"); b.type="button";
      b.append(el("span","letter",L[j]+")"), el("span","",o));
      if(reveal){
        b.setAttribute("aria-disabled","true");
        const right=isRight(item,j);
        if(right) b.classList.add("right");
        else if(mode==="quiz" && j===picked) b.classList.add("wrong");
        const ex=item.ex&&item.ex[j];
        if(ex || right || (mode==="quiz"&&j===picked)){
          const why=el("span","why");
          if(right) why.append(el("span","tag ok",(mode==="quiz"&&j===picked)?"你的選擇 · 正確答案":"正確答案"));
          else if(mode==="quiz"&&j===picked) why.append(el("span","tag no","你的選擇"));
          if(ex) why.append(document.createTextNode(ex));
          b.append(why);
        }
      } else {
        b.addEventListener("click",()=>{picks[k]=j; save(); render();});
      }
      opts.append(b);
    });
    card.append(opts);
    if(reveal){
      if(item.free) card.append(el("p","noex","這題官方公告送分／一題多答，四個選項都算對。"));
      if(!item.ex) card.append(el("p","noex","（逐選項解析還沒寫，之後會補上。）"));
    }
    list.append(card);
  });
  document.getElementById("p-cur").textContent=page+1;
  document.getElementById("p-max").textContent=maxPage;
  document.getElementById("p-prev").disabled=page===0;
  document.getElementById("p-next").disabled=page>=maxPage-1;
  score(hits);
}
function score(hits){
  let done=0,right=0;
  hits.forEach(it=>{const p=picks[keyOf(it)]; if(p!==undefined){done++; if(isRight(it,p)) right++;}});
  document.getElementById("s-total").textContent=hits.length;
  document.getElementById("s-done").textContent=done;
  document.getElementById("s-right").textContent=right;
  document.getElementById("s-pct").textContent=done?Math.round(right/done*100)+"%":"–";
  document.getElementById("meter").style.width=(hits.length?done/hits.length*100:0)+"%";
}
document.querySelectorAll('.tabs [data-t]').forEach(t=>t.addEventListener("click",()=>{
  f.t=t.dataset.t; page=0;
  document.querySelectorAll('.tabs [data-t]').forEach(x=>x.setAttribute("aria-pressed",x===t?"true":"false"));
  render();
}));
document.getElementById("f-year").addEventListener("change",e=>{f.y=e.target.value;page=0;render();});
document.getElementById("f-ch").addEventListener("change",e=>{f.ch=e.target.value;page=0;render();});
let kwT=null;
document.getElementById("f-kw").addEventListener("input",e=>{
  clearTimeout(kwT); const v=e.target.value.trim().toLowerCase();
  kwT=setTimeout(()=>{f.kw=v;page=0;render();},180);
});
function setMode(m){
  mode=m;
  document.getElementById("m-quiz").setAttribute("aria-pressed",m==="quiz"?"true":"false");
  document.getElementById("m-browse").setAttribute("aria-pressed",m==="browse"?"true":"false");
  render();
}
document.getElementById("m-quiz").addEventListener("click",()=>setMode("quiz"));
document.getElementById("m-browse").addEventListener("click",()=>setMode("browse"));
document.getElementById("p-prev").addEventListener("click",()=>{page--;render();window.scrollTo(0,0);});
document.getElementById("p-next").addEventListener("click",()=>{page++;render();window.scrollTo(0,0);});
document.getElementById("btn-reset").addEventListener("click",()=>{
  if(!confirm("確定清除全部作答紀錄?")) return;
  picks={};save();page=0;render();window.scrollTo(0,0);});
document.getElementById("btn-wrong").addEventListener("click",()=>{
  NATQ.forEach(it=>{const k=keyOf(it); if(picks[k]!==undefined && !isRight(it,picks[k])) delete picks[k];});
  save();render();window.scrollTo(0,0);
});
render();
</script>
</body>
</html>
