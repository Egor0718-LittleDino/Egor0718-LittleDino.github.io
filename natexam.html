<!DOCTYPE html>

<style>
:root{
  --bg:#f4f6f7; --surface:#ffffff; --ink:#18242b; --muted:#5b6b74; --line:#d5dde1;
  --accent:#1f6f8b; --accent-soft:#e3f0f4;
  --good:#1d7a4f; --good-soft:#e2f3ea; --bad:#b3402f; --bad-soft:#f9e7e3;
  --font-body:"IBM Plex Sans","Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11181c; --surface:#1a2328; --ink:#e6edf0; --muted:#9aaab3; --line:#2f3c43;
    --accent:#6fc0da; --accent-soft:#1d3640;
    --good:#6fd3a0; --good-soft:#173527; --bad:#f09a8a; --bad-soft:#3d201b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11181c; --surface:#1a2328; --ink:#e6edf0; --muted:#9aaab3; --line:#2f3c43;
  --accent:#6fc0da; --accent-soft:#1d3640;
  --good:#6fd3a0; --good-soft:#173527; --bad:#f09a8a; --bad-soft:#3d201b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 64px}
header.top{padding:28px 0 12px}
h1{font-size:1.5rem;font-weight:600;margin:0 0 4px;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:.95rem}
nav.site{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:.86rem;margin-bottom:14px}
nav.site a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}
nav.site a:hover{color:var(--accent);border-bottom-color:var(--accent)}
nav.site a[aria-current="page"]{color:var(--ink);font-weight:600}
nav.site a.home{color:var(--accent)}
.site .grp{color:var(--muted);font-size:.78rem;padding:0 2px 0 6px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab,.btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.btn:hover,.tab:hover{border-color:var(--accent)}
select,input[type=search]{font:inherit;font-size:.9rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:100%}
input[type=search]{flex:1 1 180px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.score{display:flex;gap:14px;align-items:center;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.score b{color:var(--ink);font-family:var(--font-mono);font-weight:500}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px;flex-basis:100%}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;margin-top:16px}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:6px}
.num{font-family:var(--font-mono);font-size:.85rem;color:var(--accent)}
.chip{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.chip.y{color:var(--accent);border-color:var(--accent)}
.verdict{margin-left:auto;font-size:.8rem;font-weight:600;border-radius:4px;padding:1px 8px}
.verdict.ok{color:var(--good);background:var(--good-soft)}
.verdict.no{color:var(--bad);background:var(--bad-soft)}
.stem{margin:0 0 12px;font-weight:500;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;width:100%;display:grid;grid-template-columns:28px 1fr;gap:4px 8px;align-items:start;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.letter{font-family:var(--font-mono);font-size:.9rem;color:var(--muted);padding-top:1px}
.q.done .opt{cursor:default}
.q.done .opt:hover{background:var(--surface);border-color:var(--line)}
.q.done .opt.right,.q.done .opt.right:hover{border-color:var(--good);background:var(--good-soft)}
.q.done .opt.wrong,.q.done .opt.wrong:hover{border-color:var(--bad);background:var(--bad-soft)}
.why{grid-column:2;font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.opt.right .why,.opt.wrong .why{color:var(--ink)}
.tag{display:inline-block;font-size:.75rem;font-weight:600;margin-right:6px}
.tag.ok{color:var(--good)} .tag.no{color:var(--bad)}
.noex{color:var(--muted);font-size:.85rem;margin:10px 0 0;border-top:1px dashed var(--line);padding-top:6px}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:22px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.pager b{font-family:var(--font-mono);color:var(--ink);font-weight:500}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.foot{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.meter i{transition:none}}
@media (max-width:420px){.q{padding:14px 12px 12px}.score{gap:10px}}
</style>

<h1>歷年國考題庫</h1>

const NATQ=[{"id":"M-113-1_100","t":"M","y":113,"q":"聚合酶鏈鎖反應（polymerase chain reaction, PCR）不需要下列何種物質？","o":["DNA雙股模板（template）","引子（primer）","去氧核糖核酸聚合酶（DNA polymerase）","反轉錄酶（reverse transcriptase）"],"a":[3],"ch":["8"],"sec":"8.3","fbt":"Figure 8-33","ex":["PCR 以雙股 DNA 為模板，需要。","兩段引子界定放大範圍，需要。","耐熱 DNA 聚合酶（Taq）負責延長，需要。","反轉錄酶只在以 RNA 為起始材料的 RT-PCR 才需要（先做成 cDNA）；一般 PCR 的模板已經是 DNA，不需要它。"]},{"id":"M-113-1_74","t":"M","y":113,"q":"在競爭性抑制劑（competitive inhibitor）的存在下，下列何項是可預期的Michaelis-Menten酵素動力學變化？","o":["Vmax下降，KM下降","Vmax不變，KM下降","Vmax下降，KM上升","Vmax不變，KM上升"],"a":[3],"ch":["6"],"sec":"6.3","fbt":"Figure 6-19"},{"id":"M-113-1_75","t":"M","y":113,"q":"下列何者為穩定蛋白質α-螺旋結構的主要因素？","o":["胜肽鏈上α碳原子之間的疏水性（hydrophobic）交互作用","螺旋結構內胜肽鏈主幹上的胜肽鍵（peptide bond）之間的氫鍵作用（hydrogen bond）","R基團（R group；side chain）之間靜電性的作用（electrostatic interaction）","R基團（R group；side chain）之間氫鍵（hydrogen bond）"],"a":[1],"ch":["4"],"sec":"4.2","fbt":""},{"id":"M-113-1_76","t":"M","y":113,"q":"Enzyme Commission（EC）將酵素依反應類型區分為六大類別（classes），下列何者不屬於EC命名系統之酵素類別？","o":["lyases","dehydrogenases","hydrolases","isomerases"],"a":[1],"ch":["6"],"sec":"6.1","fbt":"Table 6-3"},{"id":"M-113-1_77","t":"M","y":113,"q":"Lipoate是pyruvate dehydrogenase complex其中一個輔酶，參與催化pyruvate形成acetyl-CoA，下列有關其結構與功能，何者錯誤？","o":["含有2個thiol groups，可受到pyruvate dehydrogenase complex之NADP氧化形成雙硫鍵（disulfidebond）","lipoate經由amide連結與dihydrolipoyl transacetylase之lysine結合","作為acyl group carrier，轉移到coenzyme A，形成acetyl-CoA","氧化形式之lipoate受到hydroxyethyl TPP還原並接受acetyl group"],"a":[0],"ch":["16"],"sec":"16.1","fbt":"Figure 16-4"},{"id":"M-113-1_78","t":"M","y":113,"q":"轉胺酶（transaminases）是參與胺基酸合成的重要酵素，此酵素的活性中心帶有下列那一種輔酶（coenzyme）？","o":["甲基氰鈷胺（methylcobalamin）","吡哆醛磷酸（pyridoxal phosphate）","葉酸（folic acid）","硫胺素（thiamine）"],"a":[1],"ch":["18"],"sec":"18.1","fbt":"Figure 18-4","ex":["甲基氰鈷胺（B12）參與 methionine synthase 與 methylmalonyl-CoA mutase，不是轉胺酶的輔酶。","吡哆醛磷酸（PLP，B6）與活性中心 Lys 形成 Schiff base，是所有轉胺酶的共同輔酶，暫時接走胺基。","葉酸攜帶一碳單位，不攜帶胺基。","硫胺素（TPP，B1）參與脫羧反應（丙酮酸脫氫酶、α-KG 脫氫酶、transketolase）。"]},{"id":"M-113-1_79","t":"M","y":113,"q":"核苷三磷酸（nucleoside triphosphates）以下列何種形式攜帶及傳遞能量？","o":["磷酸酐鍵（phosphoanhydride bonds）","磷酸二酯鍵（phosphodiester bonds）","糖苷鍵（glycosidic bonds）","氫鍵（hydrogen bonds）"],"a":[0],"ch":["13"],"sec":"13.3","fbt":"Figure 13-11"},{"id":"M-113-1_80","t":"M","y":113,"q":"拓樸異構酶（Topoisomerase）的主要功能為：","o":["改變DNA分子的超螺旋（supercoil）","改變DNA分子鹼基配對（base-pairing）的專一性","改變DNA分子的核苷酸（nucleotide）數目","將DNA與RNA做置換"],"a":[0],"ch":["24"],"sec":"24.3","fbt":"Figure 24-25","ex":["拓樸異構酶切斷並重接磷酸二酯鍵，改變 DNA 的連結數（Lk），藉此鬆開或引入超螺旋 —— 解決複製與轉錄時前方累積的扭轉張力。","它不改變鹼基配對的規則。","它切開後會接回去，核苷酸總數不變。","置換 DNA 與 RNA 不是它的功能。"]},{"id":"M-113-1_81","t":"M","y":113,"q":"鹼基切除修復（base excision repair）過程中，催化修復作用的第一個酵素為：","o":["DNA糖基化酶（DNA glycosylase）","Apurinic/apyrimidinic核酸內切酶（AP endonuclease）","DNA連接酶（DNA ligase）","Dam甲基化酶（Dam methylase）"],"a":[0],"ch":["25"],"sec":"25.2","fbt":"Figure 25-23"},{"id":"M-113-1_82","t":"M","y":113,"q":"關於大腸桿菌（E. coli）DNA聚合酶 I 型（DNA polymerase I）的Klenow fragment，下列敘述何者錯誤？","o":["具有DNA聚合酶活性","具有5'端到3'端核酸外切酶（exonuclease）活性","是聚合酶C端（C-terminal）的大片段","具有3'端到5'端核酸外切酶（exonuclease）活性"],"a":[1],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-113-1_83","t":"M","y":113,"q":"致癌基因產物Ras位於細胞膜上傳遞信息，此蛋白是經由何種修飾而能夠結合在細胞膜？","o":["ubiquitination","acetylation","adenylation","prenylation"],"a":[3],"ch":["12"],"sec":"12.4, 12.9","fbt":"Figure 12-22, 12-41","ex":["加上 ubiquitin 是送進 26S proteasome 降解的標記，不提供膜錨。","乙醯化多發生在離胺酸側鏈或 N 端（如組織蛋白），不產生疏水錨。","加上 AMP（如 glutamine synthetase 的調節）不會形成脂質錨。","Ras C 端 CaaX motif 的半胱胺酸接上 farnesyl（15C）等類異戊二烯，形成疏水錨插入膜內側。farnesyl 與膽固醇共用 mevalonate 前驅物。"]},{"id":"M-113-1_84","t":"M","y":113,"q":"原核生物RNA聚合酶在進行轉錄延伸作用（elongation）時，下列那一個次單元（subunit）參與最少？","o":["α","β","β’","σ"],"a":[3],"ch":["26"],"sec":"26.1","fbt":"Figure 26-6"},{"id":"M-113-1_85","t":"M","y":113,"q":"擺動假說（wobble hypothesis）允許某些tRNA識別多個密碼子（codon）。在酵母菌中，一個tRNAArg具有反密碼子（anticodon）(5')ICG，此tRNAArg應可識別下列那一個精胺酸（arginine）密碼子？","o":["(5')CGA","(5')AGC","(5')UGC","(5')GGC"],"a":[0],"ch":["27"],"sec":"27.1","fbt":"Table 27-4"},{"id":"M-113-1_86","t":"M","y":113,"q":"脊椎動物中，由下列那種酶負責合成18S與28S rRNA？","o":["RNA polymerase I","RNA polymerase II","RNA polymerase III","ribosomal RNase"],"a":[0],"ch":["26"],"sec":"26.1","fbt":"Table 26-1"},{"id":"M-113-1_87","t":"M","y":113,"q":"無氧代謝時，將一莫耳（mole）的葡萄糖經由糖解作用（glycolysis）及酵素lactate dehydrogenase轉化成兩莫耳的乳酸（lactate），最終淨產生：","o":["一莫耳的ATP","兩莫耳的ATP","一莫耳的ATP以及兩莫耳的NADH","兩莫耳的ATP以及兩莫耳的NADH"],"a":[1],"ch":["14"],"sec":"14.1, 14.3","fbt":"Figure 14-3, Figure 14-11"},{"id":"M-113-1_88","t":"M","y":113,"q":"飲食中的植物性澱粉（amylopectin and amylose），會在我們的消化道中被水解成：","o":["glucose與maltose","glucose與glucose-1-phosphate","glucose-1-phosphate與maltose","glucose-6-phosphate與maltose"],"a":[0],"ch":["7"],"sec":"7.2","fbt":"Figure 7-13"},{"id":"M-113-1_89","t":"M","y":113,"q":"在醣蛋白質（glycoproteins）分子中，下列那一組胺基酸殘基（amino acid residues）皆可參與醣基 （carbohydrate moiety）與蛋白質的鍵結？","o":["asparagine, serine, threonine","cysteine, aspartate, glutamate","serine, glutamine, arginine","aspartate, arginine, threonine"],"a":[0],"ch":["7"],"sec":"7.3","fbt":"Figure 7-20"},{"id":"M-113-1_90","t":"M","y":113,"q":"下列有關膽鹽（bile salts）的敘述，何者錯誤？","o":["由7α-hydroxylase催化其生合成之速率決定步驟","屬於非極性分子，可促進脂質在小腸的吸收","合成時需要cytochrome P450酵素的參與","與膽固醇的量有關"],"a":[1],"ch":["21"],"sec":"21.4","fbt":"Figure 21-40","ex":["膽固醇 7α-hydroxylase 催化膽汁酸合成的第一步，確實是速率決定步驟，敘述正確。","膽鹽是「兩親性」分子：一面是羥基與帶電的甘胺酸／牛磺酸結合端，另一面是疏水的固醇環，正因為兩性才能乳化脂肪。說它是非極性分子錯誤。","7α-hydroxylase 屬 cytochrome P450 家族（CYP7A1），敘述正確。","膽鹽由膽固醇合成，也是人體排除膽固醇的主要途徑，敘述正確。"]},{"id":"M-113-1_91","t":"M","y":113,"q":"高雪氏症（Gaucher's disease）屬於溶小體儲積症（lysosomal storage disorder）的一種，與下列那一類物質的代謝有關？","o":["glycogen","choline","sphingolipid","N-acetylglutamate"],"a":[2],"ch":["10"],"sec":"10.2","fbt":"Box 10-1","ex":["肝醣堆積屬肝醣貯積症（如龐貝氏症），不是高雪氏症。","膽鹼代謝異常不造成溶小體儲積症。","高雪氏症缺乏 glucocerebrosidase，無法分解屬於鞘脂類的葡萄糖腦苷脂，堆積在巨噬細胞（Gaucher cell）而造成肝脾腫大、貧血與骨病變，是最常見的鞘脂貯積症。","N-acetylglutamate 屬尿素循環的調節物，與溶小體無關。"]},{"id":"M-113-1_92","t":"M","y":113,"q":"在脊椎動物細胞內，脂肪酸之omega氧化（ω-oxidation）反應主要發生於：","o":["細胞核","粒線體","高基氏體","內質網"],"a":[3],"ch":["17"],"sec":"17.2","fbt":"","ex":["細胞核不進行脂肪酸氧化。","粒線體進行的是 β 氧化（以及長鏈的主要降解）。","高基氏體負責蛋白質與脂質的修飾與分選，不氧化脂肪酸。","ω 氧化由內質網的 cytochrome P450 系統把脂肪酸的甲基端（ω 碳）羥化再氧化成二羧酸；當 β 氧化受阻（如 MCAD 缺乏）時這條旁路會變得活躍，尿中可測到二羧酸。"]},{"id":"M-113-1_93","t":"M","y":113,"q":"人體之脯胺酸（proline）或是精胺酸（arginine）主要由下列何種胺基酸代謝轉換形成？","o":["麩胺酸（glutamate）","色胺酸（tryptophan）","纈胺酸（valine）","甲硫胺酸（methionine）"],"a":[0],"ch":["22"],"sec":"22.2","fbt":"Figure 21-12","ex":["glutamate 是兩者共同的源頭：經 glutamate-5-semialdehyde 可環化成 proline，也可轉胺成 ornithine 進入尿素循環而生成 arginine。","色胺酸走向 serotonin、菸鹼酸與 kynurenine，不生成 proline 或 arginine。","纈胺酸是支鏈胺基酸，分解成 succinyl-CoA，不是這兩者的前驅物。","甲硫胺酸提供甲基（SAM），並可經 homocysteine 轉成 cysteine，與 proline／arginine 無關。"]},{"id":"M-113-1_94","t":"M","y":113,"q":"在饑餓時，人體會分解蛋白質產生胺基酸以供應能量，下列那一種胺基酸過度代謝最容易導致酮症（ketosis）？","o":["白胺酸（leucine）","甲硫胺酸（methionine）","精胺酸（arginine）","麩胺酸（glutamate）"],"a":[0],"ch":["18"],"sec":"18.3","fbt":"","ex":["白胺酸是「純生酮性」胺基酸，分解只產生 acetyl-CoA 與 acetoacetate，過度代謝最易造成酮症。","甲硫胺酸分解成 succinyl-CoA，屬生糖性。","精胺酸經 ornithine → glutamate → α-ketoglutarate，屬生糖性。","麩胺酸直接轉胺成 α-ketoglutarate，屬生糖性。"]},{"id":"M-113-1_95","t":"M","y":113,"q":"下列那一個酵素位於粒線體電子傳遞鏈的complex IV？","o":["NADH dehydrogenase","cytochrome oxidase","succinate dehydrogenase","ubiquinone:cytochrome c oxidoreductase"],"a":[1],"ch":["19"],"sec":"19.1","fbt":"Table 19-3"},{"id":"M-113-1_96","t":"M","y":113,"q":"Ca2+是一重要的訊息分子，細胞中存在Ca2+結合蛋白例如calmodulin參與其傳訊機制，而calmodulin蛋白最主要藉由那個結構來結合Ca2+？","o":["EF hand domain","SH2 domain","PTB domain","PH domain"],"a":[0],"ch":["12"],"sec":"12.2","fbt":"Figure 12-17","ex":["EF hand 是 helix–loop–helix；calmodulin 有四個 EF hand，各結合一個 Ca2+。","SH2 辨識磷酸化的 tyrosine，是 RTK 下游接合蛋白的模組。","PTB 同樣辨識 phosphotyrosine（如 IRS-1 與胰島素受體的結合）。","PH 結合膜上的 PIP3／PIP2，把 Akt 等蛋白拉到膜上。"]},{"id":"M-113-1_97","t":"M","y":113,"q":"下列何種分子引發的訊息傳遞通常不使用cAMP作為其主要的second messenger？","o":["atrial natriuretic factor（ANF）","glucagon","dopamine","serotonin"],"a":[0],"ch":["12"],"sec":"12.2","fbt":"Table 12-3","ex":["ANF 作用於膜結合型 guanylyl cyclase 受體，二級訊息是 cGMP 而非 cAMP。","glucagon 走 Gs → adenylyl cyclase → cAMP。","dopamine 的 D1 類走 Gs 升 cAMP、D2 類走 Gi 降 cAMP，皆以 cAMP 為主。","多數 5-HT 受體是 GPCR，經 Gs／Gi 調節 cAMP（5-HT3 為離子通道是例外）。"]},{"id":"M-113-1_98","t":"M","y":113,"q":"下列何種胺基酸為兒茶酚胺類激素（catecholamine hormones）生成之前驅物？","o":["天門冬醯胺（asparagine）","穀胺酸（glutamate）","精胺酸（arginine）","酪胺酸（tyrosine）"],"a":[3],"ch":["22"],"sec":"22.3","fbt":"Figure 22-31","ex":["天門冬醯胺只水解成天門冬胺酸，與兒茶酚胺無關。","穀胺酸是 GABA、glutamine、proline、arginine 的前驅物。","精胺酸是 NO、尿素、肌酸的前驅物。","酪胺酸 → DOPA → dopamine → norepinephrine → epinephrine，是兒茶酚胺的共同前驅物。"]},{"id":"M-113-1_99","t":"M","y":113,"q":"大部分常用的限制酶（restriction enzyme）會辨識迴文序列（palindromic sequence）以截切去氧核糖核酸，下列何者為迴文序列？","o":["CCCCCC","AGCAGC","TAGGAT","GCTAGC"],"a":[3],"ch":["8"],"sec":"8.2","fbt":"Figure 8-18","ex":["CCCCCC 的互補股是 GGGGGG，兩股序列不同，不是迴文。","AGCAGC 的反向互補是 GCTGCT，不是迴文（這是直接重複，不是反向重複）。","TAGGAT 的反向互補是 ATCCTA，不是迴文。","GCTAGC 的反向互補仍是 GCTAGC，兩股讀起來一樣，正是限制酶辨識的迴文序列（NheI 位點）。判斷技巧：把序列對摺，首尾必須是 A-T、G-C 互補配對。"]},{"id":"M-112-1_100","t":"M","y":112,"q":"以限制性片段長度多態性（restriction fragment length polymorphisms, RFLPs）來進行去氧核糖核酸指紋鑑定（DNA fingerprinting）時，通常需要結合下列何種生物技術？","o":["西方墨點法（Western blotting）","南方墨點法（Southern blotting）","北方墨點法（Northern blotting）","長條墨點法（slot blotting）"],"a":[1],"ch":["8"],"sec":"8.3","fbt":"Box 8-1","ex":["西方墨點法偵測的是蛋白質（抗體探針）。","RFLP 是先用限制酶切 DNA、電泳分離，再以標記探針雜交 —— 偵測 DNA 的方法就是南方墨點法。（口訣：Southern 偵測 DNA，Northern 偵測 RNA，Western 偵測蛋白質。）","北方墨點法偵測的是 RNA。","slot／dot blot 只把樣品點上膜，不先電泳分離，無法看出片段長度的差異。"]},{"id":"M-112-1_74","t":"M","y":112,"q":"蛋白質純化方法中的膠體過濾層析法（gel filtration chromatography），是根據不同蛋白質之間何項物理化學特性的差異達成分離效果？","o":["電性高低（charge）","分子大小（molecular size）","質荷比高低（mass-to-charge ratio）","穩定程度（stability）"],"a":[1],"ch":["3"],"sec":"3.3","fbt":"Figure 3-17b"},{"id":"M-112-1_75","t":"M","y":112,"q":"下列關於蛋白質結構中α螺旋（α helix）與β摺板（β sheet）的敘述，何者正確？","o":["α螺旋的胺基端（amino terminus）會因電偶極（dipole）排列的規律性而帶部分負電性（partial negative charge）","自然界中的α螺旋大部分具有左手性（left-handed）的結構","氫鍵（hydrogen bond）的形成與α螺旋的穩定性有關，但與β摺板的穩定性無關","β摺板中相鄰的兩條多肽鏈（polypeptide chains）之間的方向性可為平行（parallel）或反平行（antiparallel）的關係"],"a":[3],"ch":["4"],"sec":"4.2","fbt":"Figre 4-3; Figure 4-5"},{"id":"M-112-1_76","t":"M","y":112,"q":"某酵素的 Km=10 mM， kcat=1000 s-1，當受質濃度為 0.01 mM 時，該酵素催化反應所展現的反應速率常數（rate constant）最接近下列何者？","o":["1,000 s-1","10,000 mM s-1","10 mM s-1","100 mM-1 s-1"],"a":[3],"ch":["6"],"sec":"6.3","fbt":"Formula 6-30"},{"id":"M-112-1_77","t":"M","y":112,"q":"在人類肝細胞中提供甲基使 phosphoethanolamine 轉換成 phosphocholine 的是下列何者？","o":["methionine","serine","folic acid","S-adenosyl-L-methionine"],"a":[3],"ch":["21"],"sec":"21.3","fbt":"Figure 21-25","ex":["甲硫胺酸必須先與 ATP 結合活化成 SAM 才能供甲基，本身不是直接供體。","絲胺酸提供的是一碳單位給四氫葉酸，不直接甲基化 phosphoethanolamine。","葉酸攜帶一碳單位，但最後仍要經 SAM 才交出甲基。","S-adenosyl-L-methionine 是體內普遍的甲基供體，連續三次甲基化 phosphoethanolamine 的胺基生成 phosphocholine。"]},{"id":"M-112-1_78","t":"M","y":112,"q":"參與氮代謝（nitrogen metabolism）所需的輔酶（coenzyme），下列何者除外？","o":["磷酸吡哆醛（pyridoxal phosphate, PLP）","輔酶 Q（coenzyme Q）","四氫葉酸輔酶（tetrahydrofolate coenzyme）","B12 輔酶（B12 coenzyme）"],"a":[1],"ch":["22"],"sec":"22.1","fbt":"","ex":["磷酸吡哆醛（PLP，B6）是所有轉胺酶的輔酶，氮代謝核心。","輔酶 Q 是粒線體電子傳遞鏈中傳遞電子的脂溶性載體，與氮代謝無關，故除外。","四氫葉酸攜帶一碳單位，參與 serine／glycine 互換、嘌呤與 dTMP 合成。","B12 輔酶參與 methionine synthase（同時需 N5-methyl-THF）與 methylmalonyl-CoA mutase。"]},{"id":"M-112-1_79","t":"M","y":112,"q":"下列那一個官能基出現在胸腺嘧啶（thymine）而不出現在尿嘧啶（uracil）？","o":["去氧核糖（deoxyribose）","甲基（-CH3）","胺基（-NH2）","核糖（ribose）"],"a":[1],"ch":["8"],"sec":"8.1","fbt":"Figure 8-2","ex":["去氧核糖是核苷糖基的差異，不是鹼基上的官能基；uracil 也可以接去氧核糖（DNA 受損時）。","胸腺嘧啶就是「5-甲基尿嘧啶」，多的正是 5 號碳上的甲基。這也是為什麼 5-methylcytosine 脫胺後會變成 thymine 而不易被修復系統認出。","胺基出現在 cytosine、adenine、guanine 上，不是兩者的差別。","核糖是 RNA 的糖基，不是鹼基上的官能基。"]},{"id":"M-112-1_80","t":"M","y":112,"q":"下列何者為核苷酸（nucleotide）重新合成路徑（de novo synthesis）及補救合成路徑（salvage pathway）皆會使用的重要代謝物？","o":["glycinamide ribonucleotide（GAR）","5-phosphoribosylamine（PRA）","formylglycinamide ribonucleotide（FGAR）","5-phospho-α-D-ribosyl-1-pyrophosphate（PRPP）"],"a":[3],"ch":["22"],"sec":"22.4","fbt":"Figure 22-35","ex":["GAR 是 de novo 路徑的中間產物，回收路徑不會用到。","PRA 是 de novo 的第一個關鍵產物（PRPP amidotransferase 的產物），回收路徑不經此。","FGAR 同樣只是 de novo 的中間產物。","PRPP 既是 de novo 的起點（PRPP + glutamine → PRA），也是回收路徑 APRT／HGPRT 的核糖磷酸供體，兩條路都要用。"]},{"id":"M-112-1_81","t":"M","y":112,"q":"下列關於 DNA 複製（DNA replication）的敘述，何者錯誤？","o":["大腸桿菌（E. coli）的 DNA 複製，只會利用一個複製起始點（replication origin）","真核細胞的 DNA 複製，會利用多個複製起始點（replication origin）","大腸桿菌（E. coli）染色體 DNA 的複製以雙個複製叉（replication fork）進行","大腸桿菌（E. coli）的 DNA 複製需要利用 RNA 為引子（primer），真核生物的 DNA 複製則利用 DNA 為引子"],"a":[3],"ch":["25"],"sec":"25.1","fbt":"Figure 25-1; Figure 25-9"},{"id":"M-112-1_82","t":"M","y":112,"q":"反轉錄酶（reverse transcriptase）主要的作用為：","o":["以 DNA 為模板合成 DNA","以 DNA 為模板合成 RNA","以 RNA 為模板合成 DNA","以 RNA 為模板合成 RNA"],"a":[2],"ch":["26"],"sec":"26.3","fbt":""},{"id":"M-112-1_83","t":"M","y":112,"q":"下列何者是原核生物中核苷酸去除修復（nucleotide excision repair）過程的主要酵素？","o":["Ruv A, B, C","Uvr A, B, C","Rec A, Lex A, Rec BCD","Polymerase α, β, γ, δ"],"a":[1],"ch":["25"],"sec":"25.2","fbt":"Table 25-5"},{"id":"M-112-1_84","t":"M","y":112,"q":"三磷酸核苷（nucleoside triphosphate）是細胞內生化反應重要的能量來源，在蛋白質轉譯的過程中，核糖體轉位（translocation）所需的能量是由下列何者提供？","o":["ATP → ADP + Pi","GTP → GDP + Pi","ATP → AMP + PPi","GTP → GMP + PPi"],"a":[1],"ch":["27"],"sec":"27.2","fbt":"Figure 27-30"},{"id":"M-112-1_85","t":"M","y":112,"q":"小分子物質在原核細胞中調節基因轉錄起始，通常不是藉由下列何種作用機轉？","o":["直接結合到 DNA","調控活化子（activator）與 DNA 的結合","改變抑制子（repressor）的蛋白質構型（conformation）","調控抑制子（repressor）與 DNA 的結合"],"a":[0],"ch":["28"],"sec":"28.2","fbt":"Figure 28-4"},{"id":"M-112-1_86","t":"M","y":112,"q":"下列關於真核細胞中，mRNA 在 5' 端會經過加帽（capping）修飾的敘述，何者錯誤？","o":["可保護 mRNA 不被核酸外切酶（exonuclease）所水解","可被 eIF4E 辨識","可幫助 mRNA 之轉譯（translation）","修飾反應主要發生於內質網（ER）及高基氏體（Golgi apparatus）內"],"a":[3],"ch":["26","27"],"sec":"26.2 27.2","fbt":"Figure 26-13; Figure 27-26"},{"id":"M-112-1_87","t":"M","y":112,"q":"下列何者是胺醯-tRNA 合成酶（aminoacyl-tRNA synthetases）的錯誤詮釋？","o":["可將胺基酸接到 tRNA 的 3'端","反應中可將 ATP 分解，並釋出焦磷酸根（PPi）","對每一種胺基酸的特異性很高，但可接受任何一種 tRNA 作為受質（substrate）","多數生物體中，對每一種胺基酸皆有其專一的胺醯-tRNA 合成酶"],"a":[2],"ch":["27"],"sec":"27.2","fbt":"Figure 27-19; Figure 27-20"},{"id":"M-112-1_88","t":"M","y":112,"q":"下列那一個酵素所催化的反應為糖解作用（glycolysis）中唯一將電子轉移給 NAD+之氧化還原反應？","o":["enolase","glyceraldehyde-3-phosphate dehydrogenase","pyruvate dehydrogenase","pyruvate kinase"],"a":[1],"ch":["14"],"sec":"14.1","fbt":"Figure14-2"},{"id":"M-112-1_89","t":"M","y":112,"q":"醣基化是蛋白質上常見的一種轉譯後修飾，有 N-linked 與 O-linked 兩種主要的鍵結方式，其中 N-linked 主要是透過與蛋白質上的何種胺基酸結合？","o":["絲胺酸（serine）","酪胺酸（tyrosine）","天門冬醯胺（asparagine）","天門冬胺酸（aspartate）"],"a":[2],"ch":["7"],"sec":"7.3","fbt":"Figure 7-27"},{"id":"M-112-1_90","t":"M","y":112,"q":"葡萄糖在細胞內代謝成 acetyl-CoA 的過程中，不需要下列何者參與？","o":["glyceraldehyde 3-phosphate dehydrogenase","pyruvate kinase","pyruvate dehydrogenase complex","phosphoenolpyruvate（PEP）carboxykinase"],"a":[3],"ch":["14","16"],"sec":"14.1 16.1","fbt":"Figure 14-2; Figure 16-3"},{"id":"M-112-1_91","t":"M","y":112,"q":"在 cerebroside 合成過程中，下列何者攜帶 glucose 參與 ceramide 轉成 cerebroside 的反應？","o":["CDP","UDP","GDP","ADP"],"a":[1],"ch":["21"],"sec":"21.3","fbt":"Figure 21-31","ex":["CDP 攜帶的是 choline、ethanolamine 或 diacylglycerol，不攜帶葡萄糖。","UDP-glucose 是糖基的通用供體，把葡萄糖接到 ceramide 上生成 glucocerebroside。","GDP 攜帶的是 mannose、fucose。","ADP 不是糖基供體。"]},{"id":"M-112-1_92","t":"M","y":112,"q":"有關家族性高膽固醇症（familial hypercholesterolemia）的敘述，下列何者最不正確？","o":["LDL receptor 過度表達","LDL 的濃度太高","LDL receptor 基因突變","LDL receptor 運送到細胞膜過程受阻"],"a":[0],"ch":["21"],"sec":"21.4","fbt":"Figure 21-44","ex":["家族性高膽固醇血症正是 LDL 受體功能「不足」，絕不是過度表達，所以最不正確。","受體不足使 LDL 無法被清除，血中 LDL 濃度升高，敘述正確。","病因就是 LDL receptor 基因突變，敘述正確。","受體在運送到細胞膜的過程中受阻（第 2 類突變）也是常見型態，敘述正確。"]},{"id":"M-112-1_93","t":"M","y":112,"q":"Tay-Sachs disease 屬於一種 sphingolipidoses，關於此疾病下列敘述何者錯誤？","o":["屬於 lipid storage disease","導致神經系統退化","致病機轉主要是由於 ganglioside 無法在 endoplasmic reticulum 中分解","由 lysosomal N-acetylhexosaminidase A 功能缺失引起"],"a":[2],"ch":["10"],"sec":"10.2","fbt":"Box 10-1","ex":["Tay-Sachs 確實屬脂質貯積症，敘述正確。","GM2 堆積於神經元造成進行性神經退化、視網膜櫻桃紅斑與失明，敘述正確。","鞘脂的分解發生在「溶小體」，不是內質網；Tay-Sachs 是溶小體酵素缺陷，故此敘述錯誤。","缺的正是溶小體的 β-N-acetylhexosaminidase A，敘述正確。"]},{"id":"M-112-1_94","t":"M","y":112,"q":"下列有關琥珀酸–甘胺酸路徑（succinate-glycine pathway）的敘述，何者錯誤？","o":["此路徑作用的第一個酵素為δ-aminolevulinic acid synthase（ALA synthase）","血基質（heme）中的碳原子來自琥珀酸（succinate）及甘胺酸（glycine）","需要磷酸吡哆醛（pyridoxal phosphate）參與作用","血基質（heme）合成在細胞質中完成"],"a":[3],"ch":["22"],"sec":"22.3","fbt":"Figure 22-24; Figure 22-25","ex":["ALA synthase 催化 succinyl-CoA + glycine → δ-ALA，是第一步也是限速步驟，敘述正確。","血基質的碳原子確實全部來自 succinyl-CoA 與 glycine，敘述正確。","ALA synthase 屬轉胺／縮合型反應，需要 PLP，敘述正確。","血基質合成是跨胞器的：起始的 ALA synthase 與最後三步（含 ferrochelatase 插入 Fe2+）在粒線體，中間步驟才在細胞質，不是「在細胞質中完成」，故錯誤。"]},{"id":"M-112-1_95","t":"M","y":112,"q":"胺基酸在肌肉組織中代謝產生的氨（ammonia）會再以何種胺基酸型式攜帶進入肝臟進行代謝？","o":["離胺酸（lysine）","瓜胺酸（citrulline）","精胺酸（arginine）","丙胺酸（alanine）"],"a":[3],"ch":["18"],"sec":"18.1","fbt":"Figure 18-2; Figure 18-9","ex":["離胺酸不擔任胺基載體。","瓜胺酸是尿素循環的中間產物，留在肝細胞內，不在血中運氮。","精胺酸同樣是尿素循環的中間產物。","肌肉把胺基轉給丙酮酸生成丙胺酸，經血流送到肝臟再轉回丙酮酸做糖質新生 —— 這就是 glucose-alanine cycle，同時運氮也運碳。"]},{"id":"M-112-1_96","t":"M","y":112,"q":"下列何者為粒線體電子傳遞鏈 complex IV 之電子供應者（electron donor）？","o":["succinate","cytochrome c","coenzyme Q","NADH"],"a":[1],"ch":["19"],"sec":"19.1","fbt":"Figure 19-16"},{"id":"M-112-1_97","t":"M","y":112,"q":"下列何者不是真核生物細胞週期進行的主要調控蛋白？","o":["cyclin","cyclin-dependent protein kinase（CDK）","laminin","anaphase-promoting complex（APC/C）"],"a":[2],"ch":["12"],"sec":"12.8","fbt":"Figure 12-39","ex":["cyclin 週期性合成與降解，是 CDK 的活化次單元。","CDK 是細胞週期的核心激酶。","laminin 是基底膜的細胞外基質醣蛋白，與細胞週期調控無關 —— 容易跟核膜的 lamin 混淆。","APC/C 是 E3 ubiquitin ligase，降解 securin 與 cyclin B 推動 anaphase。"]},{"id":"M-112-1_98","t":"M","y":112,"q":"下列何者與類固醇激素（steroid hormone）之作用方式無關？","o":["激素會與受體形成複合體（hormone-receptor complexes）","受體主要在細胞膜表面以磷酸化方式活化","受體具備與特殊 DNA 序列結合之特性","受體與激素結合後可活化或抑制基因轉錄"],"a":[1],"ch":["12"],"sec":"12.7","fbt":"Figure12-34","ex":["類固醇與核內受體形成 hormone-receptor complex，是正確敘述。","類固醇受體位在細胞質／細胞核，靠配體結合解除 HSP 抑制而活化，不是在膜表面被磷酸化活化。","受體具 DNA 結合域，辨識 hormone response element。","複合體進核後可活化或抑制標的基因轉錄。"]},{"id":"M-112-1_99","t":"M","y":112,"q":"下列關於 protein kinase A 的敘述，何者正確？","o":["結合 cyclic GMP 而活化","結合 AMP 而活化","結合 cyclic AMP 而活化","其活化可促進細胞內脂肪酸的生合成（fatty acid biosynthesis）"],"a":[2],"ch":["12"],"sec":"12.2","fbt":"Figure 12-6","ex":["結合 cGMP 而活化的是 PKG，不是 PKA。","結合 AMP 而活化的是 AMPK。","cAMP 結合 PKA 的兩個調節次單元，釋出兩個具活性的催化次單元。","PKA 磷酸化並抑制 acetyl-CoA carboxylase，使脂肪酸合成下降而非上升。"]},{"id":"M-112-2_100","t":"M","y":112,"q":"下列有關限制酶（restriction enzymes）的描述，何者最適當？","o":["作用在胞膜上的通道，以限制某些病毒進入細胞","具特異性的核糖核酸酶（ribonuclease），能在特定的生理狀況下降解 mRNA","是一種具序列特異性（sequence-specific）的 DNA 內切酶（endonuclease）","能催化胺基酸與特異性的 tRNA 結合"],"a":[2],"ch":["9"],"sec":"9.1","fbt":"Table 9-1","ex":["限制酶作用在 DNA 上，不是膜上的通道。","它切的是 DNA 不是 mRNA；降解 mRNA 的是核糖核酸酶。","第二型限制酶辨識特定（通常是迴文）的 DNA 序列並在序列內部切斷雙股，是細菌用來摧毀外來噬菌體 DNA 的防禦系統，自身 DNA 則靠甲基化保護。","催化胺基酸接上 tRNA 的是 aminoacyl-tRNA synthetase。"]},{"id":"M-112-2_75","t":"M","y":112,"q":"在非競爭性抑制劑（uncompetitive inhibitor）的存在下，下列何項是可預期的 Michaelis-Menten 酵素動力學變化？","o":["Vmax 下降，KM 下降","Vmax 不變，KM 下降","Vmax 下降，KM 上升","Vmax 不變，KM 上升"],"a":[0],"ch":["6"],"sec":"6.3","fbt":"Figure 6-20"},{"id":"M-112-2_76","t":"M","y":112,"q":"酵素動力學中的穩態（steady state）指的是下列何者？","o":["反應活化能為零的狀態","酵素催化反應的分子機制","酵素和受質結合的複合體形成和分解的速率一樣","酵素反應的最大速率"],"a":[2],"ch":["6"],"sec":"6.3","fbt":"Figure 6-10"},{"id":"M-112-2_77","t":"M","y":112,"q":"下列有關輔因子參與酶催化之含碳原子團轉移反應的敘述，何者錯誤？","o":["Tetrahydrofolate 可參與不同氧化態的一個碳轉移，如 CH3-, CH2OH-, and CHO-","S-adenosylmethionine（adoMet）由 ATP 和 methionine 合成，參與甲基（methyl group）轉移","Biotin 與 cysteine 結合，參與 pyruvate carboxylase 催化 pyruvate 的 carboxylation，形成 oxaloacetate","Thiamine pyrophosphate（TPP）參與 pyruvate dehydrogenase 反應，促使 pyruvate 形成 acetyl-CoA"],"a":[2],"ch":["16","18","21"],"sec":"16.1 18.3 21.1","fbt":"Figure 16-6; Figure 18-16; Figure 18-17; Figure 21-1","ex":["四氫葉酸可攜帶甲基、亞甲基、甲醯基等不同氧化態的一碳單位，敘述正確。","SAM 由 ATP 與 methionine 縮合而成，是最主要的甲基供體，敘述正確。","生物素是以醯胺鍵接在酵素的「離胺酸」ε-胺基上（形成 biocytin），不是 cysteine，故此敘述錯誤。羧化作用本身則是正確的。","TPP 是丙酮酸脫氫酶複合體 E1 的輔酶，催化脫羧後生成 acetyl-CoA，敘述正確。"]},{"id":"M-112-2_78","t":"M","y":112,"q":"在肌肉、肝臟與腎臟之間胺基（amino group）的運送，主要藉由下列那一組胺基酸作為胺基的攜帶者（carriers）？","o":["phenylalanine、aspartate","serine、valine","glutamine、alanine","glutamate、glutamine"],"a":[2],"ch":["18"],"sec":"18.1","fbt":"Figure 18-8; Figure 18-9","ex":["苯丙胺酸與天門冬胺酸不是血中運送胺基的主力。","絲胺酸與纈胺酸不擔任組織間的胺基載體。","麩醯胺是多數組織把氨送往肝與腎的通用載體，丙胺酸則是肌肉送往肝臟的專用載體（glucose-alanine cycle），兩者是組織間運氮的主角。","麩胺酸是細胞「內」收集胺基的集散點，血中濃度低也不易穿膜；真正出場運送的是它的醯胺型 glutamine。"]},{"id":"M-112-2_79","t":"M","y":112,"q":"抗生素 azaserine 可抑制嘌呤的形成，其主要作用機制為下列何者？","o":["抑制 N10-formyl tetrahydrofolate 合成","抑制 5-phospho-α-D-ribosyl-pyrophosphate（PRPP）合成","抑制 ribose 5-phosphate 合成以降低核苷酸形成","抑制 glutamine 作為嘌呤核苷酸合成原料"],"a":[3],"ch":["22"],"sec":"22.4","fbt":"Figure 22-51","ex":["azaserine 不作用在 N10-formyl-THF 的合成。","抑制 PRPP synthetase 不是 azaserine 的機制。","azaserine 與 ribose 5-phosphate 的生成無關。","azaserine 是 glutamine 的結構類似物，共價抑制以 glutamine 為氮供體的 amidotransferase（如 FGAR amidotransferase），切斷嘌呤環所需的氮來源。"]},{"id":"M-112-2_80","t":"M","y":112,"q":"大腸桿菌的 DNA 聚合酶 I 沒有下列何種酵素活性？","o":["5'→3' DNA 聚合活性","3'→5' DNA 聚合活性","5'→3' DNA 核酸水解活性","3'→5' DNA 核酸水解活性"],"a":[1],"ch":["25"],"sec":"25.1","fbt":"Figure25-4; Table 25-1"},{"id":"M-112-2_81","t":"M","y":112,"q":"聚合酶連鎖反應（polymerase chain reaction）可用來偵測微量的 DNA，反應中通常不需要加：","o":["DNA 聚合酶（DNA polymerase）","ATP","脫氧核糖核苷三磷酸（dNTPs）","鎂離子（Mg2+）"],"a":[1],"ch":["8"],"sec":"8.3","fbt":"Figure 8-33","ex":["DNA 聚合酶（耐熱型）是延長新股的酵素，必須加。","dNTP 本身就帶三磷酸提供聚合所需的能量，PCR 不需要另外加 ATP。","dNTPs 是合成新股的原料，必須加。","Mg2+ 是 DNA 聚合酶的必需輔因子，必須加。"]},{"id":"M-112-2_82","t":"M","y":112,"q":"遺傳性非息肉症大腸直腸癌（hereditary nonpolyposis colon cancer, HNPCC）病患，主要是在何種 DNA 修復功能上產生缺失？","o":["核苷酸切除修復（nucleotide excision repair）","鹼基切除修復（base excision repair）","重組修復（recombinational repair）","核酸錯誤配對修復（mismatch repair）"],"a":[3],"ch":["25"],"sec":"25.2","fbt":"FIgure 25-21; Box 25-1"},{"id":"M-112-2_83","t":"M","y":112,"q":"核糖體辨識 mRNA 之起始密碼子（initiation codon）AUG，啟動蛋白質合成，使用之起始胺基酸為何者？","o":["在真核和細菌中均為 methionine","在真核和細菌中均為 N-formylmethionine","在真核細胞中為 methionine；而細菌中為 N-formylmethionine","在真核細胞中為 N-formylmethionine；而細菌中為 methionine"],"a":[2],"ch":["27"],"sec":"27.2","fbt":"Figure 27-24; Figure 27-25"},{"id":"M-112-2_84","t":"M","y":112,"q":"下列關於組織蛋白（histones）之特性何者正確？","o":["富含酸性胺基酸並與 DNA 結合","富含酸性胺基酸並與 RNA 結合","富含鹼性胺基酸並與 DNA 結合","富含鹼性胺基酸並與 RNA 結合"],"a":[2],"ch":["24"],"sec":"24.3","fbt":"Table 24-5","ex":["組織蛋白富含的是「鹼性」胺基酸，不是酸性。","既非酸性，結合的也不是 RNA。","組織蛋白富含離胺酸與精胺酸，側鏈帶正電，正好與 DNA 骨架的負電磷酸基靜電吸引而緊密結合；乙醯化中和這些正電就使結合鬆開而利於轉錄。","富含鹼性胺基酸正確，但結合的是 DNA 不是 RNA。"]},{"id":"M-112-2_85","t":"M","y":112,"q":"下列何者為真核細胞 mRNA 5' capping 的方式？","o":["7-methylguanosine 以 5'-to-3' diphosphate linkage 方式結合至 mRNA","7-methylguanosine 以 5'-to-5' triphosphate linkage 方式結合至 mRNA","N 6-methyladenosine 以 5'-to-5' triphosphate linkage 方式結合至 mRNA","O 6-methylguanosine 以 5'-to-3' diphosphate linkage 方式結合至 mRNA"],"a":[1],"ch":["26"],"sec":"26.1","fbt":"Figure 26-13"},{"id":"M-112-2_86","t":"M","y":112,"q":"下列何者是 trp operon 調降作用（attenuation）的最佳敘述？","o":["當色胺酸（tryptophan）存在時，可增進 trp operon 的轉錄表現","可調節此 operon 的轉錄表現，以因應細胞中微量色胺酸（tryptophan）的改變","可直接抑制 trp mRNA 轉譯作用的機制","作用在 trp operon 內每一個基因個別的啟動子（promoter）上"],"a":[1],"ch":["28"],"sec":"28.2","fbt":"Figure 28-20"},{"id":"M-112-2_87","t":"M","y":112,"q":"下列那一個酵素，位於粒線體內膜上，並同時參與克氏循環（Krebs cycle 或稱 TCA cycle）與電子傳遞鏈反應？","o":["Succinate dehydrogenase","Succinyl-CoA synthetase","Malate dehydrogenase","Isocitrate dehydrogenase"],"a":[0],"ch":["16","19"],"sec":"16.2 19.1","fbt":"Figure 16-7; Figure 19-9; Figure 19-16"},{"id":"M-112-2_88","t":"M","y":112,"q":"下列關於葡萄糖新生（gluconeogenesis）的敘述，何者正確？","o":["葡萄糖新生全部的反應都發生在細胞質","葡萄糖新生將 pyruvate 轉化成葡萄糖需要消耗 ATP 及 GTP","葡萄糖新生過程中所參與的酵素與糖解作用（glycolysis）完全相同，只是反應方向相反","Phosphoenolpyruvate carboxykinase（PEPCK）的功能是將 phosphoenolpyruvate 轉化成 oxaloacetate"],"a":[1],"ch":["14"],"sec":"14.4","fbt":"Figure 14-16; Figure 14-19"},{"id":"M-112-2_89","t":"M","y":112,"q":"下列那種酵素的活性並非調節糖解作用（glycolysis）速率的主要調控者？","o":["己糖激酶（hexokinase）","磷酸果糖激酶（phosphofructokinase）","烯醇化酶（enolase）","丙酮酸激酶（pyruvate kinase）"],"a":[2],"ch":["14"],"sec":"14.5","fbt":""},{"id":"M-112-2_90","t":"M","y":112,"q":"Acetyl-CoA carboxylase 為脂肪酸生合成的第一個酵素，其活性最不受下列何者調控？","o":["胰島素（insulin）","輔酶 A（coenzyme A）","檸檬酸（citrate）","AMP-activated protein kinase（AMPK）"],"a":[1],"ch":["21","23"],"sec":"21.1 23.3","fbt":"Table 21-11; Table 23-3","ex":["胰島素促使 ACC 去磷酸化而活化，是重要調控者。","輔酶 A 是受質 acetyl-CoA 的組成，不是 ACC 的調控分子；真正的回饋抑制物是終產物 palmitoyl-CoA。","檸檬酸是 ACC 的異位活化劑（代表細胞內碳源充足），是重要調控者。","AMPK 在能量不足時磷酸化並抑制 ACC，是重要調控者。"]},{"id":"M-112-2_91","t":"M","y":112,"q":"參與凝血作用的維生素 K 是下列何者的衍生物？","o":["7-dehydrocholesterol","arachidonate","isoprenoid","pregnenolone"],"a":[2],"ch":["10"],"sec":"10.3","fbt":"Figure 10-22","ex":["7-dehydrocholesterol 是維生素 D 的前驅物。","花生四烯酸是前列腺素與白三烯的前驅物。","維生素 K 是萘醌環加上一條由異戊二烯單元組成的長側鏈，屬 isoprenoid 衍生物；它作為 γ-glutamyl carboxylase 的輔因子，使凝血因子 II、VII、IX、X 的麩胺酸殘基羧化而能結合鈣。","pregnenolone 是類固醇荷爾蒙的共同前驅物。"]},{"id":"M-112-2_92","t":"M","y":112,"q":"下列有關膜周邊蛋白（peripheral membrane proteins）的描述，何者錯誤？","o":["調整溶液的 pH 值與離子強度可以將它和細胞膜分離","具有穿透膜結構","可以利用離子鍵和其他細胞膜蛋白穩定結合","可以利用氫鍵和其他細胞膜蛋白穩定結合"],"a":[1],"ch":["11"],"sec":"11.1","fbt":"Figure 11-9","ex":["周邊蛋白只靠靜電與氫鍵附著，改變 pH 或離子強度就能洗下來，敘述正確。","具有穿透膜結構的是「嵌入型」（integral）膜蛋白；周邊蛋白不插入脂雙層，故此敘述錯誤。","可經離子鍵與其他膜蛋白或磷脂頭基結合，敘述正確。","也可經氫鍵穩定結合，敘述正確。"]},{"id":"M-112-2_93","t":"M","y":112,"q":"下列有關色胺酸（tryptophan）之敘述，何者錯誤？","o":["為人體必需胺基酸","色胺酸羥化酶（tryptophan hydroxylase）受抑制易導致憂鬱症","為合成血清素（serotonin）的前驅物","可代謝形成多巴胺（dopamine）"],"a":[3],"ch":["22"],"sec":"22.1 22.3","fbt":"Table 22-1; Figure 22-31","ex":["色胺酸是人體必需胺基酸，敘述正確。","tryptophan hydroxylase 是 serotonin 合成的限速酶，活性受抑制時 serotonin 下降，與憂鬱症相關，敘述正確。","色胺酸 → 5-hydroxytryptophan → serotonin，敘述正確。","多巴胺來自酪胺酸（Tyr → DOPA → dopamine），不是色胺酸，故此敘述錯誤。"]},{"id":"M-112-2_94","t":"M","y":112,"q":"有關天門冬醯胺（asparagine）的敘述，下列何者錯誤？","o":["為非必需胺基酸（nonessential amino acid）","可代謝成為天門冬胺酸（aspartate）","屬於生酮性胺基酸（ketogenic amino acid）","天門冬醯胺酶（asparaginase）能分解血液中的 asparagine"],"a":[2],"ch":["18","22"],"sec":"18.3 22.1","fbt":"Figure 18-15; Figure 18-29; Table 22-1","ex":["天門冬醯胺人體可自行合成（由 aspartate + glutamine），屬非必需胺基酸，敘述正確。","asparaginase 水解 asparagine 成 aspartate，敘述正確。","Asn 與 Asp 分解後進入 oxaloacetate，屬「生糖性」胺基酸，不是生酮性，故此敘述錯誤。（純生酮只有 Leu 與 Lys。）","asparaginase 正是急性淋巴性白血病的用藥，分解血中 asparagine 使癌細胞缺料，敘述正確。"]},{"id":"M-112-2_95","t":"M","y":112,"q":"下列粒線體電子傳遞鏈中的那個酵素複合體（complex）可以將氧氣還原成水？","o":["complex I","complex II","complex III","complex IV"],"a":[3],"ch":["19"],"sec":"19.1","fbt":"Figure 19-13"},{"id":"M-112-2_96","t":"M","y":112,"q":"真核生物的細胞週期中，cyclin-dependent protein kinase（CDK）的催化活性不受下列何種蛋白直接調控？","o":["cyclin","kinase","phosphatase","ubiquitin"],"a":[3],"ch":["12"],"sec":"12.8","fbt":"Figure 12-37","ex":["cyclin 直接結合 CDK 才能使其有活性。","激酶（CAK、Wee1）直接磷酸化 CDK 而改變活性。","磷酸酶（Cdc25）直接去磷酸化 CDK 使其活化。","ubiquitin 本身只是降解標記，透過降解 cyclin 間接影響，不直接調控 CDK 的催化活性。"]},{"id":"M-112-2_97","t":"M","y":112,"q":"下列何種訊息分子通常不會直接結合於 G protein-coupled receptor（GPCR）來進行訊息傳遞？","o":["angiotensin","prostaglandin","epinephrine","insulin"],"a":[3],"ch":["12"],"sec":"12.2","fbt":"Table 12-3; Table 12-4","ex":["angiotensin II 作用於 AT1，是 GPCR。","prostaglandin 有 EP、DP 等多種 GPCR。","epinephrine 的 α、β-adrenergic 受體都是 GPCR。","胰島素作用於 receptor tyrosine kinase（α2β2 四聚體），不是 GPCR。"]},{"id":"M-112-2_98","t":"M","y":112,"q":"GTP 酶活化蛋白（GTPase activator proteins, GAPs）最可能直接結合下列何者而調節訊息傳遞？","o":["環鳥苷單磷酸（cGMP）","Ras 蛋白","二醯基甘油（diacylglycerol）","腺苷酸環化酶（adenylyl cyclase）"],"a":[1],"ch":["12"],"sec":"12.2","fbt":"Figure 12-13","ex":["cGMP 由 phosphodiesterase 水解，與 GAP 無關。","GAP 直接結合 Ras 等小 G 蛋白，促進其內在 GTP 水解，加速把訊號關掉。","DAG 是 PKC 的活化物，不是 GAP 的作用對象。","adenylyl cyclase 受 Gsα／Giα 調節，不是 GAP 的受質。"]},{"id":"M-112-2_99","t":"M","y":112,"q":"下列何者最不可能被用來測定細胞中某一特殊核糖核酸（RNA）的數量？","o":["核糖核酸免疫沉澱（RNA immunoprecipitation）","核糖核酸深度定序（RNA deep sequencing）","核糖核酸微陣列（RNA microarray）","反轉錄－即時聚合酶連鎖反應（reverse transcription-real time polymerase chain reaction）"],"a":[0],"ch":["9"],"sec":"9.1","fbt":"Figure 9-12","ex":["RNA immunoprecipitation 是用抗體把 RNA 結合蛋白連同其結合的 RNA 拉下來，問的是「哪些 RNA 和這個蛋白結合」，不是細胞中某個 RNA 的總量，最不適合用來定量。","深度定序可同時定量全部轉錄本的豐度。","微陣列以雜交訊號強弱反映各基因的表現量。","RT-qPCR 是定量特定 RNA 最標準、最靈敏的方法。"]},{"id":"M-111-1_100","t":"M","y":111,"q":"粒線體的膜電位差對於ATP synthase（complex V）所催化的ATP合成是必需的，當一對電子從NADH藉由電子傳遞鏈轉移到氧分子（O2）的過程中，下列敘述何者正確？","o":["Complex I會將4個氫離子移轉到細胞質","Complex II會將2個氫離子移轉到粒線體內外膜間隙（intermembrane space）","Complex III會將4個氫離子移轉到粒線體內外膜間隙（intermembrane space）","Complex IV會將2個氫離子移轉到粒線體基質（matrix）"],"a":[2],"ch":["19"],"sec":"19.1","fbt":"Figure 19-16"},{"id":"M-111-1_73","t":"M","y":111,"q":"下列何者最可能是胰島素分泌或作用不足（insulin deficiency）造成的變化？","o":["肝臟肝醣合成增加","肌肉葡萄糖吸收增加","肝臟合成之酮體增加","脂肪合成增加"],"a":[2],"ch":["21"],"sec":"23","fbt":"23.5","ex":["胰島素不足時肝醣合成「減少」、分解增加。","胰島素不足時 GLUT4 無法上膜，肌肉攝取葡萄糖「減少」。","胰島素不足使脂肪組織脂解失控，大量脂肪酸湧入肝臟進行 β 氧化，acetyl-CoA 過剩而轉向酮體合成 —— 這就是糖尿病酮酸中毒的由來。","胰島素不足時脂肪合成「減少」、分解增加。"]},{"id":"M-111-1_74","t":"M","y":111,"q":"在一個符合Michaelis-Menten equation的酵素催化反應中，當受質（substrate）濃度遠大於Michaelis常數（KM）時，此反應會近似於幾級化學反應？","o":["零級反應（zero-order reaction）","一級反應（first-order reaction）","二級反應（second-order reaction）","三級反應（third-order reaction）"],"a":[0],"ch":["6"],"sec":"6.2 6.3","fbt":""},{"id":"M-111-1_75","t":"M","y":111,"q":"有關酵素催化反應之敘述，下列何者正確？","o":["一個由酵素催化的反應一定是放熱反應","由酵素催化的反應不會達到化學平衡","酵素的總量在反應中不會改變","如果酵素不存在，則此酵素催化的反應就不會發生"],"a":[2],"ch":["6"],"sec":"","fbt":""},{"id":"M-111-1_76","t":"M","y":111,"q":"關於雙硫鍵（disulfide bond）的敘述，下列何者正確？","o":["雙硫鍵對大部分蛋白質三級結構的穩定性沒有顯著影響","雙硫鍵是由2個甲硫胺酸（methionine）共價鍵結所形成","強還原劑會破壞蛋白質結構中的雙硫鍵","雙硫鍵屬於非共價交互作用（non-covalent interaction）"],"a":[2],"ch":["3"],"sec":"3.1 3.4","fbt":"Figure 3-7; Figure 3-26"},{"id":"M-111-1_77","t":"M","y":111,"q":"DNA複製在真核生物細胞週期（cell cycle）的那一個時期（phase）中進行？","o":["G1","S","G2","M"],"a":[1],"ch":["12"],"sec":"12.8","fbt":"Figure 12-35","ex":["G1 期合成複製所需的酵素與受質，但還沒開始複製 DNA。","S（synthesis）期才是 DNA 複製期。","G2 是複製完成後的檢查與分裂前準備。","M 期進行染色體分離與細胞分裂。"]},{"id":"M-111-1_78","t":"M","y":111,"q":"下列何種激素－受體相互作用後，受體會由單體（monomer）形成雙聚體（dimer）？","o":["乙醯膽鹼與其菸鹼受體（nicotinic acetylcholine receptor）","表皮生長因子（EGF）與其受體（EGF receptor）","腎上腺素與其受體（β-adrenergic receptor）","膠原蛋白與其受體（integrin）"],"a":[1],"ch":["12"],"sec":"12.4","fbt":"Figure 12-26","ex":["菸鹼型乙醯膽鹼受體本來就是五聚體離子通道，不是配體誘導的二聚化。","EGF 結合 EGFR 促使受體二聚化，兩個激酶域互相自我磷酸化 tyrosine。","β-adrenergic receptor 是七次跨膜 GPCR，以單體形式作用。","integrin 本身就是 α／β 異二聚體，結合細胞外基質。"]},{"id":"M-111-1_79","t":"M","y":111,"q":"庫欣氏症（Cushing syndrome）是一種腎上腺皮質類固醇分泌過多的疾病，下列敘述何者錯誤？","o":["腎上腺皮質類固醇合成的前驅物是膽固醇","類固醇無法穿透細胞膜，故必須作用於細胞膜上之受體","腎上腺皮質類固醇與其受體結合可造成受體之構形改變","受體經活化之後可調控基因轉錄作用"],"a":[1],"ch":["10","28"],"sec":"28.3","fbt":"FIgure 10-18; Figure 28-34","ex":["腎上腺皮質類固醇（皮質醇、醛固酮）都由膽固醇合成，敘述正確。","類固醇是親脂性分子，可直接擴散穿過細胞膜，作用於細胞質／細胞核內的受體，不是細胞膜上的受體，故此敘述錯誤。","荷爾蒙結合後受體脫離 HSP 並發生構型改變，敘述正確。","活化的受體二聚化後進核，結合荷爾蒙反應元件而調控轉錄，敘述正確。"]},{"id":"M-111-1_80","t":"M","y":111,"q":"反義寡核酸（antisense oligonucleotides）已被使用做為治療疾病的藥物，下列何者不是其可達成的作用機制？","o":["影響核糖核酸剪切（RNA splicing）","造成核糖核酸序列突變（RNA sequence mutation）","導致信使核糖核酸降解（mRNA degradation）","影響蛋白質轉譯效率（translation efficiency）"],"a":[1],"ch":["26"],"sec":"26.2","fbt":"Box 26-2"},{"id":"M-111-1_81","t":"M","y":111,"q":"下列那個雙股去氧核糖核酸的物理性質可被用來測定其融化溫度（melting temperature, Tm）？","o":["導電性（conductivity）","在膠體中的泳動性（mobility）","水溶性（solubility）","低色度（hypochromicity）"],"a":[3],"ch":["8"],"sec":"8.3","fbt":"","ex":["導電性與 DNA 的解鏈無關。","膠體泳動性反映分子大小，不用於測 Tm。","水溶性不隨解鏈而顯著改變。","雙股 DNA 因鹼基堆疊而吸光度偏低（低色度效應）；加熱解鏈後鹼基暴露，260 nm 吸光度上升約 40%（高色度效應）。以吸光度對溫度作圖，升幅達一半時的溫度就是 Tm。"]},{"id":"M-111-1_82","t":"M","y":111,"q":"下列何種維生素的缺乏會造成糙皮病（pellagra），其典型症狀是腹瀉、皮膚發炎及癡呆？","o":["thiamine","niacin","riboflavin","pantothenic acid"],"a":[1],"ch":["13"],"sec":"13.4","fbt":""},{"id":"M-111-1_83","t":"M","y":111,"q":"維生素B5是泛酸（pantothenic acid），用於合成輔酶A（CoA），下列有關輔酶A的敘述，何者錯誤？","o":["輔酶A的結構含泛酸、ADP衍生物和cysteine之結合","輔酶A結構中之硫原子可與acyl group結合","輔酶A參與pyruvate dehydrogenase complex催化之反應，形成acetyl-CoA","在三羧酸循環（TCA cycle）中參與α-ketoglutarate dehydrogenase complex催化之反應，形成succinyl-CoA"],"a":[0],"ch":["16"],"sec":"16.1 16.2","fbt":"Fig tion factor -Tu, EF-Tu）","轉譯釋放因子 1（translation release factor 1, RF1）","伴護蛋白（chaperone）"],"a":[2],"ch":["27"],"sec":"27.2","fbt":"Figure 27-31"},{"id":"M-111-1_91","t":"M","y":111,"q":"原核細胞內調節基因表現的許多DNA結合蛋白具有下列何種特殊結構模體（structural motif）？","o":["同源框（homeobox）","催化三角（catalytic triad）","EF手掌（EF hand）","螺旋–轉角–螺旋（helix-turn-helix）"],"a":[3],"ch":["28"],"sec":"28.1","fbt":"Figure 28-11; Figure 28-12; Figure 28-13"},{"id":"M-111-1_92","t":"M","y":111,"q":"下列關於Cori cycle在體內不同組織進行反應的敘述，何者正確？","o":["乳酸（lactate）由肝臟運送到骨骼肌","葡萄糖由骨骼肌運送到肝臟","肝臟經過糖質新生（gluconeogenesis）產生葡萄糖","骨骼肌經過糖質新生（gluconeogenesis）產生乳酸"],"a":[2],"ch":["23"],"sec":"23.2","fbt":"Figure 23-17","ex":["方向相反：乳酸是由骨骼肌送往肝臟。","方向相反：葡萄糖是由肝臟送往骨骼肌。","Cori cycle 的核心就是肝臟把肌肉送來的乳酸經糖質新生做回葡萄糖，再送回肌肉使用；代價是肝臟耗 6 個 ATP 換肌肉得到 2 個，等於由肝臟代替肌肉承擔能量負擔。","骨骼肌缺乏 glucose 6-phosphatase 等酵素，不能進行糖質新生；它是把葡萄糖「糖解」成乳酸。"]},{"id":"M-111-1_93","t":"M","y":111,"q":"下列糖解作用（glycolysis）的步驟中，那一個酵素所催化的步驟在正常生理條件下為不可逆反應？","o":["enolase","phosphoglycerate kinase","pyruvate kinase","aldolase"],"a":[2],"ch":["14"],"sec":"14.1","fbt":"Figure 14-2"},{"id":"M-111-1_94","t":"M","y":111,"q":"雙醣分子（disaccharide）為兩個單醣分子（monosaccharide）依照特定的方式組合，經縮合反應除去一個水分子而形成。下列何者為麥芽糖（maltose）？","o":["Glcα(1→2)Fru","Galβ(1→4)Glc","Glcα(1→4)Glc","Glcα(1→1)Glc"],"a":[2],"ch":["7"],"sec":"7.1","fbt":"Figure 7-10; Figure 7-11"},{"id":"M-111-1_95","t":"M","y":111,"q":"葡萄糖進入細胞後，主要經由下列何種修飾將其留在細胞內進行代謝？","o":["glycosylation","phosphorylation","palmitoylation","acetylation"],"a":[1],"ch":["7"],"sec":"7.1","fbt":""},{"id":"M-111-1_96","t":"M","y":111,"q":"下列那一類生化反應主要不是在粒線體內進行？","o":["pyruvate oxidative decarboxylation","pentose phosphate pathway","oxidative phosphorylation","fatty acid β-oxidation"],"a":[1],"ch":["14","16","17","19"],"sec":"14.6 16.1 17.2 19.1","fbt":"Figure 19-2","ex":["丙酮酸的氧化脫羧由丙酮酸脫氫酶複合體在粒線體基質進行。","五碳糖磷酸路徑完全在「細胞質」進行，產生 NADPH 與 ribose 5-phosphate，不在粒線體。","氧化磷酸化在粒線體內膜進行。","脂肪酸 β 氧化主要在粒線體基質進行。"]},{"id":"M-111-1_97","t":"M","y":111,"q":"下列對於膽酸（bile acids）的敘述，何者錯誤？","o":["在小腸內脂肪的分解吸收過程中需要膽酸的幫助","膽酸可由肝細胞合成","促進水溶性維生素的吸收","膽固醇為合成膽酸的前驅物"],"a":[2],"ch":["17"],"sec":"17.1","fbt":"Figure 17-1","ex":["膽酸把脂肪乳化成微胞，大幅增加脂解酶的作用面積，敘述正確。","膽酸由肝細胞以膽固醇為原料合成，敘述正確。","膽酸促進的是「脂溶性」維生素（A、D、E、K）的吸收；水溶性維生素不需要膽酸，故此敘述錯誤。","膽固醇確實是膽酸的前驅物，敘述正確。"]},{"id":"M-111-1_98","t":"M","y":111,"q":"下列有關支鏈胺基酸（branched-chain amino acids, BCAAs）代謝，何者敘述錯誤？","o":["支鏈胺基酸包括白胺酸（leucine）、異白胺酸（isoleucine）與離胺酸（lysine）","肌肉組織中BCAA aminotransferase活性較肝臟組織高","楓糖尿症（maple syrup urine disease）導因於粒線體中branched-chain α-keto acid dehydrogenase complex功能 缺失","支鏈胺基酸代謝過程會產生NADH與FADH2"],"a":[0],"ch":["18"],"sec":"18.3","fbt":"Table 18-2","ex":["支鏈胺基酸是 leucine、isoleucine 與「valine」，不含離胺酸，故此敘述錯誤。","BCAA 主要在肌肉（而非肝臟）起始代謝，肌肉的 BCAA aminotransferase 活性確實較高，敘述正確。","楓糖尿症正是粒線體 branched-chain α-keto acid dehydrogenase 複合體缺損，支鏈酮酸堆積，敘述正確。","BCAA 分解途徑含多個脫氫步驟，產生 NADH 與 FADH2，敘述正確。"]},{"id":"M-111-1_99","t":"M","y":111,"q":"下列何者兼具必需胺基酸（essential amino acid）及生酮性胺基酸（ketogenic amino acid）特性？","o":["天門冬胺酸（aspartate）","組胺酸（histidine）","酪胺酸（tyrosine）","白胺酸（leucine）"],"a":[3],"ch":["18"],"sec":"18.3","fbt":"Table 18-1, Figure 18-15","ex":["天門冬胺酸是非必需且純生糖性。","組胺酸雖屬必需，但分解成 glutamate → α-KG，屬生糖性。","酪胺酸可由苯丙胺酸合成（非必需），雖兼具生糖與生酮，但不符合「必需」。","白胺酸既是必需胺基酸，又是純生酮性（只生成 acetyl-CoA 與 acetoacetate），兩個條件都符合。（另一個同時符合的是離胺酸，但不在選項中。）"]},{"id":"M-111-2_100","t":"M","y":111,"q":"下列何者為桑格定序法（Sanger sequencing method）的關鍵分子？","o":["1', 2'-雙脫氧核苷酸（1', 2'-dideoxyribonucleotides）","2', 3'-雙脫氧核苷酸（2', 3'-dideoxyribonucleotides）","2', 4'-雙脫氧核苷酸（2', 4'-dideoxyribonucleotides）","2', 5'-雙脫氧核苷酸（2', 5'-dideoxyribonucleotides）"],"a":[1],"ch":["8"],"sec":"8.3","fbt":"Figure 8-34","ex":["1′,2′-雙脫氧並不存在於定序試劑中；關鍵在 3′ 位。","2′,3′-dideoxynucleotide 少了 3′-OH，一旦接上就無法再形成下一個磷酸二酯鍵，因而隨機終止鏈的延長 —— 這就是 Sanger 定序的核心。","2′,4′-雙脫氧不是定序試劑。","2′,5′-雙脫氧不是定序試劑。"]},{"id":"M-111-2_74","t":"M","y":111,"q":"下列那一個胺基酸在中性環境下（pH=7），其支鏈（side-chain）會帶正電？","o":["丙胺酸（alanine）","精胺酸（arginine）","天門冬醯胺（asparagine）","天門冬胺酸（aspartic acid）"],"a":[1],"ch":["3"],"sec":"3.1","fbt":"Figure 3-5"},{"id":"M-111-2_75","t":"M","y":111,"q":"關於鐮形血球貧血症（sickle-cell disease）的敘述，下列何者正確？","o":["血紅素的β血球蛋白（β globin）基因點突變造成","患者體內缺少β血球蛋白造成（由γ血球蛋白取代）","血紅素缺少α血球蛋白造成","鐮形血球貧血症致死率高，在嬰兒期就會死亡"],"a":[0],"ch":["5"],"sec":"5.1","fbt":""},{"id":"M-111-2_76","t":"M","y":111,"q":"在一個符合Michaelis-Menten equation的酵素催化反應中，當受質（substrate）濃度極小於Michaelis常數（KM）時，此反應之速率常數應為下列何者？","o":["Vmax","kcat / KM","1 / kcat","kcat × KM"],"a":[1],"ch":["6"],"sec":"6.3","fbt":"Equation 6-9"},{"id":"M-111-2_77","t":"M","y":111,"q":"Pyridoxal phosphate與aspartate aminotransferase活性中心的某胺基酸形成Schiff base來催化oxaloacetate形成aspartate，此胺基酸是下列何者？","o":["lysine","cysteine","serine","arginine"],"a":[0],"ch":["18"],"sec":"18.1","fbt":"Figure 18-5","ex":["PLP 的醛基與活性中心離胺酸的 ε-胺基形成內部 Schiff base（internal aldimine）；受質進來時再換成 external aldimine，這是轉胺作用的起點。","半胱胺酸的硫醇基不與 PLP 形成 Schiff base。","絲胺酸的羥基不參與此結合。","精胺酸的胍基不參與此結合。"]},{"id":"M-111-2_78","t":"M","y":111,"q":"胺基酸的代謝需要有多重輔因子（cofactors）參與，下列那一種輔因子不能作為單一碳基團（one carbonmoiety）供給者或傳送者？","o":["tetrahydrofolate","biotin","S-adenosylmethionine","pyridoxal phosphate"],"a":[3],"ch":["18"],"sec":"18.1","fbt":"Figure 18-5","ex":["四氫葉酸是最典型的一碳單位攜帶者。","生物素攜帶的是 CO2（羧基），屬一碳基團的供給者。","S-adenosylmethionine 是甲基（一碳）的供給者。","磷酸吡哆醛攜帶的是「胺基」，不是一碳基團，故不能作為一碳單位的供給或傳送者。"]},{"id":"M-111-2_79","t":"M","y":111,"q":"去氧核糖核酸酶 I（deoxyribonuclease I, DNase I）為生物中重要的核酸內切酶（endonuclease），負責降解去氧核糖核酸。DNase I酵素活性主要作用於下列何者？","o":["糖苷鍵（glycosidic bond）","華森克里克鍵結（Watson-Crick base pairing）","磷酸二酯鍵（phosphodiester bond）","非華森克里克鍵結（non-Watson-Crick base pairing）"],"a":[2],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-111-2_80","t":"M","y":111,"q":"下列何種酵素與尿酸堆積及痛風發生最為相關？","o":["adenine phosphoribosyltransferase","5-phospho-α-D-ribosyl-1-pyrophosphate synthetase","glucose 6-phosphatase","orotate phosphoribosyltransferase"],"a":[1],"ch":["22"],"sec":"22.4","fbt":"","ex":["APRT 缺乏造成 2,8-dihydroxyadenine 結石，不是典型痛風。","PRPP synthetase 活性過高（superactivity）使 PRPP 大量累積，嘌呤 de novo 合成失控，尿酸堆積而痛風，是最直接相關者。","glucose 6-phosphatase 缺乏（von Gierke 病）也會造成高尿酸，但那是經由乳酸競爭排泄與 PPP 增強的「次發性」機制，不如 PRPP synthetase 直接。","orotate phosphoribosyltransferase 缺乏造成 orotic aciduria（嘧啶問題），與尿酸無關。"]},{"id":"M-111-2_81","t":"M","y":111,"q":"下列那一個蛋白質只會參與在真核細胞染色體DNA複製？","o":["引子RNA合成酶（primase）","解螺旋酶（helicase）","端粒酶（telomerase）","拓樸異構酶（topoisomerase）"],"a":[2],"ch":["24"],"sec":"24.1","fbt":"Figure 24-7","ex":["primase 在原核與真核都參與引子合成。","helicase 在原核與真核都負責解開雙股。","真核染色體是線狀的，末端因為最後一段引子移除後無法填補而逐次縮短；只有真核（特別是幹細胞、生殖細胞與癌細胞）才需要端粒酶這個自帶 RNA 模板的反轉錄酶來延長端粒。環狀的細菌染色體沒有這個問題。","topoisomerase 在原核與真核都存在。"]},{"id":"M-111-2_82","t":"M","y":111,"q":"真核細胞的DNA複製蛋白質PCNA（proliferating cell nuclear antigen）與大腸桿菌DNA聚合酶III的β次單元（βsubunit）共通的特性為：","o":["參與DNA校對（proofreading）","增加DNA聚合酶酵素活性","增加DNA聚合酶的持續合成能力（processivity）","帶有3’→5’ DNA水解酵素活性"],"a":[2],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-111-2_83","t":"M","y":111,"q":"下列何者為鹼基切除修復（base-excision repair）過程中的第一個作用酶？","o":["AP內切酶（AP endonuclease）","DNA醣苷酶（DNA glycosylase）","DNA連接酶（DNA ligase）","DNA聚合酶（DNA polymerase）"],"a":[1],"ch":["25"],"sec":"25.2","fbt":"Figure 25-23"},{"id":"M-111-2_84","t":"M","y":111,"q":"在真核細胞中，主要負責mRNA生成的聚合酶為：","o":["RNA聚合酶 I","RNA聚合酶 II","RNA聚合酶 III","RNA聚合酶 IV"],"a":[1],"ch":["26"],"sec":"26.1","fbt":"Table 26-1"},{"id":"M-111-2_85","t":"M","y":111,"q":"依賴泛素（ubiquitin）之蛋白質降解途徑，對於調節細胞過程和消除有缺陷的蛋白質非常重要。下列有關蛋白質泛素化（ubiquitination）之敘述，何者錯誤？","o":["泛素化過程中，泛素與E1活化酶（E1 activating enzyme）鍵結之反應需要ATP","E2結合酶（E2 conjugating enzyme）上的泛素可經由E3連接酶（E3 ligase）轉移至欲分解之蛋白質","蛋白質的lysine為發生泛素化的主要胺基酸","泛素化的蛋白質（ubiquitinated proteins）主要經溶酶體（lysosome）分解"],"a":[3],"ch":["27"],"sec":"27.3","fbt":"Figure 27-47"},{"id":"M-111-2_86","t":"M","y":111,"q":"蛋白質轉譯延伸（translation elongation）作用包含以下步驟：①帶有胺基酸的轉運核糖核酸（tRNA）結合至核糖體 ②形成胜肽鍵 ③轉位（translocation） ④轉運核糖核酸離開核糖體。下列先後順序何者最符合已知機制？","o":["①②③④","③①④②","③②①④","①③②④"],"a":[0],"ch":["27"],"sec":"27.2","fbt":"Figure 27-28; Figure 27-29;Figure 27-30"},{"id":"M-111-2_87","t":"M","y":111,"q":"下列何序列最可能含有真核細胞RNA polymerase II聚腺苷酸化訊號（polyadenylation signal）？","o":["5'-AUUCAUGUGCGGCGCGCCGCAGCUCCUAGCUUUUU-3'","5'-GUGCGGCGAUUCAUCGCCGCAGCUCCUAGCUUUUU-3'","5'-GUGCGGCGAUUCAUCGCCGCUUUUUAGCUCCUAGC-3'","5'-AAAAAUUUUUUAAUAAAAGGGGGGGGUUUUUUGG-3'"],"a":[3],"ch":["26"],"sec":"26.2","fbt":""},{"id":"M-111-2_88","t":"M","y":111,"q":"下列有關克氏循環（Krebs cycle，或稱TCA cycle）的敘述，何者正確？","o":["克氏循環過程中沒有substrate-level phosphorylation","一次完整的克氏循環會產生兩分子的CO2","一次完整的克氏循環會產生兩分子的NADH","一次完整的克氏循環會產生兩分子的FADH2"],"a":[1],"ch":["16"],"sec":"16.2","fbt":"Figure 16-7"},{"id":"M-111-2_89","t":"M","y":111,"q":"硫酸角質素（keratan sulfate）是角膜中的主要成分之一，其為下列那兩種單醣分子及其硫酸化衍生物的聚合物？","o":["galactose與glucose","galactose與N-acetylglucosamine","glucuronic acid與N-acetylglucosamine","glucuronic acid與glucose"],"a":[1],"ch":["7"],"sec":"7.2","fbt":"Figure 7-19"},{"id":"M-111-2_90","t":"M","y":111,"q":"細胞進行糖質新生（gluconeogenesis）時，需要下列那兩種酵素共同作用將pyruvate轉換為phosphoenolpyruvate？","o":["pyruvate kinase and pyruvate dehydrogenase","pyruvate carboxylase and pyruvate kinase","pyruvate carboxylase and phosphoenolpyruvate carboxykinase","pyruvate dehydrogenease and phosphoenolpyruvate carboxykinase"],"a":[2],"ch":["14"],"sec":"14.4","fbt":"Figure 14-16"},{"id":"M-111-2_91","t":"M","y":111,"q":"有關aspirin的作用，下列何者錯誤？","o":["抑制prostaglandin synthase活性","利用甲基化（methylation）調控酵素","降低血栓素（thromboxane A2）濃度","為一種非特異性的（non-selective）non-steroidal anti-inflammatory drugs（NSAIDs）"],"a":[1],"ch":["10","21"],"sec":"10.3 21.1","fbt":"Figure 21-15","ex":["aspirin 抑制 prostaglandin H2 synthase（COX），敘述正確。","aspirin 是把 COX 活性位通道中的 Ser530「乙醯化」而永久阻斷，不是甲基化，故此敘述錯誤。","抑制血小板 COX-1 使 TXA2 下降，這正是低劑量 aspirin 抗血栓的機制；血小板無細胞核無法再合成酵素，效果持續整個血小板壽命。","aspirin 同時抑制 COX-1 與 COX-2，屬非選擇性 NSAID，敘述正確。"]},{"id":"M-111-2_92","t":"M","y":111,"q":"Integral membrane protein主要由下列何者幫助其鑲嵌於膜上？","o":["translocon","signal peptidase","protein lipidation","protein glycosylation"],"a":[],"ch":["11"],"sec":"11.1","fbt":"","free":1,"ex":["translocon（Sec61 複合體）是內質網膜上的蛋白通道，新生鏈邊轉譯邊穿入，疏水的穿膜片段再由側門橫向釋放進入脂雙層 —— 生物學上這才是嵌入的機制。","signal peptidase 只負責切掉訊息胜肽，不負責把蛋白鑲進膜裡。","蛋白脂質化（如 GPI、myristoyl）是把本來不穿膜的蛋白「錨」在膜表面，不是 integral protein 穿膜的方式。","醣基化發生在膜外側的修飾，與嵌入無關。（本題官方公告送分，四個選項皆給分。）"]},{"id":"M-111-2_93","t":"M","y":111,"q":"下列何種脂肪酸在進行β-oxidation時，需要2,4-dienoyl-CoA reductase的參與？","o":["laurate","palmitoleate","oleate","linoleate"],"a":[3],"ch":["17"],"sec":"17.2","fbt":"Figure 17-11","ex":["laurate（12:0）是飽和脂肪酸，走標準 β 氧化即可。","palmitoleate（16:1 Δ9）雙鍵在奇數位，只需 enoyl-CoA isomerase 把順式雙鍵移位即可。","oleate（18:1 Δ9）同樣只需 isomerase。","linoleate（18:2 Δ9,12）有一個雙鍵會落在偶數位，形成 2,4-dienoyl 中間物，必須由 2,4-dienoyl-CoA reductase（耗 NADPH）先還原，再由 isomerase 移位才能繼續 —— 多元不飽和脂肪酸才需要這個酵素。"]},{"id":"M-111-2_94","t":"M","y":111,"q":"下列有關同半胱胺酸（homocysteine）之敘述，何者錯誤？","o":["是心血管疾病的危險因子","由精胺酸（arginine）轉換而來","若缺乏cystathionine-β-synthase，會導致同半胱胺酸尿症（homocysteinuria）","葉酸（folate）及維生素B12可作為同半胱胺酸代謝的輔酶"],"a":[1],"ch":["22"],"sec":"22.2","fbt":"Figure 22-15; Figure 22-16","ex":["高同半胱胺酸血症是動脈硬化與血栓的獨立危險因子，敘述正確。","同半胱胺酸來自「甲硫胺酸」：Met → SAM → SAH → homocysteine，不是由精胺酸轉換而來，故此敘述錯誤。","cystathionine-β-synthase 缺乏使 homocysteine 無法轉入 cysteine 而堆積，造成 homocystinuria，敘述正確。","葉酸（N5-methyl-THF）與維生素 B12 是 methionine synthase 把 homocysteine 甲基化回 methionine 所需，敘述正確。（另一條走 CBS 的路需 B6。）"]},{"id":"M-111-2_95","t":"M","y":111,"q":"在動物中，血基質（heme）生合成之主要前驅物之一是：","o":["色胺酸（tryptophan）","酪胺酸（tyrosine）","組胺酸（histidine）","甘胺酸（glycine）"],"a":[3],"ch":["22"],"sec":"22.3","fbt":"Figure 22-25; Figure 22-26","ex":["色胺酸走 serotonin／菸鹼酸，不是血基質前驅物。","酪胺酸走兒茶酚胺、甲狀腺素與黑色素。","組胺酸脫羧成組織胺。","血基質由 succinyl-CoA 與 glycine 縮合成 δ-ALA 開始，甘胺酸是兩大前驅物之一。"]},{"id":"M-111-2_96","t":"M","y":111,"q":"某新物種中粒線體的complex V，其F0之 c-ring由12個c subunit所組成，而F1 complex中的αβ dimer共有6組。依據目前已知complex V作用機轉，此物種的complex V每合成一個ATP最有可能需要幾個氫離子通過粒線體內膜（inner membrane）？","o":["2","3","4","6"],"a":[0],"ch":["19"],"sec":"19.2","fbt":"Figure 19-26; 19-28"},{"id":"M-111-2_97","t":"M","y":111,"q":"在細胞凋亡程序中的caspases為一種cysteine protease，其切割受質蛋白的位點位於下列何種胺基酸的C端？","o":["絲胺酸（serine）","胱胺酸（cysteine）","天門冬胺酸（aspartic acid）","酪胺酸（tyrosine）"],"a":[2],"ch":["12"],"sec":"19.4","fbt":"","ex":["serine 是 chymotrypsin 等 serine protease 的催化殘基，不是 amoxifen（一種激素拮抗劑）來做為輔助治療。下列有關此藥劑之敘述，何者正確？","o":["tamoxifen是一種男性激素的專一拮抗劑（antagonist）","對雌激素受體呈陰性的乳癌患者效果較好","必須經由癌細胞表面之受器（receptor）進入細胞","進入細胞後，與雌激素受器結合，影響雌激素調控之基因表達"],"a":[3],"ch":["12"],"sec":"12.7","fbt":"","ex":["tamoxifen 是雌激素受體的拮抗劑，與男性激素無關。","要 ER 陽性的乳癌才有效；ER 陰性者無效。","類固醇類與其拮抗劑親脂性高，直接穿膜進入細胞，不需細胞表面受體運送。","進入細胞後與雌激素受體結合，阻斷雌激素調控基因的表達。"]},{"id":"M-110-1_99","t":"M","y":110,"q":"下列那一個載體最有可能用於人類疾病之基因治療（gene therapy）？","o":["酵母菌（yeast）","人造細菌染色體（bacterial artificial chromosome）","腺病毒（adenovirus）","噬菌體（bacteriophage）"],"a":[2],"ch":["9"],"sec":"9.1","fbt":"","ex":["酵母菌是表現宿主或 YAC 的載體系統，不用於人體基因治療。","BAC 是實驗室中選殖大片段 DNA 的載體，無法把基因送進人體細胞。","腺病毒感染效率高、可感染不分裂的細胞、不整合進基因體（安全性較高但表現為暫時性），是人類基因治療最常用的載體之一（腺相關病毒 AAV 與反轉錄病毒也常用）。","噬菌體只感染細菌，不感染人類細胞。"]},{"id":"M-110-2_100","t":"M","y":110,"q":"第二型限制酶（type II restriction enzymes）通常能辨認DNA序列的大小為何？","o":["4～6個鹼基對（base pairs）","10～12個鹼基對（base pairs）","15～20個鹼基對（base pairs）","20～30個鹼基對（base pairs）"],"a":[0],"ch":["9"],"sec":"9.1","fbt":"","ex":["第二型限制酶的辨識序列通常是 4～6 個鹼基對的迴文（少數到 8 bp）。切點越短的酶切得越碎：4 bp 平均每 256 bp 切一次，6 bp 平均每 4096 bp 切一次。","10～12 bp 太長，不符一般第二型限制酶。","15～20 bp 是歸巢內切酶或人工核酸酶（如 ZFN、CRISPR）的辨識長度。","20～30 bp 遠超過限制酶的辨識範圍。"]},{"id":"M-110-2_74","t":"M","y":110,"q":"氧氣和肌紅蛋白（myoglobin）結合時，蛋白質上的何種胺基酸會和此氧分子形成氫鍵，使氧分子結合更為穩定？","o":["serine","histidine","proline","tyrosine"],"a":[1],"ch":["5"],"sec":"5.1","fbt":"Figure 5-5"},{"id":"M-110-2_75","t":"M","y":110,"q":"下列何者數值越大，表示酵素之催化效率越佳？","o":["1 /kcat","KM","kcat / KM","KM / kcat"],"a":[2],"ch":["6"],"sec":"6.3","fbt":""},{"id":"M-110-2_76","t":"M","y":110,"q":"下列關於酵素的敘述，何者錯誤？","o":["酵素可降低化學反應物及產物之間的自由能差異","大多數酵素會與反應過渡態（transition state）緊密結合","大多數酵素催化反應有立體化學專一性（stereospecificity）","酵素可縮短反應達到化學平衡所需的時間"],"a":[0],"ch":["6"],"sec":"6.2","fbt":"Figure 6-3"},{"id":"M-110-2_77","t":"M","y":110,"q":"缺乏phenylalanine hydroxylase會造成苯丙酮尿症。phenylalanine hydroxylase催化由phenylalanine生成tyrosine，下列何種輔酶為反應所必需？","o":["tetrahydrobiopterin","biotin","thiamine pyrophosphate","pyridoxal phosphate"],"a":[0],"ch":["18"],"sec":"18.3","fbt":"Figure 18-24","ex":["phenylalanine hydroxylase 屬芳香族胺基酸羥化酶，需要四氫生物蝶呤（BH4）提供電子；BH4 再生障礙也會造成非典型 PKU。","生物素負責羧化反應，與羥化無關。","TPP 負責脫羧反應。","PLP 負責轉胺與脫羧，不是此羥化反應的輔酶。"]},{"id":"M-110-2_78","t":"M","y":110,"q":"下列何種輔酶（coenzyme）於羧化反應（carboxylation）中用以攜帶CO2？","o":["biotin","NAD+","FAD","thiamine pyrophosphate"],"a":[0],"ch":["14","16"],"sec":"14.4、16.4","fbt":"Figure 14-17、Figure 16-16"},{"id":"M-110-2_79","t":"M","y":110,"q":"下列何者屬於迴文序列（palindromic sequence）？","o":["AGGTCCTCCAGG","CCTTCCGGAAGG","GAATCCCTTAGG","GGATCCCCTAGG"],"a":[1],"ch":["8"],"sec":"8.2","fbt":"Figure 8-19","ex":["AGGTCCTCCAGG 的反向互補是 CCTGGAGGACCT，與原序列不同。","CCTTCCGGAAGG 的反向互補仍是 CCTTCCGGAAGG，兩股讀起來一樣，是迴文序列。","GAATCCCTTAGG 的反向互補是 CCTAAGGGATTC，不是迴文。","GGATCCCCTAGG 的反向互補是 CCTAGGGGATCC，與原序列不同（雖然裡面含有 GGATCC 這個 BamHI 位點，但整段不是迴文）。"]},{"id":"M-110-2_80","t":"M","y":110,"q":"下列關於Lesch-Nyhan syndrome的敘述，何者錯誤？","o":["先天缺乏hypoxanthine-guanine phosphoribosyltransferase而導致","無法藉由新合成路徑（de novo pathway）合成鳥糞嘌呤（guanine）","X染色體相關之遺傳性疾病","嚴重者會累積過多的尿酸，造成組織的破壞"],"a":[1],"ch":["22"],"sec":"22.4","fbt":"","ex":["Lesch-Nyhan 正是先天缺乏 HGPRT，敘述正確。","缺的是「回收」路徑；de novo 路徑不但正常，還因 PRPP 無處消耗而累積、反而加速，所以鳥糞嘌呤仍能從頭合成，故此敘述錯誤。","HPRT1 基因位於 X 染色體，屬 X 性聯遺傳，敘述正確。","嘌呤回收失敗使尿酸大量堆積，造成痛風、腎結石與自殘行為，敘述正確。"]},{"id":"M-110-2_81","t":"M","y":110,"q":"大腸桿菌裡染色體DNA複製最主要的聚合酶為：","o":["DNA聚合酶 I","DNA聚合酶 II","DNA聚合酶 III","DNA聚合酶 IV"],"a":[2],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-110-2_82","t":"M","y":110,"q":"大腸桿菌進行同源性重組（homologous recombination）時，下列何種蛋白質會包覆於此過程中產生之單股DNA上，形成螺旋的細絲（helical filaments）結構？","o":["DNA polymerase","RuvC","RecA","RecBCD"],"a":[2],"ch":["25"],"sec":"25.3","fbt":"Figure 25-31"},{"id":"M-110-2_83","t":"M","y":110,"q":"UvrABC核酸內切酶（UvrABC excinuclease）參與下列何種DNA修復機制？","o":["直接修復機制（direct repair）","重組修復（recombination repair）","鹼基錯誤配對修復（mismatch repair）","核苷酸切除修復（nucleotide excision repair）"],"a":[3],"ch":["25"],"sec":"25.2","fbt":"Figure 25-25"},{"id":"M-110-2_84","t":"M","y":110,"q":"下列何者對真核細胞中的蛋白質轉譯起始（translation initiation）最不重要？","o":["5' 端帽結構（5' cap structure）","內部核糖體進入位點（internal ribosome entry site）","轉譯起始因子eIF2的參與","夏因–達爾加諾序列（Shine-Dalgarno sequence）"],"a":[3],"ch":["27"],"sec":"27.2","fbt":"Figure 27-26"},{"id":"M-110-2_85","t":"M","y":110,"q":"下列何種物質不會抑制蛋白質的生合成？","o":["氯黴素（chloramphenicol）","戊二醯亞胺環己酮（cycloheximide）","青黴素（penicillin）","嘌呤黴素（puromycin）"],"a":[2],"ch":["27"],"sec":"27.2","fbt":"Figure 27-38"},{"id":"M-110-2_86","t":"M","y":110,"q":"有關拓樸異構酶（topoisomerase）功能的敘述，下列何者正確？","o":["打開DNA，並催化磷酸雙酯鍵的斷裂與接合，以紓緩DNA纏繞的壓力","結合並保護染色體尾端DNA，使其不易被水解","修飾組蛋白（histone），以穩定染色體之結構","幫助致癌基因之轉譯後修飾"],"a":[0],"ch":["24"],"sec":"24.2","fbt":"Figure 24-18、Figure 24-19","ex":["拓樸異構酶暫時切斷一股（Type I）或兩股（Type II）的磷酸二酯鍵，讓 DNA 旋轉或穿越後再接回，以紓解複製叉前方累積的正超螺旋張力；喜樹鹼抑制 Top I、依托泊苷與氟喹諾酮抑制 Top II／旋轉酶，都是這個機制的藥物應用。","結合並保護染色體末端的是端粒結合蛋白（shelterin 複合體）。","修飾組織蛋白的是乙醯轉移酶、甲基轉移酶等。","它不參與致癌基因的轉譯後修飾。"]},{"id":"M-110-2_87","t":"M","y":110,"q":"有關核糖體（ribosomes）的描述，下列何者最適當？","o":["只有大次單元（large subunit）含有rRNA分子","rRNA只扮演核糖體結構的角色","大次單元是由多個大小不一的rRNAs和蛋白質所構成","核糖體中胜肽轉移酶（peptidyl transferase）的催化作用由蛋白質執行"],"a":[2],"ch":["27"],"sec":"27.2","fbt":""},{"id":"M-110-2_88","t":"M","y":110,"q":"Pyruvate dehydrogenase（PDH）催化pyruvate轉化為acetyl-CoA的過程中會依序釋放出：","o":["acetyl-CoA, CO2, NADH","acetyl-CoA, CO2, FADH2","CO2, FADH2, acetyl-CoA","CO2, acetyl-CoA, NADH"],"a":[3],"ch":["16"],"sec":"16.1","fbt":"Figure 16-6"},{"id":"M-110-2_89","t":"M","y":110,"q":"Amylopectin是葡萄糖單體以何種方式聚合而成的多醣？","o":["α-D-glucose通過1→4鍵結所形成之長直鏈","β-D-glucose通過1→4鍵結所形成之長直鏈","α-D-glucose通過1→4鍵結所形成之長直鏈，並以1→6鍵結方式形成支鏈","β-D-glucose通過1→4鍵結所形成之長直鏈，並以1→6鍵結方式形成支鏈"],"a":[2],"ch":["7"],"sec":"7.3","fbt":"Table 7-2"},{"id":"M-110-2_90","t":"M","y":110,"q":"在細胞中，下列那種化合物無法直接用以合成ATP？","o":["1,3-bisphosphoglycerate","3-phosphoglycerate","phosphocreatine","phosphoenolpyruvate"],"a":[1],"ch":["13"],"sec":"13.3","fbt":"Table 13-6、Figure 13-19"},{"id":"M-110-2_91","t":"M","y":110,"q":"以抑制肺部小氣道收縮為治療氣喘的策略時，下列何者最適合作為發展抑制氣喘藥物的標的？","o":["COX-1/COX-2","leukotriene receptor","PGH2","phospholipase A2"],"a":[1],"ch":["10"],"sec":"10.3","fbt":"Fig 10-17","ex":["抑制 COX 會把花生四烯酸推向 lipoxygenase 而增加白三烯，部分病人因此出現 aspirin 誘發型氣喘，反而不利。","氣喘支氣管收縮的主力是 cysteinyl leukotriene（LTC4／D4／E4），阻斷其受體（montelukast、zafirlukast）正是臨床上的氣喘用藥。","PGH2 是 COX 路徑的短命中間物，不是可行的藥物標的。","抑制 PLA2 會同時關掉所有 eicosanoid（類固醇即間接如此作用），專一性差、副作用大，不是最適合的「標的」。"]},{"id":"M-110-2_92","t":"M","y":110,"q":"細胞膜上脂膜筏（lipid rafts）的主要組成，不包含下列何者？","o":["cholesterol","sphingolipids","GPI-anchored proteins","methylated proteins"],"a":[3],"ch":["11"],"sec":"11.2","fbt":"Figure 11-22","ex":["膽固醇填塞在鞘脂長而飽和的鏈之間，是脂筏的核心成分。","鞘脂（sphingomyelin、醣鞘脂）是脂筏的骨幹。","GPI 錨定蛋白富集於脂筏外層，是典型的脂筏標誌。","蛋白質甲基化是細胞內的修飾（如組織蛋白），與脂筏組成無關，故不包含。"]},{"id":"M-110-2_93","t":"M","y":110,"q":"下列何者與細胞調節飽和脂肪酸氧化反應（β-oxidation）的關聯性最低？","o":["acetyl-CoA濃度","cyclic AMP濃度","malonyl-CoA濃度","NADPH濃度"],"a":[3],"ch":["17"],"sec":"17.2","fbt":"Figure 17-13","ex":["acetyl-CoA 累積會回饋抑制 thiolase，直接調節 β 氧化。","cAMP 經 PKA 活化脂解，決定送進來的脂肪酸量，關聯密切。","malonyl-CoA 抑制 CPT I，是阻止脂肪酸進入粒線體的關鍵開關。","NADPH 是脂肪酸「合成」與還原性生合成的還原力（β 氧化產生的是 NADH 與 FADH2），與 β 氧化的調節關聯最低。"]},{"id":"M-110-2_94","t":"M","y":110,"q":"有關蛋白質迴轉（protein turnover）的敘述，下列何者錯誤？","o":["泛素（ubiquitin）結合至待分解蛋白質的精胺酸（arginine）殘基上","自噬作用（autophagy）可經由溶小體（lysosome）內的蛋白分解酶作用使蛋白質重新利用","細菌為了適應環境生存而進行孢子形成（sporulation）作用，此過程涉及蛋白質迴轉","泛素化（ubiquitination）需要ATP的參與"],"a":[0],"ch":["27"],"sec":"27.3","fbt":"Figure 27-47"},{"id":"M-110-2_95","t":"M","y":110,"q":"酪胺酸（tyrosine）與苯丙胺酸（phenylalanine）在體內皆可經由酵素催化形成反丁烯二酸（fumarate）或乙醯乙酸（acetoacetate），這兩種胺基酸具有下列何種特性？","o":["絕對葡萄糖生成性（glucogenic）","絕對生酮性（ketogenic）","兼具葡萄糖生成性（glucogenic）與生酮性（ketogenic）","不具生酮性（ketogenic）"],"a":[2],"ch":["18"],"sec":"18.3","fbt":"Figure 18-15","ex":["產物中有 acetoacetate，所以不是「絕對」生糖性。","產物中有 fumarate 可進 TCA 做糖質新生，所以不是「絕對」生酮性。","Phe 與 Tyr 分解同時產生 fumarate（生糖）與 acetoacetate（生酮），因此兼具兩種性質。","產物有 acetoacetate，具生酮性。"]},{"id":"M-110-2_96","t":"M","y":110,"q":"在棕色脂肪細胞（brown adipose tissue）中，uncoupling protein 1（UCP1）大量表現會造成電子傳遞鏈與ATP合成的耦合（coupling）被破壞，並藉此產生熱。UCP1的主要作用是：","o":["使氫離子回到粒線體基質（matrix）","阻擋氫離子轉移到粒線體內外膜間隙（intermembrane space）","藉由異位連結（allosteric binding）直接抑制NADH dehydrogenase的活性","藉由異位連結（allosteric binding）直接抑制ATP synthase的活性"],"a":[0],"ch":["19"],"sec":"19.4","fbt":"Figure 19-36"},{"id":"M-110-2_97","t":"M","y":110,"q":"在粒線體參與的細胞凋亡中，下列那一個蛋白質由粒線體釋放至細胞質並參與凋亡複合體（apoptosome）的形成？","o":["cytochrome a","cytochrome c","Apaf-1","caspase-8"],"a":[1],"ch":["19"],"sec":"19.4","fbt":"Figure19-39"},{"id":"M-110-2_98","t":"M","y":110,"q":"1977年諾貝爾獎得主Rosalyn Yalow的獲獎貢獻是開發radioimmunoassay（RIA）方法來偵測下列何類賀爾蒙？","o":["steroid hormones","peptide hormones","eicosanoid hormones","retinoid hormones"],"a":[1],"ch":["23"],"sec":"23.1","fbt":"","ex":["類固醇荷爾蒙並非 RIA 最初開發的對象。","Yalow 與 Berson 開發 RIA 是為了測量血中極微量的「胰島素」，從而證明第二型糖尿病患者的胰島素並不低 —— 這是胜肽類荷爾蒙，RIA 也因此成為內分泌學的革命性工具。","eicosanoid 半衰期極短，不是 RIA 的開發對象。","retinoid 不是 RIA 的開發對象。"]},{"id":"M-110-2_99","t":"M","y":110,"q":"下列何者不是細胞內主要之二級訊息傳遞者（second messenger）？","o":["cAMP","Ca2+","inositol 1,4,5-triphosphate","17 β-estradiol"],"a":[3],"ch":["12"],"sec":"12.2","fbt":"","ex":["cAMP 是最典型的二級訊息傳遞者。","Ca2+ 是典型的二級訊息傳遞者。","IP3 是二級訊息，開啟 ER 上的 IP3 受體釋出鈣。","17β-estradiol 是荷爾蒙本身（一級訊息），作用於核內受體，不是二級訊息。"]},{"id":"M-109-1_100","t":"M","y":109,"q":"下列何者不是type II限制酶的辨認序列？","o":["5'-GAATTC-3'","5'-CATTAG-3'","5'-CATATG-3'","5'-CAATTG-3'"],"a":[1],"ch":["9"],"sec":"","fbt":"","ex":["5′-GAATTC-3′ 是迴文，正是 EcoRI 的辨識序列。","5′-CATTAG-3′ 的反向互補是 CTAATG，與原序列不同，不是迴文，因此不會是第二型限制酶的辨識序列。","5′-CATATG-3′ 是迴文（NdeI 位點）。","5′-CAATTG-3′ 是迴文（MfeI 位點）。"]},{"id":"M-109-1_74","t":"M","y":109,"q":"下列那一種胜肽能吸收 280 nm波長的 光？","o":["丙胺酸-離胺酸-組織胺酸（Ala-Lys-His）","丙胺酸-丙胺酸-色胺酸（Ala-Ala-Trp）","絲胺酸-甘胺酸-天門冬醯胺（Ser-Gly-Asn）","纈胺酸-脯胺酸-白胺酸（Val-Pro-Leu）"],"a":[1],"ch":["3"],"sec":"","fbt":"Figure 3-6"},{"id":"M-109-1_75","t":"M","y":109,"q":"酶具有高效率的化學反應催化作用（catalysis），原因為何？","o":["可抑制酶促反應（enzymatic catalytic reaction）的逆反應","可增加催化反應的平衡常數（equilibrium constant）","可降低化學反應的活化能（activation energy, ΔG‡）","可增加化學反應的活化能（activation energy, ΔG‡）"],"a":[2],"ch":["6"],"sec":"","fbt":""},{"id":"M-109-1_76","t":"M","y":109,"q":"依照 Enzyme Commission（EC）建議之酵素命名原則，催化下述反應「glucose + ATP → glucose-6-phosphate + ADP」的酵素應歸屬於下列何種酵素類別？","o":["hydrolase","ligase","oxidoreductase","transferase"],"a":[3],"ch":["6"],"sec":"6.1","fbt":"Figure 6-3"},{"id":"M-109-1_77","t":"M","y":109,"q":"下列關於維生素E（vitamin E）的敘述，何者正確？","o":["維生素E為單碳代謝（one-carbon metabolism）反應中重要的輔酶","維生素E為醌（quinone）的衍生物","食物中維生素E的成分含有tocopherols與tocotrienols","人體在接受陽光照射後，可自行合成維生素E"],"a":[2],"ch":["10"],"sec":"","fbt":"","ex":["單碳代謝的輔酶是四氫葉酸，不是維生素 E。","醌的衍生物是維生素 K（萘醌）。","維生素 E 泛指一群結構相近的分子，包含四種 tocopherol 與四種 tocotrienol，其中 α-tocopherol 活性最高；它是膜上的脂溶性抗氧化劑，阻斷多元不飽和脂肪酸的自由基連鎖反應。","照射陽光後自行合成的是維生素 D。"]},{"id":"M-109-1_78","t":"M","y":109,"q":"人體中biotin缺乏時，下列那個生化反應會受影響而無法進行？","o":["轉氨基反應（transamination）","磷酸化反應（phosphorylation）","羧化反應（carboxylation）","甲基化反應（methylation）"],"a":[2],"ch":["16"],"sec":"","fbt":""},{"id":"M-109-1_79","t":"M","y":109,"q":"雙股DNA melting temperature之定義，是多少百分比的DNA分子產生變性（denaturation）時的溫度？","o":["25%","50%","75%","100%"],"a":[1],"ch":["8"],"sec":"8.3","fbt":"","ex":["25% 不是 Tm 的定義。","Tm（melting temperature）定義為半數（50%）DNA 分子解鏈成單股時的溫度，也就是吸光度升幅達一半的溫度。GC 含量越高、鹽濃度越高，Tm 越高。","75% 不是 Tm 的定義。","100% 變性的溫度不是 Tm。"]},{"id":"M-109-1_80","t":"M","y":109,"q":"下列何者是華生與克理克（Watson-Crick）DNA結構模型的正確描述？","o":["磷酸基團（phosphate groups）位於雙股螺旋的內部","DNA雙股螺旋中兩股平行（parallel）且方向（5'→3'）相同","DNA雙股螺旋中兩股間的距離足夠容納兩個嘌呤（purines）或兩個嘧啶（pyrimidines）","同股內相鄰兩個核苷酸鹼基的距離為3.4 Å"],"a":[3],"ch":["8"],"sec":"8.2","fbt":"","ex":["磷酸與糖骨架在螺旋「外側」（親水），鹼基才在內側。","兩股是「反平行」（antiparallel），一股 5′→3′，另一股 3′→5′。","螺旋內徑固定約 20 Å，只能容納一個嘌呤配一個嘧啶；兩個嘌呤太寬、兩個嘧啶太窄。","B 型 DNA 中相鄰鹼基對沿軸的間距為 3.4 Å，每圈約 10.5 bp（約 34 Å），是正確描述。"]},{"id":"M-109-1_81","t":"M","y":109,"q":"下列何者具有5'端至3'端的核酸外切酶（exonuclease）活性？","o":["primase","DNA聚合酶Ⅰ型（DNA polymeraseⅠ）","DNA聚合酶Ⅲ型（DNA polymeraseⅢ）","DNA促旋酶（DNA gyrase）"],"a":[1],"ch":["25"],"sec":"","fbt":""},{"id":"M-109-1_82","t":"M","y":109,"q":"在DNA複製中，下列何酵素功能主要是用以增加DNA複製之準確度？","o":["單股DNA結合蛋白","3'→5'外切核酸酶","DNA連接酶","DNA解螺旋酶"],"a":[1],"ch":["25"],"sec":"","fbt":""},{"id":"M-109-1_83","t":"M","y":109,"q":"大部分的真核細胞含40～50種不同的tRNAs，下列何者是這些tRNA之共同序列？","o":["3'端含-CCA-3'OH","3'端含-AAC-3'OH","5'端含-CCAp-5'","5'端含-AACp-5'"],"a":[0],"ch":["26","27"],"sec":"26.2","fbt":"Figure 26-26"},{"id":"M-109-1_84","t":"M","y":109,"q":"關於真核細胞蛋白質合成的啟始階段（initiation stage），下列敘述何者錯誤？","o":["需要mRNA、核糖體（ribosome）與aminoacyl-tRNA的參與","mRNA必須具有5'端帽結構（5'cap structure）或internal ribosome entry site（IRES）才能參與啟始作用","核糖體的大與小兩個次單元（large and small subunits）必須形成完整的核糖體（ribosome）才能與mRNA結合Met","啟始階段需要的aminoacyl-tRNA是Met-tRNAi"],"a":[2],"ch":["27"],"sec":"","fbt":""},{"id":"M-109-1_85","t":"M","y":109,"q":"同質異化基因（homeotic genes）在果蠅胚胎發育期（developmental stages）主要扮演何種角色？","o":["基因在產卵期時開始作轉錄表現，其mRNA在卵中呈休眠狀態直到受精後才被啟動","在胚胎發育後期表現，決定每一體節的詳細結構","決定翅膀的基因總稱","決定眼睛顏色的基因總稱"],"a":[1],"ch":["28"],"sec":"","fbt":""},{"id":"M-109-1_86","t":"M","y":109,"q":"下列何者負責DNA結合蛋白形成二聚體（protein dimers）的主要基序（motif）？","o":["β-barrel","homeodomain","leucine zipper","zinc finger"],"a":[2],"ch":["28"],"sec":"","fbt":""},{"id":"M-109-1_87","t":"M","y":109,"q":"那兩個克氏循環（TCA cycle）的中間產物皆可直接經由一次轉胺反應（transamination）合成胺基酸？","o":["草醯乙酸（oxaloacetate）與α-酮基戊二酸（α-ketoglutarate）","檸檬酸（citrate）與琥珀酸（succinate）","琥珀酸（succinate）與蘋果酸（malate）","α-酮基戊二酸（α-ketoglutarate）與異檸檬酸（isocitrate）"],"a":[0],"ch":["16"],"sec":"","fbt":""},{"id":"M-109-1_88","t":"M","y":109,"q":"下列那種酶所催化之反應不產生二氧化碳？","o":["異檸檬酸脫氫酶（isocitrate dehydrogenase）","3-磷酸甘油醛脫氫酶（glyceraldehyde-3-phosphate dehydrogenase）","α-酮戊二酸脫氫酶（α-ketoglutarate dehydrogenase）","丙酮酸脫氫酶（pyruvate dehydrogenase）"],"a":[1],"ch":["16"],"sec":"","fbt":""},{"id":"M-109-1_89","t":"M","y":109,"q":"細胞在無氧狀態下（anaerobic condition）進行葡萄糖糖解作用（glycolysis）時，下列相關敘述何者正確？","o":["可進行完整的糖解作用，產生兩分子乳酸（lactate）","僅能生成NADH，但不會產生ATP","能同時生成ATP及NADH","無法進行糖解作用"],"a":[0],"ch":["14"],"sec":"","fbt":""},{"id":"M-109-1_90","t":"M","y":109,"q":"下列何種物質可直接經由cyclooxygenase的作用，產生前列凝素（thromboxanes）？","o":["乙醯輔酶A（acetyl-CoA）","棕櫚酸（palmitate）","硬脂酸（stearate）","花生四烯酸（arachidonate）"],"a":[3],"ch":["21"],"sec":"","fbt":"Figure 21-15","ex":["乙醯輔酶 A 是脂肪酸合成的原料，不是 COX 的受質。","棕櫚酸是飽和的 16 碳脂肪酸，不能被 COX 作用。","硬脂酸是飽和的 18 碳脂肪酸，同樣不是 COX 的受質。","花生四烯酸（20:4）由膜磷脂經 phospholipase A2 釋出後，才能被 cyclooxygenase 轉成 PGH2，再分支生成前列腺素與血栓素。"]},{"id":"M-109-1_91","t":"M","y":109,"q":"關於鈉-鉀離子唧筒（Na+-K+pump）的機制，下列敘述何者錯誤？","o":["每運送三莫耳（moles）鈉離子至細胞外需水解一莫耳ATP","與鈉離子結合後會導致鈉-鉀離子唧筒的磷酸化","Cardiotonic steroid，如洋地黃（digitalis）會結合並抑制心臟細胞之鈉-鉀離子唧筒的功能","磷酸化的鈉-鉀離子唧筒對鉀離子的親和力低於對鈉離子的親和力"],"a":[3],"ch":["11"],"sec":"","fbt":"","ex":["每水解 1 個 ATP 送出 3 個 Na+、送入 2 個 K+，敘述正確。","細胞內側的 Na+ 結合後，ATP 把天門冬胺酸殘基磷酸化（形成 E1-P），敘述正確。","毛地黃等強心苷結合在細胞外側抑制此幫浦，使細胞內 Na+ 上升、Na+/Ca2+ 交換減弱、細胞內 Ca2+ 增加而增強心肌收縮力，敘述正確。","磷酸化後酵素轉為 E2 構型，此時對 K+ 的親和力「高」於 Na+（才能在細胞外抓住 K+），說低於是顛倒的，故此敘述錯誤。"]},{"id":"M-109-1_92","t":"M","y":109,"q":"下列何者為肝臟粒線體內的HMG-CoA synthase的主要功能？","o":["促進膽固醇合成（cholesterol biosynthesis）","抑制脂肪酸合成（fatty acid biosynthesis）","促進酮體合成（ketone body biosynthesis）","促進糖質新生（gluconeogenesis）"],"a":[2],"ch":["21"],"sec":"","fbt":"","ex":["促進膽固醇合成的是「細胞質型」HMG-CoA synthase 那一條路（接著由 HMG-CoA reductase 作用）。","HMG-CoA synthase 不直接抑制脂肪酸合成。","粒線體型 HMG-CoA synthase 把 acetoacetyl-CoA 與 acetyl-CoA 縮合成 HMG-CoA，再裂解成 acetoacetate —— 這是肝臟酮體生成的限速步驟。同一個中間物 HMG-CoA，在粒線體走酮體、在細胞質走膽固醇，是本章常考的對照。","與糖質新生無關。"]},{"id":"M-109-1_93","t":"M","y":109,"q":"下列何者不是血基質（heme）生合成的前驅物或中間產物？","o":["glycine","succinyl-CoA","δ-aminolevulinate","bilirubin"],"a":[3],"ch":["22"],"sec":"22.3","fbt":"Figure 22-25","ex":["甘胺酸是 δ-ALA 的兩大前驅物之一。","succinyl-CoA 是另一個前驅物，由 TCA 循環提供。","δ-aminolevulinate 是合成路徑的第一個中間產物。","膽紅素是血基質「降解」的產物（heme → biliverdin → bilirubin），不是合成的前驅物或中間產物。"]},{"id":"M-109-1_94","t":"M","y":109,"q":"GOT和GPT指數是一般肝功能的指標，此兩種酵素具有那一類酵素活性？","o":["kinase","decarboxylase","transaminase","methyltransferase"],"a":[2],"ch":["18"],"sec":"18.2","fbt":"Box 18-1","ex":["GOT／GPT 不是激酶。","GOT／GPT 不是脫羧酶。","GOT（AST）催化 aspartate + α-KG ⇌ oxaloacetate + glutamate，GPT（ALT）催化 alanine + α-KG ⇌ pyruvate + glutamate，兩者都是轉胺酶；肝細胞受損時漏到血中而升高。","GOT／GPT 不是甲基轉移酶。"]},{"id":"M-109-1_95","t":"M","y":109,"q":"人類細胞之氧化磷酸化反應（oxidative phosphorylation）中，參與電子傳遞鏈（electron transport chain）與ATP合成的酵素位於何處？","o":["電子傳遞鏈位於粒線體外膜；ATP合成的酵素位於粒線體內膜","電子傳遞鏈位於粒線體內膜；ATP合成的酵素位於粒線體外膜","皆位於粒線體外膜","皆位於粒線體內膜"],"a":[3],"ch":["19"],"sec":"19.2","fbt":"Figure 19-19"},{"id":"M-109-1_96","t":"M","y":109,"q":"下列何者為粒線體電子傳遞鏈Complex II的electron donor？","o":["NADH","succinate","NADPH","ubiquinone"],"a":[1],"ch":["19"],"sec":"19.1","fbt":"Figure 19-9"},{"id":"M-109-1_97","t":"M","y":109,"q":"免疫細胞分泌tumor necrosis factor（TNF），造成標的細胞的凋亡（apoptosis），下列何者是其正確的作用？","o":["TNF無特異性受器，但TNF可結合Fas 受器而引起細胞凋亡","TNF活化caspase 8，分解cytochrome c引起細胞凋亡","破壞參與DNA合成的酵素","造成粒線體cytochrome c釋出，引發細胞蛋白質及DNA的破壞"],"a":[3],"ch":["12"],"sec":"12.11","fbt":"Figure 12-40","ex":["TNF 有專一受體 TNFR1／TNFR2；Fas 的配體是 FasL，不是 TNF。","caspase-8 切割的是 Bid 等受質；cytochrome c 不是被分解，而是被釋出。","細胞凋亡不是靠破壞 DNA 合成酵素達成。","TNF → caspase-8 → Bid → 粒線體釋出 cytochrome c → apoptosome → caspase-9／3，造成蛋白質與 DNA 降解。"]},{"id":"M-109-1_98","t":"M","y":109,"q":"下列關於guanylyl cyclase的敘述，何者正確？","o":["guanylyl cyclase主要功能是使cyclic GMP（cGMP）轉變為5'-GMP","guanylyl cyclase是細胞膜上的受體（receptor），皆為穿透性蛋白質（integral protein）","guanylin可結合在小腸上之guanylyl cyclase receptor，進而調控小腸內Cl-離子分泌","用來治療陽痿之藍色藥丸Viagra其主要藥物作用是促進cyclic GMP（cGMP）的產生"],"a":[2],"ch":["12"],"sec":"12.5","fbt":"Figure 12-23","ex":["guanylyl cyclase 是把 GTP 變成 cGMP；水解 cGMP 成 5′-GMP 的是 phosphodiesterase。","guanylyl cyclase 分膜結合受體型與細胞質可溶型兩類，不是「皆為」穿膜蛋白。","guanylin 結合腸道膜型 guanylyl cyclase 受體，升高 cGMP 進而調節 Cl− 分泌；霍亂毒素與大腸桿菌耐熱腸毒素也作用於這條軸。","Viagra 抑制 PDE5，是減少 cGMP 的「分解」而維持其濃度，不是促進其產生。"]},{"id":"M-109-1_99","t":"M","y":109,"q":"下列關於胜肽類 （peptide） 荷爾蒙和類固醇類 （steroid） 荷爾蒙的比較，何者錯誤？","o":["前者的受體在細胞膜上，而後者在細胞內","在血液中前者有攜帶蛋白（carrier protein），後者沒有攜帶蛋白","前者如副甲狀腺荷爾蒙（parathyroid hormone）和細胞膜上受體結合後可產生cAMP","後者和受體結合後會和DNA結合"],"a":[1],"ch":["23"],"sec":"23.1","fbt":"Figure 23-3","ex":["胜肽類親水、受體在細胞膜；類固醇親脂、受體在細胞內，敘述正確。","顛倒了：類固醇因不溶於水，在血中「需要」攜帶蛋白（CBG、SHBG、白蛋白）；胜肽類親水，多以游離形式運送，故此敘述錯誤。","副甲狀腺素作用於 GPCR，經 Gs 產生 cAMP，敘述正確。","類固醇-受體複合體進核後結合荷爾蒙反應元件而調控轉錄，敘述正確。"]},{"id":"M-109-2_100","t":"M","y":109,"q":"將重組DNA進行基因定點突變（site-directed mutagenesis）之過程，不需要下列何者？","o":["反轉錄酶（reverse transcriptase）","DNA聚合酶（DNA polymerase）","deoxyribonucleoside triphosphate","突變的引子（mutated primers）"],"a":[0],"ch":["9"],"sec":"9.1","fbt":"Figure 9-10","ex":["定點突變是直接以「DNA」質體為模板進行 PCR，不涉及 RNA，所以不需要反轉錄酶。","需要 DNA 聚合酶（常用高保真的 Pfu）複製整個質體。","需要 dNTP 作為合成新股的原料。","需要帶有目標突變的引子，突變就是靠它引入的。"]},{"id":"M-109-2_74","t":"M","y":109,"q":"血紅素S（Hemoglobin S）是由於其中的胺基酸Glu被置換成Val，致使血紅素S有聚集（aggregation）的現象，其原因為何？","o":["血紅素S間形成共價鍵（covalent bond）","血紅素S間形成雙硫鍵（disulfide bond）","血紅素S間的疏水性交互作用（hydrophobic interactions）增加","血紅素S間的離子交互作用（ionic interactions）增加"],"a":[2],"ch":["5"],"sec":"5.1","fbt":""},{"id":"M-109-2_75","t":"M","y":109,"q":"配體（Ligand）與蛋白質之同向異位性作用（homotropic allosteric interaction）的定義為何？","o":["一分子的配體與蛋白質上的結合位點（binding site）結合後，會影響第二個相同的配體分子結合到同一位點上","一分子的配體與蛋白質上的結合位點（binding site）結合後，會影響該蛋白質其他配體結合位點與配體的結合能力","二個不同的配體能與同一個蛋白質結合位點（binding site）結合","配體與蛋白質結合位點（binding site）結合後，不會造成該蛋白質其他部分的結構變化（conformational change）"],"a":[1],"ch":["6"],"sec":"6.5","fbt":""},{"id":"M-109-2_76","t":"M","y":109,"q":"一合乎Michaelis-Menten動力學之酵素，若其反應的初速度（initial reaction rate）為0.8 Vmax時，受質的濃度應為：","o":["2 Km","3 Km","4 Km","5 Km"],"a":[2],"ch":["6"],"sec":"6.3","fbt":""},{"id":"M-109-2_77","t":"M","y":109,"q":"輔酶thiamine pyrophosphate（TPP）在參與丙酮酸脫羧酶（pyruvate decarboxylase）催化反應時，負責轉移下列何種基團？","o":["methyl group","acyl group","aldehyde group","carboxyl group"],"a":[2],"ch":["16"],"sec":"16.1","fbt":"Figure 16-6"},{"id":"M-109-2_78","t":"M","y":109,"q":"下列何種生物能自行合成cobalamin（vitamin B12）？","o":["脊椎動物","昆蟲","微生物","植物"],"a":[2],"ch":["17"],"sec":"17.2","fbt":"Box 17-2","ex":["脊椎動物無法合成 B12，必須由飲食（動物性食品）攝取。","昆蟲不能合成 B12。","只有細菌與古菌能從頭合成鈷胺素；動物體內的 B12 最終都源自微生物（反芻動物靠瘤胃菌，人類靠飲食）。這也是純素食者容易缺乏的原因。","植物不含也不合成 B12。"]},{"id":"M-109-2_79","t":"M","y":109,"q":"下列何種反應是一種deamination的作用？","o":["胞嘧啶（cytosine）變成次黃嘌呤（hypoxanthine）","5'-甲基胞嘧啶（5'-methylcytosine）變成胸腺嘧啶（thymine）","腺嘌呤（adenine）變成黃嘌呤（xanthine）","鳥糞嘌呤（guanine）變成尿嘧啶（uracil）"],"a":[1],"ch":["8"],"sec":"8.3","fbt":"Figure 8-29","ex":["胞嘧啶脫胺後變成尿嘧啶，不是次黃嘌呤；變成次黃嘌呤的是腺嘌呤。","5-甲基胞嘧啶脫胺後變成胸腺嘧啶 —— 因為產物是 DNA 的正常鹼基，修復系統難以辨認，所以 CpG 位點是人類基因組的突變熱點。","腺嘌呤脫胺後變成次黃嘌呤，不是黃嘌呤。","鳥糞嘌呤脫胺後變成黃嘌呤，不是尿嘧啶。"]},{"id":"M-109-2_80","t":"M","y":109,"q":"DNA-DNA，DNA-RNA，RNA-RNA所形成的雜交配對，在中性pH下，三者間的相對穩定度為何？","o":["DNA-DNA>RNA-RNA>DNA-RNA","RNA-DNA>RNA-RNA>DNA-DNA","RNA-RNA>DNA-DNA>DNA-RNA","RNA-RNA>DNA-RNA>DNA-DNA"],"a":[3],"ch":["8"],"sec":"8.3","fbt":"","ex":["DNA-DNA 其實是三者中最不穩定的。","順序不對：RNA-RNA 最穩定。","DNA-RNA 不是最不穩定的那一個。","中性 pH 下穩定度為 RNA-RNA > RNA-DNA > DNA-DNA。原因是 RNA 的 2′-OH 與 A 型螺旋構型提供額外的氫鍵與較佳的鹼基堆疊。"]},{"id":"M-109-2_81","t":"M","y":109,"q":"下列有關Klenow fragment的敘述，何者錯誤？","o":["具有DNA polymerase活性","具有3'→5'exonuclease活性","屬於DNA polymerase I的片段","具有topoisomerase活性"],"a":[3],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-109-2_82","t":"M","y":109,"q":"下列何種反應參與大腸桿菌複製叉（replication forks）中的DNA合成反應？","o":["DNA解旋酶（helicase）具內切酶活性，切割DNA","引子合成酶（primase）合成RNA引子","DNA拓樸異構酶I（topoisomerase I）具外切酶活性，切割DNA","DNA聚合酶II（DNA polymerase II）合成DNA"],"a":[1],"ch":["25"],"sec":"25.1","fbt":"Figure 25-12"},{"id":"M-109-2_83","t":"M","y":109,"q":"胺醯-tRNA合成酶（aminoacyl-tRNA synthetase）的功能為何？","o":["能使 tRNA和相對應的胺基酸進行酯化作用（esterification）","能與特定的蛋白質結合後，間接促進tRNA與胺基酸進行酯化作用（esterification）","存在於核糖體（ribosome）中，促進胜肽鍵（peptide bond）的合成","需要GTP的作用才能活化胺基酸"],"a":[0],"ch":["27"],"sec":"27.2","fbt":"Figure 27-19"},{"id":"M-109-2_84","t":"M","y":109,"q":"下列何者是原核細胞蛋白質合成之延伸期（elongation）的最佳敘述？","o":["每一胜肽鍵的合成只需消耗二個高能磷酸組（high-energy phosphoryl groups）","胺醯-tRNA（aminoacyl-tRNA）首先進入核糖體的P位（P site）","EF-Tu延伸因子（elongation factor EF-Tu）是有利於蛋白質合成時核糖體的移位作用（translocation）","肽基轉移酶（peptidyl-transferase）是一種ribozyme"],"a":[3],"ch":["27"],"sec":"27.2","fbt":""},{"id":"M-109-2_85","t":"M","y":109,"q":"在人體內，下列何者之生合成並非由tyrosine代謝而形成？","o":["S-adenosylmethionine","epinephrine","melanin","dopamine"],"a":[0],"ch":["18"],"sec":"18.3","fbt":"","ex":["S-adenosylmethionine 由「甲硫胺酸」與 ATP 合成，與酪胺酸無關。","腎上腺素由酪胺酸 → DOPA → dopamine → norepinephrine → epinephrine。","黑色素由酪胺酸經 tyrosinase 合成。","多巴胺由酪胺酸經 tyrosine hydroxylase 與脫羧酶合成。"]},{"id":"M-109-2_86","t":"M","y":109,"q":"蛋白質的降解可經由ubiquitin-proteasome的路徑，下列何者是催化將ubiquitin直接結合至待降解之蛋白質上的主要酵素？","o":["E1","E2","E3","E4"],"a":[2],"ch":["27"],"sec":"27.3","fbt":"Figure 27-49"},{"id":"M-109-2_87","t":"M","y":109,"q":"下列有關葡萄糖氧化的五碳糖磷酸途徑（pentose phosphate pathway）功能之敘述，何者正確？","o":["負責催化每莫耳葡萄糖產生36莫耳ATP","負責催化每莫耳葡萄糖產生5莫耳CO2","供應合成核苷酸（nucleotide）所需要之核糖（ribose）的來源","主要功能是產生NADH及FADH2進入呼吸鏈氧化產生能量"],"a":[2],"ch":["14"],"sec":"14.5","fbt":"Figure 14-21"},{"id":"M-109-2_88","t":"M","y":109,"q":"下列那一種黏多醣類（mucopolysaccharide）含有alpha 1→4糖苷鍵（glycosidic bond），臨床上用來當抗凝血劑（anticoagulant）？","o":["chondroitin sulfate A","heparin","hyaluronic acid","dermatan sulfate"],"a":[1],"ch":["7"],"sec":"7.2","fbt":"Figure 7-22"},{"id":"M-109-2_89","t":"M","y":109,"q":"經由糖解作用（glycolysis）產生的丙酮酸（pyruvate）必須直接先被轉換為下列何種分子，才能繼續以克式循環（Krebs cycle，亦稱citric acid cycle或TCA cycle）進行氧化？","o":["lactic acid","acetyl-CoA","S-adenosylmethionine","phosphoenolpyruvate"],"a":[1],"ch":["16"],"sec":"16.1","fbt":"Figure 16-1"},{"id":"M-109-2_90","t":"M","y":109,"q":"下列何者並非膽固醇（cholesterol）生合成之前驅物？","o":["乙酸（acetate）","異戊二烯（isoprene）","二氫鞘氨醇（sphinganine）","鯊烯（squalene）"],"a":[2],"ch":["21"],"sec":"21.4","fbt":"Figure 21-33","ex":["乙酸經活化成 acetyl-CoA，是膽固醇所有碳原子的來源。","異戊二烯（五碳單元）是膽固醇合成中段的基本建材。","二氫鞘氨醇是鞘脂（sphingolipid）的骨架，由 palmitoyl-CoA 與 serine 縮合而來，與膽固醇合成無關。","鯊烯是 30 碳的直鏈中間物，環化後即成固醇骨架。"]},{"id":"M-109-2_91","t":"M","y":109,"q":"Carnitine palmitoyl transferases（CPTs）的損壞最可能會導致下列何種物質無法直接進入粒線體中？","o":["NADH","succinyl CoA","triacylglycerol","long-chain fatty acids"],"a":[3],"ch":["17"],"sec":"17.2","fbt":"Figure 17-6","ex":["NADH 本身不穿越內膜，但靠的是甘油磷酸或蘋果酸穿梭，與 CPT 無關。","succinyl-CoA 在粒線體內生成，不需要 CPT 運入。","三酸甘油酯要先水解成脂肪酸才能利用，本來就不會整個運進粒線體。","長鏈脂肪酸必須先活化成 acyl-CoA，再由 CPT I 轉成 acylcarnitine 穿過內膜、由 CPT II 轉回 acyl-CoA；CPT 損壞時長鏈脂肪酸卡在細胞質，造成運動不耐、肌紅蛋白尿與低酮性低血糖。（中短鏈脂肪酸可自行擴散進入，不受影響。）"]},{"id":"M-109-2_92","t":"M","y":109,"q":"關於acetyl-CoA carboxylase在脂肪生成（lipogenesis）中的敘述，下列何者錯誤？","o":["催化反應的產物之一為malonyl-CoA","反應過程需直接消耗NADH","催化的化學反應為脂肪酸合成的速率限制步驟","肌肉中AMP上升時，經由活化AMPK，進而抑制acetyl-CoA carboxylase的酵素活性"],"a":[1],"ch":["17","21"],"sec":"17.2、21.1","fbt":"Figure 17-13、Figure 21-1","ex":["ACC 催化 acetyl-CoA + HCO3− → malonyl-CoA，敘述正確。","ACC 是生物素依賴的羧化酶，消耗的是 ATP 與 HCO3−，不直接用 NADH（NADPH 是後續 fatty acid synthase 才用），故此敘述錯誤。","ACC 催化的正是脂肪酸合成的速率限制步驟，敘述正確。","AMP 上升活化 AMPK，磷酸化並抑制 ACC，敘述正確。"]},{"id":"M-109-2_93","t":"M","y":109,"q":"Aspartate-argininosuccinate shunt是代謝胺基酸之重要途徑，其與下列那兩種代謝環之連結有關？","o":["citric acid cycle和urea cycle","urea cycle和Cori cycle","citric acid cycle和glyoxylate cycle","glucose-alanine cycle和urea cycle"],"a":[0],"ch":["18"],"sec":"18.2","fbt":"Figure 18-12","ex":["尿素循環產生的 fumarate 進入 TCA 循環變成 malate、oxaloacetate，再轉胺回 aspartate 供下一輪尿素循環使用 —— 這條 aspartate-argininosuccinate 捷徑把兩個循環接在一起。","Cori cycle 運送的是乳酸與葡萄糖，不參與此捷徑。","乙醛酸循環只存在於植物與微生物，人體沒有。","glucose-alanine cycle 運的是丙胺酸與葡萄糖，不是此捷徑的組成。"]},{"id":"M-109-2_94","t":"M","y":109,"q":"下列那個胺基酸的代謝異常是最常導致白化症（albinism）的原因？","o":["離胺酸（lysine）","精胺酸（arginine）","色胺酸（tryptophan）","酪胺酸（tyrosine）"],"a":[3],"ch":["18"],"sec":"18.3","fbt":"Table 18-2","ex":["離胺酸的代謝異常造成的是其他有機酸血症，與色素無關。","精胺酸異常影響尿素循環。","色胺酸異常影響血清素與菸鹼酸。","黑色素由酪胺酸經 tyrosinase 合成；tyrosinase 缺乏或酪胺酸代謝異常造成白化症。"]},{"id":"M-109-2_95","t":"M","y":109,"q":"下列那一種克式循環（Krebs cycle，亦稱citric acid cycle或TCA cycle）的中間產物可以不經由NADH的產生，而將其電子直接傳遞給電子傳遞鏈中的複合體II（complex II）進行氧化？","o":["succinate","citrate","α-ketoglutarate","malate"],"a":[0],"ch":["19"],"sec":"19.1","fbt":""},{"id":"M-109-2_96","t":"M","y":109,"q":"粒線體電子傳遞鏈的Complex III主要是把電子傳遞到：","o":["cytochrome c","succinate","NADH","ubiquinone"],"a":[0],"ch":["19"],"sec":"19.1","fbt":""},{"id":"M-109-2_97","t":"M","y":109,"q":"在phosphatidylinositol 3-kinase（PI-3K）訊息傳遞路徑中，下列何者可經由與PIP3（3,4,5-phosphatidylinositoltrisphosphate）的結合而被活化？","o":["cGMP","protein kinase B","protein kinase G","calmodulin kinase"],"a":[1],"ch":["15"],"sec":"15.5","fbt":"Figure 15-41"},{"id":"M-109-2_98","t":"M","y":109,"q":"肌肉細胞的細胞質中，關於鈣離子的敘述下列何者錯誤？","o":["細胞內大部分的鈣離子皆與蛋白質結合","鈣離子濃度在細胞內質網內高於在細胞外液","鈣離子透過與攜鈣素（calmodulin）結合進而調節多重細胞功能","鈣離子為次級訊息傳遞者（secondary messenger），其與二醯基甘油（diacylglycerol）對protein kinase C活性的調節作用是相反的"],"a":[3],"ch":["12"],"sec":"12.2","fbt":"Figure 12-11","ex":["細胞質游離鈣極低（約 100 nM），細胞內大部分鈣與蛋白質結合或儲存於胞器。","內質網／肌漿網管腔是高鈣區，講義認定其濃度高於細胞外液。","鈣與 calmodulin 結合後調節 CaM kinase 等多重功能。","Ca2+ 與 DAG 對 PKC 是協同活化（兩者都把 PKC 拉到膜上並活化），不是相反作用，故此敘述錯誤。"]},{"id":"M-109-2_99","t":"M","y":109,"q":"下列那一個激素無法促進脂肪細胞（adipocyte）內脂肪的代謝以產生ATP？","o":["insulin","glucagon","epinephrine","glucocorticoids"],"a":[0],"ch":["17"],"sec":"17.1","fbt":"","ex":["胰島素代表飽食狀態，會促使 hormone-sensitive lipase 去磷酸化而失活，是「抑制」脂解的荷爾蒙，無法促進脂肪分解產能。","升糖素經 cAMP-PKA 活化 HSL，促進脂解。","腎上腺素經 β 受體活化 cAMP-PKA，促進脂解。","糖皮質素增加脂解相關酵素的表現，促進脂肪動員。"]},{"id":"M-108-1_100","t":"M","y":108,"q":"下列何者是實驗室中⽤來將質體（plasmid）直接轉形（transformation）進入細菌的最常⽤的⽅法？","o":["低電壓電泳法（low-voltage electrophoresis）將質體牽引入細菌中","帶有質體的噬菌體轉染法（transfection）","微注射法（micro-injection）將質體注入細菌中","CaCl2處理細菌後再以熱休克法（heat shock）將質體送入細菌中"],"a":[3],"ch":["9"],"sec":"9.1","fbt":"","ex":["電泳用於分離核酸，不是把質體送進細菌的常規方法（電穿孔 electroporation 才是，但那是高壓短脈衝而非低電壓電泳）。","噬菌體轉染是另一條路（transduction／packaging），不是質體轉形的最常用法。","微注射用於卵細胞或大型細胞，細菌太小不適用。","以冰冷 CaCl2 處理使細菌成為勝任細胞（competent cell），再以 42℃ 短暫熱休克讓質體進入，是實驗室最常用的化學轉形法。"]},{"id":"M-108-1_74","t":"M","y":108,"q":"某多胜肽（polypeptide）在其等電點pH（isolelectric pH）的溶液中，該多胜肽的電荷為何？","o":["胺基（amino）和羧基（carboxyl）末端（termini）皆帶正電荷","胺基和羧基末端皆不帶電荷","淨電荷為零","帶有四個淨電荷"],"a":[2],"ch":["3"],"sec":"","fbt":""},{"id":"M-108-1_75","t":"M","y":108,"q":"下列那⼀種⽣化實驗技術無法直接應⽤於蛋⽩質⾝分鑑定？","o":["⻄⽅墨點法（Western blot analysis）","質譜法（mass spectrometry）","分⼦篩管柱層析法（size-exclusion chromatography）","胺基端序列分析（N-terminal sequencing）"],"a":[2],"ch":["3"],"sec":"","fbt":""},{"id":"M-108-1_76","t":"M","y":108,"q":"下列A到D蛋⽩質的混合物，在適當的條件下，以凝膠過濾⾊層分析法（gel filtration chromatography）分離時，第⼆順位沖提出來的蛋⽩質為何？","o":["細胞⾊素c（cytochrome c）Mr=13,000","免疫球蛋⽩G（immunoglobulin G）Mr=145,000","核醣核酸酶A（ribonuclease A）Mr=13,700","核醣核酸聚合酶（RNA polymerase）Mr=450,000"],"a":[1],"ch":["3"],"sec":"","fbt":""},{"id":"M-108-1_77","t":"M","y":108,"q":"下列那⼀種維⽣素的化學結構含有鈷離⼦（cobalt ion）？","o":["vitamin K","vitamin E","vitamin B6","vitamin B12"],"a":[3],"ch":["10"],"sec":"","fbt":"","ex":["維生素 K 是萘醌衍生物，不含金屬。","維生素 E 是生育醇，不含金屬。","維生素 B6（磷酸吡哆醛）不含金屬。","維生素 B12（鈷胺素）的咕啉環中心配位一個鈷離子，是人體唯一含金屬的維生素。"]},{"id":"M-108-1_78","t":"M","y":108,"q":"維⽣素A（vitamin A）會與細胞中下列那⼀類蛋⽩質直接結合，以調控基因表達？","o":["calcitriol receptor","receptor tyrosine kinases","nuclear retinoid receptors","G protein-coupled receptors"],"a":[2],"ch":["12"],"sec":"","fbt":"","ex":["calcitriol receptor 是維生素 D 的核內受體。","RTK 是生長因子受體，不結合維生素 A。","維生素 A 衍生的 retinoic acid 結合核內 RAR／RXR 受體，直接調控基因轉錄。","GPCR 不是 retinoid 的受體。"]},{"id":"M-108-1_79","t":"M","y":108,"q":"霍亂弧菌（Vibrio cholerae）會產出霍亂毒素（cholera toxin），催化Gsα（即stimulatory G蛋⽩α次單元）之","o":["細胞中Gsα無法活化下游效應物（effectors）","細胞中Gsα與Gs蛋⽩βγ次單元的重新結合（re-association）受到抑制","細胞中adenylyl cyclase持續活化","細胞中cAMP增加"],"a":[0],"ch":["12"],"sec":"","fbt":"Box 12-1","ex":["方向相反：ADP-ribosylation 後 Gsα 是持續活化而非失去活化下游的能力。","Gsα 鎖在 GTP 型確實無法與 βγ 重新結合，但這只是鎖定狀態的描述，不是題目要的直接效應。","霍亂毒素使 Gsα 的 Arg 被 ADP-ribosylation，抑制其 GTP 水解活性，Gsα-GTP 持續結合並活化 adenylyl cyclase —— 這是毒素的直接作用結果。","cAMP 上升是 adenylyl cyclase 持續活化的下游後果（再使 CFTR 開啟、Cl− 與水大量分泌而水瀉），屬更下游的敘述。（註：此題題幹在原始題庫中被截斷，B／C／D 的區辨以「直接效應」為準。）"]},{"id":"M-108-1_80","t":"M","y":108,"q":"下列有關酵素異常的敘述，何者最可能導致痛風（gout）的發⽣？","o":["缺乏citrate synthase","5-phosphoribosyl-1-pyrophosphate synthetase活性降低","hypoxanthine-guanine phosphoribosyltransferase活性降低","glucose 6-phosphatase表現量上升"],"a":[2],"ch":["22"],"sec":"","fbt":"Figure 22-50","ex":["citrate synthase 屬 TCA 循環，與尿酸無關。","PRPP synthetase 活性「降低」會減少嘌呤合成；要活性升高才造成尿酸過多，方向相反。","HGPRT 活性降低使嘌呤無法回收、PRPP 累積，de novo 合成加速，嘌呤分解成尿酸而痛風（部分缺損為 Kelley-Seegmiller 症候群，完全缺損為 Lesch-Nyhan）。","glucose 6-phosphatase「缺乏」（von Gierke 病）才會伴隨高尿酸；表現量上升不會。"]},{"id":"M-108-1_81","t":"M","y":108,"q":"在⼤腸桿菌中，下列何者為Dam甲基化酶（Dam methylase）所扮演的功能？","o":["甲基化尿嘧啶（uracil），使之轉化為胸腺嘧啶（thymine）","對DNA模板股（template strand）的修飾，以便DNA修復系統的辨認","
