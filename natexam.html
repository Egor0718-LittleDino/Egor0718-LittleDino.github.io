正確？","o":["同源染色體(homologous chromosome)聯會(synapsis)可發生於減數分裂及有絲分裂(mitosis)時","同源染色體聯會之後會發生同源片段的遺傳物質互換(crossing over)","性染色體(sex chromosome)X 和 Y 由於大小相差太大，無法發生如體染色體(autosome)一樣的同源染色體聯會","第一次減數分裂(meiosis I)是著絲粒(centromere)分離，同源染色體並不分離"],"a":[1],"ch":["25"],"sec":"25.3","fbt":""},{"id":"M-98-2_28","t":"M","y":98,"q":"在新生兒病房，有一位 1 天大的小男嬰常常都在睡眠狀態，進食欠佳且出現嘔吐，抽血結果發現血液中氨(ammonia)濃度異常的高。下列相關敘述何者正確？","o":["氨是糖類的代謝物","人體細胞可以利用氨來做為胺基酸的合成","尿素循環(urea cycle)方面的疾病可引起血液中氨升高","由於人體有血腦障壁(blood-brain barrier)，所以氨不會進入腦部"],"a":[1,2],"ch":["18","22"],"sec":"18.2 22.1","fbt":"Figure 22-1","ex":["氨主要來自胺基酸／蛋白質的脫胺代謝，不是糖類的代謝物。","人體可經 glutamate dehydrogenase 與 glutamine synthetase 把氨併入有機分子，再轉胺成各種胺基酸，敘述正確。","尿素循環任一酵素缺損（如 OTC 缺乏）都會使氨無法轉成尿素而堆積，新生兒高血氨最常見的先天原因，敘述正確。","氨（尤其是非離子型 NH3）可通過血腦障壁，正是造成嗜睡、嘔吐、腦水腫與昏迷的原因，故此敘述錯誤。"]},{"id":"M-98-2_29","t":"M","y":98,"q":"下列那一個胺基酸可以降解成 fumarate？","o":["Phenylalanine","Alanine","Cysteine","Serine"],"a":[0,1,2,3],"ch":["18"],"sec":"18.3","fbt":"Figure 18-15","free":1,"ex":["苯丙胺酸分解確實同時產生 fumarate 與 acetoacetate，是唯一直接降解成 fumarate 的選項。","丙胺酸轉胺成丙酮酸，不直接生成 fumarate（丙酮酸要先羧化成 oxaloacetate 才間接繞到 fumarate）。","半胱胺酸分解成丙酮酸，同樣不直接生成 fumarate。","絲胺酸脫胺成丙酮酸，同樣不直接生成 fumarate。本題嚴格說只有 A 正確，但因 B／C／D 的產物丙酮酸可經 oxaloacetate 間接到 fumarate，官方公告四個選項都給分。"]},{"id":"M-98-2_30","t":"M","y":98,"q":"粒線體氧化磷酸化的過程所產生的·O2-自由基，可由下列那一個酵素去除？","o":["NADH dehydrogenase","Glutathione peroxidase","Glutathione reductase","Superoxide dismutase"],"a":[3],"ch":["19"],"sec":"19.1","fbt":"Figure 19-18"},{"id":"M-98-2_31","t":"M","y":98,"q":"動物呼吸氧(O2)進入細胞進行氧化磷酸化，O2最終會轉變為何種物質？","o":["H3PO4","CO2","CO","H2O"],"a":[3],"ch":["19"],"sec":"19.1","fbt":"Table 19-2"},{"id":"M-98-2_32","t":"M","y":98,"q":"有關甘油-3-磷酸穿梭路徑(glycerol 3-phosphate shuttle)之敘述，下列何者正確？","o":["此穿梭路徑將細胞質的 NADH 穿過粒線體內膜運送至間質(matrix)而得到 3ATP / NADH","此穿梭路徑可將細胞質的NADH轉換為NAD+，同時在粒線體生成FADH2","此穿梭路徑不需要粒線體甘油-3-磷酸脫氫酶(mitochondrial glycerol 3-phosphate dehydrogenase)的參與","此穿梭路徑需要蘋果酸脫氫酶(malate dehydrogenase)的參與"],"a":[1],"ch":["19"],"sec":"19.2","fbt":"Figure 19-32"},{"id":"M-98-2_36","t":"M","y":98,"q":"下列那一項是 DNA 和 RNA 共同的特性？","o":["皆為雙股 α 螺旋鏈","合成過程都具有相同校正機制避免錯誤","皆含有磷酸根、醣及鹼基","在五碳糖的第二個位置都是-OH 基"],"a":[2],"ch":["8"],"sec":"8.1","fbt":"Figure 8-4","ex":["DNA 是雙股螺旋（而且是 β 構型的右旋，不是「α 螺旋」—— 那是蛋白質的用語）；RNA 多為單股。","DNA 聚合酶有 3′→5′ 校對活性，RNA 聚合酶的校對能力差很多，兩者並不相同。","核苷酸的三個組成就是磷酸根、五碳醣與含氮鹼基，這是兩者共同的基本結構。","只有 RNA 的 2′ 位是 -OH；DNA 的 2′ 位是 -H，這正是兩者的根本差異。"]},{"id":"M-98-2_37","t":"M","y":98,"q":"下列關於真核生物 RNA 的敘述，何者錯誤？","o":["5'-cap 可保護 mRNA 的端點，增加其穩定性","rRNA 及 tRNA 均無 5'-cap","mRNA 之 3' poly(A)序列是依循模板(template)DNA 上 poly(T)而來","histone 的 mRNA 沒有 3' poly(A)序列"],"a":[2],"ch":["26"],"sec":"26.2","fbt":""},{"id":"M-98-2_38","t":"M","y":98,"q":"下列有關著色性乾皮症(xeroderma pigmentosum)的敘述，何者錯誤？","o":["是一種遺傳性疾病","病患對紫外光(ultraviolet)敏感，容易產生皮膚癌","部分病患伴隨神經異常(neurological abnormalities)","因為缺乏鹼基切除修復(base excision-repair)功能"],"a":[3],"ch":["25"],"sec":"25.2","fbt":"Box 25-1"},{"id":"M-98-2_39","t":"M","y":98,"q":"岡崎氏片段(Okazaki fragments)會在下列何種生物過程中出現？","o":["轉錄作用(transcription)","轉譯作用(translation)","DNA 重組(DNA recombination)","DNA 複製(DNA replication)"],"a":[3],"ch":["25"],"sec":"25.1","fbt":"Figure 25-4"},{"id":"M-98-2_40","t":"M","y":98,"q":"下列何種酵素不會參與 DNA 複製(DNA replication)？","o":["DNA 拓樸異構酶(DNA topoisomerase)","解螺旋酶(helicase)","單股 DNA 鍵結蛋白(single-stranded DNA binding protein)","依賴 DNA 的 RNA 聚合酶(DNA-dependent RNA polymerase)"],"a":[3],"ch":["25","26"],"sec":"25.1 26.1","fbt":""},{"id":"M-98-2_41","t":"M","y":98,"q":"癌症腫瘤細胞傾向進行無氧呼吸，下列關於無氧呼吸 glucose 代謝的敘述，何者錯誤？","o":["產生 ATP 較少","產生 lactate 較多","產生 acetyl-CoA 較多","Krebs cycle 參與的程度較低"],"a":[2],"ch":["14"],"sec":"14.1","fbt":"Box 14-1"},{"id":"M-98-2_42","t":"M","y":98,"q":"臨床上我們可以將患者 DNA 經過亞硫酸氫鈉(sodium bisulfite)處理過後，使未被甲基化的細胞嘧啶(cytosine)轉變成尿素嘧啶(uracil)，經由 PCR 放大特定基因之序列，再藉由兩股的解離溫度不同而判別其甲基化的程度。如圖卡-098-2-2-01中何者甲基化程度較高？","o":["A 股 Melting Peaks","B 股","A 股和 B 股的甲基化程度一樣高","資料不足，無法判讀"],"a":[1],"ch":["8"],"sec":"8.3","fbt":"Figure 8-27","ex":["（本題需搭配原卷的融解曲線圖，題庫的文字檔沒有附圖。）判讀原則：亞硫酸氫鈉只把「未甲基化」的 C 轉成 U（PCR 後變 T），甲基化的 C 不受影響而保留下來，GC 含量較高、Tm 較高。所以融解峰出現在較高溫者甲基化程度較高。","官方答案為 B 股，表示圖上 B 股的融解峰位在較高溫側，代表其甲基化程度較高。","兩股的融解峰若真的一樣高溫才會選此項，與官方答案不符。","圖上有可分辨的融解峰位差異，並非資料不足。"]},{"id":"M-98-2_43","t":"M","y":98,"q":"下列那種酵素活性高低會影響 NADPH 的形成以及 glutathione 的還原狀態？","o":["Glucose 6-phosphate dehydrogenase","Pyruvate dehydrogenase","Lactate dehydrogenase","Alcohol dehydrogenase"],"a":[0],"ch":["14"],"sec":"14.5","fbt":"Box 14-4"},{"id":"M-98-2_44","t":"M","y":98,"q":"調控紅血球與O2親合力的重要因子為 2,3-bisphosphoglycerate，它由下列那種代謝作用所提供？","o":["酮體生成作用(ketogenesis)","糖解作用(glycolysis)","葡萄糖新生作用(gluconeogenesis)","五碳糖磷酸途徑(pentose phosphate pathway)"],"a":[1],"ch":["5","14"],"sec":"5.1 14.1","fbt":""},{"id":"M-98-2_45","t":"M","y":98,"q":"下列何者是 DNA 片段 5’-ATTGCAG-3’ 的互補核酸股？","o":["5’-CUGCAAU-3’","5’-TAACGTC-3’","5’-ATTCGTC-3’","5’-ATTGCAG-3’"],"a":[0],"ch":["8"],"sec":"8.2","fbt":"","ex":["5′-ATTGCAG-3′ 逐位互補得 TAACGTC，反向讀出為 5′-CTGCAAT-3′；選項以 U 取代 T 寫成 RNA 型式的 5′-CUGCAAU-3′，是唯一正確的互補股。","這是互補序列但沒有反向書寫（等於把 3′→5′ 的互補股寫成 5′→3′），無法配對。","序列本身就不互補。","這是原序列，不是互補股。"]},{"id":"M-98-2_46","t":"M","y":98,"q":"一位病患疑似有維生素B12缺乏現象，下列何種血液變化最不支持此一診斷？","o":["甲基丙二酸(methylmalonic acid)過高","對羥基苯丙酮酸(para-hydroxyphenylpyruvate)過高","紅血球過少","巨母紅血球過多"],"a":[1],"ch":["17"],"sec":"17.2","fbt":"Figure 17-12","ex":["B12 是 methylmalonyl-CoA mutase 的輔酶，缺乏時甲基丙二酸堆積 —— 這是最具特異性的指標，支持診斷。","對羥基苯丙酮酸是「酪胺酸」代謝的中間產物，與 B12 完全無關，最不支持此診斷。","B12 缺乏造成貧血，紅血球數目減少，支持診斷。","DNA 合成受阻使紅血球前驅細胞無法分裂卻持續長大，形成巨母紅血球，支持診斷。"]},{"id":"M-98-2_47","t":"M","y":98,"q":"輔酶NAD＋、FAD、coenzyme A等分子中之共同結構單元(structure module)為：","o":["ADP","CDP","GDP","UDP"],"a":[0],"ch":["13","16"],"sec":"13.4 16.1","fbt":"Figure 13-4"},{"id":"M-98-2_48","t":"M","y":98,"q":"一位 30 歲男子主訴有牙齒鬆動、傷口不易癒合等症狀，口腔理學檢查發現牙齦浮腫、牙齦泛紫。這些病徵最可能與維他命 C 參與何種蛋白修飾(protein modification)變化有關？","o":["羥基化(hydroxylation)","磷酸化(phosphorylation)","乙醯化(acetylation)","甲基化(methylation)"],"a":[0],"ch":["4"],"sec":"4.3","fbt":"Box 4-3"},{"id":"M-98-2_49","t":"M","y":98,"q":"組胺酸(histidine)的胺基(-NH2)、側鏈(R-group)與羧基(-COOH)的pKa值分別為 9、6 和 2 ，當此胺基酸處於pH 5.0 的環境中時，溶液中大部分組胺酸分子的帶電狀態應為：","o":["帶二個正電荷","帶一個正電荷","不帶電","帶一個負電荷"],"a":[1],"ch":["3"],"sec":"3.1","fbt":""},{"id":"M-98-2_50","t":"M","y":98,"q":"下列何者不能做為酵素執行酸-鹼催化(acid-base catalysis)時的活性中心胺基酸(active site residue)？","o":["組胺酸(histidine)","甲硫胺酸(methionine)","天門冬胺酸(aspartic acid)","麩胺酸(glutamic acid)"],"a":[1],"ch":["6"],"sec":"6.2","fbt":"Figure 3-5"},{"id":"M-97-1_27","t":"M","y":97,"q":"已知 ammonia 對細胞具有毒性，在肝硬化而進入肝昏迷的病人，經常檢驗血中 ammonia 之濃度作為病情進展的指標，下列何者與 ammonia 的代謝清除反應無直接關係？","o":["leucine","pyruvate","glutamate","α-ketoglutarate"],"a":[0],"ch":["18"],"sec":"18.1","fbt":"Figure 18-9","ex":["白胺酸是純生酮性支鏈胺基酸，不是氨清除反應中的受體或載體，與氨的代謝清除沒有直接關係。","丙酮酸接受胺基形成丙胺酸，把氨從肌肉送到肝臟，有直接關係。","麩胺酸可再接一個氨形成麩醯胺，也可經 glutamate dehydrogenase 釋氨入尿素循環，有直接關係。","α-ketoglutarate 接受游離氨生成麩胺酸，是氨進入有機分子的入口，有直接關係。"]},{"id":"M-97-1_28","t":"M","y":97,"q":"下列關於生物膜(biological membrane)分子構造的敘述何者為非？","o":["為 noncovalent assemblies","為 symmetric","為 fluid structures","主要組成為 lipids 和 proteins"],"a":[1],"ch":["11"],"sec":"11.1","fbt":"","ex":["膜的組成分子之間靠疏水作用與非共價力聚集，敘述正確。","生物膜是高度「不對稱」的：兩層的磷脂組成不同（PS、PE 偏內層，PC、鞘磷脂偏外層）、醣鏈只在外側、蛋白質方向固定，故說它對稱為非。","膜具流動性，脂質與許多蛋白可側向擴散，敘述正確。","主要組成確實是脂質與蛋白質（加上少量醣類），敘述正確。"]},{"id":"M-97-1_29","t":"M","y":97,"q":"肥胖是脂肪過多的疾病。關於脂肪組織之脂肪代謝，下述何者錯誤？","o":["釋放出來的脂肪酸部分可供給其他組織生產能量","釋放出來的脂肪酸可送到肝臟內再合成三酸甘油酯，所以肥胖病患易合併脂肪肝","空腹時，釋放出來的脂肪酸送到肝臟內合成三酸甘油酯，包裝成低密度脂蛋白(low-density lipoprotein)分泌至血液中","釋放出來的脂肪酸，大部分在脂肪組織內及肝臟內再合成三酸甘油酯"],"a":[2],"ch":["17"],"sec":"17.1","fbt":"Figure 17-3","ex":["釋出的脂肪酸送往肌肉、心臟等組織氧化供能，敘述正確。","大量脂肪酸回到肝臟再酯化，是脂肪肝的成因，敘述正確。","肝臟把自行合成的三酸甘油酯包裝成「VLDL」分泌；LDL 是 VLDL 在血中被代謝後的產物，不是肝臟直接分泌，故此敘述錯誤。","脂肪組織內部與肝臟都會把脂肪酸再酯化，形成無效循環，敘述正確。"]},{"id":"M-97-1_30","t":"M","y":97,"q":"氰化物(cyanide)常被用於自殺或謀殺。請問氰化物毒害細胞的機轉為抑制細胞的那一種物質之功能？","o":["白蛋白(albumin)","細胞色素 C(cytochrome c)","乳酸脫氫酶(lactate dehydrogenase)","鐵結合蛋白(ferritin)"],"a":[1],"ch":["19"],"sec":"19.1","fbt":"Figure 19-6"},{"id":"M-97-1_31","t":"M","y":97,"q":"ErbB1 致癌基因(oncogene)的產物為 human epidermal growth factor receptor 1(HER1)，屬於 receptor tyrosine kinases(RTKs)家族成員。人類癌症中常發現 ErbB1 基因的過度表現，這可能為癌細胞不正常增殖、抗凋亡以及轉移的機制。若要發展對這類癌症的「標靶治療」(target therapy)，由你對RTK signaling 之認識來判斷，下列何者可能不是有效標靶治療藥劑？","o":["可抑制 epidermal growth factor(EGF)與 HER1 結合的單株抗體","可與 HER1 之 extracellular EGF-binding domain 結合，而不引起 intracellular kinase domain 活化的單株抗體","可引發 HER1 dimerization 的單株抗體","可自由穿越細胞膜而 block HER1 intracellular kinase domain 上 ATP-binding site 的小分子化合物"],"a":[2],"ch":["12"],"sec":"","fbt":"","ex":["阻斷 EGF 與 HER1 結合 → 受體無法被活化，是有效策略。","結合細胞外域但不引起細胞內激酶活化（拮抗型單株抗體，如 cetuximab 的概念）→ 佔住位子又不傳訊，是有效策略。","引發 HER1 二聚化等於「活化」受體訊號，會促進癌細胞增殖，所以不可能是有效的標靶治療藥劑。","小分子酪胺酸激酶抑制劑穿膜後競爭細胞內激酶域的 ATP 結合位（gefitinib、erlotinib），是有效策略。"]},{"id":"M-97-1_32","t":"M","y":97,"q":"百日咳桿菌(Bordetella pertussis)會產生百日咳毒素(pertussis toxin)，催化 Giα(即 inhibitory G蛋白 α 次單元)之 ADP-ribosylation，導致 adenylate cyclase 的持續性活化。下列有關 pertussis toxin致病機轉之敘述，何者正確？","o":["pertussis toxin 抑制 Giα 由 GDP 結合態到 GTP 結合態的轉換","pertussis toxin 抑制 Giα 由 GTP 結合態到 GDP 結合態的轉換","pertussis toxin 抑制 Giα 的 GTPase 活性","pertussis toxin 促進 Giα 對 adenylate cyclase 的作用"],"a":[0],"ch":["12"],"sec":"","fbt":"","ex":["pertussis toxin 把 Giα 進行 ADP-ribosylation，使它無法由 GDP 型轉換成 GTP 型，也就是 Gi 無法被受體活化；Gi 失去抑制 adenylate cyclase 的能力，AC 便持續活化。","若抑制 GTP → GDP 的轉換，Gi 會持續活化而更強地抑制 AC，與題幹描述的結果相反。","抑制 GTPase 活性是霍亂毒素對 Gsα 的作用模式，不是 pertussis toxin 對 Giα 的模式。","pertussis toxin 是讓 Giα「失去」對 AC 的抑制作用，不是促進它作用於 AC。"]},{"id":"M-97-1_33","t":"M","y":97,"q":"下列各種與癌症形成有關的基因中，何者並非轉錄因子(transcription factor)基因？","o":["c-myc","p53","bcl-2","以上皆為轉錄因子基因"],"a":[2],"ch":["12"],"sec":"12.11","fbt":"Figure 12-39","ex":["c-myc 是 bHLH-Zip 類的轉錄因子。","p53 是能結合特定 DNA 序列的轉錄因子。","bcl-2 是粒線體外膜上的抗凋亡蛋白，靠結合 Bax／Bak 發揮作用，不是轉錄因子。","因為 bcl-2 不是轉錄因子，所以「以上皆為」不成立。"]},{"id":"M-97-1_34","t":"M","y":97,"q":"下列何種形式之核酸重複(nucleotide repeat)，與遺傳疾病如 fragile X syndrome, Huntington’s disease 等有關?","o":["雙核酸重複(double nucleotide repeat)","三核酸重複(triple nucleotide repeat)","四核酸重複(quadruple nucleotide repeat)","隨意核酸重複(random nucleotide repeat)"],"a":[1],"ch":["9"],"sec":"Problems","fbt":"Problem 5","ex":["雙核苷酸重複多見於微衛星標記，不是這類疾病的機制。","脆弱 X 症候群（CGG）、亨丁頓舞蹈症（CAG）、肌強直性失養症（CTG）、Friedreich 運動失調（GAA）都屬「三」核苷酸重複擴增；重複數超過閾值即致病，且世代間有擴增傾向而出現早發現象（anticipation）。","四核苷酸重複不是這類疾病的典型機制。","隨意重複不是定義明確的致病機制。"]},{"id":"M-97-1_35","t":"M","y":97,"q":"去氧核糖核酸(DNA)雙股螺旋(double helix)結構為二十世紀最偉大的發現之一。雙股螺旋結構之穩定性主要來自下列何者？","o":["鄰近嘌呤(purine)間之氫鍵","鄰近嘧啶(pyrimidine)間之氫鍵","雙股螺旋結構本身","不同股 DNA 嘌呤(purine)與嘧啶(pyrimidine)間之氫鍵"],"a":[3],"ch":["8"],"sec":"8.2","fbt":"","ex":["同一股上相鄰嘌呤之間靠的是堆疊力與凡得瓦力，不是氫鍵。","同一股上相鄰嘧啶之間同樣不靠氫鍵連結。","「結構本身」不是一種作用力，無法解釋穩定性的來源。","兩股之間由嘌呤與嘧啶互補配對形成氫鍵（A=T 兩個、G≡C 三個），加上鹼基堆疊，共同維持雙螺旋的穩定。"]},{"id":"M-97-1_36","t":"M","y":97,"q":"Acetylcholine receptor 屬於下列何種接受器？","o":["G protein coupled receptor","gated ion channel","nuclear receptor","receptor with tyrosine kinase activity"],"a":[0,1],"ch":["12"],"sec":"12.8","fbt":"Figure 12-29","ex":["蕈毒鹼型（muscarinic）乙醯膽鹼受體是 GPCR，正確。","菸鹼型（nicotinic）乙醯膽鹼受體是配體門控陽離子通道，也正確。乙醯膽鹼受體分這兩大類，所以 A、B 都對，官方併計兩個答案。","乙醯膽鹼受體不是核受體。","乙醯膽鹼受體不具酪胺酸激酶活性。"]},{"id":"M-97-1_37","t":"M","y":97,"q":"下列那一種蛋白質不參與人類嗅覺的訊息傳遞？","o":["三體 G 蛋白(trimeric G protein)","cAMP","細胞膜鈣離子通道","STAT 轉錄因子"],"a":[3],"ch":["12"],"sec":"12.3","fbt":"","ex":["嗅覺受體是 GPCR，耦合三體 G 蛋白 Golf，有參與。","Golf 活化 adenylyl cyclase 產生 cAMP 作為二級訊息，有參與。","cAMP 開啟 cAMP-gated 陽離子通道，Na+ 與 Ca2+ 流入造成去極化，有參與。","STAT 是細胞激素 JAK-STAT 路徑的轉錄因子，不參與嗅覺訊息傳遞。"]},{"id":"M-97-1_38","t":"M","y":97,"q":"下列那個化合物水解時，可得到最大負值的自由能變化？","o":["UDP 葡萄糖(UDP-glucose)","葡萄糖-6-磷酸(glucose-6-phosphate)","蘋果酸(malate)","乳糖(lactose)"],"a":[0],"ch":["13"],"sec":"13.1","fbt":"Table 13-4"},{"id":"M-97-1_39","t":"M","y":97,"q":"下列何者與細胞對抗氧化傷害(oxidative damage)之機制無關？","o":["glutathione","alpha-tocopherol","biopterin","catalase"],"a":[2],"ch":["19"],"sec":"","fbt":""},{"id":"M-97-1_40","t":"M","y":97,"q":"Alcohol dehydrogenase(EC 1.1.1.1)催化乙醇(alcohol)及 aldehyde 之反應，屬於何種反應型態？","o":["轉移酶(transferase)","氧化還原酶(oxidoreductase)","水解酶(hydrolase)","連接酶(ligase)"],"a":[1],"ch":["14"],"sec":"14.3","fbt":""},{"id":"M-97-1_41","t":"M","y":97,"q":"何者具有最大催化反應的能力？","o":["脫輔基酶(apoenzyme)","輔酶(coenzyme)","全酶(holoenzyme)","酶原(zymogen)"],"a":[2],"ch":["6"],"sec":"6.1","fbt":""},{"id":"M-97-1_42","t":"M","y":97,"q":"下列何種輔酶能協助單碳基團(one-carbon groups)轉移，如果缺乏時會影響 DNA 的合成？","o":["coenzyme A","lipoate","tetrahydrofolate","pyridoxal phosphate"],"a":[2],"ch":["22"],"sec":"22.4","fbt":"Figure 22-35","ex":["輔酶 A 攜帶醯基（acyl），不是一碳單位。","lipoate 攜帶醯基與電子，見於丙酮酸脫氫酶複合體。","四氫葉酸攜帶甲基、亞甲基、甲醯基等一碳單位，缺乏時 dTMP 與嘌呤合成受阻，直接影響 DNA 合成（巨母紅血球性貧血）。","磷酸吡哆醛負責轉胺、脫羧等反應，不攜帶一碳單位。"]},{"id":"M-97-1_43","t":"M","y":97,"q":"人類的粗皮病(pellagra)是由於缺乏下列那種維生素所引起？","o":["生物素(biotin)","泛酸(pantothenic acid)","葉酸(folic acid)","菸鹼酸(niacin)"],"a":[3],"ch":["13"],"sec":"13.4","fbt":""},{"id":"M-97-1_44","t":"M","y":97,"q":"與染色體(chromosome)結合的蛋白質有 1000 多種以上，其中五種蛋白質具有很明顯的胺基酸共識序列(consensus amino acid sequence)，該種蛋白質富含離胺酸(lysine)和精胺酸(arginine)，是染色質(chromatin)的主要結構蛋白，請問該蛋白質為何？","o":["支架蛋白(scaffolding proteins)","核仁蛋白(nucleolus proteins)","組織蛋白(histone proteins)","轉錄因子(transcription factors)"],"a":[2],"ch":["24"],"sec":"24.3","fbt":"","ex":["支架蛋白參與染色體高階結構，但不是富含鹼性胺基酸的那五種共識蛋白。","核仁蛋白與核糖體組裝有關。","組織蛋白共有 H1、H2A、H2B、H3、H4 五種，高度保守、富含離胺酸與精胺酸，是染色質最主要的結構蛋白。","轉錄因子種類繁多，不是染色質的主要結構蛋白。"]},{"id":"M-97-1_45","t":"M","y":97,"q":"引子(primer)是 DNA 複製時的必須材料，下列何者為引子的主要功能？","o":["誘發 DNA 生合成的起點及方向，並決定生合成的終點","可幫助 DNA 雙螺旋的解旋工作，誘發 DNA 的生合成","確定 DNA 生合成的起點及方向，提供一個羥基(-OH)作為 DNA 延伸之用","可決定前導股(leading strand)，但無法決定遲緩股(lagging strand)的形成"],"a":[2],"ch":["25"],"sec":"25.1","fbt":"Figure 25-5"},{"id":"M-97-1_46","t":"M","y":97,"q":"第一型肝醣貯積病(type I glycogen storage disease)是由於 glucose-6-phosphatase 缺失導致，下列何者為其臨床生化特徵？","o":["hyperglycemia","hypouremia","hypolipemia","ketosis"],"a":[3],"ch":["15"],"sec":"15.4","fbt":""},{"id":"M-97-1_47","t":"M","y":97,"q":"在尿素(urea)循環中，尿素由 NH4+和 CO2 形成。氨(ammonia)對人體毒性很大，但尿素則無毒性，而且可溶於水，可由尿中排出體外。下列那一項對 carbamoyl phosphate synthetase I 的敘述錯誤？","o":["它是細胞質內的酵素","它所催化之反應需要 ATP","它以 HCO3-及 NH4+為反應之受質","它所催化之反應形成了 carbamoyl phosphate"],"a":[0],"ch":["18"],"sec":"18.2","fbt":"Figure 18-10","ex":["CPS I 位於「粒線體基質」（細胞質中的是嘧啶合成用的 CPS II），故此敘述錯誤。","反應消耗 2 個 ATP，敘述正確。","受質是 HCO3− 與 NH4+，敘述正確。","產物是 carbamoyl phosphate，再由 OTC 與 ornithine 結合成 citrulline，敘述正確。"]},{"id":"M-97-1_48","t":"M","y":97,"q":"Phenylketonuria 與下列何項酵素缺陷有關？","o":["Branched-chain α-keto acid dehydrogenase complex","Homogentisic acid dioxygenase","Tyrosinase","Phenylalanine hydroxylase"],"a":[3],"ch":["18"],"sec":"18.3","fbt":"Figure 18-24","ex":["支鏈 α-酮酸脫氫酶複合體缺陷是楓糖尿症。","homogentisic acid dioxygenase 缺陷是黑尿症。","tyrosinase 缺陷是白化症。","苯酮尿症是 phenylalanine hydroxylase 缺陷，苯丙胺酸無法轉成酪胺酸而堆積。"]},{"id":"M-97-1_49","t":"M","y":97,"q":"Methotrexate 可以當作化療之生化機轉為何？","o":["作為 pyridoxal phosphate 的相似物，抑制酵素活性","抑制 dihydrofolate reductase","競爭性抑制 EPSP synthase","直接抑制糖解作用(glycolysis)"],"a":[1],"ch":["22"],"sec":"22.4","fbt":"Figure 22-52","ex":["methotrexate 是葉酸類似物，不是 PLP 類似物。","methotrexate 緊密結合 dihydrofolate reductase，使 THF 枯竭，dTMP 與嘌呤合成中斷，快速分裂的細胞受害最深。","EPSP synthase 是除草劑 glyphosate 的標的，只存在於植物與微生物。","methotrexate 不直接抑制糖解作用。"]},{"id":"M-97-1_50","t":"M","y":97,"q":"下列有關 E. coli DNA 複製之敘述，何者正確？","o":["複製原點(replication origin)附近有許多富含 GU 之序列","由 DNA 聚合酶 I 負責前導股(leading strand)之合成","需要從一段 RNA 引子(primer)開始合成","單股 DNA 結合蛋白(single-strand DNA-binding proteins)負責打開雙股"],"a":[2],"ch":["25"],"sec":"25.1","fbt":"Figure 25-5"},{"id":"M-97-2_26","t":"M","y":97,"q":"下列何種酵素活性增加可造成癌細胞無法進行正常細胞的老化現象？","o":["去氧核糖核酸聚合酶－甲型(DNA polymerase alpha)","去氧核糖核酸聚合酶－丁型(DNA polymerase delta)","去氧核糖核酸接合酶(DNA ligase)","端粒酶(telomerase)"],"a":[3],"ch":["26"],"sec":"26.3","fbt":""},{"id":"M-97-2_27","t":"M","y":97,"q":"根據Watson-Crick 的DNA 模式，有關兩股核苷酸鏈結合的力量，下列何者為非？","o":["各鹼基間所形成的氫鍵(hydrogen bonds between bases)","鹼基間的堆積力量(Stacking of the bases)","鹼基間所產生的凡得瓦爾交互作用(Van der Waals interaction)","磷酸根與鹼基間之離子交互作用(ionic interaction)"],"a":[3],"ch":["8"],"sec":"8.2","fbt":"","ex":["互補鹼基間的氫鍵是維繫兩股的主要力量之一。","鹼基堆疊（疏水與芳香環堆疊）其實是穩定雙螺旋貢獻最大的力量。","堆疊中的凡得瓦交互作用也有貢獻。","磷酸根帶負電、鹼基為中性，兩者之間不存在離子交互作用；相反地，兩股的磷酸根彼此靜電「排斥」，要靠陽離子與水屏蔽，故此項為非。"]},{"id":"M-97-2_28","t":"M","y":97,"q":"酵素催化反應的雙倒數圖(double-reciprocal plot)若有一競爭性抑制劑(competitive inhibitor)存在時，則下列何項會改變？","o":["1/V 軸的截距","1/[S]軸的截距","V max","平衡常數K(pK)"],"a":[1],"ch":["6"],"sec":"6.3","fbt":"Box 6-2"},{"id":"M-97-2_29","t":"M","y":97,"q":"在葡萄糖運載蛋白(glucose transporter)的家族(family)中，高Km 的GLUT2 主要在下列何種組織表現？","o":["小腸","肝","肌肉","腦"],"a":[0,1],"ch":["11"],"sec":"11.3","fbt":"Table 11-3","ex":["小腸基底側以 GLUT2 把吸收的葡萄糖送入血中，確實有表現。","肝臟是 GLUT2 最典型的表現部位，高 Km 使肝臟在血糖高時才大量攝糖。官方將小腸與肝併計為答案。","肌肉用的是 GLUT4（受胰島素調控），不是 GLUT2。","腦神經元用的是低 Km 的 GLUT3、血腦障壁用 GLUT1，不是 GLUT2。"]},{"id":"M-97-2_30","t":"M","y":97,"q":"Li-Fraumeni 徵候是一種罕見遺傳的疾病，病患家族的成員很容易在30 歲前得到各種癌症，這個家族的問題是他們遺傳了一個突變的p53 基因。另外，人類癌症中一半以上可發現有p53 基因的somatic mutations。下列關於p53 之敘述何者錯誤？","o":["正常p53 為抑癌基因(tumor suppressor gene)","正常p53 參與細胞週期(cell cycle)的調控","正常p53 為transcription factor，可與特定DNA 序列結合","正常p53 主要分布於細胞膜上，可接受外來訊號"],"a":[3],"ch":["12"],"sec":"12.11","fbt":"Figure 12-39","ex":["p53 是典型的腫瘤抑制基因，正確。","p53 經誘導 p21 而阻斷 G1／S，參與細胞週期調控，正確。","p53 是能結合特定 DNA 序列（p53 response element）的轉錄因子，正確。","p53 主要位於細胞核（受損時從細胞質累積入核），不是分布在細胞膜上接受外來訊號，故此敘述錯誤。"]},{"id":"M-97-2_31","t":"M","y":97,"q":"Urea cycle enzyme deficiency 是罕見的遺傳代謝疾病，下列何種amino acid 未參與urea cycle？","o":["Phenylalanine","arginine","citrulline","ornithine"],"a":[0],"ch":["18"],"sec":"18.2","fbt":"Figure 18-10","ex":["苯丙胺酸不是尿素循環的成員；它走羥化成酪胺酸的路。","精胺酸是尿素循環成員，由 arginase 切出尿素與 ornithine。","瓜胺酸是尿素循環成員，由 OTC 產生後運出粒線體。","鳥胺酸是尿素循環的骨架載體，接受 carbamoyl 基。"]},{"id":"M-97-2_32","t":"M","y":97,"q":"病患數天無法經口進食，通常靜脈點滴中會提供每日約100 公克葡萄糖，以避免下列何種現象，而造成肌肉流失(muscle wasting)？","o":["因為缺少能源，肌肉細胞壞死","因為發生肌肉內肝糖分解(glycogenolysis)以提供葡萄糖來供給能源","因為肌肉內發生脂肪分解(lipolysis)，以提供脂肪酸來供給能源","因為肌肉內發生蛋白質分解，以合成葡萄糖來提供能源"],"a":[3],"ch":["23"],"sec":"23.3","fbt":"Figure 23-31","ex":["短期禁食不會讓肌肉細胞壞死。","肌肉缺乏 glucose 6-phosphatase，分解的肝醣只能自用，不能釋出葡萄糖供全身。","脂肪分解主要發生在脂肪組織，而且脂肪酸無法轉成葡萄糖。","禁食超過一天後，腦與紅血球仍需葡萄糖，身體便分解肌肉蛋白質取出胺基酸做糖質新生。每天給約 100 克葡萄糖可大幅減少這種蛋白質消耗，臨床上稱為 protein-sparing effect。"]},{"id":"M-97-2_33","t":"M","y":97,"q":"人類癌症中約有三分之一可發現有ras 基因的突變，這些突變造成Ras 持續性活化(constitutive activation)，不受傳訊路徑上游的生長因子受體調控，而一直促進細胞分裂。下列關於Ras 訊息傳導之敘述，何者錯誤？","o":["與GDP 結合的Ras 會活化MAP kinase kinase kinase(MAPKKK)","活化的MAPKKK 啟動一個kinase cascade，依序磷酸化MAP kinase kinase(MAPKK)與MAP kinase(MAPK)","磷酸化的MAPK 是活化態，可磷酸化一些transcription factors","磷酸化的transcription factors(例如Jun 和Fos)，可活化一些調控細胞分裂的基因之表現"],"a":[0],"ch":["12"],"sec":"","fbt":"","ex":["與 GDP 結合的 Ras 是失活型，不會活化 Raf-1（MAPKKK）；要 Ras-GTP 才行，故此敘述錯誤。","活化的 MAPKKK（Raf-1）依序磷酸化 MAPKK（MEK）與 MAPK（ERK），正確。","磷酸化的 ERK 是活化態，可進核磷酸化轉錄因子，正確。","被磷酸化的 Jun、Fos（AP-1）活化細胞分裂相關基因的表現，正確。"]},{"id":"M-97-2_34","t":"M","y":97,"q":"細胞中各種基因的表達常因不同組織而有差異。在一些基因的啟動子(promoter)上常有一些CpG島(CpG island)。同一基因的表達，常因CpG 島受到下列何種修飾(modification)而有不同？","o":["乙烯化(acetylation)","甲基化(methylation)","磷酸化(phosphorylation)","羧化(carboxylation)"],"a":[1],"ch":["8"],"sec":"8.3","fbt":"Figure 8-5","ex":["乙醯化發生在組織蛋白的離胺酸上，不是直接修飾 DNA 的 CpG。","CpG island 中胞嘧啶的甲基化（5-methylcytosine）會招募抑制性蛋白並使染色質緊縮，造成基因沉默；這是組織特異性表達與腫瘤抑癌基因失活的常見機制。","磷酸化修飾的是蛋白質（組織蛋白、轉錄因子），不是 CpG 的鹼基。","羧化不是 DNA 的修飾方式。"]},{"id":"M-97-2_35","t":"M","y":97,"q":"一胺基酸的側鍵為一環狀結構，但其生化性質與脂族側鍵(aliphatic side chain)相類似，由於此環狀結構的剛性，故難以摺疊進蛋白質的結構中，請問這個胺基酸的名稱為何？","o":["組織胺酸(Histidine)","脯胺酸(Proline)","酪胺酸(Tyrosine)","色胺酸(Tryptophan)"],"a":[1],"ch":["3"],"sec":"3.1","fbt":""},{"id":"M-97-2_36","t":"M","y":97,"q":"Tamoxifen 最常應用於治療癌症(如乳癌及其他癌症)，其主要機轉為抑制下列何種荷爾蒙感受體(hormone receptor)之轉錄(transcription)能力？","o":["雄激素感受體(androgen receptor)","雌激素感受體(estrogen receptor)","甲狀腺激素感受體(thyroid hormone receptor)","維生素D 感受體(vitamin D receptor)"],"a":[1],"ch":["28"],"sec":"","fbt":""},{"id":"M-97-2_37","t":"M","y":97,"q":"何者為此DNA 序列的互補股：5’-CGCGAATTCGCG-3’？","o":["5’-GCGCTTAAGCGC-3’","5’-CGCGAATTCGCG-3’","5’-GCGCUUAAGCGC-3’","5’-CGCGAAUUCGCG-3’"],"a":[1],"ch":["8"],"sec":"8.2","fbt":"","ex":["這是互補序列但方向寫反，以 5′→3′ 書寫時無法與原股配對。","5′-CGCGAATTCGCG-3′ 的反向互補就是它自己 —— 這是個迴文序列（中間 GAATTC 正是 EcoRI 位點），所以互補股寫出來與原股相同。","互補股應為 DNA，不應出現 U，且方向也反了。","互補股應為 DNA，不應出現 U。"]},{"id":"M-97-2_38","t":"M","y":97,"q":"38 Polymerase chain reaction(PCR)在臨床診斷上是一個很重要的工具，在一般反應過程不需要下列何項？","o":["大量純化的DNA","溫控循環儀","四種去氧核糖核酸","對熱穩定的DNA polymerase"],"a":[0],"ch":["8"],"sec":"8.3","fbt":"","ex":["PCR 的最大優勢就是只需極微量的模板（理論上一個分子即可），不需要大量純化的 DNA。","溫控循環儀負責快速精準地在三個溫度之間切換，是必需設備。","四種 dNTP 是合成新股的原料，必需。","耐熱 DNA 聚合酶是 PCR 能反覆循環而不必每次補酵素的關鍵，必需。"]},{"id":"M-97-2_39","t":"M","y":97,"q":"神經傳遞之所以具有方向性是因為：","o":["離子通道(ion channel)蛋白發生去敏作用(desensitization)","離子通道蛋白具有專一性(specificity)","鈣離子在神經細胞中具方向性之傳遞","鈣調素(calmodulin)在神經細胞中具方向性之傳遞"],"a":[0],"ch":["11"],"sec":"","fbt":"","ex":["動作電位之所以只往前傳而不倒退，是因為剛通過的膜上電壓門控鈉通道進入「不活化」狀態（去敏／不反應期），短時間內無法再被打開。","通道的專一性決定哪些離子通過，與傳導方向無關。","鈣離子在突觸末梢觸發囊泡釋放，但不是軸突上方向性的成因。","鈣調素是細胞內的鈣感應蛋白，與神經衝動的方向性無關。"]},{"id":"M-97-2_40","t":"M","y":97,"q":"下列何種胺基酸，經由代謝程序，可成為甲基供給者(methyl donor)？","o":["Valine","threonine","methionine","glutamine"],"a":[2],"ch":["18"],"sec":"18.3","fbt":"Figure 18-18","ex":["纈胺酸是支鏈胺基酸，分解成 succinyl-CoA，不供甲基。","蘇胺酸分解成丙酮酸或 succinyl-CoA，不供甲基。","甲硫胺酸與 ATP 結合成 S-adenosylmethionine（SAM），是體內最主要的甲基供給者，供甲基後變成 SAH → homocysteine。","麩醯胺提供的是醯胺氮，不是甲基。"]},{"id":"M-97-2_41","t":"M","y":97,"q":"下列何種胺基酸為合成一氧化氮(NO)的前驅物？","o":["Arginine","Tryptophan","Lysine","Methionine"],"a":[0],"ch":["22"],"sec":"22.3","fbt":"Figure 22-33","ex":["NO synthase 以 arginine 為受質，產生 NO 與 citrulline。","色胺酸走 serotonin 與菸鹼酸。","離胺酸是純生酮性必需胺基酸，不生成 NO。","甲硫胺酸提供甲基（SAM），與 NO 合成無關。"]},{"id":"M-97-2_42","t":"M","y":97,"q":"下列那些為脂溶性維生素？1 維生素A 2 維生素B 3 維生素C 4 維生素D 5 維生素E","o":["123","234","345","145"],"a":[3],"ch":["10"],"sec":"10.3","fbt":"","ex":["維生素 B 與 C 都是水溶性，不在其中。","維生素 B、C 皆為水溶性。","維生素 C 是水溶性。","脂溶性維生素是 A、D、E、K（口訣：ADEK），需要脂肪與膽鹽協助吸收，過量會蓄積中毒；維生素 B 群與 C 為水溶性。"]},{"id":"M-97-2_43","t":"M","y":97,"q":"G protein α-subunit 本身具下列何種酵素活性？","o":["guanylate cyclase，催化轉換GTP 成cGMP","GTPase，水解GTP 成GDP","Kinase，催化轉移GTP 磷酸根至蛋白質","cGMP-dependent protein kinase"],"a":[1],"ch":["12"],"sec":"12.2","fbt":"Figure 12-5","ex":["把 GTP 轉成 cGMP 的是 guanylyl cyclase，不是 Gα 的活性。","Gα 本身具內在 GTPase 活性，水解 GTP 成 GDP 而自我關閉；GAP／RGS 可加速此步驟。","Gα 不是激酶，不會把 GTP 的磷酸根轉給蛋白質。","cGMP-dependent protein kinase（PKG）是另一個獨立的酵素。"]},{"id":"M-97-2_44","t":"M","y":97,"q":"下列那一個胺基酸在pH 等於11 時帶一個淨負電荷？","o":["精胺基酸(arginine)","天冬胺基酸(aspartic acid)","麩胺基酸(glutamic acid)","絲胺基酸(serine)"],"a":[3],"ch":["3"],"sec":"3.1","fbt":""},{"id":"M-97-2_45","t":"M","y":97,"q":"下列氧化劑(oxidant)中，何者的標準還原電位(standard reduction potential)值最小？","o":["cytochrome b (+3)","ubiquinone (oxidized)","FAD","Fe (+3)"],"a":[2],"ch":["19"],"sec":"19.1","fbt":"Table 19-2"},{"id":"M-97-2_46","t":"M","y":97,"q":"遺傳性非息肉症大腸癌(hereditary nonpolyposis colon cancer-HNPCC)可由hMSH2 或hMLH1 基因變異，而影響下列何種DNA 修復途徑所造成？","o":["錯誤配對修復(mismatch repair)","鹼基切除修復(base excision repair)","核酸切除修復(nucleotide excision repair)","雙股斷裂修復(double strand break repair)"],"a":[0],"ch":["25"],"sec":"25.2","fbt":"Box 25-1"},{"id":"M-97-2_47","t":"M","y":97,"q":"心臟病患血中膽固醇(cholesterol)過高，因此服用降膽固醇藥物statin，下列何者為statin 在此一狀況中最主要之作用機制？","o":["statin 抑制膽固醇經腸道吸收","statin 抑制膽固醇的腸肝再循環(enterohepatic recirculation)","statin 抑制膽固醇合成反應的HMG-CoA reductase","statin 抑制low-density lipoprotein receptor 基因表現"],"a":[2],"ch":["21"],"sec":"21.4","fbt":"Box 21-3","ex":["抑制腸道吸收膽固醇的是 ezetimibe，不是 statin。","阻斷腸肝再循環的是膽酸結合樹脂（cholestyramine），不是 statin。","statin 是 HMG-CoA 的結構類似物，競爭性抑制 HMG-CoA reductase，使肝細胞內膽固醇下降、SREBP 活化、LDL 受體增加，從血中清掉更多 LDL。","statin 反而是「增加」LDL 受體的基因表現，方向相反。"]},{"id":"M-97-2_48","t":"M","y":97,"q":"葡萄糖經由糖解反應(glycolysis)代謝時，其中間產物甘油醛-3-磷酸(glyceraldehyde-3-phosphate)的第3 個碳是由葡萄糖的第幾個碳所轉變的？","o":["碳3 及碳4","碳2 及碳5","碳1 及碳6","碳1 及碳2"],"a":[2],"ch":["14"],"sec":"14.1","fbt":"Figure 14-2"},{"id":"M-97-2_49","t":"M","y":97,"q":"Jacob 和Monod 在研究大腸桿菌中乳糖代謝時發現：一些突變株不管有沒有誘導物(乳糖等)的存在下，皆可表現大量半乳糖苷酶(β-galactosidase)，是因為：","o":["此突變株影響到半乳糖苷酶mRNA 的轉譯表現","此突變株影響到半乳糖苷酶mRNA 的轉錄後修飾表現","此突變株的半乳糖苷酶操縱子(operon)無法受其抑止子(Lac repressor)所調控","此突變造成Lac repressor 的DNA 結合能力變強"],"a":[2],"ch":["28"],"sec":"28.1","fbt":""},{"id":"M-97-2_50","t":"M","y":97,"q":"硬脂酸(stearic acid)完全氧化，須經過beta-oxidation 途徑幾次？","o":["6","7","8","9"],"a":[2],"ch":["17"],"sec":"17.2","fbt":"Table 10-1","ex":["6 次不足以切完 18 碳。","7 次不足以切完 18 碳。","硬脂酸是 18 碳飽和脂肪酸，產生 9 個 acetyl-CoA；β 氧化次數 = (碳數/2) − 1 = 8 次。","9 是 acetyl-CoA 的數目，不是循環次數。"]},{"id":"M-96-1_10","t":"M","y":96,"q":"cAMP 是真核細胞(eukaryotic cells)的第二信使(second messenger)之一，可直接調控下列何種蛋白質之功能？","o":["活化Adenylate cyclase","活化Protein kinase A","抑制G protein","抑制Calmodulin"],"a":[1],"ch":["12"],"sec":"12.2","fbt":"Figure 12-4","ex":["adenylate cyclase 是「產生」cAMP 的酵素，受 Gsα／Giα 調控，不是被 cAMP 活化。","cAMP 直接結合 PKA 的調節次單元，釋出催化次單元而活化 —— 這是 cAMP 在真核細胞最主要的直接標的。","cAMP 不抑制 G 蛋白；G 蛋白在 cAMP 的上游。","calmodulin 由 Ca2+ 調控，不受 cAMP 直接調控。"]},{"id":"M-96-1_11","t":"M","y":96,"q":"在呼吸鏈中，下列何者電子的傳遞可被一氧化碳所抑制？","o":["cytochrome(a＋a3)","coenzyme Q","cytochrome(b＋c1)","cytochrome c"],"a":[0,1,2,3],"ch":["19"],"sec":"19.1","fbt":"Figure 19-6","free":1},{"id":"M-96-1_27","t":"M","y":96,"q":"碘與酪胺酸(tyrosine)的結合主要是靠：","o":["甲狀腺過氧化酶(peroxidase)","甲狀腺蛋白酶(protease)","甲狀腺脫碘酶(deiodinase)","甲狀腺脫氫酶(dehydrogenase)"],"a":[0],"ch":[],"sec":"","fbt":""},{"id":"M-96-1_38","t":"M","y":96,"q":"胰島素缺乏的第一型糖尿病(type I diabetes mellitus)病人，血糖控制極差時，可能發生酮酸中毒(ketoacidosis)，下列有關病人體內能量代謝之敘述，何者錯誤？","o":["酮體(ketone body)主要是由葡萄糖代謝產生之acetyl-CoA 所轉化而成","酮體可代替葡萄糖成為細胞能量來源","Kreb’s cycle 之中間產物，如oxaloacetate 被移作糖質新生作用(gluconeogenesis)之材料，故血糖會上升","acetyl-CoA 因缺乏oxaloacetate，無法進行Kreb’s cycle，故轉化成酮體"],"a":[0],"ch":["14"],"sec":"14.1","fbt":"Figure 14-10"},{"id":"M-96-1_40","t":"M","y":96,"q":"有一種特殊的血紅素基因病變來自於終止密碼子(termination codon)之突變而造成polypeptide 之延長或縮短。下列何者不是終止密碼子？","o":["UAG","UAA","UGA","UGG"],"a":[3],"ch":["27"],"sec":"27.1","fbt":"Figure 27-7"},{"id":"M-96-1_41","t":"M","y":96,"q":"丙酮酸羧化酶(Pyruvate carboxylase)其輔酶生物素(biotin)主要功能是傳遞：","o":["胺基(amino group)","電子(electrons)","醯基(acyl groups)","二氧化碳(CO2)"],"a":[3],"ch":["14"],"sec":"14.4","fbt":"Figure"},{"id":"M-96-1_42","t":"M","y":96,"q":"人體主要胺基酸基本結構為：","o":["L-α form","L-β form","D-α form","D-β form"],"a":[0],"ch":["3"],"sec":"3.1","fbt":""},{"id":"M-96-1_43","t":"M","y":96,"q":"下列那一項是DNA 和RNA 共同的特性？","o":["都是雙股螺旋鏈","合成過程都具有校正機制避免錯誤","核酸中都含有磷酸根、醣及鹼基","在五碳醣的第二個位置都是-OH 基"],"a":[2],"ch":["8"],"sec":"8.1","fbt":"Figure 8-4","ex":["DNA 多為雙股螺旋，RNA 多為單股（可局部回摺），不是共同特性。","DNA 聚合酶有 3′→5′ 校對活性，RNA 聚合酶的校對能力低很多，不是共同特性。","兩者的基本單元都是「磷酸根＋五碳醣＋含氮鹼基」，這是共同特性。","只有 RNA 的 2′ 位是 -OH，DNA 是 -H，正是兩者的根本差異。"]},{"id":"M-96-1_44","t":"M","y":96,"q":"一分子的丙酮酸(pyruvate)經由丙酮酸脫氫酶(pyruvate dehydrogenase)以及檸檬酸循環(citric acid cycle)代謝生成3 分子二氧化碳時，可以產生1 分子的FADH2，1 分子的ATP(或GTP)，以及幾分子的NADH？","o":["1","2","3","4"],"a":[3],"ch":["16"],"sec":"16.1 16.2","fbt":"Figure 16-2"},{"id":"M-96-1_45","t":"M","y":96,"q":"Alanine 及2-oxoglutarate 在alanine aminotransferase 作用下會形成glutamate 及何者？","o":["aspartate","oxaloacetate","ketobutyrate","pyruvate"],"a":[3],"ch":["18"],"sec":"18.3","fbt":"Figure 18-19","ex":["aspartate 是 AST（GOT）反應的產物，不是 ALT。","oxaloacetate 是 AST 反應的產物。","ketobutyrate 來自 cystathionine 的裂解，與此反應無關。","ALT（GPT）催化 alanine + α-ketoglutarate ⇌ pyruvate + glutamate，所以另一個產物是丙酮酸。"]},{"id":"M-96-1_46","t":"M","y":96,"q":"Aspartate transaminase 又可稱為Glutamate:oxaloacetate transaminase 作用時需要下列何者當作輔助因子？","o":["pyridoxal phosphate","thiamine","FAD","ATP"],"a":[0],"ch":["18"],"sec":"18.1","fbt":"","ex":["所有轉胺酶（含 AST／GOT）都以磷酸吡哆醛為輔因子，與活性中心 Lys 形成 Schiff base。","thiamine（TPP）負責脫羧反應。","FAD 負責氧化還原。","ATP 不是轉胺反應的輔因子；轉胺是可逆且不耗能的。"]},{"id":"M-96-1_47","t":"M","y":96,"q":"Mevalonate 是膽固醇的前驅物，每形成一分子的膽固醇須多少分子的Mevalonate？","o":["3","4","5","6"],"a":[3],"ch":["21"],"sec":"21.4","fbt":"","ex":["3 個 mevalonate 只提供 15 個碳，不足以構成 squalene。","4 個不足。","5 個提供 25 個碳，仍不足。","每個 mevalonate（6 碳）脫羧後貢獻一個五碳異戊二烯單元；squalene 需要 30 個碳，故需 6 個 mevalonate（再環化、去掉 3 個碳成 27 碳的膽固醇）。"]},{"id":"M-96-1_48","t":"M","y":96,"q":"一個Palmitic acid 完全氧化後可以淨得多少ATP？","o":["125","129","130","140"],"a":[0,1,2,3],"ch":[],"sec":"","fbt":"","free":1},{"id":"M-96-1_49","t":"M","y":96,"q":"下列何種酵素活性之抑制可以提升cAMP 濃度，以減緩氣喘症狀？","o":["phospholipase C","adenylate cyclase","protein kinase A","cAMP phosphodiesterase"],"a":[3],"ch":["12"],"sec":"12.2","fbt":"Figure 12-4","ex":["抑制 phospholipase C 影響的是 IP3／DAG 那條路，不會提升 cAMP。","抑制 adenylate cyclase 會「降低」cAMP，方向相反。","抑制 pro rophenol 抑制呼吸鏈(respiratory chain)之機制？","o":["抑制 ATP-ADP 交換(exchange)","磷酸化反應與電子傳遞的解偶聯(uncoupling)","抑制ATP synthase 活性","抑制電子的傳遞(electron transfer)"],"a":[1],"ch":["19"],"sec":"19.1","fbt":"Table 19-4"},{"id":"M-96-2_38","t":"M","y":96,"q":"一分子 acetyl CoA 氧化生成二氧化碳和水共產生多少分子的ATP(包括GTP 在內)？［假設一對電子進入呼吸鏈在NADH-Q reductase(Complex I)，cytochrome reductase(Complex III)，cytochrome oxidase(Complex IV)分別可產生1、0.5、1 個ATP］","o":["8","9","10","12"],"a":[2],"ch":["19"],"sec":"19.3","fbt":"Table 19-5"},{"id":"M-96-2_39","t":"M","y":96,"q":"下列那個輔酶(coenzyme)可輔助轉胺酶(aminotransferase)進行胺基(amino group)之傳遞反應？","o":["NAD+","FAD","磷酸吡哆醛(pyridoxal phosphate)","硫胺素焦磷酸(thiamine pyrophosphate)"],"a":[2],"ch":["18"],"sec":"18.1","fbt":"","ex":["NAD+ 負責氫與電子的傳遞。","FAD 負責氫與電子的傳遞。","磷酸吡哆醛暫時接走胺基變成 pyridoxamine phosphate，再把胺基交給另一個酮酸，是轉胺酶的專屬輔酶。","硫胺素焦磷酸負責脫羧反應。"]},{"id":"M-96-2_40","t":"M","y":96,"q":"胰凝乳蛋白酶原(chymotrypsinogen)如何轉換形成胰凝乳蛋白酶(chymotrypsin)？","o":["由一蛋白激酶(protein kinase)將胰凝乳蛋白酶原作磷酸化(phosphorylation)，而生成胰凝乳蛋白酶","胰凝乳蛋白酶原與cAMP 結合，而形成胰凝乳蛋白酶","胰凝乳蛋白酶原與鈣離子結合，而形成胰凝乳蛋白酶","胰凝乳蛋白酶原經由蛋白水解(proteolysis)，而生成胰凝乳蛋白酶"],"a":[3],"ch":["6"],"sec":"6.4","fbt":""},{"id":"M-96-2_41","t":"M","y":96,"q":"α-胺基酸中的胺基(-NH2)與羧基(-COOH)，其pKa 值分別為10 和2，當pH 接近中性時，胺基會接受一個質子(proton)，而羧基則失去一個質子，這種狀態或現象稱為：","o":["異構現象(isomerization)","中和現象(neutralization)","兩性離子(zwitterions)","立體異構現象(stereoisomerization)"],"a":[2],"ch":["3"],"sec":"3.1","fbt":"Figure 3"},{"id":"M-96-2_42","t":"M","y":96,"q":"在 DNA 上不常見的5'-methyl cytosine 被去胺基後(deamination)，可見在複製後出現何種突變？","o":["CG to TA","CG to GC","CG to AT","G 被去除掉"],"a":[0],"ch":["25"],"sec":"25.2","fbt":""},{"id":"M-96-2_43","t":"M","y":96,"q":"在試管中進行polymerase chain reaction(PCR)合成DNA，需要：","o":["DNA 模板(template)，引子(primer)，DNA 聚合酶(polymerase)","DNA 模板(template)，DNA 解旋酸(helicase)，DNA 聚合酶(polymerase)","引導體(primosome)，引子(primer)，DNA 聚合酶(polymerase)","複製叉(replication fork)，引子(primer)，DNA 聚合酶(polymerase)"],"a":[0],"ch":["8"],"sec":"8.3","fbt":"","ex":["試管中的 PCR 只需要模板、引子與耐熱聚合酶（加上 dNTP 與 Mg2+），靠溫度循環取代細胞內的解旋與引子合成機制。","PCR 以高溫取代解旋酶，不需要 helicase。","引導體（primosome）是細胞內合成 RNA 引子的複合體；PCR 直接加入人工合成的 DNA 引子。","複製叉是細胞內複製的結構，試管反應中不存在。"]},{"id":"M-96-2_44","t":"M","y":96,"q":"如果一細胞無法合成或獲得葉酸(folic acid)，則此細胞將無法合成下列那種胺基酸？","o":["isoleucine","leucine","lysine","methionine"],"a":[3],"ch":["22"],"sec":"22.2","fbt":"Figure 22-17","ex":["isoleucine 是必需胺基酸，人體本來就不能合成，與葉酸有無無關。","leucine 是必需胺基酸，人體本來就不能合成。","lysine 是必需胺基酸，人體本來就不能合成。","甲硫胺酸雖也是必需胺基酸，但人體能用 N5-methyl-THF 經 methionine synthase 把 homocysteine「再生」成 methionine；沒有葉酸這條再生路就斷了，是四者中唯一真正依賴葉酸的。"]},{"id":"M-96-2_45","t":"M","y":96,"q":"Serotonin 是由那一個胺基酸衍生合成？","o":["tyrosine","tryptophan","arginine","lysine"],"a":[1],"ch":["22"],"sec":"22.4","fbt":"Figure 22-31","ex":["酪胺酸衍生出兒茶酚胺、甲狀腺素與黑色素。","色胺酸經 tryptophan hydroxylase 生成 5-hydroxytryptophan，再脫羧成 serotonin。","精胺酸衍生出 NO 與尿素。","離胺酸不衍生神經傳導物質。"]},{"id":"M-96-2_46","t":"M","y":96,"q":"酮體(ketone bodies)不包括下列何者？","o":["acetobutyrate","3-hydroxybutyrate","acetone","acetoacetate"],"a":[0],"ch":["17"],"sec":"17.3","fbt":"","ex":["並沒有 acetobutyrate 這個酮體；人體的酮體只有三種。","3-hydroxybutyrate（β-羥基丁酸）是血中含量最高的酮體。","acetone 由 acetoacetate 自發脫羧而來，由呼氣排出（酮酸中毒病人的水果味）。","acetoacetate 是生酮路徑的直接產物。"]},{"id":"M-96-2_47","t":"M","y":96,"q":"下列何者位於粒線體的外膜(outer mitochondrial membrane)？","o":["acyl CoA synthetase","cytochrome c","nucleotide kinase","glycerol 3-phosphate dehydrogenase"],"a":[0],"ch":["17"],"sec":"17.1","fbt":"","ex":["acyl-CoA synthetase（硫激酶）位於粒線體「外膜」，把脂肪酸活化成 acyl-CoA，之後才由 carnitine 系統送入。","cytochrome c 是附著在內膜外側面的膜間腔蛋白。","核苷酸激酶位於膜間腔。","glycerol 3-phosphate dehydrogenase（穿梭用的那個）位於內膜面向膜間腔的一側。"]},{"id":"M-96-2_48","t":"M","y":96,"q":"中樞神經細胞中荷爾蒙或neurotransmitters 作用時可透過phosphatidylinositol(PI)-based signal transduction system。躁鬱症治療常用的鋰鹽(lithium)被認為可降低PI system 之運作，使神經細胞對neurotransmitters 刺激較不敏感，因而達到療效。下列關於PI system 之敘述何者錯誤？","o":["PI system 的啟動牽涉到phospholipase C 的活化","IP3 的形成必須藉由一phosphatase 作用","PI system 啟動後細胞質內鈣離子濃度上升","PI system 啟動造成diacylglycerol(DAG)的釋出"],"a":[1],"ch":["12"],"sec":"12.2","fbt":"Figure 12-11","ex":["PI system 的啟動需要 Gq 活化 phospholipase C，正確。","IP3 是由 PLC 水解 PIP2 的磷酸二酯鍵而來，靠的是 phospholipase 不是 phosphatase；phosphatase（含鋰鹽抑制的 inositol monophosphatase）作用在 IP3 之後的去磷酸化回收步驟，故此敘述錯誤。","IP3 使內質網釋鈣，細胞質鈣濃度上升，正確。","PLC 的另一個產物就是 DAG，正確。"]},{"id":"M-96-2_49","t":"M","y":96,"q":"E. coli 修護DNA 複製產生之錯配(mismatch)，須靠辨識母股(parental strand)上的何種修飾？","o":["adenine 甲基化","guanine 甲基化","cytosine 甲基化","thymine 甲基化"],"a":[0],"ch":["25"],"sec":"25.2","fbt":"Figure 25-21"},{"id":"M-96-2_5","t":"M","y":96,"q":"骨骼肌產生收縮所需之ATP，最先由何方式產生？","o":["磷酸肌酸(creatine phosphate)轉移出能量和磷酸根與ADP 結合","氧化磷酸化反應(oxidative phosphorylation)","醣分解反應(glycolysis)","脂肪酸(fatty acid)氧化"],"a":[0],"ch":["23"],"sec":"23.2","fbt":"Figure 23-20","ex":["磷酸肌酸是肌肉的即時能量緩衝，由 creatine kinase 把高能磷酸根直接轉給 ADP，數秒內即可供能，是最快的來源。","氧化磷酸化反應慢，是持久運動的主力。","糖解比磷酸肌酸慢，約在數秒後才成為主力。","脂肪酸氧化最慢，屬長時間低強度運動的能源。"]},{"id":"M-96-2_50","t":"M","y":96,"q":"5'-AAGAAGAAGAAGAAGAAGAAG3'---為一合成的RNA，以此為模板而進行在試管中的轉譯實驗，請問預期可產生幾種的胜肽種類？","o":["1","2","3","4"],"a":[0,1,2,3],"ch":[],"sec":"","fbt":"","free":1},{"id":"M-95-1_26","t":"M","y":95,"q":"威而鋼(Viagra)是cGMP phosphodiesterase的抑制劑，其作用為維持:","o":["高活性的G protein","高濃度的cGMP","低活性的G protein","低濃度的cGMP"],"a":[1],"ch":["12"],"sec":"12.6","fbt":"","ex":["與 G 蛋白的活性高低無關。","抑制 cGMP phosphodiesterase（PDE5）使 cGMP 不被水解，維持高濃度 cGMP → PKG 活化 → 平滑肌放鬆、血流增加。","同樣與 G 蛋白活性無關。","方向相反：抑制分解酵素會讓 cGMP 升高而非降低。"]},{"id":"M-95-1_27","t":"M","y":95,"q":"在動物中經由肌肉細胞代謝過程所產生的ammonia，藉由何者運輸到liver進行尿素循環(Urea cycle)?","o":["alanine","glycine","serine","cysteine"],"a":[0],"ch":["18"],"sec":"18.1","fbt":"Figure 18-9","ex":["肌肉把胺基轉給丙酮酸形成丙胺酸，經血液送到肝臟，肝再取回胺基進尿素循環、把丙酮酸做成葡萄糖送回（glucose-alanine cycle）。","甘胺酸不是肌肉運氮的主要形式。","絲胺酸不是肌肉運氮的主要形式。","半胱胺酸不是運氮的載體。"]},{"id":"M-95-1_28","t":"M","y":95,"q":"限制酵素可以切割DNA，它不可以用於下列何者用途?","o":["診斷鐮刀型貧血","重組 DNA","南方點墨法(Southern blot)","診斷懷孕"],"a":[3],"ch":["9"],"sec":"9.1","fbt":"","ex":["鐮刀型貧血的 βS 突變破壞了 MstII 的切點，可用限制酶切後的片段長度差異診斷。","切出黏性末端再接合，正是重組 DNA 的基礎。","南方墨點法的第一步就是用限制酶把 DNA 切成片段再電泳。","診斷懷孕是測尿液或血中的 hCG（免疫學方法），與 DNA 的限制酶切割完全無關。"]},{"id":"M-95-1_29","t":"M","y":95,"q":"在Lesch-Nyhan syndrome中除了尿酸昇高外，血液及尿液中還有那一種物質昇高?","o":["Hypoxanthine","Inosine 5’-hypoxanthine","Guanosine 5’-monophosphate","ATP"],"a":[0],"ch":["22"],"sec":"22.4","fbt":"","ex":["HGPRT 缺乏使 hypoxanthine 無法回收成 IMP，與鳥糞嘌呤一起在血中與尿中堆積，再被 xanthine oxidase 氧化成尿酸。","「Inosine 5′-hypoxanthine」不是標準化合物名稱。","回收路徑受阻，GMP 的生成反而減少。","ATP 不會因為 HGPRT 缺乏而升高。"]},{"id":"M-95-1_30","t":"M","y":95,"q":"下列何種脂蛋白(lipoprotein)的主要功能是將cholesterol運送給周邊組織?","o":["Chylomicron","VLDL","LDL","HDL"],"a":[2],"ch":["21"],"sec":"21.4","fbt":"Figure 21-40","ex":["乳糜微粒運送的是小腸吸收的食物三酸甘油酯。","VLDL 運送的是肝臟自行合成的三酸甘油酯。","LDL 由 VLDL 代謝而來，核心以膽固醇酯為主，經 Apo B-100 與周邊細胞的 LDL 受體結合，把膽固醇送給周邊組織。","HDL 的功能相反 —— 把周邊多餘的膽固醇帶回肝臟（逆向運輸），所以被稱為好膽固醇。"]},{"id":"M-95-1_31","t":"M","y":95,"q":"下列何種激素不能活化脂肪組織triacylglycerol lipase的活性?","o":["insulin","norepinephrine","adrenocorticotropic hormone","glucagon"],"a":[0],"ch":["23"],"sec":"23.3","fbt":"Table 23-4","ex":["胰島素使 triacylglycerol lipase（hormone-sensitive lipase）去磷酸化而失活，是抑制而非活化。","正腎上腺素經 β 受體→cAMP→PKA 磷酸化並活化之。","ACTH 也能經 cAMP 路徑活化脂解。","升糖素同樣經 cAMP-PKA 活化脂解。"]},{"id":"M-95-1_32","t":"M","y":95,"q":"下列有關膽固醇合成之敘述，何者錯誤?","o":["胰島素可刺激HMG-CoA reductase","細胞內高濃膽固醇可以刺激膽固醇脂(cholesterol ester)的形成","從飲食中攝取的膽固醇是不會影響到肝細胞中膽固醇的合成","一些膽固醇的中間代謝產物會抑制HMG-CoA reductase"],"a":[2],"ch":["21"],"sec":"21.4","fbt":"Figure 21-43","ex":["胰島素促使 HMG-CoA reductase 去磷酸化而活化，敘述正確。","細胞內膽固醇過多會活化 ACAT 形成膽固醇酯儲存，敘述正確。","飲食攝取的膽固醇經乳糜微粒殘粒進入肝細胞後，會抑制 HMG-CoA reductase 並下調 SREBP，肝臟自行合成因而減少 —— 這正是人體維持膽固醇恆定的方式，說「不會影響」錯誤。","膽固醇合成路徑的中間產物（如氧化固醇類）會回饋抑制 HMG-CoA reductase 並促其降解，敘述正確。"]},{"id":"M-95-1_33","t":"M","y":95,"q":"醣蛋白(N-linked glycoprotein)的生成中，攜帶寡醣(oligosaccharide moiety)的分子為下列何者?","o":["isoprene","dolichol phosphate","Coenzyme A","thiamine pyrophosphate"],"a":[1],"ch":["27"],"sec":"27.3","fbt":"Figure 27-41"},{"id":"M-95-1_34","t":"M","y":95,"q":"下列何者可作為葡萄糖新生作用(gluconeogenesis)的前體(precursor)?","o":["glycerol","leucine","palmitic acid","glycine"],"a":[0],"ch":["14"],"sec":"14.4","fbt":"Figure 14-16"},{"id":"M-95-1_35","t":"M","y":95,"q":"胰蛋白酶(trypsin)切於蛋白質內何種胺基酸之羧端?","o":["苯丙胺酸(phenylalanine)","離胺酸(lysine)","甲硫胺酸(methionine)","天冬胺酸(aspartate)"],"a":[1],"ch":["3"],"sec":"3.4","fbt":"Table 3-6"},{"id":"M-95-1_36","t":"M","y":95,"q":"下列有關胺基酸之描述，何者正確?","o":["蛋白質中胺基酸為 D form","蛋白質中胺基酸以離子鍵彼此聯接","自然界中存在數百種胺基酸","胺基酸在 pH=7 時為中性"],"a":[2],"ch":["3"],"sec":"3.1","fbt":""},{"id":"M-95-1_37","t":"M","y":95,"q":"下列有關蛋白質的結構敘述，何項正確?","o":["雙硫鍵(Disulfide bond)構成蛋白質的二級結構","蛋白質都含有一至四級結構","肌紅蛋白有四級結構","αhelix是常見的蛋白質二級結構"],"a":[3],"ch":["4"],"sec":"4.2 4.3","fbt":"Figure 4-16"},{"id":"M-95-1_38","t":"M","y":95,"q":"下列何種反應條件，酵素可達到其催化之最高速度?","o":["反應物濃度<Km","反應物濃度=Km","所有酵素均與反應物結合","溫度達到 100°C"],"a":[2],"ch":["6"],"sec":"6.3","fbt":""},{"id":"M-95-1_39","t":"M","y":95,"q":"下列有關膠原蛋白(collagen)之敘述，何者正確?","o":["膠原蛋白螺旋(collagen helix)的α鏈(αchain)由三個胺基酸重複出現的右手型(right-handed)螺旋所構成","其每一圈(turn)含有四個胺基酸殘基(amino acid residues)","其構造中通常含有 Glu-X-Y 重複出現的結構","其含有特殊胺基酸羥脯胺酸(4-hydroxyproline)"],"a":[3],"ch":["4"],"sec":"4.3","fbt":""},{"id":"M-95-1_40","t":"M","y":95,"q":"一個反應在有酵素催化及無酵素催化時，下列何項為正確?","o":["其平衡常數(equilibrium constant)會改變","有酵素催化的反應其活化能(activation energy)會下降","有酵素催化的反應其標準自由能變化(standard free energy change)會改變","有酵素催化的反應其初始速度(initial velocity)會下降"],"a":[1],"ch":["6"],"sec":"6.2","fbt":"Figure 6-3"},{"id":"M-95-1_41","t":"M","y":95,"q":"在研究細菌DNA複製過程中，5’-bromouracil常用來取代thymidine的藥品，其原因為何?","o":["導致DNA合成的終止","容易在DNA上產生切割位置","可以產生較重的DNA，且易於用離心方式分離","可以用來染色DNA"],"a":[2],"ch":["25"],"sec":"","fbt":""},{"id":"M-95-1_42","t":"M","y":95,"q":"下列對於RNA polymerase之敘述何者錯誤?","o":["在真核細胞中有三大類","在轉錄過程中RNA polymerase需要primer來進行RNA合成","Cycloheximide不能抑制它的活性","在原核細胞中需要 sigma 因子來辨識啟動子(promoter)"],"a":[1],"ch":["26"],"sec":"","fbt":""},{"id":"M-95-1_43","t":"M","y":95,"q":"如圖卡-095-1-2-01為三種不同雙螺旋DNA結構(A form; B form; Z form)的特性，請指出代號 W、X、Y 的結構型式(structural form)名稱:","o":["W = Z form DNA; X = A form DNA; Y = B form DNA","W = Z form DNA; X = B form DNA; Y = A form DNA","W = A form DNA; X = Z form DNA; Y = B form DNA","W = A form DNA; X = B form DNA; Y = Z form DNA"],"a":[0],"ch":["8"],"sec":"8.2","fbt":"Figure 8-17","ex":["（本題需搭配原卷的性質對照表，題庫的文字檔沒有附圖。）官方答案為 W = Z 型、X = A 型、Y = B 型。","判別要訣一：旋向。只有 Z 型是左旋，A 與 B 都是右旋。","判別要訣二：每圈鹼基數與軸向間距。A 型約 11 bp/圈、鹼基對間距 2.6 Å；B 型約 10.5 bp/圈、3.4 Å；Z 型約 12 bp/圈、3.7 Å。","判別要訣三：溝槽。B 型有明顯的大溝與小溝；A 型大溝深窄、小溝寬淺；Z 型小溝深窄、幾乎看不出大溝，骨架呈鋸齒狀。"]},{"id":"M-95-1_44","t":"M","y":95,"q":"大腸桿菌中DNA聚合酶(I, II, III)的特性如圖卡-095-1-2-02，在下列選項中找出各個聚合酶(X, Y, Z)的名稱:","o":["X = polymerase I, Y = polymerase II, Z = polymerase III","X = polymerase I, Y = polymerase III, Z = polymerase II","X = polymerase II, Y = polymerase I, Z = polymerase III","X = polymerase II, Y = polymerase III, Z = polymerase I"],"a":[3],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-95-1_45","t":"M","y":95,"q":"因核苷酸去除修復(nucleotide excision repair)系統發生變異時所引起的兩種疾病a及b：a. Xeroderma pigmentosum b. Cockayne’s syndrome，這兩種疾病的病徵為：I.皮膚對光影敏感，生長衰敗，神經系統異常 II.人類遺傳疾病，可引起皮膚癌 III.可增加乳癌和卵巢癌的風險。請選出最合適的配對:","o":["a-I, b-II","a-II, b-I","a-III, b-II","a-I, b-III"],"a":[1],"ch":["25"],"sec":"25.2","fbt":"Box 25-1"},{"id":"M-95-1_46","t":"M","y":95,"q":"胺基酸的遺傳編碼(genetic code)是由三個鹼基(triplet)所組成。一種tRNA可辨識同一胺基酸的不同編碼，其原因為何?","o":["是由於tRNA上的反編碼子(anticodon)的5’端鹼基具搖擺配對(wobble base-pairing)能力","是由於tRNA上的反編碼子的3’端鹼基具搖擺配對能力","是由於tRNA 上的反編碼子與mRNA上的編碼子5’端鹼基可作彈性配對","是由於轉譯時使用不同的轉譯起點(translation initiation site)所致"],"a":[0],"ch":["27"],"sec":"27.1","fbt":"Figure 27-8"},{"id":"M-95-1_47","t":"M","y":95,"q":"下列有關E. coli DNA複製的敘述，何者錯誤?","o":["需要RNA的引子","主要由DNA polymerase I來合成","在複製過程中由Helicase打開複製的分叉","複製的方向是從5’→3’，而且可校正錯誤"],"a":[1],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-95-1_48","t":"M","y":95,"q":"在100公尺短跑中，下列何者為肌肉前4秒主要的能源?","o":["anaerobic metabolism of glucose","aerobic metabolism of glucose","creatine phosphate","ketone bodies"],"a":[2],"ch":["23"],"sec":"23.2","fbt":"Figure 23-20","ex":["無氧糖解約在數秒之後才成為主力，可支撐約 1 分鐘。","有氧代謝啟動更慢，是長時間運動的能源。","衝刺最初 3–5 秒的 ATP 幾乎完全由磷酸肌酸經 creatine kinase 直接再生 ADP 而來，因為這是唯一快到足以跟上爆發性需求的途徑。","酮體是飢餓時的燃料，不是短跑的能源。"]},{"id":"M-95-1_49","t":"M","y":95,"q":"檸檬酸循環(Citric acid cycle)中那個酵素可催化FADH2的產生?","o":["異檸檬酸脫氫酶(Isocitrate dehydrogenase)","蘋果酸脫氫酶(Malate dehydrogenase)","α-酮戊二酸脫氫酶(α-Ketoglutarate dehydrogenase)","琥珀酸脫氫酶(Succinate dehydrogenase)"],"a":[3],"ch":["16"],"sec":"16.2","fbt":"Figure 16-7"},{"id":"M-95-1_50","t":"M","y":95,"q":"下列有關粒線體ATP合成酶(ATP synthase)的敘述，何者正確?","o":["它含有F0及F1次單元(subunit)，二者皆可穿透粒線體的胞膜","它單獨在水溶液中仍可以合成 ATP","它只能水解 ATP","當它催化 ATP 合成時，其標準自由能變化( ∆G'o )事實上是接近於零"],"a":[3],"ch":["19"],"sec":"19.2","fbt":"Figure 19-19"},{"id":"M-95-2_26","t":"M","y":95,"q":"有關姊妹單體交換(sister chromatid exchange)之敘述，何者正確?","o":["僅發生在減數分裂的酵母菌中","可發生於有絲分裂過程","發生在細胞 G1 週期","其交換處，必屬於相同的重複(direct repeat)序列"],"a":[1],"ch":["24"],"sec":"24.3","fbt":"Figure 24-33","ex":["姊妹染色分體交換並不限於酵母菌或減數分裂。","姊妹染色分體交換是兩條相同的姊妹染色分體之間的對等交換，發生於有絲分裂（S 期複製之後）；其頻率上升常被用作染色體不穩定與致突變物暴露的指標（如 Bloom 症候群明顯增加）。","G1 期尚未複製，根本沒有姊妹染色分體可交換。","交換點不必落在相同的直接重複序列上。"]},{"id":"M-95-2_27","t":"M","y":95,"q":"當胰島素(insulin)作用於細胞後，會直接造成:","o":["G protein的活化","insulin receptor上serine的磷酸化","insulin receptor的autophosphorylation","adenylate cyclase的活化"],"a":[2],"ch":["12"],"sec":"12.4","fbt":"","ex":["胰島素受體不經由三體 G 蛋白傳訊。","自我磷酸化發生在 tyrosine 殘基；受體的 serine 磷酸化反而是抑制性的（與胰島素抗性有關）。","胰島素結合後最直接的事件就是受體的 autophosphorylation（兩個 β 次單元互相磷酸化 tyrosine）。","胰島素不活化 adenylate cyclase；它反而使細胞內 cAMP 下降。"]},{"id":"M-95-2_28","t":"M","y":95,"q":"鐵硫蛋白(iron-sulfur protein)為一種電子傳遞蛋白質，下列相關敘述何者不正確?","o":["屬於 non-heme iron protein","其鐵硫簇(iron-sulfur cluster)的配體(ligand)大多是cysteine","Rieske protein屬於此類的蛋白","有3Fe-3S cluster"],"a":[3],"ch":["19"],"sec":"19.1","fbt":"Figure 19-5"},{"id":"M-95-2_29","t":"M","y":95,"q":"下列有關腺嘌呤核苷酸易位酶(adenine nucleotide translocase)之敘述，何者為真?","o":["位於粒線體的外膜","主要媒介 ATP 與 ADP 穿過粒線體內膜的互換反應","主要媒介 ATP 由粒線體膜外運送至間質(matrix)","主要媒介 ADP 由間質穿過粒線體內膜轉運至膜間空隙(intermembrane space)"],"a":[1],"ch":["19"],"sec":"19.2","fbt":"Figure 19-30"},{"id":"M-95-2_30","t":"M","y":95,"q":"N2可經由氮固化作用(nitrogen fixation)轉換成 ammonia，其所用到的兩個酵素為:","o":["nitrate reductase, nitrite reductase","glutamate synthase, glutamate dehydrogenase","dihydrofolate reductase, methione synthase","nitrogenase, nitrogenase reductase"],"a":[3],"ch":["22"],"sec":"22.1","fbt":"","ex":["nitrate reductase 與 nitrite reductase 負責硝酸同化（NO3− → NH3），不是固定大氣氮。","glutamate synthase 與 glutamate dehydrogenase 負責把氨同化成胺基酸，發生在固氮之後。","dihydrofolate reductase 與 methionine synthase 屬一碳代謝，與固氮無關。","固氮酶複合體由 dinitrogenase（nitrogenase，含 Fe-Mo 輔因子）與 dinitrogenase reductase（nitrogenase reductase，提供電子）兩個組件構成，耗大量 ATP 把 N2 還原成 NH3。"]},{"id":"M-95-2_31","t":"M","y":95,"q":"植物荷爾蒙Indole-3-acetic acid是由下列何種胺基酸代謝而來?","o":["Arginine","Histidine","Tryptophan","Phenylalanine"],"a":[2],"ch":["22"],"sec":"22.3","fbt":"Figure 22-30","ex":["精胺酸衍生 NO 與尿素。","組胺酸脫羧成組織胺。","色胺酸經脫胺與氧化生成 indole-3-acetic acid（生長素 auxin），是植物體內最主要的生長素。","苯丙胺酸在植物走 phenylpropanoid 路徑（木質素等），不是生長素來源。"]},{"id":"M-95-2_32","t":"M","y":95,"q":"下列對於嘌呤類的“salvage pathway\"\"敘述，何者為非?","o":["嘌呤可以再利用的過程","它比“de novo pathway\"\"消耗更多的 ATP","adenosine kinase是屬於嘌呤類salvage pathway的重要酵素","嘌呤salvage pathway中的Inosine 5’-monophosphate是由hypoxanthine所產生"],"a":[1],"ch":["22"],"sec":"22.4","fbt":"","ex":["salvage pathway 的定義就是把游離鹼基與核苷再利用，敘述正確。","回收路徑只需一兩步、能量成本遠低於 de novo（從頭合成 IMP 要耗 5 個以上的 ATP），說它消耗更多 ATP 為非。","adenosine kinase 把 adenosine 直接磷酸化成 AMP，是回收路徑的酵素，敘述正確。","HGPRT 把 hypoxanthine 加上 PRPP 的核糖磷酸生成 IMP，敘述正確。"]},{"id":"M-95-2_33","t":"M","y":95,"q":"acetyl CoA carboxylase 所催化之反應，為脂肪酸合成途徑的關鍵步驟(committed step)，下列何者為此酵素之變構活化物(allosteric activator)?","o":["palmitoyl CoA","AMP","NADPH","citrate"],"a":[3],"ch":["21"],"sec":"21.1","fbt":"Figure 21-11","ex":["palmitoyl-CoA 是脂肪酸合成的終產物，對 ACC 是回饋「抑制」劑。","AMP 代表能量不足，經 AMPK 抑制 ACC。","NADPH 是後續 fatty acid synthase 的還原力，不調控 ACC。","檸檬酸從粒線體運出代表碳源與能量充足，異位活化 ACC 並促其聚合成有活性的長絲狀多聚體。"]},{"id":"M-95-2_34","t":"M","y":95,"q":"Tay-Sachs病是溶酵素體貯積病(lysosomal storage disease)之一，它是由於缺乏下列何種酵素所導 致?","o":["beta-N-acetylhexosaminidase","HMG-CoA reductase","alpha-1,4-glucosidase","amylo-1,6-glucosidase"],"a":[0],"ch":["10"],"sec":"10.2","fbt":"Box 10-1","ex":["Tay-Sachs 缺乏溶小體的 β-N-acetylhexosaminidase A，GM2 神經節苷脂無法分解而堆積於神經元。","HMG-CoA reductase 是膽固醇合成的限速酶，與此無關。","α-1,4-glucosidase（酸性麥芽糖酶）缺乏是龐貝氏症（第 II 型肝醣貯積症）。","amylo-1,6-glucosidase（去分支酶）缺乏是 Cori 病（第 III 型肝醣貯積症）。"]},{"id":"M-95-2_35","t":"M","y":95,"q":"下列有關sphingolipid合成之敘述，何者正確?","o":["所有來自palmitate和serine的碳原子都包含入sphingosine","Phosphatidic acid是一個主要的中間產物","CDP-sphingosine是一個活化的中間產物","由palmitate和serine合成ceramide時，同時會產生二氧化碳"],"a":[3],"ch":["21"],"sec":"21.4","fbt":"Figure 21-31","ex":["serine 的羧基在縮合時以 CO2 形式脫去，所以並非「所有」來自 palmitate 與 serine 的碳都留在 sphingosine 中。","phosphatidic acid 是甘油磷脂的中間產物，鞘脂的骨架是 sphinganine，不經此物。","鞘脂合成沒有「CDP-sphingosine」這個中間物；CDP-choline 是在最後加頭基時才用到。","palmitoyl-CoA 與 serine 由 serine palmitoyltransferase 縮合成 3-ketosphinganine，同時釋出 CO2，敘述正確。"]},{"id":"M-95-2_36","t":"M","y":95,"q":"脂肪細胞不具下列何種酵素的活性?","o":["triose phosphate isomerase","glycerol phosphate dehydrogenase","hexokinase","glycerol kinase"],"a":[3],"ch":["21"],"sec":"21.2","fbt":"","ex":["triose phosphate isomerase 屬糖解作用，脂肪細胞具有。","glycerol 3-phosphate dehydrogenase 把 DHAP 還原成甘油-3-磷酸，脂肪細胞正是靠它取得酯化所需的骨架。","hexokinase 把葡萄糖磷酸化，脂肪細胞具有。","脂肪細胞幾乎沒有 glycerol kinase，所以脂解釋出的甘油無法原地再利用，只能送到肝臟；也因此脂肪細胞必須靠糖解產生的 DHAP 才能合成三酸甘油酯 —— 沒有葡萄糖就無法有效儲脂。"]},{"id":"M-95-2_37","t":"M","y":95,"q":"肝醣合成酶(glycogen synthase)可被下列何種反應直接活化?","o":["肝醣合成酶激酶3(Glycogen synthase kinase 3)在肝醣合成酶之特定胺基酸上作磷化反應","酪蛋白激酶II(Casein kinase II)在肝醣合成酶之特定胺基酸上作磷化反應","磷蛋白磷酸水解酶第一型(Phosphoprotein phosphatase 1)將肝醣合成酶分子中多個位置作去磷化反應","在胰高血糖激素(glucagon)存在下"],"a":[2],"ch":["15"],"sec":"15.5","fbt":""},{"id":"M-95-2_38","t":"M","y":95,"q":"抗生素tunicamycin可抑制下列何步驟?","o":["N-glycosylation","nucleotide synthesis","protein synthesis","oxidative phosphorylation"],"a":[0,2],"ch":["27"],"sec":"27.3","fbt":""},{"id":"M-95-2_39","t":"M","y":95,"q":"檸檬酸循環(citric acid cycle)的代謝物(metabolite)中，何者作為卟啉(porphyrin)生合成的前體(precursor)?","o":["Oxaloacetate","alpha-ketoglutarate","citrate","succinyl CoA"],"a":[3],"ch":["16"],"sec":"16.2","fbt":"Figure 16-16"},{"id":"M-95-2_40","t":"M","y":95,"q":"下列那一個方法可用來估計蛋白質分子量?","o":["凝膠層析(gel filtration chromatography)","等電聚焦(isoelectric focusing)","親合層析(affinity chromatography)","自然膠電泳(native gel electrophoresis)"],"a":[0],"ch":["3"],"sec":"3.3","fbt":""},{"id":"M-95-2_41","t":"M","y":95,"q":"利用280 nm吸光值定量蛋白質是常用的方式，蛋白質的那一個胺基酸被破壞時會影響吸光值?","o":["絲胺基酸(serine)","色胺基酸(tryptophan)","天冬胺基酸(aspartic acid)","甲硫胺基酸(methionine)"],"a":[1],"ch":["3"],"sec":"3.1","fbt":""},{"id":"M-95-2_42","t":"M","y":95,"q":"有關膠原蛋白(collagen)的生合成之敘述，何者錯誤?","o":["在proline及lysine常作後修飾(modification)","需要Vitamin C的參與","大部分由glycine、alanine、proline 所組成","後修飾只有 hydroxylation"],"a":[3],"ch":["4"],"sec":"4.3","fbt":"Box 4-3"},{"id":"M-95-2_43","t":"M","y":95,"q":"如果把真核細胞的一段基因嵌入E. coli DNA中，卻無法表現此真核蛋白質，原因可能是?","o":["原核細胞和真核細胞的遺傳密碼不同","原核細胞只可以轉譯polycistronic mRNA","E. coli無法移除introns","E. coli RNA polymerase不能把真核DNA轉錄成mRNA"],"a":[2],"ch":["26"],"sec":"26.2","fbt":""},{"id":"M-95-2_44","t":"M","y":95,"q":"RNA polymerase有別於DNA polymerase，因其:","o":["具校正功能","可利用 nucleoside monophosphates 合成核酸","在合成 RNA 時，不需要 RNA primer","合成方向從 5' 端到 3' 端"],"a":[2],"ch":["26"],"sec":"26.1","fbt":"Figure 26-6"},{"id":"M-95-2_45","t":"M","y":95,"q":"下列何者是 DNA 包裹的層次次序:","o":["DNA→核小體(nucleosome)→染色質原纖維(chromatin fibril)→染色質纖維圈套(chromatin fiber looping)→染色體(chromosome)","DNA→染色質原纖維→核小體→染色體→染色質纖維圈套","DNA→核小體→染色質纖維圈套→染色質原纖維→染色體","DNA→染色質原纖維→染色質纖維圈套→核小體→染色體"],"a":[0],"ch":["24"],"sec":"24.3","fbt":"","ex":["包裝層次由小而大：裸 DNA 先纏上組織蛋白八聚體成核小體（「串珠」），串珠再盤繞成 30 nm 的染色質原纖維，原纖維再形成附著於蛋白支架的環圈，最後在分裂期高度壓縮成可見的染色體，總壓縮比約一萬倍。","核小體必定先於染色質原纖維形成。","染色質原纖維在纖維圈套之前，順序顛倒。","核小體是最基本的單元，不可能排在纖維圈套之後。"]},{"id":"M-95-2_46","t":"M","y":95,"q":"下列何者是“鹼基去除修復(base excision repair)\"\"的主要化合物?","o":["糖基化酶(DNA-N-Glycosylase)、AP內切酶(AP endonuclease)","Uvr B/C 內切酶、光解酶(Photolyase)","AP內切酶、烷化鳥嘌呤-烷基轉移酶(O6-Alkylguanine Alkytransferase)","Ruv D內切酶、Rec BCD內切酶"],"a":[0],"ch":["25"],"sec":"25.2","fbt":"Figure 25-24"},{"id":"M-95-2_47","t":"M","y":95,"q":"下列有關E. coli修補O6-methylguanine的敘述，何者正確?","o":["利用甲基轉移酶(methyltransferase)將甲基送到四氫葉酸(tetrahydrofolate)","利用甲基轉移酶將甲基送到甲基轉移酶本體","利用DNA去甲基酶(DNA demethylase)送到四氫葉酸","利用DNA去甲基酶送到水中"],"a":[1],"ch":["25"],"sec":"25.2","fbt":""},{"id":"M-95-2_48","t":"M","y":95,"q":"減數分裂中DNA重組是經由:","o":["雙股斷裂(double-strand break)重組","單股斷裂(single-strand break)重組","端粒(telomere)重組","著絲粒(centromere)重組"],"a":[0],"ch":["25"],"sec":"25.3","fbt":""},{"id":"M-95-2_49","t":"M","y":95,"q":"神經傳遞中下列那一項可能最直接促使神經末梢之乙醯膽鹼(acetylcholine)釋放?","o":["電壓門控鈉離子通道(voltage-gated sodium ion channel)打開","電壓門控鉀離子通道(voltage-gated potassium ion channel)打開","電壓門控鈣離子通道(voltage-gated calcium ion channel)打開","電壓門控鎂離子通道(voltage-gated magnesium ion channel)打開"],"a":[2],"ch":["12"],"sec":"12.8","fbt":"Figure 12-29","ex":["電壓門控鈉通道開放引發動作電位，但不直接觸發囊泡融合。","電壓門控鉀通道開放是再極化，會終止而非促成釋放。","動作電位傳到軸突末梢使電壓門控鈣通道開啟，Ca2+ 內流直接觸發突觸囊泡與膜融合而釋出乙醯膽鹼 —— 最直接的一步。","並沒有生理上有意義的電壓門控鎂離子通道。"]},{"id":"M-95-2_50","t":"M","y":95,"q":"請指出何者不是核糖核酸(ribonucleic acid, RNA)的特性?","o":["其五碳2'位置上為羥基(hydroxy group, -OH)","很多核糖核酸如tRNA能形成雙螺旋構造","在RNA的分子內A和G可分別與U和C形成氫鍵","在RNA的分子內A和U，以及G和C的量均等"],"a":[3],"ch":["8"],"sec":"8.1 8.2","fbt":"","ex":["RNA 的五碳糖 2′ 位帶羥基，正是 RNA 的定義性特徵。","tRNA、rRNA 的單股會自行回摺配對形成莖環與雙螺旋區段，確實具此特性。","RNA 分子內部回摺時，A 與 U、G 與 C 同樣以氫鍵配對（還常見 G–U 擺動配對）。","RNA 多為單股，Chargaff 法則不適用，A 與 U、G 與 C 的量不需要相等，故此非 RNA 的特性。"]},{"id":"D-113-1_67","t":"D","y":113,"q":"關於酶（enzyme）催化反應的敘述，下列何者錯誤？","o":["酶可以降低活化能（ΔG），提高反應速率","過渡態（transition state）位於反應坐標圖（reaction coordinate diagram）的頂點","酶的催化會影響反應速率但不會改變反應的平衡","受質（substrate）與酶的結合比過渡態（transition state）更緊密"],"a":[3],"ch":["6"],"sec":"6.2","fbt":""},{"id":"D-113-1_68","t":"D","y":113,"q":"下列胺基酸中，何者最不容易出現在膜蛋白穿膜區？","o":["組胺酸（histidine）","谷胺酸（glutamic acid）","色胺酸（tryptophan）","丙胺酸（alanine）"],"a":[1],"ch":["3"],"sec":"3.1","fbt":"Figure 3-5"},{"id":"D-113-1_69","t":"D","y":113,"q":"波爾效應（Bohr effect）在解釋血紅蛋白（Hemoglobin,Hb）與O2結合能力，當O2結合的百分比（縱軸；θ）對氧分壓（橫軸；pO2）關係如圖所示，下列敘述何者錯誤？","o":["pH下降時，Hb與O2結合的飽和曲線向右移","CO2的濃度影響Hb與O2的結合","在組織中pH 7.2比pH 7.4釋放更多O2","O2與H+競爭在Hb相同結合位置"],"a":[3],"ch":["5"],"sec":"5.1","fbt":"Figure 5-15"},{"id":"D-113-1_70","t":"D","y":113,"q":"下列那個選項可進行糖質新生作用（gluconeogenesis）？","o":["乙醯輔酶A（acetyl-CoA）與乙醯乙酸酯（acetoacetate）","草醯乙酸（oxaloacetate）與丙酮酸（pyruvate）","乙醯乙酸酯（acetoacetate）與硬脂酸（stearic acid）","草醯乙酸（oxaloacetate）與乙醯乙酸酯（acetoacetate）"],"a":[1],"ch":["14"],"sec":"14.4","fbt":"Figure 14-16"},{"id":"D-113-1_71","t":"D","y":113,"q":"寡黴素（oligomycin）對下列何者有直接抑制作用？","o":["ATP合成酶（ATP synthase）","電子傳遞鏈（electron transport chain）的Complex I","電子傳遞鏈（electron transport chain）的Complex Ⅱ","電子傳遞鏈（electron transport chain）的Complex Ⅳ"],"a":[0],"ch":["19"],"sec":"19.1","fbt":"Table 19-4"},{"id":"D-113-1_72","t":"D","y":113,"q":"生物體中，代謝的熱動力學效率是由那個偶合反應（coupling reaction）決定？","o":["NADH氧化","CO2釋放","O2還原","ATP代謝（水解和合成）"],"a":[3],"ch":["13"],"sec":"13.1","fbt":""},{"id":"D-113-1_73","t":"D","y":113,"q":"關於酮體（ketone bodies）的敘述，下列何者錯誤？","o":["包括丙酮（acetone）、乙醯乙酸酯（acetoacetate）、β羥基丁酸酯（β-hydroxybutyrate）","主要在小腸細胞之粒線體中合成","生合成涉及的酵素包括硫解酶（thiolase）、HMG-CoA裂解酶（HMG-CoA lyase）和HMG-CoA合成酶（HMG-CoA synthase）","為飢餓時大腦的主要能量來源"],"a":[1],"ch":["17"],"sec":"17.3","fbt":"Figure 17-18","ex":["酮體三者正是丙酮、乙醯乙酸與 β-羥基丁酸，敘述正確。","酮體主要在「肝細胞」的粒線體合成，不是小腸細胞，故此敘述錯誤。","生酮路徑依序由 thiolase、HMG-CoA synthase、HMG-CoA lyase 催化，敘述正確。","長期飢餓時大腦可把酮體當作主要燃料（因為脂肪酸無法通過血腦障壁），敘述正確。"]},{"id":"D-113-1_74","t":"D","y":113,"q":"關於細胞膜運送（membrane transport）的敘述，下列何者正確？","o":["飯後細胞從血液中攝取葡萄糖是屬於主動運輸（active transport）","大腸桿菌利用Lactose-H+ pump攝取lactose乃屬於一級主動運輸（primary active transport）","Na+-K+ ATPase屬主動運輸，將三個Na+送到細胞內，而將兩個K+送出細胞外","經由ionophores如Gramicidin A運送K+通過細胞膜乃屬被動運輸（passive transport）"],"a":[3],"ch":["11"],"sec":"11.3","fbt":"","ex":["飯後肌肉與脂肪靠 GLUT4 攝取葡萄糖，屬沿梯度的促進性擴散（被動），不是主動運輸。","乳糖-H+ 共同運輸靠的是呼吸鏈建立的質子驅動力，屬「二級」主動運輸，不是一級。","方向寫反了：Na+-K+ ATPase 是把 3 個 Na+ 送「出」細胞、2 個 K+ 送「入」細胞。","Gramicidin A 形成跨膜通道，讓 K+ 等單價陽離子沿電化學梯度流動，不耗能，屬被動運輸。"]},{"id":"D-113-1_75","t":"D","y":113,"q":"在核苷（nucleoside）結構中，五碳醣的第a號碳與鹼基（base）相連，而第b號碳的官能基決定此核苷是否為去氧核苷（deoxynucleoside）。a與b各為何？","o":["a , b = 1 , 2","a , b = 1 , 3","a , b = 3 , 5","a , b = 5 , 2"],"a":[0],"ch":["8"],"sec":"8.1","fbt":"Figure 8-1","ex":["鹼基接在 C1′ 上（N-糖苷鍵），而 C2′ 是 -OH 還是 -H 決定它是核苷還是去氧核苷。","決定去氧與否的是 2′ 位，不是 3′ 位。","鹼基接的是 C1′ 不是 C3′。","鹼基接的是 C1′ 不是 C5′（C5′ 接的是磷酸根）。"]},{"id":"D-113-1_76","t":"D","y":113,"q":"關於真核生物DNA複製，下列何者錯誤？","o":["由複製起點向兩個方向同時進行複製","為semidiscontinuous","需要DNA polymerase I","可分為leading strand 和lagging strand"],"a":[2],"ch":["25"],"sec":"25.1","fbt":"Figure 25-12"},{"id":"D-113-1_77","t":"D","y":113,"q":"Aspartate transcarbamoylase（ATCase）參與嘧啶（pyrimidine）生合成，可經由下列何方式進行異位調控？","o":["ATCase受到CTP的回饋抑制","ATCase受到ATP的回饋抑制","ATCase受到GTP的回饋抑制","ATCase活性不受異位調控"],"a":[0],"ch":["22"],"sec":"22.4","fbt":"Figure 22-38","ex":["ATCase 是異位調控的經典範例：終產物 CTP 結合調節次單元，使酵素偏向低活性的 T 態，屬回饋抑制。","ATP 的作用相反 —— 它是活化劑，把酵素推向 R 態，使嘌呤與嘧啶的合成量彼此平衡。","GTP 不是 ATCase 的調節物。","ATCase 正是受異位調控的教科書範例，說它不受調控是錯的。"]},{"id":"D-113-1_78","t":"D","y":113,"q":"在內源性的核糖核酸干擾（RNA interference, RNAi）中，下列那一個信使核糖核酸（mRNA）的結構最可能與微型核糖核酸（miRNA）結合？","o":["內含子（intron）","5′非轉譯區（5′-untranslated region, 5′-UTR）","編碼序列（coding sequence, CDS）","3′非轉譯區（3′-untranslated region, 3′-UTR）"],"a":[3],"ch":["28"],"sec":"28.3","fbt":"Figure 28-37"},{"id":"D-113-1_79","t":"D","y":113,"q":"反轉錄病毒（如HIV）利用反轉錄酶（reverse transcriptase），以RNA為模板合成DNA，下列敘述何者正確？","o":["其產物之錯誤率（error rate）較高，因反轉錄酶缺乏3´→5´exonuclease活性","反轉錄過程需DNA primer參與","反轉錄病毒之基因體為雙股RNA，因此特別穩定","反轉錄酶合成互補DNA（cDNA）之方向為3´→5´"],"a":[0],"ch":["26"],"sec":"26.3","fbt":"Figure 26-34"},{"id":"D-112-1_67","t":"D","y":112,"q":"血紅蛋白（hemoglobin）是一種異位蛋白（allosteric protein），關於血紅蛋白的敘述，下列何者錯誤？","o":["血紅蛋白與氧協同結合，使得R狀態穩定","血紅蛋白與2,3-雙磷酸甘油酸（2,3-bisphosphoglycerate）的結合，轉變為R狀態","血紅蛋白與H+結合，穩定T狀態","CO2和血紅蛋白的胺基末端結合，形成胺基甲酸酯（carbamate）的形式，穩定T狀態"],"a":[1],"ch":["5"],"sec":"5.1","fbt":"Figure 5-11"},{"id":"D-112-1_68","t":"D","y":112,"q":"關於胺基酸的衍生分子，下列敘述何者錯誤？","o":["酪胺酸（tyrosine）是包括多巴胺（dopamine）、正腎上腺素（norepinephrine）和腎上腺素（epinephrine）在內的兒茶酚胺（catecholamines）家族之前驅物","穀胱甘肽（glutathione）是谷胺酸（glutamate）、半胱胺酸（cysteine）和甘胺酸（glycine）組成的三胜肽","谷胺醯胺（glutamine）可進行脫羧（decarboxylation）產生 γ-胺基丁酸（GABA）","一氧化氮是由精胺酸（arginine）經一氧化氮合成酶（nitric oxide synthase）催化合成"],"a":[2],"ch":["22"],"sec":"22.3","fbt":"Figure 22-29; Figure 22-31; Figure 22-33","ex":["酪胺酸是兒茶酚胺家族（dopamine、norepinephrine、epinephrine）的共同前驅物，敘述正確。","穀胱甘肽確實是 γ-Glu-Cys-Gly 三胜肽，敘述正確。","脫羧生成 GABA 的是「谷胺酸」（由 glutamate decarboxylase 催化，需 PLP），不是谷胺醯胺，故此敘述錯誤。","NO 由精胺酸經 NO synthase 催化生成，敘述正確。"]},{"id":"D-112-1_69","t":"D","y":112,"q":"生理條件下，關於蛋白質中α螺旋（α helix）的敘述，下列何者錯誤？","o":["L-胺基酸所組成的螺旋構造主要為右旋型（right-handed helix）","穩定α螺旋構造的主要作用力是胜肽鍵間形成氫鍵","甘胺酸（glycine）是最小的胺基酸，因此最有利於α螺旋的形成","序列中連續三個離胺酸（lysine）會干擾α螺旋的形成"],"a":[2],"ch":["4"],"sec":"4.2","fbt":""},{"id":"D-112-1_70","t":"D","y":112,"q":"關於肝醣（glycogen）性質的敘述，下列何者錯誤？","o":["是一種用於儲存的多醣","是連接葡萄糖殘基（glucose residues）的支狀聚合物","所有分支末端均為還原端（reducing end）","高度支狀的結構可使其增加代謝效率"],"a":[2],"ch":["15"],"sec":"15.1","fbt":"Figure 15-2"},{"id":"D-112-1_71","t":"D","y":112,"q":"糖解途徑包含十個反應作用，其中有七個是可逆的，可用於糖解作用的逆向反應糖質新生。另外三種不可逆反應是由那幾個酵素催化？","o":["己糖激酶（hexokinase）、磷酸甘油酸激酶（phosphoglycerate kinase）、丙酮酸激酶（pyruvate kinase）","磷酸丙糖異構酶（triose phosphate isomerase）、磷酸甘油酸變位酶（phosphoglycerate mutase）、丙酮酸激酶（pyruvate kinase）","烯醇化酶（enolase）、磷酸甘油酸激酶（phosphoglycerate kinase）、磷酸果糖激酶-1（phosphofructokinase-1）","己糖激酶（hexokinase）、磷酸果糖激酶-1（phosphofructokinase-1）、丙酮酸激酶（pyruvate kinase）"],"a":[3],"ch":["14"],"sec":"14.1","fbt":"Figure 14-2"},{"id":"D-112-1_72","t":"D","y":112,"q":"身體中持續存在燃料（fuel）可維持熱量恆定（caloric homeostasis），燃料使用的優先順序為下列何者？","o":["肝醣 > 蛋白質 > 三酸甘油脂","三酸甘油脂 > 肝醣 > 蛋白質","三酸甘油脂 > 蛋白質 > 肝醣","肝醣 > 三酸甘油脂 > 蛋白質"],"a":[3],"ch":["23"],"sec":"23.3","fbt":"Table 23-4; Figure 23-28","ex":["蛋白質不會排在三酸甘油酯之前被動用。","肝醣才是最先被動用的。","肝醣應排第一。","短期（數小時）先用肝醣，因為動員最快；接著主要燒三酸甘油酯，因為儲量最大且每克產能最高；蛋白質是最後手段，因為那等於拆解自身的結構與酵素。"]},{"id":"D-112-1_73","t":"D","y":112,"q":"關於脂肪酸合成的敘述，下列何者錯誤？","o":["脂肪酸合成所需之乙醯輔酶A（acetyl-CoA）來源，主要來自檸檬酸","脂肪酸合成所需之NADPH，可由檸檬酸-蘋果酸-丙酮酸循環傳遞（citrate-malate-pyruvate shuttle）的蘋果酸酵素（malic enzyme）來提供","乙醯輔酶A（acetyl-CoA）羧酸化（carboxylation）形成丙二醯輔酶A（malonyl-CoA）是不可逆的，而且是脂肪酸合成的關鍵步驟","脂肪酸由2碳的丙二醯輔酶A（malonyl-CoA）構建而成，丙二醯輔酶A是由乙醯輔酶A（acetyl-CoA）的逆向脂化反應（reverse esterification）產生"],"a":[3],"ch":["21"],"sec":"21.1","fbt":"FIgure 21-1; Figure 21-2; Figure 21-10","ex":["粒線體的 acetyl-CoA 以檸檬酸形式運出細胞質，再由 ATP-citrate lyase 釋出，是脂肪酸合成的碳來源，敘述正確。","citrate-malate-pyruvate 穿梭中的 malic enzyme 把 malate 氧化脫羧成 pyruvate 並產生 NADPH，敘述正確。","ACC 催化的羧化反應不可逆，是脂肪酸合成的關鍵（committed）步驟，敘述正確。","malonyl-CoA 是「3 碳」而非 2 碳（脫羧後才提供 2 碳單位），而且它是由 acetyl-CoA 經生物素依賴的「羧化」而來，不是什麼逆向脂化反應，故此敘述錯誤。"]},{"id":"D-112-1_74","t":"D","y":112,"q":"關於訊息傳遞的敘述，下列何者正確？","o":["β-adrenergic receptor主要是經由cGMP進行訊息傳遞","一氧化氮（nitric oxide, NO）是經由膜型guanylyl cyclase（membrane form guanylyl cyclase）進行訊息傳遞","細胞內的鈉離子濃度是經由inositol triphosphate（IP3）進行調控","cyclic AMP（cAMP）可藉由活化protein kinase A（PKA）進行訊息傳遞"],"a":[3],"ch":["12"],"sec":"12.2 12.6","fbt":"Figure 12-4; Figure 12-6; Figure 12-32; Box 12-2","ex":["β-adrenergic receptor 走 Gs-adenylyl cyclase-cAMP，不是 cGMP。","NO 作用的是「細胞質可溶型」guanylyl cyclase；膜型 guanylyl cyclase 的配體是 ANF、guanylin 等胜肽。","IP3 調控的是「鈣」離子從內質網釋出，不是鈉離子。","cAMP 結合並活化 PKA，再磷酸化下游標的，是正確敘述。"]},{"id":"D-112-1_75","t":"D","y":112,"q":"Thymidylate synthase所催化的直接反應為下列何者？","o":["dCMP→dTMP","dUMP→dTMP","CMP→TMP","UDP→TDP"],"a":[1],"ch":["22"],"sec":"22.4","fbt":"Figure 22-46","ex":["dCMP 不是 thymidylate synthase 的受質；dCMP 要先經 deaminase 變成 dUMP。","thymidylate synthase 催化 dUMP + N5,N10-methylene-THF → dTMP + dihydrofolate，這是細胞唯一的 dTMP 從頭來源。","受質是去氧核糖核苷酸（dUMP），不是核糖核苷酸 CMP。","反應發生在單磷酸層級，不是二磷酸。"]},{"id":"D-112-1_76","t":"D","y":112,"q":"DNA進行複製時，將雙股DNA分開為下列何者？","o":["DnaB helicase","single strand DNA binding protein（SSB）","DnaG（primase）","DNA polymerase"],"a":[0],"ch":["25"],"sec":"25.1","fbt":"Figure 25-11; Figure 25-12; Table 25-4"},{"id":"D-112-1_77","t":"D","y":112,"q":"下列何者為DNA合成時使用的核酸原料？","o":["deoxynucleoside 5′-triphosphate","ribonucleoside 5′-triphosphate","deoxynucleoside 5′-diphosphate","ribonucleoside 5′-diphosphate"],"a":[0],"ch":["25"],"sec":"25.1","fbt":"Figure 25-3"},{"id":"D-112-1_78","t":"D","y":112,"q":"抑制病原生物（pathogen）的核糖核酸聚合酶（RNA polymerase）的轉錄功能是很好的抗生素或是小分子藥物的標的。下列何種分子可以同時抑制真核及原核生物的核糖核酸聚合酶？","o":["立汎黴素（Rifampin）","α-鵝膏蕈鹼（α-Amanitin）","四環素（Tetracyclines）","放線菌素D（Actinomycin D）"],"a":[3],"ch":["26"],"sec":"26.1","fbt":""},{"id":"D-112-1_79","t":"D","y":112,"q":"第二信使（second messenger）是細胞內的訊號分子，在細胞接受到胞外（extracellular）的訊號分子刺激時會被產生。下列何種分子最不可能是第二信使？","o":["肌醇三磷酸（inositol trisphosphate,IP3）","環磷酸鳥苷（cGMP）","一氧化氮（NO）","正腎上腺素（norepinephrine）"],"a":[3],"ch":["12"],"sec":"12.2","fbt":"Box 12-2","ex":["IP3 由 PLC 在細胞內產生，是典型的第二信使。","cGMP 由 guanylyl cyclase 在細胞內產生，是典型的第二信使。","NO 在細胞內產生並作用於鄰近細胞的 guanylyl cyclase，教科書將其列為訊息分子／第二信使之一。","正腎上腺素是細胞外的「第一信使」（神經傳導物質／荷爾蒙），由神經末梢釋放後作用於細胞表面受體，最不可能是第二信使。"]},{"id":"D-112-1_80","t":"D","y":112,"q":"下列那一蛋白質區域（motif），最不容易與DNA結合？","o":["helix-turn-helix","acidic domain","homeodomain","zinc finger"],"a":[1],"ch":["28"],"sec":"28.1","fbt":"Figure 28-11; Figure 28-12; Figure 28-13"},{"id":"D-112-2_67","t":"D","y":112,"q":"關於酶催化反應動力學參數的敘述，下列何者錯誤？","o":["從酶反應的雙倒數圖（Lineweaver-Burk plot）中，所求得與y軸的截距表示Km/Vmax","對於Michaelis-Menten kinetics，當初速度（V0）等於（1/2）Vmax 時，受質濃度（[S]）等於Km","催化常數kcat等於Vmax除以全部酶濃度（[Et]）","酶對受質的特異性常數（specificity constant）常以kcat/Km表示"],"a":[0],"ch":["6"],"sec":"6.3","fbt":"Figure 6-14"},{"id":"D-112-2_68","t":"D","y":112,"q":"Carbonic anhydrase、alcohol dehydrogenase、carboxypeptidase A均為含金屬酵素（metalloenzyme），他們共有的輔基（prosthetic group）為下列何者？","o":["Cu","Mo","Mn","Zn"],"a":[3],"ch":["6"],"sec":"6.1","fbt":"Table 6-1"},{"id":"D-112-2_69","t":"D","y":112,"q":"Tyrosine的等電點（isoelectric point, pI）為何？（pK1 = 2.2; pK2 =9.11; pKR = 10.07）","o":["5.66","6.45","7.12","9.59"],"a":[0],"ch":["3"],"sec":"3.1","fbt":""},{"id":"D-112-2_70","t":"D","y":112,"q":"下列何者為heteropolysaccharides？","o":["heparin","chitin","cellulose","glycogen"],"a":[0],"ch":["7"],"sec":"7.2","fbt":"Figure 7-12; Figure 7-13; Figure 7-14; Figure 7-15; Figure 7-19"},{"id":"D-112-2_71","t":"D","y":112,"q":"粒線體電子傳遞鏈中，電子傳遞由前至後的順序下列何者正確？","o":["NADH→ubiquinone→cytochrome c→cytochrome c1→cytochrome b→cytochrome a→cytochrome a3→O2","NADH→ubiquinone→cytochrome b→cytochrome c1→cytochrome c→cytochrome a→cytochrome a3→O2","NADH→ubiquinone→cytochrome a→cytochrome b→cytochrome c1→cytochrome c→cytochrome a3→O2","NADH→ubiquinone→cytochrome a→cytochrome a3→cytochrome b→cytochrome c→cytochrome c1→O2"],"a":[1],"ch":["19"],"sec":"19.1","fbt":"Figure 19-6"},{"id":"D-112-2_72","t":"D","y":112,"q":"脂肪酸進行氧化代謝的酵素群位於何處？","o":["mitochondrial outer membrane","mitochondrial inner membrane","mitochondrial intermembrane space","mitochondrial matrix"],"a":[3],"ch":["17"],"sec":"17.2","fbt":"Figure 17-7","ex":["外膜上有 acyl-CoA synthetase 與 CPT I，但 β 氧化本身不在這裡。","內膜是電子傳遞鏈與 CPT II 的所在，β 氧化的酵素群不在膜上。","膜間腔沒有 β 氧化的酵素。","β 氧化的四個步驟（脫氫、水合、再脫氫、硫解）全在粒線體基質進行，產生的 NADH 與 FADH2 就近交給內膜的電子傳遞鏈。"]},{"id":"D-112-2_73","t":"D","y":112,"q":"當血糖過低時，胰臟（pancreas）會釋放下列何種物質？","o":["胰島素（insulin）","升糖素（glucagon）","腎上腺素（epinephrine）","胰蛋白酶（trypsin）"],"a":[1],"ch":["23"],"sec":"23.3","fbt":"Figure 23-26","ex":["胰島素是血糖「過高」時由 β 細胞釋放。","血糖過低時胰島 α 細胞釋放升糖素，促進肝醣分解與糖質新生而升高血糖。","腎上腺素由腎上腺髓質分泌，不是胰臟。","胰蛋白酶是外分泌的消化酵素，與血糖調節無關。"]},{"id":"D-112-2_74","t":"D","y":112,"q":"下列那一類脂質代謝異常最可能導致神經系統病變？","o":["phosphatidylserine","phosphatidylethanolamine","cholesterol","sphingomyelin"],"a":[3],"ch":["10"],"sec":"10.2","fbt":"Box 10-1","ex":["磷脂醯絲胺酸是一般膜磷脂，代謝異常不以神經病變為主。","磷脂醯乙醇胺同樣是一般膜磷脂。","膽固醇代謝異常主要表現為動脈硬化等心血管問題。","鞘脂（鞘磷脂、腦苷脂、神經節苷脂）在髓鞘與神經元膜含量特別高，其分解酵素缺陷（Tay-Sachs、Niemann-Pick、Gaucher、Krabbe、異染性腦白質失養症）幾乎都以進行性神經退化為主要表現。"]},{"id":"D-112-2_75","t":"D","y":112,"q":"下列何者是由IMP合成AMP的直接能量來源？","o":["ATP","CTP","creatine phosphate","GTP"],"a":[3],"ch":["22"],"sec":"22.4","fbt":"Figure 22-36","ex":["ATP 是 IMP → XMP → GMP 那一支所需的能量來源，不是走向 AMP 這一支。","CTP 屬嘧啶，與此無關。","磷酸肌酸是肌肉的能量緩衝，與核苷酸合成無關。","IMP → adenylosuccinate（由 adenylosuccinate synthetase 催化）用的是 GTP。這種「做 A 要花 G、做 G 要花 A」的交叉設計，正是讓 AMP 與 GMP 產量自動平衡的機制。"]},{"id":"D-112-2_76","t":"D","y":112,"q":"在E. coli的homologous recombination中，下列何種蛋白質位於雙股DNA上，將DNA去螺旋並水解之？","o":["DNA ligase","RecA protein","RecBCD enzy hate","biotin phosphate"],"a":[2],"ch":["18"],"sec":"18.1","fbt":"Figure 18-4","ex":["thiamine pyrophosphate 負責脫羧反應。","NADP+ 負責還原力的傳遞。","磷酸吡哆醛（B6）是轉胺酶的共同輔酶。","「biotin phosphate」不是標準輔酶名稱；生物素本身負責羧化反應。"]},{"id":"D-111-1_70","t":"D","y":111,"q":"糖解作用（glycolysis）於細胞何處發生？","o":["細胞核（nucleus）","細胞質（cytosol）","內質網（endoplasmic reticulum）","粒線體（mitochondrion）"],"a":[1],"ch":["14"],"sec":"14.1","fbt":""},{"id":"D-111-1_71","t":"D","y":111,"q":"當血液中的升糖激素（glucagon）濃度上升，則下列那一個肝細胞酶活性不會上升？","o":["腺苷酸環化酶（adenylyl cyclase）","蛋白激酶A（protein kinase A，也稱 PKA）","磷酸果糖激酶-2（phosphofructokinase-2）","肝醣磷酸酶（glycogen phosphorylase）"],"a":[2],"ch":["15"],"sec":"15.3","fbt":"Figure 15-12"},{"id":"D-111-1_72","t":"D","y":111,"q":"乙醯輔酶A（acetyl-CoA）進入檸檬酸循環（citric acid cycle，又名TCA cycle）一圈後，會釋出多少分子的二氧化碳？","o":["1","2","3","4"],"a":[1],"ch":["16"],"sec":"16.2","fbt":"Figure 16-7"},{"id":"D-111-1_73","t":"D","y":111,"q":"對於sildenafil citrate（Viagra；威而鋼）的敘述下列何者正確？","o":["可維持細胞內低濃度的AMP","可維持細胞內低濃度的cAMP","可維持細胞內低活性的G protein","可維持細胞內高濃度的cGMP"],"a":[3],"ch":["12"],"sec":"12.2","fbt":"Box 12-2","ex":["與 AMP 濃度無關。","Viagra 抑制的是 PDE5，對 cGMP 專一，不影響 cAMP。","與 G 蛋白活性無關。","抑制 cGMP 的分解酵素，所以維持細胞內高濃度 cGMP，使平滑肌放鬆。"]},{"id":"D-111-1_74","t":"D","y":111,"q":"膽固醇合成的限速酶（rate-limiting enzyme）為下列何者？","o":["HMG-CoA reductase","HMG-CoA isomerase","HMG-CoA synthase","HMG-CoA lyase"],"a":[0],"ch":["21"],"sec":"21.4","fbt":"Figure 21-43","ex":["HMG-CoA reductase 把 HMG-CoA 還原成 mevalonate，是膽固醇合成的限速酶，也是 statin 的作用標的。","膽固醇合成路徑中沒有「HMG-CoA isomerase」這個酵素。","HMG-CoA synthase 生成 HMG-CoA，但不是限速步驟。","HMG-CoA lyase 把 HMG-CoA 裂解成 acetoacetate，屬粒線體的酮體生成路徑，不在膽固醇合成上。"]},{"id":"D-111-1_75","t":"D","y":111,"q":"有關人體粒線體DNA（mtDNA）的敘述，下列何者錯誤？","o":["長度約為16.5 kb","是圓形封閉的dsDNA","其密碼系統與染色體（genomic DNA）完全相同","超過90％的粒線體蛋白質是由核染色體的基因所轉譯"],"a":[2],"ch":["19","24"],"sec":"19.5 24.1","fbt":"","ex":["人類 mtDNA 長約 16,569 bp，敘述正確。","它是環狀封閉的雙股 DNA，敘述正確。","粒線體使用的遺傳密碼與核基因體「不完全相同」（例如 UGA 在粒線體讀作色胺酸而非終止、AGA／AGG 作為終止碼），故此敘述錯誤。","粒線體內約一千多種蛋白中超過 90%（mtDNA 只編碼 13 個）由核基因編碼後輸入，敘述正確。"]},{"id":"D-111-1_76","t":"D","y":111,"q":"有關於染色體中 histone 蛋白的敘述，下列何者錯誤？","o":["是chromatin proteins中最大量的","種類含H1、 H2A、H2B、H3及H4","在生理狀態下形成histone octamer","H1為nucleosome的核心成分"],"a":[3],"ch":["24"],"sec":"24.3","fbt":"Table 24-5, Figure 24-24","ex":["組織蛋白是染色質中含量最多的蛋白質，敘述正確。","五種組織蛋白正是 H1、H2A、H2B、H3、H4，敘述正確。","H2A、H2B、H3、H4 各兩分子組成八聚體，敘述正確。","H1 是「連接」組織蛋白，結合在 DNA 進出核小體之處，不是八聚體核心的成分，故此敘述錯誤。"]},{"id":"D-111-1_77","t":"D","y":111,"q":"在大腸桿菌細胞中Mut H/S/L complex參與下列那種DNA修補機制？","o":["mismatch repair","base excision repair","nucleotide excision repair","thymidine dimer repair"],"a":[0],"ch":["25"],"sec":"25.2","fbt":"Figure 25-21"},{"id":"D-111-1_78","t":"D","y":111,"q":"細胞進行去氧核糖核酸複製作用（DNA replication）所需的引子（primers），主要是由下列那一種分子所組成？","o":["去氧核糖核苷（deoxyribonucleosides）","去氧核糖核苷酸（deoxyribonucleotides）","核糖核苷（ribonucleosides）","核糖核苷酸（ribonucleotides）"],"a":[3],"ch":["25"],"sec":"25.1","fbt":"Figure 25-4"},{"id":"D-111-1_79","t":"D","y":111,"q":"在正常的狀況下，細胞進行核糖核酸轉錄作用（RNA transcription）產生許多不同種類的核糖核酸分子，下列那一種核糖核酸分子在細胞內的含量最高？","o":["信使核糖核酸（mRNA）","微小核糖核酸（microRNAs, miRNAs）","核糖體核糖核酸（rRNA）","傳遞核糖核酸（tRNA）"],"a":[2],"ch":["27","28"],"sec":"27.2 28.2","fbt":""},{"id":"D-111-1_80","t":"D","y":111,"q":"真核細胞進行轉錄後修飾作用（post-transcriptional modification）的剪接作用（splicing）時，由剪接體（spliceosome）負責催化的剪接作用所產生套索內含子（lariat intron），其內含子（intron）的5'端是連接在下列那一種核苷（ribonucleoside）上？","o":["腺苷（adenosine）","胞苷（cytidine）","鳥苷（guanosine）","尿苷（uridine）"],"a":[0],"ch":["26"],"sec":"26.2","fbt":"Figure 26-14"},{"id":"D-111-2_67","t":"D","y":111,"q":"如果細胞內無法合成或得到N5-methyl H4 folate，下列何項胺基酸的生合成會缺乏？","o":["lysine","methionine","leucine","serine"],"a":[1],"ch":["18"],"sec":"18.3","fbt":"Figure 18-17; Figure 18-18","ex":["離胺酸是必需胺基酸，人體本來就不能合成。","N5-methyl-THF 經 methionine synthase（需 B12）把甲基交給 homocysteine 再生成 methionine；沒有它這條再生路就斷了。","白胺酸是必需胺基酸，人體本來就不能合成。","絲胺酸由 3-phosphoglycerate 合成，不需要 N5-methyl-THF（它反而是提供一碳單位給 THF 的來源）。"]},{"id":"D-111-2_68","t":"D","y":111,"q":"當加入可逆性抑制劑（I）於酶（E）和受質（S）的反應中，導致酶動力學參數Vmax下降，但不影響Km/Vmax，此類可逆性抑制劑屬於下列何種：","o":["不競爭型抑制劑（uncompetitive inhibitor）， I與ES complex結合","非競爭型抑制劑（noncompetitive inhibitor），I 與ES complex結合","混合型抑制劑（mixed inhibitor），I 與E結合","競爭型抑制劑（competitive inhibitor），I 與E結合"],"a":[0],"ch":["6"],"sec":"6.3","fbt":"Figure 6-20"},{"id":"D-111-2_69","t":"D","y":111,"q":"Alanine與alpha-ketoglutarate進行轉胺作用（transamination）後形成之產物，為下列何者？","o":["glutamate；oxaloacetate","glutamate；pyruvate","aspartate；oxaloacetate","aspartate；pyruvate"],"a":[1],"ch":["18"],"sec":"18.1","fbt":"Figure 18-9","ex":["oxaloacetate 是 AST 的產物，不是 ALT 的。","alanine aminotransferase（ALT／GPT）把丙胺酸的胺基交給 α-ketoglutarate，產生 glutamate 與 pyruvate。","aspartate 與 oxaloacetate 都是 AST 反應的成員。","此反應不產生 aspartate。"]},{"id":"D-111-2_70","t":"D","y":111,"q":"丙酮酸脫氫酶複合體（pyruvate dehydrogenase complex）內有五種輔酶，但不包括下列何者？","o":["FAD（flavin adenine dinucleotide）","輔酶A（coenzyme A）","生物素（biotin）","硫胺素焦磷酸（thiamine pyrophosphate）"],"a":[2],"ch":["16"],"sec":"16.1","fbt":"Figure 16-5"},{"id":"D-111-2_71","t":"D","y":111,"q":"葡萄糖（glucose）進入肝細胞後，會立刻進行下列那一個反應而留在細胞內？","o":["轉化成半乳糖（galactose）","在第六個碳上磷酸化","在第一個碳上磷酸化","轉化成果糖（fructose）"],"a":[1],"ch":["7"],"sec":"7.1","fbt":""},{"id":"D-111-2_72","t":"D","y":111,"q":"血液中游離的脂肪酸（free fatty acid）依靠下列何者協助運送？","o":["膽固醇（cholesterol）","膽鹽（bile salt）","血清蛋白（serum albumin）","紅血球（red blood cell)"],"a":[2],"ch":["10","17"],"sec":"10.1 17.1","fbt":"Figure 17-3","ex":["膽固醇是脂蛋白的成分，不負責攜帶游離脂肪酸。","膽鹽在腸腔乳化脂肪，不在血中運送脂肪酸。","游離脂肪酸不溶於水，在血漿中與血清白蛋白非共價結合運送（每個白蛋白可帶多個脂肪酸）。","紅血球不負責運送脂肪酸。"]},{"id":"D-111-2_73","t":"D","y":111,"q":"一次citric acid cycle可以產生幾個還原態的nicotinamide adenine dinucleotide（NADH）？","o":["1","3","9","12"],"a":[1],"ch":["16"],"sec":"16.2","fbt":"Figure 16-7"},{"id":"D-111-2_74","t":"D","y":111,"q":"下列關於胰島素（insulin）的敘述，何者正確？","o":["胰島素會促進hormone-sensitive lipase的活性","胰島素會促進β-oxidation反應","胰島素會促進酮體（ketone body）的生成","胰島素會促進acetyl-CoA carboxylase的活性"],"a":[3],"ch":["17"],"sec":"17.3","fbt":"Figure 17-13","ex":["胰島素使 hormone-sensitive lipase 去磷酸化而「失活」，抑制脂解。","胰島素促進脂肪合成、抑制 β 氧化（經 malonyl-CoA 抑制 CPT I）。","胰島素抑制酮體生成；酮體增加是胰島素不足時的表現。","胰島素促使 acetyl-CoA carboxylase 去磷酸化而活化，malonyl-CoA 增加，一方面供應脂肪酸合成、一方面關掉 CPT I，敘述正確。"]},{"id":"D-111-2_75","t":"D","y":111,"q":"下列有關DNA或RNA結構，何者敘述錯誤？","o":["高溫加熱可使雙股DNA分離成單股","雙股DNA之核苷酸G含量等於核苷酸C含量","雙股DNA其purine與pyrimidine含量是相等的","在強鹼下，RNA相對於雙股DNA是較穩定的"],"a":[3],"ch":["8"],"sec":"8.1","fbt":"Figure 8-8","ex":["高溫破壞鹼基對的氫鍵與堆疊，雙股分離成單股，敘述正確。","依 Chargaff 法則，雙股 DNA 中 G 含量等於 C 含量，敘述正確。","A+G（嘌呤）等於 T+C（嘧啶），兩者含量相等，敘述正確。","強鹼下 RNA 的 2′-OH 會攻擊相鄰磷酸二酯鍵而使骨架斷裂，所以 RNA 比雙股 DNA「不穩定」，故此敘述錯誤。"]},{"id":"D-111-2_76","t":"D","y":111,"q":"有關原核細胞DNA replication相關酶功能，下列敘述何者正確？","o":["DNA polymaerase Ⅲ負責將RNA primer移除","DNA polymerase I 負責將RNA primer移除","DNA ligase負責合成RNA primer","topoisomerase負責合成RNA primer"],"a":[1],"ch":["25"],"sec":"25.1","fbt":"Table 25-4"},{"id":"D-111-2_77","t":"D","y":111,"q":"在大腸桿菌（Escherichia coli）的去氧核糖核酸複製作用（DNA replication）中，由下列那一種聚合酶（polymerase）負責催化？","o":["第一型去氧核糖核酸聚合酶（DNA polymeraseⅠ）","第二型去氧核糖核酸聚合酶（DNA polymerase Ⅱ）","第三型去氧核糖核酸聚合酶（DNA polymerase Ⅲ）","多腺苷酸聚合酶（poly(A) polymerase）"],"a":[2],"ch":["25"],"sec":"25.1","fbt":""},{"id":"D-111-2_78","t":"D","y":111,"q":"蛋白質轉譯作用（protein translation）中的搖擺（wobble）現象是發生在下列何者？","o":["反密碼子（anticodon）序列的第一位置","反密碼子（anticodon）序列的第二位置","反密碼子（anticodon）序列的第三位置","密碼子（codon）序列的第二位置"],"a":[0],"ch":["27"],"sec":"27.1","fbt":"Table 27-4"},{"id":"D-111-2_79","t":"D","y":111,"q":"在原核細胞（prokaryotic cell）的蛋白質轉譯作用（protein translation）中，下列何者可以直接結合在核糖體（ribosome）的肽基部位（P-site：peptidyl site）上？","o":["丙胺酸傳遞核糖核酸（Ala-tRNAAla）","甲醯甲硫胺酸傳遞核糖核酸（fMet-tRNAfMet）","甲硫胺酸傳遞核糖核酸（Met-tRNAfMet）","酪胺酸傳遞核糖核酸（Tyr-tRNATyr）"],"a":[1],"ch":["27"],"sec":"27.2","fbt":"Figure 27-24"},{"id":"D-111-2_80","t":"D","y":111,"q":"下列那一種序列不參與維持真核細胞染色體（chromosome）的完整結構？","o":["著絲粒（centromere）","複製起點（origin of replication）","引子（primer）","端粒（telomere）"],"a":[2],"ch":["9","24"],"sec":"9.1 24.2","fbt":"Figure 9-6; Figure 24-7","ex":["著絲粒是紡錘絲附著、確保染色體正確分離的必要序列。","複製起點讓染色體能被複製，是人工染色體的三大要素之一。","引子是 DNA 複製時臨時合成的 RNA 片段，複製完就被切除換成 DNA，不是染色體上固有 的。","HMG-CoA synthase 不是 aspirin 的標的。","aspirin 把 cyclooxygenase（prostaglandin H2 synthase）活性位的 Ser530 乙醯化而不可逆抑制，阻斷前列腺素與血栓素的生成，因而鎮痛、解熱、抗發炎並抑制血小板聚集。"]},{"id":"D-110-1_74","t":"D","y":110,"q":"導致家族性高膽固醇症（familial hypercholesterolemia）的原因是：","o":["在細胞膜上LDL受體的基因變異","膽固醇不能有效地被呼吸道的細胞所吸收","膽固醇和細胞外基質（extracellular matrix）的附著力下降","膽固醇進入紅血球的主動運輸機制被抑制"],"a":[0],"ch":["21"],"sec":"21.4","fbt":"","ex":["家族性高膽固醇血症是細胞膜上 LDL 受體的基因變異，使肝臟無法有效清除血中 LDL，血膽固醇自幼偏高。","膽固醇不是由呼吸道細胞吸收，此敘述無生理依據。","與細胞外基質的附著力無關。","膽固醇不是靠主動運輸進入紅血球，此敘述無生理依據。"]},{"id":"D-110-1_75","t":"D","y":110,"q":"下列那一個分子具有直接活化guanylyl cyclase的作用？","o":["estrogen","nitric oxide","retinoic acid","inositol 1,4,5-triphosphate"],"a":[1],"ch":["12"],"sec":"12.2","fbt":"Box12-2","ex":["estrogen 作用於核內受體，調控轉錄。","NO 直接擴散進細胞，結合細胞質可溶型 guanylyl cyclase 的血基質鐵而活化它。","retinoic acid 作用於核內 RAR／RXR 受體。","IP3 開啟內質網上的鈣通道，不活化 guanylyl cyclase。"]},{"id":"D-110-1_76","t":"D","y":110,"q":"在真核細胞中的成熟mRNA，不含下列那個基因序列？","o":["exons","introns","5'-non-coding sequences","3'-non-coding sequences"],"a":[1],"ch":["26"],"sec":"26.2","fbt":"Figure 26-18"},{"id":"D-110-1_77","t":"D","y":110,"q":"大腸桿菌主要負責DNA複製的聚合酶是下列何者？","o":["DNA polymerase I","DNA polymerase II","DNA polymerase III","DNA polymerase IV"],"a":[2],"ch":["25"],"sec":"25.1","fbt":""},{"id":"D-110-1_78","t":"D","y":110,"q":"下列那一組DNA核酸序列稱作palindromic sequence？","o":["GGCGGC","GCATAT","GCATGC","CCTTCC"],"a":[2],"ch":["8"],"sec":"8.2","fbt":"Figure 8-19","ex":["GGCGGC 的反向互補是 GCCGCC，不是迴文（這是直接重複）。","GCATAT 的反向互補是 ATATGC，不是迴文。","GCATGC 的反向互補仍是 GCATGC，兩股讀起來一樣，是迴文序列（SphI 位點）。對摺檢查：G-C、C-G、A-T、T-A、G-C、C-G 全部互補。","CCTTCC 的反向互補是 GGAAGG，不是迴文。"]},{"id":"D-110-1_79","t":"D","y":110,"q":"真核細胞利用下列那一種核糖核酸聚合酶（RNA polymerase）合成所有的傳遞核糖核酸（tRNA）分子？","o":["多腺苷酸聚合酶（poly(A) polymerase）","第一型核糖核酸聚合酶（RNA polymerase I）","第二型核糖核酸聚合酶（RNA polymerase II）","第三型核糖核酸聚合酶（RNA polymerase III）"],"a":[3],"ch":["26"],"sec":"26.1","fbt":""},{"id":"D-110-1_80","t":"D","y":110,"q":"真核細胞的染色體（chromosome）不含下列何者的基因序列？","o":["微核糖核酸（miRNA ）","信使核糖核酸3'多腺苷酸尾（mRNA 3'poly(A)-tail）","核糖體核糖核酸（rRNA）","傳遞核糖核酸（tRNA）"],"a":[1],"ch":["26"],"sec":"26.1","fbt":"Table 26-1"}];
const KEY="natexam-quiz-v1";
const PER=50;
let picks={}, mode="quiz", page=0;
let f={t:"",y:"",ch:"",kw:""};
try{const s=localStorage.getItem(KEY); if(s) picks=JSON.parse(s)||{};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(picks));}catch(e){}}
function el(tag,cls,text){const n=document.createElement(tag); if(cls) n.className=cls; if(text!=null) n.textContent=text; return n;}
const list=document.getElementById("list");
const L="ABCD";
function isRight(it,j){return it.free?true:it.a.indexOf(j)>=0;}
function keyOf(it){return it.id;}

/* ---- 篩選選單 ---- */
const years=[...new Set(NATQ.map(x=>x.y))].sort((a,b)=>b-a);
const chs=[...new Set(NATQ.flatMap(x=>x.ch))].sort((a,b)=>parseFloat(a)-parseFloat(b));
function fillSel(id,opts,allLabel,fmt){
  const s=document.getElementById(id);
  s.append(new Option(allLabel,""));
  opts.forEach(o=>s.append(new Option(fmt?fmt(o):o,o)));
}
fillSel("f-year",years.map(String),"全部年度",v=>v+" 年");
fillSel("f-ch",chs,"全部章節",v=>"Ch"+v);
document.getElementById("f-ch").append(new Option("未分章節","__none__"));

function pass(it){
  if(f.t && it.t!==f.t) return false;
  if(f.y && String(it.y)!==f.y) return false;
  if(f.ch){
    if(f.ch==="__none__"){ if(it.ch.length) return false; }
    else if(it.ch.indexOf(f.ch)<0) return false;
  }
  if(f.kw){
    const s=(it.q+" "+it.o.join(" ")+" "+it.id).toLowerCase();
    if(!s.includes(f.kw)) return false;
  }
  return true;
}

function render(){
  const hits=NATQ.filter(pass);
  const maxPage=Math.max(1,Math.ceil(hits.length/PER));
  if(page>=maxPage) page=maxPage-1;
  if(page<0) page=0;
  list.textContent="";
  const slice=hits.slice(page*PER,(page+1)*PER);
  if(!slice.length) list.append(el("p","empty","沒有符合條件的題目。"));
  slice.forEach(item=>{
    const k=keyOf(item);
    const picked=picks[k];
    const answered=picked!==undefined;
    const reveal = mode==="browse" || answered;
    const card=el("section","q"+(reveal?" done":""));
    const head=el("div","qhead");
    head.append(el("span","num",item.id));
    head.append(el("span","chip y",(item.t==="D"?"牙醫 ":"醫師 ")+item.y+" 年"));
    if(item.ch.length) head.append(el("span","chip","Ch"+item.ch.join("、")+(item.sec?" · "+item.sec:"")));
    else head.append(el("span","chip","未分章節"));
    if(item.fbt) head.append(el("span","chip",item.fbt));
    const ansTxt = item.free ? "送分題" : "正解 "+item.a.map(i=>L[i]).join("、");
    if(mode==="quiz" && answered){
      const ok=isRight(item,picked);
      head.append(el("span","verdict "+(ok?"ok":"no"), ok?(item.free?"送分題":"答對"):"答錯,"+ansTxt));
    } else if(mode==="browse"){
      head.append(el("span","verdict ok",ansTxt));
    }
    card.append(head, el("p","stem",item.q));
    const opts=el("div","opts");
    item.o.forEach((o,j)=>{
      const b=el("button","opt"); b.type="button";
      b.append(el("span","letter",L[j]+")"), el("span","",o));
      if(reveal){
        b.setAttribute("aria-disabled","true");
        const right=isRight(item,j);
        if(right) b.classList.add("right");
        else if(mode==="quiz" && j===picked) b.classList.add("wrong");
        const ex=item.ex&&item.ex[j];
        if(ex || right || (mode==="quiz"&&j===picked)){
          const why=el("span","why");
          if(right) why.append(el("span","tag ok",(mode==="quiz"&&j===picked)?"你的選擇 · 正確答案":"正確答案"));
          else if(mode==="quiz"&&j===picked) why.append(el("span","tag no","你的選擇"));
          if(ex) why.append(document.createTextNode(ex));
          b.append(why);
        }
      } else {
        b.addEventListener("click",()=>{picks[k]=j; save(); render();});
      }
      opts.append(b);
    });
    card.append(opts);
    if(reveal){
      if(item.free) card.append(el("p","noex","這題官方公告送分／一題多答，四個選項都算對。"));
      if(!item.ex) card.append(el("p","noex","（逐選項解析還沒寫，之後會補上。）"));
    }
    list.append(card);
  });
  document.getElementById("p-cur").textContent=page+1;
  document.getElementById("p-max").textContent=maxPage;
  document.getElementById("p-prev").disabled=page===0;
  document.getElementById("p-next").disabled=page>=maxPage-1;
  score(hits);
}
function score(hits){
  let done=0,right=0;
  hits.forEach(it=>{const p=picks[keyOf(it)]; if(p!==undefined){done++; if(isRight(it,p)) right++;}});
  document.getElementById("s-total").textContent=hits.length;
  document.getElementById("s-done").textContent=done;
  document.getElementById("s-right").textContent=right;
  document.getElementById("s-pct").textContent=done?Math.round(right/done*100)+"%":"–";
  document.getElementById("meter").style.width=(hits.length?done/hits.length*100:0)+"%";
}
document.querySelectorAll('.tabs [data-t]').forEach(t=>t.addEventListener("click",()=>{
  f.t=t.dataset.t; page=0;
  document.querySelectorAll('.tabs [data-t]').forEach(x=>x.setAttribute("aria-pressed",x===t?"true":"false"));
  render();
}));
document.getElementById("f-year").addEventListener("change",e=>{f.y=e.target.value;page=0;render();});
document.getElementById("f-ch").addEventListener("change",e=>{f.ch=e.target.value;page=0;render();});
let kwT=null;
document.getElementById("f-kw").addEventListener("input",e=>{
  clearTimeout(kwT); const v=e.target.value.trim().toLowerCase();
  kwT=setTimeout(()=>{f.kw=v;page=0;render();},180);
});
function setMode(m){
  mode=m;
  document.getElementById("m-quiz").setAttribute("aria-pressed",m==="quiz"?"true":"false");
  document.getElementById("m-browse").setAttribute("aria-pressed",m==="browse"?"true":"false");
  render();
}
document.getElementById("m-quiz").addEventListener("click",()=>setMode("quiz"));
document.getElementById("m-browse").addEventListener("click",()=>setMode("browse"));
document.getElementById("p-prev").addEventListener("click",()=>{page--;render();window.scrollTo(0,0);});
document.getElementById("p-next").addEventListener("click",()=>{page++;render();window.scrollTo(0,0);});
document.getElementById("btn-reset").addEventListener("click",()=>{
  if(!confirm("確定清除全部作答紀錄?")) return;
  picks={};save();page=0;render();window.scrollTo(0,0);});
document.getElementById("btn-wrong").addEventListener("click",()=>{
  NATQ.forEach(it=>{const k=keyOf(it); if(picks[k]!==undefined && !isRight(it,picks[k])) delete picks[k];});
  save();render();window.scrollTo(0,0);
});
render();
</script>
</body>
</html>
