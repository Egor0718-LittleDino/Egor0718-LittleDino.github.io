dine"],"a":[0],"ch":["18"],"sec":"18.3","fbt":"Table 18-2","ex":["白胺酸是支鏈胺基酸，其 α-酮酸無法被 BCKDH 複合體脫羧而堆積；Leu、Ile、Val 三者的酮酸一起累積，尿帶楓糖味。","丙胺酸不是支鏈胺基酸，與此病無關。","甘胺酸不是支鏈胺基酸。","組胺酸不是支鏈胺基酸。"]},{"id":"M-103-1_46","t":"M","y":103,"q":"有關人類粒線體的敘述，下列何者正確?","o":["有些粒線體蛋白質由細胞核內基因所合成","粒線體內 genome 是直線型雙股 DNA","粒線體內 tRNA 及 rRNA 分子全部來自細胞質","粒線體內 genome 不會產生突變"],"a":[0],"ch":["19"],"sec":"19.5","fbt":""},{"id":"M-103-1_47","t":"M","y":103,"q":"血中腎上腺素(epinephrine)濃度增加時，主要會引起下列何種現象?","o":["減少 cAMP 產生","活化蛋白質激酶 A(protein kinase A)","降低肝細胞肝醣之分解","抑制糖質新生(gluconeogenesis)"],"a":[1],"ch":["12"],"sec":"12.4","fbt":"Figure 12-16","ex":["腎上腺素經 β 受體使 cAMP「增加」，不是減少。","cAMP 上升活化 PKA，這是腎上腺素最主要的細胞內效應。","肝醣分解被「促進」：PKA → phosphorylase kinase → glycogen phosphorylase。","糖質新生被促進（並抑制糖解），不是抑制。"]},{"id":"M-103-1_48","t":"M","y":103,"q":"一位媽媽來求診，述說她的小孩從小能看到東西卻不會分辨顏色，其最可能的原因是:","o":["桿狀細胞(rod cells)受損","錐狀細胞(cone cells)上 cGMP 控制型離子通道(cGMP-gated channel)的 α 次單元發生失去功能(loss-of-function)之基因突變","此病是因為細胞對光刺激時，Mg2+無法進入細胞所造成","補充維生素 A(vitamin A)便會痊癒"],"a":[1],"ch":["12"],"sec":"12.3","fbt":"Figure 12-14","ex":["桿狀細胞負責暗處視覺，受損造成夜盲而不是無法分辨顏色。","錐狀細胞的 cGMP-gated channel α 次單元失去功能突變會造成色覺辨識障礙（achromatopsia），仍看得見但分不出顏色。","光傳導中流入細胞的是 Na+ 與 Ca2+，不是 Mg2+。","維生素 A 缺乏造成的是夜盲；先天色覺缺陷補充維生素 A 無效。"]},{"id":"M-103-1_49","t":"M","y":103,"q":"鈣離子(calcium ion)是細胞內重要之二級訊息傳遞者，下列何種物質可影響細胞內鈣離子的濃度?","o":["phosphatidylcholine + phospholipase A","phosphatidylcholine + phospholipase C","phosphatidylinositol + phospholipase A","phosphatidylinositol + phospholipase C"],"a":[3],"ch":["12"],"sec":"12.2","fbt":"Figure 12-11","ex":["phospholipase A2 作用於 phosphatidylcholine 釋出 arachidonate（走 eicosanoid），不直接影響細胞內鈣。","PLC 的生理受質是磷酸肌醇類，不是 phosphatidylcholine。","phosphatidylinositol 要靠 PLC（不是 PLA）才會產生 IP3。","phosphatidylinositol 4,5-bisphosphate 被 PLC 水解成 IP3，IP3 使內質網釋出鈣，是調控細胞內鈣的典型組合。"]},{"id":"M-103-1_50","t":"M","y":103,"q":"下列何種 DNA 的缺口可藉由 DNA 連接酶(ligase)所接合?","o":["5’-O-P + 3’-OH","5’-OH + 3’-O-P","5’-OH + 3’-OH","5’-O-P + 3’-O-P"],"a":[0],"ch":["8"],"sec":"8.3","fbt":"","ex":["DNA ligase 催化 5′-磷酸與 3′-OH 之間形成磷酸二酯鍵（耗 ATP 或 NAD+），這正是可接合的缺口型式。","方向相反，無法接合。","兩端都是 OH，缺少磷酸基無法形成磷酸二酯鍵。","兩端都帶磷酸，無法形成磷酸二酯鍵。"]},{"id":"M-103-1_75","t":"M","y":103,"q":"下列何者不是 gene transfer 所使用的 vectors?","o":["adenovirus","retrovirus","liposome-DNA","naked RNA"],"a":[3],"ch":["9"],"sec":"","fbt":"","ex":["腺病毒是基因治療常用的病毒載體。","反轉錄病毒可把基因整合進宿主基因體，是常用的病毒載體。","脂質體包裹 DNA 是常見的非病毒載體。","裸露的 RNA 在體內會被 RNase 迅速降解、也難以進入細胞，不是傳統上所謂的 vector（現代 mRNA 疫苗要靠脂質奈米粒包覆並修飾核苷才可行）。"]},{"id":"M-103-2_26","t":"M","y":103,"q":"維繫蛋白質三級結構穩定性作用力之中，何者最易受到所處環境之氧化還原狀態的影響?","o":["雙硫鍵(disulfide bond)","氫鍵(hydrogen bond)","凡德瓦爾力(van der Waals interaction)","離子交互作用(ionic interaction)"],"a":[0],"ch":["3"],"sec":"3.1","fbt":"Figure 3-7"},{"id":"M-103-2_27","t":"M","y":103,"q":"酵素能夠有效降低反應活化能，以提升反應速率的關鍵在於:","o":["酵素能與受質(substrate)緊密的結合","酵素能與反應過渡態(transition state)緊密的結合","酵素能與反應中間物(intermediate)緊密的結合","酵素能與產物(product)緊密的結合"],"a":[1],"ch":["6"],"sec":"6.2","fbt":""},{"id":"M-103-2_28","t":"M","y":103,"q":"關於競爭型抑制劑(competitive inhibitor)的敘述，下列何者錯誤?","o":["競爭型抑制劑能與酵素的活性中心結合","競爭型抑制劑的存在會使酵素 Km 上升","競爭型抑制劑的存在會使酵素 Kcat 下降","競爭型抑制劑與酵素的結合是可逆的"],"a":[2],"ch":["6"],"sec":"6.3","fbt":""},{"id":"M-103-2_29","t":"M","y":103,"q":"Coenzyme A，NAD+，和 FAD 都利用下列何種物質作為它們的共同成分?","o":["Adenine","Guanine","Cytosine","Thymidine"],"a":[0],"ch":["13","16"],"sec":"13.4 16.1","fbt":"Figure 13-4"},{"id":"M-103-2_30","t":"M","y":103,"q":"抗癌藥 5-Fluorouracil 可減少細胞中之 dTMP 的供應，因而抑制 DNA 合成，其作用機轉是因為此藥 物之衍生物可直接抑制下列何種酵素之活性?","o":["Dihydrofolate reductase","Ribonucleotide reductase","Thymidine kinase","Thymidylate synthase"],"a":[3],"ch":["22"],"sec":"22.4","fbt":"Figure 22-52、Figure 22-53","ex":["抑制 dihydrofolate reductase 的是 methotrexate、trimethoprim。","抑制 ribonucleotide reductase 的是 hydroxyurea。","thymidine kinase 屬回收路徑，不是 5-FU 的標的。","5-FU 在體內轉成 FdUMP，與 N5,N10-methylene-THF 一起把 thymidylate synthase 共價鎖死（自殺性抑制），dTMP 斷供而 DNA 無法合成。"]},{"id":"M-103-2_31","t":"M","y":103,"q":"在真核細胞內 DNA 複製的過程中，其 lagging strand 的合成，下列何者和 DNA polymerase α 直接參與 Okazaki fragment 的生合成?","o":["Primase","Clamp-loading factor","RNaseH","DNA gyrase"],"a":[0,1,2,3],"ch":["25"],"sec":"","fbt":"","free":1},{"id":"M-103-2_32","t":"M","y":103,"q":"下列何者是原核生物(prokaryotes)最常用來調節基因表現的方式?","o":["使用轉錄因子結合到 enhancer 區域以增加轉錄速度","更換 RNA polymerase 中 sigma factor","使用過多的酪胺酸(tyrosine)來調節 RNA 轉錄速度","在 RNA 5’端經 7-甲基鳥糞嘌呤核苷(7-methylguanosine)修飾，以增加 RNA 穩定度"],"a":[1],"ch":["26"],"sec":"26.1","fbt":""},{"id":"M-103-2_33","t":"M","y":103,"q":"下列那一組的胺基酸的成員最有可能扮演 DNA-蛋白質辨認(DNA-protein recognition)的角色?","o":["Arg, Gln, Leu","Asn, Gln, Trp","Asn, Glu, Lys","Glu, Lys, Pro"],"a":[2],"ch":["28"],"sec":"28.1","fbt":""},{"id":"M-103-2_34","t":"M","y":103,"q":"以 RNA 干擾(RNA interference)的方法抑制基因表現的可能機制之一為:","o":["抑制基因的轉錄作用(transcription)","抑制基因的轉譯後修飾作用(posttranslational modification)","抑制 mRNA 的剪接作用(splicing)","促進 mRNA 的降解(degradation)"],"a":[3],"ch":["28"],"sec":"28.3","fbt":""},{"id":"M-103-2_35","t":"M","y":103,"q":"下列何者不屬於轉錄因子和 DNA 結合區之 DNA binding domain?","o":["Helix-turn-helix","Nuclear localization signal","Zinc finger","Homeodomain"],"a":[1],"ch":["28"],"sec":"28.1","fbt":""},{"id":"M-103-2_36","t":"M","y":103,"q":"抑制細胞內乳酸去氫酶(lactate dehydrogenase)的活性會影響下列那些反應的進行?","o":["克氏循環(TCA cycle)無法進行","無氧狀態的糖解作用(anaerobic glycolysis)無法進行，克氏循環(TCA cycle)不受影響","無氧狀態的糖解作用(anaerobic glycolysis)與克氏循環(TCA cycle)皆無法進行","氧化磷酸化作用(oxidative phosphorylation)與克氏循環(TCA cycle)皆無法進行"],"a":[1],"ch":["14"],"sec":"14.3","fbt":""},{"id":"M-103-2_37","t":"M","y":103,"q":"有關調控肝臟之肝醣(glycogen)代謝的敍述，下列何者正確?","o":["Cyclic AMP 促進 glycogen phosphorylase 之磷酸化並活化其活性","Glucagon 促進 glycogen synthase 之活性","Insulin 活化 glycogen phosphorylase 之活性","高血糖同時活化 glycogen phosphorylase 和 glycogen synthase"],"a":[0],"ch":["15"],"sec":"15.5","fbt":""},{"id":"M-103-2_38","t":"M","y":103,"q":"紅血球內之葡萄糖利用糖解作用(glycolysis)產生丙酮酸(pyruvate)，它進一步會氧化成下列何種分子?","o":["CO2","Ethanol","Lactate","Citrate"],"a":[0,1,2,3],"ch":["14"],"sec":"","fbt":"","free":1},{"id":"M-103-2_39","t":"M","y":103,"q":"砷酸鹽(arsenate)的結構性質類似磷酸鹽(phosphate)，對糖解作用(glycolysis)之影響為:","o":["抑制六碳糖激酶(hexokinase)活性","抑制磷酸果糖激酶(phosphofructokinase)活性","抑制糖解過程之 ATP 生成","抑制整個糖解過程"],"a":[2],"ch":["14"],"sec":"","fbt":""},{"id":"M-103-2_40","t":"M","y":103,"q":"在饑餓或糖尿病時，下列何者最不可能發生?","o":["丙二醯輔酶 A(Malonyl-CoA)濃度升高","乙醯乙醯輔酶 A(Acetoacetyl-CoA)濃度升高","酮體(Ketone body)濃度升高","脂肪酸(Fatty acid)濃度升高"],"a":[0],"ch":[],"sec":"","fbt":""},{"id":"M-103-2_41","t":"M","y":103,"q":"葡萄糖經由下列何種運輸方式，進入到紅血球內?","o":["主動運輸(active transport)","反向運輸(antiport)","電能單向運輸(electrogenic uniport)","促進性擴散(facilitated diffusion)"],"a":[3],"ch":["11"],"sec":"11.3","fbt":"","ex":["紅血球攝取葡萄糖不耗 ATP，不是主動運輸。","GLUT1 不交換其他溶質，不是反向運輸。","葡萄糖不帶電，運送不產生電流，不是電能性單向運輸。","紅血球由 GLUT1 以促進性擴散攝取葡萄糖，沿濃度梯度、可飽和、可被 cytochalasin B 抑制。"]},{"id":"M-103-2_42","t":"M","y":103,"q":"下列關於脂質代謝的敘述，何者錯誤?","o":["細胞中合成膽固醇的前驅物為乙醯輔酶(acetyl-CoA)","運送由食物攝取之三酸甘油酯(triacylglycerol)的主要脂蛋白(lipoprotein)，為超低密度脂蛋白(VLDL , very low density lipoprotein)","低密度脂蛋白(LDL, low density lipoprotein)主要功能是將膽固醇送到周邊組織，易增加膽固醇在血管內壁堆積的風險，因此被稱為壞膽固醇(bad cholesterol)","胰島素可藉由活化 HMG-CoA reductase 而促進細胞中膽固醇的生合成"],"a":[1],"ch":["21"],"sec":"21.4","fbt":"","ex":["膽固醇的所有碳原子都來自 acetyl-CoA，敘述正確。","運送食物來源三酸甘油酯的是乳糜微粒（chylomicron）；VLDL 運的是肝臟自行合成的三酸甘油酯，故此敘述錯誤。","LDL 把膽固醇送往周邊組織，氧化後易沉積血管壁形成粥狀硬化，俗稱壞膽固醇，敘述正確。","胰島素促使 HMG-CoA reductase 去磷酸化而活化，增加膽固醇合成，敘述正確。"]},{"id":"M-103-2_43","t":"M","y":103,"q":"下列關於 Cystic fibrosis 遺傳疾病的敘述，何者錯誤?","o":["造成 cystic fibrosis 的原因是 CFTR(Cystic fibrosis transmembrane conductance regulator)基因發生突變","Cystic fibrosis 導致嚴重的上呼吸道感染","Cystic fibrosis 導致上皮細胞纖毛(cilia)擺動困難造成細菌容易感染","Cystic fibrosis 的 CFTR 缺陷，造成 Cl-離子由細胞外大量運到細胞內"],"a":[3],"ch":["11"],"sec":"11.3","fbt":"Box 11-2","ex":["CFTR 基因突變（最常見 ΔF508）是病因，敘述正確。","黏稠分泌物滯積造成反覆呼吸道感染（常見綠膿桿菌），敘述正確。","分泌液脫水變稠使纖毛清除功能受損，細菌易定殖，敘述正確。","CFTR 是 cAMP 調控的「氯離子通道」，缺陷時 Cl− 無法送「出」上皮細胞，水分跟著留不住，分泌物才變稠；說造成 Cl− 由細胞外大量運入是方向相反，故錯誤。"]},{"id":"M-103-2_44","t":"M","y":103,"q":"胺基酸代謝須進行轉氨反應，此反應最常需要那一種維生素參與?","o":["Vitamin B1(Thiamine)","Vitamin B2(Riboflavine)","Vitamin B6(Pyridoxine)","Vitamin B12(Cobalamin)"],"a":[2],"ch":["18"],"sec":"18.1","fbt":"","ex":["B1（TPP）負責脫羧反應。","B2（FAD）負責氧化還原。","B6 的活性型磷酸吡哆醛是所有轉胺酶的輔酶，先把胺基接到自己身上（變成 pyridoxamine phosphate）再交給酮酸。","B12 參與 methionine synthase 與 methylmalonyl-CoA mutase，不參與轉胺。"]},{"id":"M-103-2_45","t":"M","y":103,"q":"心肌細胞受損後，最先在血液裡可以偵測到下列何種酵素?","o":["Creatine kinase","Alkaline phosphatase","Glutaminase","Aspartate aminotransferase"],"a":[0],"ch":["18"],"sec":"18.2","fbt":"Box 18-1","ex":["creatine kinase（特別是 CK-MB）分子量小、心肌含量高，在心肌受損後數小時內就能在血中測到，是四個選項中最早出現者。（臨床上 troponin 更專一但不在選項中。）","鹼性磷酸酶反映膽道與骨骼疾病，不是心肌指標。","glutaminase 不是臨床上的心肌損傷指標。","AST（GOT）雖會升高，但出現較晚且專一性差，不是最先偵測到的。"]},{"id":"M-103-2_46","t":"M","y":103,"q":"下列何者為粒線體電子傳遞鏈 Complex I 的 electron donor?","o":["NADH","Cytochrome c","Coenzyme Q","Succinate"],"a":[0],"ch":["19"],"sec":"19.1","fbt":"Figure 19-8"},{"id":"M-103-2_47","t":"M","y":103,"q":"在細胞週期中，下列何種蛋白質可受細胞週期蛋白質依賴蛋白質激酶(cyclin-dependent protein kinase) 的磷酸化?","o":["胰島素(insulin)","肌紅蛋白(myoglobin)","肌凝蛋白(myosin)","視網膜錐體蛋白質(retinal cone protein)"],"a":[2],"ch":["12"],"sec":"12.1","fbt":"","ex":["胰島素是分泌性荷爾蒙，不是 CDK 的受質。","肌紅蛋白是攜氧蛋白，與細胞週期無關。","cyclin B-CDK1 會磷酸化 myosin 輕鏈、核膜 lamin、condensin 等結構蛋白，推動染色體凝聚、核膜崩解與分裂。","視錐／視桿的 rhodopsin 類蛋白由 rhodopsin kinase 磷酸化，與 CDK 無關。"]},{"id":"M-103-2_48","t":"M","y":103,"q":"Multiple Endocrine Neoplasia 2(MEN-2)是因為 RET gene 發生突變所致。RET 是一種 tyrosine kinase receptor，當它與其 Ligand 結合後，不會產生下列何種反應?","o":["Receptor 會 dimerization","Receptor kinase 會磷酸化自己","Receptor kinase 會磷酸化其它蛋白質","會造成細胞內 cAMP 上升"],"a":[3],"ch":["12"],"sec":"12.4","fbt":"","ex":["RTK 與配體結合後二聚化，會發生。","二聚化後兩個激酶域互相自我磷酸化，會發生。","活化的受體會磷酸化下游蛋白的 tyrosine，會發生。","RTK 不經由 G 蛋白活化 adenylyl cyclase，所以不會造成細胞內 cAMP 上升。"]},{"id":"M-103-2_49","t":"M","y":103,"q":"小朋友患有多發性視網膜細胞瘤(retinoblastoma)可發生於單眼或雙眼的視網膜，造成這些疾病最可能的原因是:","o":["多發性腫瘤的病患出生時，每一個視網膜細胞(retinal cell)的 Rb gene 的兩個 copies 皆已有缺陷","單一腫瘤的病患於出生時，單一眼睛上之 Rb gene 的兩個 copies 皆已有缺陷","無論是單一或多發性腫瘤，都需要在小孩成長過程中，再發生第二個 copy 的 Rb gene 突變才會發生腫瘤","Rb gene 本身就是致癌基因(oncogene)"],"a":[2],"ch":["12"],"sec":"","fbt":"","ex":["多發性（雙眼）病患是生殖細胞帶「一個」Rb 缺陷 copy，不是兩個都已缺陷。","單一腫瘤多為體細胞先後發生兩次突變，出生時並非已有兩個缺陷 copy。","Knudson two-hit 假說：Rb 是腫瘤抑制基因，兩個 copy 都失去功能才成瘤；不論單發或多發，都需要在成長過程中再發生第二次突變。","Rb 是腫瘤抑制基因（失去功能致病），不是致癌基因。"]},{"id":"M-103-2_50","t":"M","y":103,"q":"下列何者是第二型限制酶(type II restriction enzymes)的錯誤敘述?","o":["可以在特定的辨認序列(recognition sequences)內作交錯式(staggered end)切割","可以在特定的辨認序列(recognition sequences)內產生平端(blunt end)切割","在細菌中用以切割外來 DNA 的防禦系統","同一種限制酶可對不同的辨認序列進行切割"],"a":[3],"ch":["9"],"sec":"9.1","fbt":"","ex":["許多第二型限制酶在辨識序列內錯開切割產生黏性末端（如 EcoRI），敘述正確。","也有些產生平端（如 SmaI、HaeIII），敘述正確。","限制酶是細菌限制修飾系統的一部分，用來切碎入侵的噬菌體 DNA，敘述正確。","每一種限制酶只辨識它自己那一段特定序列；不同辨識序列要用不同的酶（偶有同切點酶 isoschizomer，但那是不同的酶），故此敘述錯誤。"]},{"id":"M-103-2_51","t":"M","y":103,"q":"下列何者不會作用於 ligand-gated channels?","o":["Acetylcholine","Serotonin","GABA","Interferon"],"a":[3],"ch":["12"],"sec":"12.8","fbt":"","ex":["乙醯膽鹼作用於菸鹼型受體，是配體門控陽離子通道。","serotonin 的 5-HT3 受體是配體門控陽離子通道。","GABA 作用於 GABA-A，是配體門控 Cl− 通道。","interferon 作用於細胞激素受體，走 JAK-STAT 路徑，不是離子通道。"]},{"id":"M-102-1_26","t":"M","y":102,"q":"競爭型抑制劑(competitive inhibitor)對於酵素動力學參數的影響為：","o":["使Km值上升","使kcat值下降","使kcat / Km值上升","使Vmax下降"],"a":[0],"ch":["6"],"sec":"6.3","fbt":"Box 6-2"},{"id":"M-102-1_27","t":"M","y":102,"q":"囊狀纖維化(cystic fibrosis)病患最常見的分子特徵為：CFTR 蛋白質(cystic fibrosis transmembrane conductance regulator)中少了第 50號苯丙胺酸(phenylalanine)。下列何種特性，最可能是這個 CFTR 蛋白質突變導致其疾病的主要原因？","o":["蛋白質穩定度(protein stability)提昇，導致 CFTR 蛋白質堆積於細胞外","蛋白質輸核機制(nuclear transport)改變，導致 CFTR 蛋白質累積於細胞核內","蛋白質疊合(protein folding)異常，導致 CFTR 蛋白質於細胞內容易被降解","蛋白質磷酸化(phosphorylation)增加，導致 CFTR 蛋白質於細胞膜的活性過高"],"a":[2],"ch":["4"],"sec":"4.4","fbt":"Box 11-2"},{"id":"M-102-1_28","t":"M","y":102,"q":"25歲病患因昏迷被送來急診，檢查發現血中碳氧血紅蛋白(carboxyhemoglobin)占總血紅蛋白的 40%。 相較於氧合血紅蛋白(oxyhemoglobin)，下列何者可能是碳氧血紅蛋白不能有效輸送氧分子至一般 組織的主要原因？","o":["於一般組織的低氧狀態下，結合一個一氧化碳時，碳氧血紅蛋白結合氧分子的能力過高","於一般組織的低氧狀態下，結合一個一氧化碳時，碳氧血紅蛋白結合氧分子的能力過低","於肺泡組織的高氧狀態下，結合一個一氧化碳時，碳氧血紅蛋白結合氧分子的能力不變","於肺泡組織的高氧狀態下，結合一個一氧化碳時，碳氧血紅蛋白結合氧分子的能力過低"],"a":[0],"ch":["5"],"sec":"5.1","fbt":"Box 5-1"},{"id":"M-102-1_29","t":"M","y":102,"q":"下列關於分子伴護蛋白(molecular chaperones)性質的敘述，何者錯誤？","o":["分子伴護蛋白可以協助摺疊錯誤的蛋白質(misfolded protein)走向正確的摺疊途徑","大部分分子伴護蛋白在作用時，無須消耗腺嘌呤核苷三磷酸(ATP)","大部分分子伴護蛋白的含量在細胞處與高溫狀態時會上升","某些分子伴護蛋白可藉由與未摺疊蛋白質所暴露之疏水性區域結合，防止其不當凝聚"],"a":[1],"ch":["4"],"sec":"4.4","fbt":"Figure"},{"id":"M-102-1_30","t":"M","y":102,"q":"30 磷酸吡哆醛(pyridoxal phosphate)是下列何種酶活性所需？","o":["肝糖磷解酶(glycogen phosphorylase)","六碳糖激酶(hexokinase)","丙酮酸脫氫酶(pyruvate dehydrogenase)","磷酸果糖激酶-1(phosphofructokinase-1)"],"a":[0],"ch":["15"],"sec":"15.5","fbt":"Figure 15-36"},{"id":"M-102-1_31","t":"M","y":102,"q":"有關「心臟病患血中膽固醇(cholesterol)過高而服用降膽固醇藥物 statin，會影響 SREBP(sterol response element binding protein)之作用」，下列何者錯誤？","o":["肝細胞中 SREBP 會由 ER 釋放出來","LDL receptor 基因表現會增加","血液中 LDL-cholesterol 會下降","SREBP 只調控與膽固醇代謝相關的基因"],"a":[3],"ch":["21"],"sec":"21.4","fbt":"","ex":["statin 抑制 HMG-CoA reductase 使細胞內膽固醇下降，SCAP-SREBP 複合體得以離開 ER 前往高基氏體被切割釋出，敘述正確。","釋出的 SREBP 進核後上調 LDL receptor 基因，敘述正確。","肝細胞表面 LDL 受體增加，從血中清除更多 LDL，血中 LDL-C 下降，敘述正確。","SREBP 是一個家族：SREBP-2 主管膽固醇，SREBP-1c 則調控脂肪酸與三酸甘油酯合成的基因，所以說它「只」調控膽固醇相關基因是錯的。"]},{"id":"M-102-1_32","t":"M","y":102,"q":"下列何種 DNA 核苷酸序列能被限制性核酸內切酶(restriction endonucleases)辨識並切割？","o":["AATAAT","AAACCC","GAATTC","AAAGGG"],"a":[2],"ch":["9"],"sec":"9.1","fbt":"Table 9-2","ex":["AATAAT 的反向互補是 ATTATT，不是迴文。","AAACCC 的反向互補是 GGGTTT，不是迴文。","GAATTC 的反向互補仍是 GAATTC，是迴文序列，正是 EcoRI 的辨識與切割位點（在 G 與 A 之間錯開切，產生 AATT 黏性末端）。","AAAGGG 的反向互補是 CCCTTT，不是迴文。"]},{"id":"M-102-1_33","t":"M","y":102,"q":"下列那一項突變在蛋白質表現區(coding sequence)對於其蛋白質功能影響最大？","o":["插入一個核苷酸(nucleotide)","把 adenine 變成 cytosine","把 thymine 變成 cytosine","刪除了三個核苷酸"],"a":[0],"ch":["27"],"sec":"27.1","fbt":""},{"id":"M-102-1_34","t":"M","y":102,"q":"Klenow fragment 是大腸桿菌(E. coli)DNA 聚合酶 I 型(DNA polymerase I)的片段，其主要具有何 種酵素活性？","o":["聚合酶與 5’核酸外切酶(polymerase and 5’ exonuclease)活性","聚合酶與 3’核酸外切酶(polymerase and 3’ exonuclease)活性","5’與 3’核酸外切酶(5’ and 3’ exonuclease)活性","聚合酶，5’與 3’核酸外切酶(polymerase，5’ and 3’ exonuclease)活性"],"a":[1],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-102-1_35","t":"M","y":102,"q":"細菌之 RNA 聚合酶本體(core enzyme)不包含下列何種次單元(subunit)？","o":["α","β","β'","σ"],"a":[3],"ch":["26"],"sec":"26.1","fbt":"Figure 26-4"},{"id":"M-102-1_36","t":"M","y":102,"q":"乳糖操縱子(lac operon)作轉錄表現時，能產生多順反子信使 RNA(polycistronic mRNA)。下列 有關 polycistronic mRNA 的敘述，何者正確？","o":["一條 mRNA 上含有能調控 lac operon 的正調控因子和負調控因子","一條 mRNA 上含有反置重覆序列(inverted repeat sequence)的編碼","一條 mRNA 上含有多個基因的編碼","一條 mRNA 上含有能抑制 β-半乳糖苷酶(β-galactosidase)轉譯的專一性序列"],"a":[2],"ch":["28"],"sec":"28.1","fbt":""},{"id":"M-102-1_37","t":"M","y":102,"q":"促進子(enhancer)在基因轉錄(transcription)時的特性為：","o":["distance-independent, orientation-independent","distance-independent, orientation-dependent","distance-dependent, orientation-independent","distance-dependent, orientation-dependent"],"a":[0],"ch":["28"],"sec":"28.3","fbt":""},{"id":"M-102-1_39","t":"M","y":102,"q":"丙酮酸(pyruvate)生成草醯乙酸(oxaloacetate)之催化酶，需要下列何者作為變構活化劑(allosteric activator)？","o":["ADP","acetyl-CoA","glucose","NAD+"],"a":[1],"ch":["14"],"sec":"14.4","fbt":""},{"id":"M-102-1_40","t":"M","y":102,"q":"有一種罕見糖尿病，是由於 hexokinase 之基因突變所造成，其 substrate 是：","o":["fructose","glucose","galactose","sucrose"],"a":[1],"ch":["14"],"sec":"14.1","fbt":"Figure 14-2"},{"id":"M-102-1_41","t":"M","y":102,"q":"Valinomycin 抗生素是一種 ionophore，下列相關敘述何者錯誤？","o":["它是一種具環狀結構的 peptide 抗生素","其殺菌的效果是因為能使細菌之細胞壁無法合成","其殺菌的效果是因為擾亂細胞膜內外的離子平衡","它能夠攜帶K+離子通過細胞膜"],"a":[1],"ch":["11"],"sec":"11.3","fbt":"Figure 11-42","ex":["valinomycin 是由胺基酸與羥酸交替組成的環狀胜肽，敘述正確。","它完全不影響細胞壁合成（那是 β-內醯胺類抗生素的機制），故此敘述錯誤。","它讓 K+ 沿梯度漏出，瓦解跨膜電化學梯度與質子驅動力，細菌無法製造 ATP 而死亡，敘述正確。","它的中心腔以六個羰基氧配位去水合的 K+，外殼疏水，正是攜帶 K+ 穿膜的載體型離子載體，敘述正確。"]},{"id":"M-102-1_42","t":"M","y":102,"q":"Multi-drug transporter(MDR 1)和癌症治療有關，下列有關 MDR 1的敘述，何者錯誤？","o":["是一種膜蛋白","不需要 ATP 即可作用","是一種 ABC transporter","可以將藥物送出細胞外"],"a":[1],"ch":["11"],"sec":"11.3","fbt":"","ex":["MDR1（P-glycoprotein）是細胞膜上的膜蛋白，敘述正確。","ABC transporter 的 ABC 就是 ATP-binding cassette，MDR1 必須水解 ATP 才能把藥物逆梯度泵出，故此敘述錯誤。","它屬 ABC transporter 超家族，敘述正確。","它把化療藥物泵出細胞，是癌細胞多重抗藥性的主因，敘述正確。"]},{"id":"M-102-1_43","t":"M","y":102,"q":"下列關於細胞內膽固醇恆定的調控敘述，何者錯誤？","o":["膽固醇合成的關鍵性酵素為 HMG-CoA 還原酶(HMG-CoA reductase)","細胞內膽固醇量過多時，可以活化 ACAT(Acyl-CoA:cholesterol acyl transferase)使膽固醇進行酯化","當細胞內缺乏膽固醇時，可以攝取葡萄糖直接促進膽固醇的合成","細胞內膽固醇量過多時，細胞將抑制 LDL receptor 的表現，進而降低細胞對血液中膽固醇的攝取量"],"a":[2],"ch":["21"],"sec":"21.4","fbt":"","ex":["HMG-CoA reductase 是膽固醇合成的限速酶，也是 statin 的作用標的，敘述正確。","膽固醇過多時 ACAT 被活化，把膽固醇酯化成膽固醇酯儲存於細胞內脂滴，敘述正確。","葡萄糖只是間接提供 acetyl-CoA 與 NADPH；細胞缺膽固醇時真正的機制是 SREBP 活化而上調 HMG-CoA reductase 與 LDL receptor，說攝取葡萄糖可「直接促進」膽固醇合成並不正確。","膽固醇過多時經 SREBP 路徑下調 LDL receptor 表現，減少攝取，敘述正確。"]},{"id":"M-102-1_44","t":"M","y":102,"q":"安息香酸(benzoate)與苯丁酸(phenylbutyrate)是用來治療尿素循環(urea cycle)障礙疾病的藥物， 其藥理作用主要為何？","o":["提供尿素循環所需的中間產物，增進整個尿素循環的效率","作為胺甲醯磷酸合成酶(carbamoyl phosphate synthase I)的異位活化劑(allosteric activator)，增 進尿素循環的效率","其代謝物分別與甘胺酸(glycine)和麩醯胺酸(glutamine)結合成衍生物排出體外，減少尿素循 環的負擔","促進精胺酸(arginine)的合成，防止精胺酸缺乏的發生"],"a":[2],"ch":["18"],"sec":"18.2","fbt":"Figure 18-14","ex":["補充中間產物（arginine、citrulline）是另一種策略，不是這兩個藥的機制。","作為 CPS I 異位活化劑的是 carbamoyl glutamate（carglumic acid）。","benzoate 與 glycine 結合成 hippurate、phenylbutyrate 代謝成 phenylacetate 後與 glutamine 結合成 phenylacetylglutamine，兩者都由尿排出，等於開一條不經尿素循環的「排氮旁路」。","促進精胺酸合成不是這兩個藥的作用機制。"]},{"id":"M-102-1_45","t":"M","y":102,"q":"下列那一個酵素的功能喪失會導致 Phenylketonuria？","o":["Aminotransferase","Phenylalanine hydroxylase","Maleylacetoacetate isomerase","Fumarylacetoacetase"],"a":[1],"ch":["18"],"sec":"18.3","fbt":"Table 18-2","ex":["轉胺酶功能喪失不會造成 PKU。","PKU 是 phenylalanine hydroxylase 缺損，苯丙胺酸無法轉成酪胺酸而堆積，改走轉胺生成苯丙酮酸。","maleylacetoacetate isomerase 在酪胺酸分解的下游，缺損造成其他酪胺酸血症。","fumarylacetoacetase 缺損造成 type I 酪胺酸血症（肝腎損傷），不是 PKU。"]},{"id":"M-102-1_46","t":"M","y":102,"q":"下列那一個酵素位於粒線體電子傳遞鏈的 Complex II？","o":["NADH dehydrogenase","cytochrome c oxidase","succinate dehydrogenase","ubiquinol-cytochrome c oxidoreductase"],"a":[2],"ch":["19"],"sec":"19.1","fbt":""},{"id":"M-102-1_47","t":"M","y":102,"q":"一位中年婦人最近節食減肥，因虛弱無力、無法行動而送至急診，經診斷為腳氣病(beriberi)。下 列有關此病之敘述，何者正確？","o":["此病主要是因硫胺素(thiamine)缺乏所導致","此病是因醣類攝取不足所引起","血中的丙酮酸(pyruvate)會下降","神經系統不會受到影響"],"a":[0],"ch":["14"],"sec":"14.3","fbt":""},{"id":"M-102-1_48","t":"M","y":102,"q":"車禍病人的腦部受傷發生尿崩症，是因為其抗利尿激素(antidiuretic hormone)分泌下降。抗利尿激 素作用在位於腎小管上之 G protein coupled receptor，其主要可造成下列何種反應？","o":["使 G protein dimerization","抑制 protein kinase C","細胞內 cGMP 濃度下降","可活化 adenylyl cyclase"],"a":[3],"ch":["12"],"sec":"12.2","fbt":"Figure 12-4","ex":["三聚體 G 蛋白活化時是解離成 α 與 βγ，不是二聚化。","ADH 的 V2 受體走 Gs-cAMP，與抑制 PKC 無關。","與 cGMP 下降無關。","ADH 結合腎集尿管的 V2 受體 → Gs → 活化 adenylyl cyclase → cAMP → PKA → aquaporin-2 移到頂膜而回收水分。"]},{"id":"M-102-1_49","t":"M","y":102,"q":"下列關於細胞與細胞週期(cell cycle)的敘述，何者錯誤？","o":["處於 S phase 的細胞主要進行 DNA 複製(DNA replication)工作","處於 M phase 的細胞主要進行細胞分裂","大部分高度分化的細胞，皆處於 S phase","在快速分裂時，細胞處在 S phase 的比例增加"],"a":[2],"ch":["24"],"sec":"24.3","fbt":"Figure 24-23","ex":["S 期正是 DNA 複製期，敘述正確。","M 期進行有絲分裂與胞質分裂，敘述正確。","高度分化的細胞（神經元、心肌、成熟紅血球前驅）多半退出細胞週期停在 G0 期，不是 S 期，故此敘述錯誤。","快速分裂的族群中正在複製 DNA 的細胞比例自然較高，敘述正確。"]},{"id":"M-102-1_50","t":"M","y":102,"q":"下列那一項對 cDNA 微矩陣(microarray)的敘述錯誤？","o":["可以同時分析細胞內數千基因的相對表現量","可利用 PCR 技術合成 DNA，固定在玻片上","可以利用 photolithography 技術合成基因晶片","也可以偵測蛋白質表現程度"],"a":[3],"ch":["9"],"sec":"9.2","fbt":"","ex":["微陣列一次可比較數千到數萬個基因的相對表現量，敘述正確。","早期的 cDNA 微陣列正是把 PCR 產物點在玻片上，敘述正確。","Affymetrix 的寡核苷酸晶片即以光微影技術在晶片上原位合成探針，敘述正確。","cDNA 微陣列靠的是核酸雜交，測的是 mRNA 的量；要偵測蛋白質表現必須用蛋白質晶片或質譜，故此敘述錯誤。"]},{"id":"M-102-2_22","t":"M","y":102,"q":"下列那一種葡萄糖轉運子(glucose transporter，GLUT)是負責運送葡萄糖進入胰臟貝他細胞(β cell)？","o":["GLUT1","GLUT2","GLUT3","GLUT4"],"a":[1],"ch":["11"],"sec":"11.3","fbt":"Table 11-1","ex":["GLUT1 主要在紅血球與腦血管內皮。","胰臟 β 細胞用高 Km 的 GLUT2，使葡萄糖攝取速率隨血糖線性變化，成為血糖感測器的第一關（接著由 glucokinase 這個同樣高 Km 的酵素接棒）。","GLUT3 在神經元。","GLUT4 在肌肉與脂肪，受胰島素調控。"]},{"id":"M-102-2_26","t":"M","y":102,"q":"許多蛋白質須與金屬離子結合後才能展現正確的功能，下列何種胺基酸的側鏈具備與金屬離子直接 結合的能力？","o":["半胱胺酸(cysteine)","丙胺酸(alanine)","苯丙胺酸(phenylalanine)","脯胺酸(proline)"],"a":[0],"ch":["3"],"sec":"3.1","fbt":""},{"id":"M-102-2_27","t":"M","y":102,"q":"維生素 lipoic acid 及 biotin 是與酶分子中那個胺基酸結合？","o":["proline","glutamate","lysine","arginine"],"a":[2],"ch":["16"],"sec":"16.1","fbt":"Figure 16-4"},{"id":"M-102-2_28","t":"M","y":102,"q":"缺乏下列何種營養素最常導致腳氣病(beriberi)？","o":["硫胺素(thiamine)","核黃素(riboflavin)","菸鹼酸(niacin)","維生素 B6(pyridoxine)"],"a":[0],"ch":["14"],"sec":"14.3","fbt":""},{"id":"M-102-2_29","t":"M","y":102,"q":"缺乏維生素 B12最可能會導致下列何種疾病？","o":["腳氣病(beriberi)","壞血病(scurvy)","惡性貧血(pernicious anemia)","口角炎(angular stomatitis)"],"a":[2],"ch":["17"],"sec":"17.2","fbt":"Box 17-2","ex":["腳氣病是維生素 B1（硫胺素）缺乏。","壞血病是維生素 C 缺乏。","B12 缺乏造成惡性貧血（巨母紅血球性貧血）並可伴隨脊髓後索與側索的神經病變；典型原因是內在因子缺乏或長期純素食。","口角炎主要與維生素 B2（核黃素）缺乏有關。"]},{"id":"M-102-2_30","t":"M","y":102,"q":"5’-ACCGTAAGGCTTTAG-3’DNA 之互補股(complementary strand)，其核苷酸序列為何？","o":["5’-ACCGUAAGGCUUUA-3’","5’-CUAAAGCCUUACGG-3’","5’-CTAAAGCCTTACGGT-3’","5’-ACCGTAAGGCTTTAG-3’"],"a":[2],"ch":["8"],"sec":"8.2","fbt":"","ex":["互補股是 DNA，不應出現 U；而且長度少了一個。","方向寫反了，而且含 U。","5′-ACCGTAAGGCTTTAG-3′ 的互補股以 5′→3′ 書寫為 5′-CTAAAGCCTTACGGT-3′：先逐位互補（TGGCATTCCGAAATC），再反向讀出即得。","這是原序列本身，不是互補股。"]},{"id":"M-102-2_31","t":"M","y":102,"q":"在生物體內，質體(plasmid)DNA 以負超螺旋結構(negative supercoiling)存在，這代表其 linking number(Lk)為何？","o":["Lk＞Lk₀","Lk＝Lk₀","Lk＜Lk₀","無法判斷"],"a":[2],"ch":["24"],"sec":"24.2","fbt":"Figure 24-16","ex":["Lk 大於 Lk0 是「正」超螺旋（overwound）。","Lk 等於 Lk0 是鬆弛態，沒有超螺旋。","負超螺旋表示實際的連結數少於鬆弛狀態的 Lk0，也就是 Lk < Lk0（underwound）。細胞內 DNA 普遍呈負超螺旋，有利於解股進行複製與轉錄；細菌的 DNA gyrase 就是靠耗 ATP 主動引入負超螺旋。","由定義即可判斷，並非無法判斷。"]},{"id":"M-102-2_32","t":"M","y":102,"q":"關於針對核苷酸合成路徑所設計的藥物，下列敘述何者錯誤？","o":["azaserine 會抑制 glutamine amidotransferase，無法提供核苷酸合成所需要的氮基","fluorouracil 會抑制 thymidylate kinase","methotrexate 會抑制 dihydrofolate reductase","trimethoprim 對細菌 dihydrofolate reductase 的親和力比對人類相對應的酵素還要高十萬倍"],"a":[1,3],"ch":["22"],"sec":"22.4","fbt":"","ex":["azaserine 是 glutamine 類似物，確實抑制 glutamine amidotransferase 而切斷氮來源，敘述正確。","fluorouracil 抑制的是 thymidylate synthase（經由 FdUMP），不是 thymidylate kinase，故此敘述錯誤。","methotrexate 是葉酸類似物，抑制 dihydrofolate reductase，敘述正確。","Lehninger 寫 trimethoprim 對細菌 DHFR 的結合力約比哺乳類酵素高十萬倍，依講義此敘述為正確；官方答案仍併計 D，作答時以 B 為準。"]},{"id":"M-102-2_33","t":"M","y":102,"q":"細胞在下列何種情況之下，會有反轉錄酵素(reverse transcriptase)活性的參與？","o":["DNA lagging strand 的複製","DNA leading strand 的複製","某些 RNA 病毒的複製","SV40 病毒的複製"],"a":[2],"ch":["26"],"sec":"26.3","fbt":""},{"id":"M-102-2_34","t":"M","y":102,"q":"下列有關微型核糖核酸(micro RNA)之敘述，何者正確？","o":["經修飾後的最終產物大約有 200～300 個核苷酸(nucleotides)","會轉譯出一個 5 kDa 的蛋白質","可由 RNA polymerase II 轉錄製造","可結合特定蛋白質而分解其它蛋白質"],"a":[2],"ch":["26"],"sec":"26.2","fbt":"Figure 26-27"},{"id":"M-102-2_35","t":"M","y":102,"q":"具有下列何種胺基酸序列之蛋白質，最有可能在轉譯後送入細胞核內？","o":["met-ser-ser-ala-gly-trp-val-lys-asp-val-ile-leu-leu-tyr-tyr-cys-","met-thr-ile-ala-leu-ile-leu-leu-pro-leu-leu-phe-met-ser-ala-ala-","met-ile-leu-lys-lys-arg-arg-met-lys-arg-arg-tyr-ser-asp-gly-ile-","met-lys-ala-ser-asp-ser-ser-gly-arg-trp-tyr-met-his-trp-arg-ile-"],"a":[2],"ch":["27"],"sec":"27.3","fbt":""},{"id":"M-102-2_36","t":"M","y":102,"q":"請指出 σ factor 在大腸桿菌 RNA 聚合酶(polymerase)中的功能為何？","o":["先與啟動子結合，再誘使與核心酶(core enzyme)的結合","與核心酶(core enzyme)結合後，能確保 RNA 聚合酶與啟動子(promoter)結合的專一性","能終止 RNA 鏈生合成的因子","具轉錄 DNA 模板的活性"],"a":[1],"ch":["26"],"sec":"26.1","fbt":"Figure 26-6"},{"id":"M-102-2_37","t":"M","y":102,"q":"關於 aminoacyl-tRNA 的合成反應，下列那一項敘述正確？","o":["需要鳥苷三磷酸(GTP)與錳離子(Mn2+)","需要腺苷三磷酸(ATP)與錳離子(Mn2+)","將胺基酸接合在 tRNA 的 5’端","由 aminoacyl-tRNA synthetase 催化產生"],"a":[3],"ch":["27"],"sec":"27.2","fbt":""},{"id":"M-102-2_38","t":"M","y":102,"q":"克氏循環(TCA cycle)中那種酵素的受質為一個四碳化合物？","o":["異檸檬酸脫氫酶(isocitrate dehydrogenase)","烏頭酸酶(aconitase)","檸檬酸合成酶(citrate synthase)","乳酸脫氫酶(lactate dehydrogenase)"],"a":[2],"ch":["16"],"sec":"16.2","fbt":"Figure 16-7"},{"id":"M-102-2_39","t":"M","y":102,"q":"下列有關人體細胞進行葡萄糖新生作用(gluconeogenesis)之敍述何者正確？","o":["可將蛋白質轉變成血糖","胰島素可活化葡萄糖新生作用","攝取高醣類食物後，利用此作用來降低血糖","脂肪酸轉變成葡萄糖之必需途徑"],"a":[0],"ch":["14"],"sec":"14.4","fbt":"Figure 14-16"},{"id":"M-102-2_40","t":"M","y":102,"q":"紅血球因缺乏粒線體，其葡萄糖分解的最終產物為何？","o":["pyruvate","lactate","acetyl-CoA","CO2"],"a":[1],"ch":["14"],"sec":"14.3","fbt":""},{"id":"M-102-2_41","t":"M","y":102,"q":"穿越細胞膜(transmembrane)的蛋白質中，色胺酸(tryptophan)最常位於何處？","o":["細胞膜脂肪層內(intra-lipid bilayer)","細胞質的水相中","細胞膜脂肪層與細胞質水相之交接處","緊鄰於甘胺酸(glycine)"],"a":[2],"ch":["11"],"sec":"11.1","fbt":"Figure 11-13","ex":["脂肪層正中央的疏水核心以 Leu、Ile、Val、Phe、Ala 等小型疏水殘基為主。","細胞質水相中以帶電與極性殘基為主。","色胺酸與酪胺酸的側鏈同時具疏水的環與可形成氫鍵的基團，最常聚集在脂雙層與水相的「界面」，像錨一樣把穿膜螺旋定位在正確深度。","色胺酸並沒有特別緊鄰甘胺酸的傾向。"]},{"id":"M-102-2_42","t":"M","y":102,"q":"厭水性分析圖(hydropathy plot)一般可用於：","o":["推算膜蛋白質的四級結構","測定天然的蛋白質(native protein)的水含量","推算膜蛋白質的實際分子量","預測已知的蛋白質胺基酸序列是否含有穿膜區(membrane-spanning segment)"],"a":[3],"ch":["11"],"sec":"11.1","fbt":"Figure 11-10","ex":["厭水性分析無法推算四級結構。","它不是用來測蛋白質的水含量。","它與分子量的推算無關。","把序列上連續約 20 個殘基的疏水性平均值沿序列作圖，出現連續的高疏水峰就預示有一段穿膜 α 螺旋 —— 這是由序列預測膜蛋白拓樸的標準方法。"]},{"id":"M-102-2_43","t":"M","y":102,"q":"脂肪酸 cis-, cis-delta 9, delta 12-octadecadienoate 是指下列何者？","o":["oleate","palmitoleate","linoleate","arachidonate"],"a":[2],"ch":["10"],"sec":"10.1","fbt":"Table 10-1","ex":["oleate 是 18:1（Δ9），只有一個雙鍵。","palmitoleate 是 16:1（Δ9）。","octadecadienoate 表示 18 碳、兩個雙鍵，位置在 Δ9 與 Δ12 且皆為順式 —— 這就是亞麻油酸（linoleate，18:2 ω-6），人體必需脂肪酸，也是花生四烯酸的前驅物。","arachidonate 是 20:4（Δ5,8,11,14）。"]},{"id":"M-102-2_44","t":"M","y":102,"q":"一位小孩罹患罕見基因缺陷之遺傳疾病「尼曼匹克症(Niemann-Pick disease)」，此孩子剛出生時 活潑正常，8 個月後出現吞嚥困難、腦部功能退化，最後將成為植物人而死亡。這類疾病主要是那一 類物質代謝失常而堆積在組織中所造成？","o":["triacylglycerol","gangliosides","vitamin D","cholesterol"],"a":[0,1,2,3],"ch":["10"],"sec":"10.2","fbt":"Box 10-1","free":1,"ex":["三酸甘油酯堆積不是尼曼匹克症的機制（本題官方公告送分，四個選項皆給分）。","神經節苷脂 GM2 堆積的是 Tay-Sachs 病，不是尼曼匹克症。","維生素 D 不會堆積造成此病。","尼曼匹克症 A／B 型缺乏溶小體的 sphingomyelinase，堆積的是「鞘磷脂（sphingomyelin）」—— 正確答案其實不在選項中，這應是本題送分的原因。（C 型則是膽固醇在溶小體運輸異常，與選項 D 有部分關聯。）"]},{"id":"M-102-2_45","t":"M","y":102,"q":"Lesch-Nyhan syndrome 是因缺乏次黃嘌呤－鳥嘌呤磷酸核苷轉移酶(hypoxanthine-guanine phosphoribosyltransferase)，因而發生下列何種現象？","o":["大量嘌呤(purine)生合成","大量 dTTP 合成","在血液中 dCTP 量非常低","尿液出現大量尿素(urea)"],"a":[0],"ch":["22"],"sec":"22.4","fbt":"","ex":["HGPRT 缺乏使嘌呤無法回收，PRPP 無處消耗而大量累積，反而推動 de novo 嘌呤合成大增，終致尿酸過多。","與 dTTP 的合成無關。","與血中 dCTP 濃度無關。","升高的是尿酸（嘌呤分解產物），不是尿素（尿素循環產物）。"]},{"id":"M-102-2_46","t":"M","y":102,"q":"在人體中，胺基酸不能作為下列何種生物分子生合成的前驅物？","o":["腎上腺素(epinephrine)","紫質(porphyrin)","腺嘌呤(adenine)","氰鈷胺(cobalamin)"],"a":[3],"ch":["22"],"sec":"22.3","fbt":"","ex":["腎上腺素由酪胺酸衍生而來。","紫質（porphyrin）由甘胺酸與 succinyl-CoA 合成。","腺嘌呤的嘌呤環由 glycine、aspartate、glutamine、CO2 與一碳單位組成。","氰鈷胺（維生素 B12）只有細菌與古菌能合成，人體必須由飲食攝取，無法由胺基酸合成。"]},{"id":"M-102-2_47","t":"M","y":102,"q":"下列那一個胺基酸可以降解成 pyruvate？","o":["alanine","leucine","lysine","tyrosine"],"a":[0],"ch":["14"],"sec":"14.4","fbt":"Table 14-4"},{"id":"M-102-2_48","t":"M","y":102,"q":"類固醇荷爾蒙必須由專一性運送蛋白質(carrier protein)運送，是因為荷爾蒙具有下列何種特性？","o":["在血液中化學結構不安定","因為是親油性(hydrophobic)物質，在血液中不易溶解","利用專一性運送蛋白送到特定的目標細胞","需要專一性運送蛋白來穿越細胞膜"],"a":[1],"ch":["21"],"sec":"21.4","fbt":"","ex":["類固醇荷爾蒙的固醇環相當穩定，不是因為化學結構不安定。","類固醇是親油性分子，在水性血漿中溶解度極低，必須由 albumin 或專一性結合蛋白（如 CBG、SHBG）攜帶；結合態同時延長其半衰期、調節游離濃度。","專一性由目標細胞內的受體決定，不是由運送蛋白決定去哪個細胞。","正好相反：類固醇親油，自己就能穿膜，不需要運送蛋白幫忙。"]},{"id":"M-102-2_49","t":"M","y":102,"q":"細胞內訊息傳遞分子(intracellular signaling molecules)，下列何種系列是最常見的組合？","o":["phospholipase C，cAMP，PKA","adenylate cyclase，cAMP，PKC","adenylate cyclase，diacylglycerol，PKA","phopholipase C，diacylglycerol，PKC"],"a":[3],"ch":["12"],"sec":"","fbt":"","ex":["PLC 的下游是 IP3／DAG，不接 cAMP 與 PKA。","adenylate cyclase 產生的 cAMP 活化的是 PKA，不是 PKC。","adenylate cyclase 不產生 diacylglycerol。","phospholipase C → diacylglycerol → protein kinase C 是教科書上的標準組合（另一半是 IP3 → Ca2+）。"]},{"id":"M-102-2_50","t":"M","y":102,"q":"聚合酶鏈鎖反應(polymerase chain reaction)過程的先後順序為何？①DNA 延伸(extension) ②DNA 變性(denaturation) ③引子與 DNA 模板結合(annealing)","o":["①③②","②①③","②③①","①②③"],"a":[2],"ch":["8"],"sec":"8.3","fbt":"Figure 8-33","ex":["延伸不可能排在最前面，必須先有單股模板與黏合好的引子。","變性之後必須先讓引子黏合才能延伸，順序顛倒。","每一循環都是：②變性（95℃ 解成單股）→ ③黏合（50–65℃ 引子與模板配對）→ ①延伸（72℃ Taq 合成新股）。","延伸不會排在變性之前。"]},{"id":"M-102-2_61","t":"M","y":102,"q":"下列何者非 vitamin D 及其衍生物的臨床適應症？","o":["骨質疏鬆(osteoporosis)","骨軟化症(osteomalacia)","腎功能衰竭(renal failure)","副甲狀腺功能亢進症(hyperparathyroidism)"],"a":[0,1,2,3],"ch":[],"sec":"","fbt":"","free":1},{"id":"M-101-1_26","t":"M","y":101,"q":"組胺酸(histidine)的胺基(-NH2)、側鏈(R-group)與羧基(-COOH)的 pKa 值分別為 9、6 和 2， 此氨基酸的等電點(isoelectric point)應為：","o":["7.5","4","6","8.5"],"a":[0],"ch":["3"],"sec":"3.2","fbt":""},{"id":"M-101-1_27","t":"M","y":101,"q":"動力學分析顯示某酵素與其突變型對相同受質的 Km 值分別為 0.001 與 0.0001 mM，由此數據可知：","o":["突變酵素催化的反應在較低受質濃度時達到飽和","突變導致酵素與受質的親合力下降","突變酵素的催化速率較快","野生型酵素對此受質的專一性較高"],"a":[0],"ch":["6"],"sec":"6.3","fbt":"Figure 6-11"},{"id":"M-101-1_28","t":"M","y":101,"q":"下列何種化合物不是五碳糖途徑(pentose phosphate pathway)之代謝物或產物？","o":["NADPH","α-ketoglutarate","CO2","Ribulose 5-phosphate"],"a":[1],"ch":["14"],"sec":"14.5","fbt":"Figure 14-21"},{"id":"M-101-1_29","t":"M","y":101,"q":"去氧脲苷(deoxyuridylate, dUMP)轉變為胸苷(thymidylate, dTMP)之酶反應需要何種輔酶參與？","o":["Coenzyme A","Biotin","S-adenosylmethionine","N5 , N10-methylenetetrahydrofolate"],"a":[3],"ch":["22"],"sec":"22.4","fbt":"Figure 22-47","ex":["輔酶 A 攜帶醯基，與此反應無關。","生物素負責羧化反應，與此反應無關。","SAM 是一般的甲基供體，但 thymidylate synthase 用的不是它。","thymidylate synthase 以 N5,N10-methylene-THF 同時提供甲基與還原力，自己被氧化成 dihydrofolate，再靠 DHFR 還原回來 —— 這正是 methotrexate 與 5-FU 的攻擊點。"]},{"id":"M-101-1_30","t":"M","y":101,"q":"25 歲病患因頭痛、昏眩、噁心來到急診，經檢查後懷疑可能是一氧化碳中毒。下列有關一氧化碳對 血紅蛋白(hemoglobin)所產生的效應，何者敘述正確？","o":["它會增加血液酸度，導致氧合血紅蛋白(oxyhemoglobin)沈澱","它會改變血紅蛋白結合的鐵離子的氧化態","它會將肌球蛋白(myoglobin)直接轉變成碳氧血紅蛋白(carboxyhemoglobin)","它會與氧分子競爭，導致氧合血紅蛋白(oxyhemoglobin)減少"],"a":[3],"ch":["5"],"sec":"5.1","fbt":"Box 5-1"},{"id":"M-101-1_31","t":"M","y":101,"q":"下列關於痛風(Gout)的敘述，何者錯誤？","o":["當嘌呤代謝出現異常時，累積過多的尿酸而導致","關節會因累積過多的尿酸鈉鹽晶體(sodium urate crystals)而發炎疼痛","Allopurinol 會抑制 xanthine oxidase，使得嘌呤的代謝物以水溶性的 xanthine 和 hypoxanthine 形式排出","Allopurinol 在痛風急性發作時可以直接抑制發炎反應，緩解疼痛"],"a":[3],"ch":["22"],"sec":"22.4","fbt":"","ex":["痛風源於嘌呤代謝異常使尿酸過多，敘述正確。","尿酸鈉鹽結晶沉積於關節引起急性發炎，敘述正確。","allopurinol 抑制 xanthine oxidase，使嘌呤以水溶性較佳的 xanthine 與 hypoxanthine 排出，敘述正確。","allopurinol 是長期降尿酸藥，起效慢且不具抗發炎作用，急性發作時不能止痛（甚至可能誘發發作）；急性期用的是 NSAID、colchicine 或類固醇，故此敘述錯誤。"]},{"id":"M-101-1_32","t":"M","y":101,"q":"下列何者在 DNA 上的鹼基能夠被甲基化(methylation)修飾，並且對哺乳類細胞的基因表達產生調控作用？","o":["腺嘌呤(adenine)","胸腺嘧啶(thymine)","鳥糞嘌呤(guanine)","胞嘧啶(cytosine)"],"a":[3],"ch":["8"],"sec":"8.3","fbt":"","ex":["腺嘌呤甲基化見於細菌（Dam methylase 用於區分新舊股），不是哺乳類的基因調控機制。","胸腺嘧啶本身已帶甲基，不是被修飾的標的。","鳥糞嘌呤不是 DNA 甲基化的位點。","哺乳類的 DNA 甲基化幾乎都發生在 CpG 中胞嘧啶的 5 號碳上，形成 5-methylcytosine；啟動子 CpG island 高度甲基化即造成基因沉默。"]},{"id":"M-101-1_33","t":"M","y":101,"q":"檸檬酸循環(citric acid cycle)之代謝酶中何者性可被丙二酸(malonate)競爭所抑制？","o":["檸檬酸合成酶(Citrate synthase)","琥珀酸脫氫酶(Succinate dehydrogenase)","延胡索酸酶(Fumarase)","蘋果酸脫氫酶(Malate dehydrogenase)"],"a":[1],"ch":["16"],"sec":"16.2","fbt":""},{"id":"M-101-1_34","t":"M","y":101,"q":"第一型糖尿病病人在極度缺乏胰島素及嚴重壓力下會產生 diabetic ketoacidosis，血中的 ketone bodies 濃度上升。下列相關敘述，何者錯誤？","o":["ketone bodies 含 acetoacetic acid 及 β-hydroxybutyric acid","ketone bodies 由 acetyl-CoA 所形成","ketone bodies 是代謝酸，必須由呼吸及腎臟排出，無法被身體利用","ketone bodies 主要來源是脂肪酸分解而來的"],"a":[2],"ch":["17"],"sec":"17.3","fbt":"","ex":["酮體三者為 acetoacetate、β-hydroxybutyrate 與 acetone，敘述正確。","酮體由 acetyl-CoA 經 HMG-CoA 途徑生成，敘述正確。","酮體雖是代謝酸，但腦、心肌與骨骼肌都能把 acetoacetate 與 β-hydroxybutyrate 轉回 acetyl-CoA 利用（飢餓時腦的主要燃料之一）；說「無法被身體利用」錯誤。","胰島素極度缺乏時脂解失控，大量脂肪酸在肝臟氧化成 acetyl-CoA 再轉為酮體，敘述正確。"]},{"id":"M-101-1_35","t":"M","y":101,"q":"空腹且激烈運動後，若飲用高量酒精，易發生低血糖，下列有關此現象之敘述，何者錯誤？","o":["肝臟 gluconeogenesis 被抑制","酒精增進肝臟胰島素敏感性，使葡萄糖由血液進入細胞中","肝細胞內因酒精代謝，還原物質 NADH 量增加","肝細胞內 pyruvate 濃度下降"],"a":[1],"ch":["14"],"sec":"14.3","fbt":""},{"id":"M-101-1_36","t":"M","y":101,"q":"有關真核細胞(eukaryotic cells)與原核細胞(prokaryotic cells)DNA 複製(DNA replication)的敘述，何者錯誤？","o":["皆需引子(primer)","皆會有引導股(leading strand)與落後股(lagging strand)形成","皆由一個複製起始點(replication origin)進行所有 DNA 複製","皆需 DNA 連接酶(DNA ligase)參與"],"a":[2],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-101-1_37","t":"M","y":101,"q":"RNA 干擾技術可以抑制特定基因之表現，是因為：","o":["促進特定基因所表現蛋白質之分解","造成特定 RNA 分解","抑制蛋白質之功能","抑制 RNA 之轉錄速度"],"a":[1],"ch":["28"],"sec":"28.3","fbt":""},{"id":"M-101-1_38","t":"M","y":101,"q":"下列何種 RNA，具最多的修飾核苷酸？","o":["tRNA","rRNA","mRNA","hnRNA"],"a":[0],"ch":["26"],"sec":"26.2","fbt":"Figure 26-26"},{"id":"M-101-1_40","t":"M","y":101,"q":"真核生物 RNA polymerase Ⅱ的 carboxy-terminal domain(CTD)被磷酸化時，開始進行：","o":["initiation","elongation","termination","carboxylation"],"a":[1],"ch":["26"],"sec":"26.1","fbt":"Figure 26-9"},{"id":"M-101-1_41","t":"M","y":101,"q":"在人體中，屬於酮體(ketone body)成員之一的 acetoacetate，主要在下列那一個組織或器官中合成？","o":["Liver","Intestinal mucosa","Adipose tissues","Kidney"],"a":[0],"ch":["17"],"sec":"17.3","fbt":"","ex":["酮體由肝細胞粒線體的 HMG-CoA synthase 與 HMG-CoA lyase 合成；肝臟本身缺乏 β-ketoacyl-CoA transferase（thiophorase），所以「只製造、不使用」，全部送給周邊組織。","腸黏膜不是酮體的合成部位。","脂肪組織提供脂肪酸原料，但不合成酮體。","腎臟可少量生成，但不是主要器官。"]},{"id":"M-101-1_42","t":"M","y":101,"q":"下列關於膽固醇代謝的敘述，何者錯誤？","o":["膽固醇是由乙醯輔酶A(acetyl-CoA)生合成而來","六碳結構 Mevalonate 是膽固醇的前驅物，每形成一個膽固醇需要 5 個分子的 mevalonate","HMG-CoA reductase 是調控膽固醇合成的關鍵性酵素","扮演不同生理功能的 bile acid, vitamin D 與 estrogen 都是膽固醇的代謝衍生產物"],"a":[1],"ch":["21"],"sec":"21.4","fbt":"","ex":["膽固醇的 27 個碳全部來自 acetyl-CoA，敘述正確。","mevalonate 確實是六碳，但每個 mevalonate 脫羧後只貢獻一個五碳的異戊二烯單元；squalene 有 30 個碳，所以需要「6 個」mevalonate 而非 5 個，故此敘述錯誤。","HMG-CoA reductase 是限速酶，也是 statin 的標的，敘述正確。","膽汁酸、維生素 D 與性荷爾蒙（含 estrogen）都由膽固醇衍生，敘述正確。"]},{"id":"M-101-1_43","t":"M","y":101,"q":"下列關於 lipoprotein 的敘述，何者正確？","o":["Apolipoprotein 不會與脂質結合","LDL(low-density lipoprotein)上的 Apo B-100 會與 LDL receptor 結合","LDL 的主要成分為 triacylglycerol","由肝臟與小腸釋放出的 HDL(high-density lipoprotein)含有大量的 cholesteryl ester"],"a":[1,3],"ch":["21"],"sec":"21.4","fbt":"Table 21-2","ex":["載脂蛋白的兩親性螺旋正是用來與脂質結合並包覆脂蛋白顆粒，說它不會與脂質結合是錯的。","Apo B-100 是 LDL 受體辨識的配體，細胞靠它把 LDL 吞入，敘述正確。","LDL 的主成分是膽固醇與膽固醇酯，不是三酸甘油酯。","剛由肝與小腸釋出的新生 HDL 是盤狀、幾乎不含膽固醇酯，要在血中經 LCAT 把游離膽固醇酯化後才逐漸填滿核心；依此 D 應為錯誤敘述，但官方答案併計了 D，作答時以 B 為準。"]},{"id":"M-101-1_44","t":"M","y":101,"q":"一氧化碳(CO)是粒線體的電子傳遞鏈抑制劑，其主要作用機制是下列何者？","o":["抑制 ATP synthase","抑制 cytochrome b 到 cytochrome c1之電子傳遞","抑制 cytochrome oxidase","抑制電子由 Fe-S 中心流至 ubiquinone"],"a":[2],"ch":["19"],"sec":"19.1","fbt":"Table 19-4"},{"id":"M-101-1_45","t":"M","y":101,"q":"糖解作用(glycolysis)產生的 NADH 要先轉化為下列何種物質，才可以通過粒線體內膜(inner membrane)，再經由酵素轉化回 NADH？","o":["Malate","Aspartate","α-ketoglutarate","Glutamate"],"a":[0,1,2,3],"ch":["19"],"sec":"19.2","fbt":"Figure 19-31","free":1},{"id":"M-101-1_46","t":"M","y":101,"q":"粒線體氧化磷酸化之去偶合(uncoupling)會造成下列何種現象？","o":["ATP 持續合成，但停止 O2消耗","ATP 不合成，但 O2仍然消耗","抑制粒線體之所有代謝反應","抑制電子傳遞及 O2之消耗"],"a":[1],"ch":["19"],"sec":"19.2","fbt":"Figure 19-20"},{"id":"M-101-1_47","t":"M","y":101,"q":"粒線體電子傳遞鏈的 Complex Ⅳ主要是把電子由那裏傳遞到 O2？","o":["Ubiquinone","NADH","Cytochrome c","Succinate"],"a":[2],"ch":["19"],"sec":"19.1","fbt":"Figure 19-13"},{"id":"M-101-1_48","t":"M","y":101,"q":"在皮膚科見習時，你看到一位小朋友眼珠呈紅色，皮膚及毛髮極為白皙，怎麼曬太陽都不會變黑， 因此你推測此病人之黑色素合成或分泌有異常。下列相關敘述何者正確？","o":["此病人之可能診斷為 tyrosinase 缺乏","黑色素之合成與精氨酸酵素(arginase)有關","黑色素是經由淋巴細胞(lymphocyte)製造再分泌至皮膚、毛髮","由於不會曬黑，所以不需要防曬，此病人的皮膚癌機率比正常人低"],"a":[0],"ch":["18"],"sec":"18.2","fbt":"Table 18-2","ex":["白化症最常見的型態（OCA1）就是 tyrosinase 缺乏，酪胺酸無法轉成 DOPA 與黑色素，因此毛髮皮膚極白、虹膜缺色素而透出血管呈紅色。","arginase 屬尿素循環，與黑色素合成無關。","黑色素由神經脊來源的黑色素細胞（melanocyte）製造，不是淋巴細胞。","恰好相反：缺乏黑色素的保護，紫外線傷害更嚴重，皮膚癌風險比常人高，更需要嚴格防曬。"]},{"id":"M-101-1_49","t":"M","y":101,"q":"1961 年，Victor Herbert 醫師證明葉酸(folic acid)缺乏會造成血液的病變，下列敘述何者正確？","o":["缺乏葉酸所導致的症狀在短短數天內便出現","由於葉酸參與氨基酸的代謝，所以尿中可以測到較高量的亞氨甲基麩氨酸(formiminoglutamate)","葉酸缺乏會使紅血球體積變小，數目變少","葉酸缺乏不會影響神經功能"],"a":[1],"ch":["18"],"sec":"18.3","fbt":"Figure 18-26","ex":["體內葉酸儲存約可撐數月，缺乏症狀要數週到數月才出現，不是數天。","組胺酸分解時要把 formimino 基交給四氫葉酸；葉酸缺乏時這一步卡住，FIGLU（亞胺甲基麩胺酸）堆積並由尿排出 —— 這就是臨床上的 FIGLU 試驗。","葉酸缺乏造成的是「巨母紅血球性」貧血，紅血球體積變大（MCV 上升）而數目減少。","葉酸缺乏與胎兒神經管缺損及認知、情緒症狀有關，說完全不影響神經功能並不正確。（不過 B12 缺乏特有的脊髓後索與側索病變，葉酸缺乏不會造成。）"]},{"id":"M-101-1_50","t":"M","y":101,"q":"第二型糖尿病(Type 2 Diabetes)的致病原因是：","o":["胰島素(insulin)分泌不足","胰島素(insulin)分泌過多","血液中的胰島素無法藉由細胞上的胰島素受體(insulin receptor)發生有效的降血糖作用","細胞不表現胰島素受體(insulin receptor)"],"a":[2],"ch":["23"],"sec":"23.5","fbt":"","ex":["胰島素分泌不足（β 細胞被破壞）是第一型的機制。","第二型早期胰島素反而偏高（代償性），不是分泌過多致病。","第二型糖尿病的核心是「胰島素阻抗」：血中胰島素存在，但標的組織的訊息傳遞（IRS-1 絲胺酸磷酸化、PI3K-Akt 受損）失效，GLUT4 無法上膜，降血糖作用不彰；後期 β 細胞衰竭才合併分泌不足。","細胞仍表現胰島素受體，問題在受體後的訊息傳遞。"]},{"id":"M-101-2_26","t":"M","y":101,"q":"某酵素對受質A的動力學參數為：Km＝0.01 mM；Kcat＝5 S-1，而對受質B的動力學參數為：Km ＝0.1 mM；Kcat＝5 S-1，由以上數據可知：","o":["此酵素對受質 B 的反應速率較易飽和","當催化速率處於飽和時，此酵素對受質 A 的反應較快","此酵素對受質 A 的專一性較高","當受質濃度極低時，此酵素對受質 B 的反應較快"],"a":[2],"ch":["6"],"sec":"6.3","fbt":""},{"id":"M-101-2_27","t":"M","y":101,"q":"下列何者不是同源重組(homologous recombination)的生物功能？","o":["幫助染色體在減數分裂(meiosis)時的分離","增加基因多樣性(genetic diversity)","促進轉錄作用(transcription)","DNA 修復(DNA repair)"],"a":[2],"ch":["25"],"sec":"25.3","fbt":""},{"id":"M-101-2_28","t":"M","y":101,"q":"下列關於非競爭型抑制劑(uncompetitive inhibitor)的敘述，何者正確？","o":["非競爭型抑制劑係結合於酵素的活性中心，使受質無法結合","非競爭型抑制劑與酵素結合後會改變酵素活性中心的結構，阻斷反應的進行","非競爭型抑制劑的存在會使酵素的 Km 上升","酵素反應之 Vmax 不受非競爭型抑制劑的影響"],"a":[1],"ch":["6"],"sec":"6.3","fbt":""},{"id":"M-101-2_29","t":"M","y":101,"q":"下列維生素何者為輔 A(coenzyme A)的結構成分？","o":["Pantothenic acid","Ascorbic acid","Nicotinic acid","Folic acid"],"a":[0],"ch":["6","16"],"sec":"6.1 16.1","fbt":"Table 6-2"},{"id":"M-101-2_30","t":"M","y":101,"q":"下列何者主要是負責細胞還原生合成(reductive biosynthesis)反應之輔酶？","o":["NADH","NADPH","FADH2","FMNH2"],"a":[1],"ch":["13"],"sec":"13.4","fbt":""},{"id":"M-101-2_31","t":"M","y":101,"q":"有關 DNA 與 RNA 的敘述，下列何者錯誤？","o":["DNA 由去氧核糖核酸組成，RNA 由核糖核酸組成","在弱鹼溶液中，RNA 較 DNA 穩定","雙股 DNA 大多以 B form 二級結構存在","DNA 與 RNA 皆用磷酸二酯鍵(phosphodiester bond)形成聚合體"],"a":[1],"ch":["8"],"sec":"8.1","fbt":"","ex":["DNA 的糖是 2′-去氧核糖，RNA 是核糖，敘述正確。","RNA 的 2′-OH 在鹼性下會攻擊相鄰的磷酸二酯鍵形成 2′,3′-環狀中間物而斷裂，所以鹼性環境中 RNA 比 DNA「不穩定」，故此敘述錯誤。","生理條件下雙股 DNA 主要以 B 型存在，敘述正確。","兩者骨架都靠 3′,5′-磷酸二酯鍵連接，敘述正確。"]},{"id":"M-101-2_32","t":"M","y":101,"q":"有關細菌的基因表現之敘述，下列何者錯誤？","o":["細菌的 protein coding gene 不含 intron","細菌僅有一種 RNA polymerase 進行轉錄作用","細菌的 mRNA 的轉錄可和轉譯同步發生","細菌所有的 RNA，均不須進行轉錄後 processing"],"a":[3],"ch":["26"],"sec":"26.1","fbt":""},{"id":"M-101-2_33","t":"M","y":101,"q":"三餐正常的人在午餐未進食前，下列那一項是血糖的主要來源？","o":["蛋白質","肝臟中的肝醣(glycogen)","肌肉中的肝醣","脂肪組織的葡萄糖(glucose)"],"a":[1],"ch":["15"],"sec":"15.4","fbt":""},{"id":"M-101-2_34","t":"M","y":101,"q":"遺傳密碼子(genetic codon)的 degeneracy 是指：","o":["遺傳密碼子是由二個核酸(nucleotides)所構成","遺傳密碼子是由核酸重複使用所構成","多個遺傳密碼子可代表同一種胺基酸(amino acid)","同一遺傳密碼子在不同的生物體中代表不同種的胺基酸"],"a":[2],"ch":["27"],"sec":"27.1","fbt":"Table 27-3"},{"id":"M-101-2_36","t":"M","y":101,"q":"胰島素(insulin)調節下列何種分子的合成，進而活化 phosphofructokinase-1 以促進糖解作用 (glycolysis)？","o":["Citrate","NADH","fructose 2,6-bisphosphate","ATP"],"a":[2],"ch":["15"],"sec":"15.3","fbt":"Figure 15-19"},{"id":"M-101-2_37","t":"M","y":101,"q":"下列何種內分泌荷爾蒙其 receptor 不是 nuclear hormone receptor？","o":["glucocorticoid","glucagon","thyroid hormone","progesterone"],"a":[1],"ch":["23"],"sec":"23.1","fbt":"Table 23-1","ex":["糖皮質素是類固醇，作用於核內受體。","升糖素是胜肽荷爾蒙，親水、無法穿膜，作用於細胞膜上的 G 蛋白偶合受體，不是核內受體。","甲狀腺素雖由酪胺酸衍生，但親脂可穿膜，作用於核內受體。","黃體素是類固醇，作用於核內受體。"]},{"id":"M-101-2_38","t":"M","y":101,"q":"劇烈運動中的肌細胞與靜止時之肌細胞相比，前者會產生下列何種現象？","o":["lactate 形成之速率較高","gluconeogenesis 增加","glucose 之消耗較低","glycogenolysis 較低"],"a":[0],"ch":["14"],"sec":"14.3","fbt":"Box 14-2"},{"id":"M-101-2_39","t":"M","y":101,"q":"Tay-Sachs 是一種人類遺傳性疾病，下列相關敘述何者錯誤？","o":["會導致 ganglioside GM2 在腦及脾中的堆積","它是 β-galactosidase 的缺乏","它是一種發育過程漸進式的肢體麻痺及失明","脂質類代謝的異常所引起"],"a":[1],"ch":["10"],"sec":"10.2","fbt":"Box 10-1","ex":["GM2 神經節苷脂在腦與內臟堆積，敘述正確。","缺乏的是 β-N-acetylhexosaminidase A（切 GM2 末端的 N-乙醯半乳糖胺），不是 β-galactosidase（後者缺乏造成 GM1 gangliosidosis 或 Krabbe 病），故此敘述錯誤。","典型表現是出生數月後進行性的動作退化、肌張力低下與失明，敘述正確。","屬鞘脂（脂質）代謝異常的溶小體貯積症，敘述正確。"]},{"id":"M-101-2_40","t":"M","y":101,"q":"下列何種分子是屬於 glycerophospholipid 並參與細胞內訊息傳遞？","o":["arachidonic acid","vitamin C","phosphatidylinositol","phosphatidylethanolamine"],"a":[2],"ch":["21"],"sec":"21.3","fbt":"","ex":["花生四烯酸是脂肪酸，雖為 eicosanoid 的前驅物，但本身不是甘油磷脂。","維生素 C 是水溶性維生素，不是脂質。","phosphatidylinositol 的骨架是甘油，屬甘油磷脂；其 4,5-雙磷酸化產物 PIP2 被 PLC 水解成 IP3 與 DAG，是細胞訊息傳遞的核心分子。","phosphatidylethanolamine 雖屬甘油磷脂，但主要是膜的結構成分，不是訊息分子。"]},{"id":"M-101-2_41","t":"M","y":101,"q":"free ammonia 在細胞內可藉由那一個酵素作用，將其轉化為無毒性的 L-glutamine？","o":["Glutaminase","glutamine synthetase","glutamate dehydrogenase","aspartate aminotransferase"],"a":[1],"ch":["22"],"sec":"22.1","fbt":"","ex":["glutaminase 作用方向相反：把 glutamine 水解成 glutamate 與 NH3（在腎臟排氨）。","glutamine synthetase 以 ATP 把自由氨接到 glutamate 的側鏈羧基上生成 glutamine，是體內運送與解除氨毒的主要方式。","glutamate dehydrogenase 也能固定氨，但產物是 glutamate 而非 glutamine。","aspartate aminotransferase 是轉胺酶，轉移的是胺基而非固定自由氨。"]},{"id":"M-101-2_42","t":"M","y":101,"q":"有關家族性高膽固醇症(familial hypercholesterolemia)最主要的致病原因為何？","o":["飲食中過度高油脂食物的攝取","HMG-CoA reductase 基因變異","正常 LDL receptor 蛋白表現量過高","LDL receptor 基因變異"],"a":[3],"ch":["21"],"sec":"21.4","fbt":"","ex":["高油脂飲食會使膽固醇偏高，但不是「家族性」高膽固醇血症的病因。","HMG-CoA reductase 基因變異不是此病的原因。","受體表現量過高會讓血中 LDL 更低，與本病相反。","家族性高膽固醇血症是 LDL receptor 基因突變（體染色體顯性），肝細胞無法有效清除血中 LDL，血膽固醇自幼偏高，易見黃色瘤與早發性冠心病。"]},{"id":"M-101-2_43","t":"M","y":101,"q":"澱粉樣變性病(amyloidosis)是一類由蛋白質摺疊錯誤所引發的疾病，何種蛋白質二級結構(secondary structure)與導致此類疾病的關係最為密切？","o":["α-螺旋(α-helix)","β-摺板(β-sheet)","β-回轉(β-turn)","隨機線圈(random coil)"],"a":[1],"ch":["4"],"sec":"4.4","fbt":"Figure 4-32"},{"id":"M-101-2_44","t":"M","y":101,"q":"一位 60 歲病患因腹部劇痛、輕度癱瘓被送來急診，尿液檢查呈酒紅色，基因分析發現：參與血紅素 (heme)合成的酵素發生錯義突變(missense mutation)。下列何者是最可能的診斷？","o":["苯酮尿症(phenylketonuria)","楓糖漿尿症(maple syrup urine disease)","黑尿症(alkaptonuria)","紫質症(porphyria)"],"a":[3],"ch":["22"],"sec":"22.3","fbt":"Box 22-2","ex":["苯酮尿症缺的是 phenylalanine hydroxylase，表現為智能障礙與尿有鼠臭味，不是血基質酵素。","楓糖漿尿症缺的是支鏈酮酸脫氫酶，尿有楓糖味。","黑尿症缺的是 homogentisate dioxygenase，尿液「放置後」才變黑，且不會急性腹痛。","急性間歇性紫質症：血基質合成路徑的酵素缺陷使 porphobilinogen 等堆積，典型表現就是劇烈腹痛、神經病變與尿液（暴露空氣後）呈酒紅／紅褐色。"]},{"id":"M-101-2_45","t":"M","y":101,"q":"一位新生兒的血液篩檢發現有白胺酸(leucine)、異白胺酸(isoleucine)及纈胺酸(valine)的堆積， 懷疑是楓糖漿尿症(maple syrup urine disease)的患者，必須終身作嚴格的飲食控制。下列那個酵素 的功能障礙，最可能是這個疾病的原因？","o":["胺甲醯磷酸鹽合成酶(carbamoyl phosphate synthetase)","黑尿酸氧化酶(homogentisic acid oxidase)","支鏈酮酸去氫酵素(branched-chain α–keto acid dehydrogenase)","苯丙胺酸羥化酶(phenylalanine hydroxylase)"],"a":[2],"ch":["18"],"sec":"18.3","fbt":"Table 18-2","ex":["CPS I 缺損造成高血氨，不會使支鏈胺基酸堆積。","homogentisic acid oxidase 缺損是黑尿症。","楓糖尿症是粒線體支鏈 α-酮酸脫氫酶複合體缺損，Leu／Ile／Val 的 α-酮酸無法脫羧而堆積，尿液帶楓糖漿味。","phenylalanine hydroxylase 缺損是苯酮尿症。"]},{"id":"M-101-2_46","t":"M","y":101,"q":"puromycin 是一種抗生素(antibiotics)，可以抑制細菌之蛋白質合成，是由於它可以：","o":["抑制細菌之核糖體結合於 mRNA 上","佔據 mRNA 之起始密碼位置","促進核糖體之分解","結合在核糖體之 A site，破壞胜肽鍵之生合成"],"a":[3],"ch":["27"],"sec":"27.2","fbt":"Figure 27-38"},{"id":"M-101-2_48","t":"M","y":101,"q":"粒線體進行電子傳遞過程中容易產生下列何種對細胞有害的物質？","o":["reactive oxygen species(ROS)","CO","NH3","O2"],"a":[0],"ch":["19"],"sec":"19.1","fbt":""},{"id":"M-101-2_49","t":"M","y":101,"q":"下列關於訊息傳遞的敘述，何者錯誤？","o":["β-adrenergic receptor 是經由 cyclic AMP 進行細胞訊息傳遞","一氧化氮(nitric oxide)是經由膜型 guanylyl cyclase 受體(membrane form guanylyl cyclase)進行細胞訊息傳遞","細胞內鈣離子濃度受 inositol-3-phosphate(IP3)調控","cyclic AMP(cAMP)是藉由 allosteric regulation 的方式調控蛋白激酶A(protein kinase A)活性"],"a":[1],"ch":["12"],"sec":"12.6","fbt":"","ex":["β-adrenergic receptor 經 Gs-adenylyl cyclase-cAMP 傳訊，正確。","NO 作用的是「細胞質可溶型」guanylyl cyclase（結合其血基質鐵），膜型 guanylyl cyclase 的配體是 ANF、guanylin 等胜肽，故此敘述錯誤。","細胞內鈣濃度受 IP3 調控，正確（題幹寫 inositol-3-phosphate，實指 inositol 1,4,5-trisphosphate）。","cAMP 以異位性方式結合 PKA 的調節次單元來調控活性，正確。"]},{"id":"M-101-2_50","t":"M","y":101,"q":"1871 年德國眼科醫師 Theodor Leber 發現了一種家族性的神經眼科疾病 Leber hereditary optic neuropathy，簡稱 LHON，後來證實這是一種粒線體疾病。下列有關粒線體之敘述何者正確？","o":["粒線體的 DNA 與細胞核 DNA 一樣，為環狀雙股結構","粒線體相關的遺傳病大多是自體隱性染色體遺傳(autosomal recessive)","粒線體相關的遺傳病大多是 X-性聯染色體遺傳(X-linked recessive)，所以大多發生在男性","粒線體 DNA 突變情況較輕的病人，有時候只有眼睛神經病變，在接近成年的年齡時突然發生失明"],"a":[3],"ch":["19"],"sec":"19.5","fbt":"Figure 19-40"},{"id":"M-100-1_26","t":"M","y":100,"q":"一位男童特別高大，主訴關節鬆動、視網膜剝離病變。檢查發現他的第二型膠原蛋白(type II collagen)於三胜肽重複單位(tripeptide repeat)產生突變，以致影響它的四級結構。這個突變最可能發生在那個胺基酸？","o":["羥離胺酸(hydroxylysine)","羥脯胺酸(hydroxyproline)","甘胺酸(glycine)","色胺酸(tryptophan)"],"a":[2],"ch":["4"],"sec":"4.3","fbt":""},{"id":"M-100-1_27","t":"M","y":100,"q":"下列關於酵素反應的敘述，何者錯誤？","o":["酵素可以改變化學反應的平衡常數，使正反應的速率上升","大多數的酵素為蛋白質，但少數核醣核酸分子(RNA)亦具有催化能力","一般化學反應的速率會隨著溫度升高而上升，但大多數酵素反應的速率在溫度過高時會顯著降低","酵素可區分光學性質不同的受質，因此反應的立體專一性(stereo-specificity)極高"],"a":[0],"ch":["6"],"sec":"6.2","fbt":""},{"id":"M-100-1_28","t":"M","y":100,"q":"缺少維生素B1會導致下列何種酶的活性降低？","o":["Succinate dehydrogenase Glucose","6-phosphate dehydrogenase","α-Ketoglutarate dehydrogenase","Transaldolase"],"a":[2],"ch":["16"],"sec":"16.2 16.1","fbt":""},{"id":"M-100-1_29","t":"M","y":100,"q":"下列何者不是穩定蛋白質三級結構的非共價交互作用力？","o":["氫鍵(hydrogen bond)","凡德瓦爾力(van der Waals interaction)","離子交互作用(ionic interaction)","雙硫鍵(disulfide bond)"],"a":[3],"ch":["4"],"sec":"4.1","fbt":""},{"id":"M-100-1_30","t":"M","y":100,"q":"全世界約有10%人口具有葉酸缺乏症，下列相關敘述何者錯誤？","o":["葉酸缺乏可能和癌症、心臟病或腦部功能異常有關","葉酸缺乏時，會導致胸苷酸(Thymidylate)累積過量","葉酸缺乏時，DNA中易累積過量的尿素嘌呤(Uracil)","葉酸缺乏時，尿素嘌呤會被DNA修補系統辨認，導致DNA損壞"],"a":[1],"ch":["22"],"sec":"22.4","fbt":"","ex":["葉酸缺乏與癌症、心血管疾病及神經功能異常都有關聯，敘述正確。","葉酸缺乏時 thymidylate synthase 缺乏一碳單位，dTMP 合成「減少」而非累積過量，故此敘述錯誤。","dTMP 不足使 dUMP／dUTP 相對增加，uracil 被誤摻入 DNA，敘述正確。（選項把 uracil 寫成「尿素嘌呤」是誤植，它是嘧啶。）","修補系統切除誤摻的 uracil，反覆切除與斷裂造成 DNA 損傷，敘述正確。"]},{"id":"M-100-1_31","t":"M","y":100,"q":"下列關於glucose在人類的紅血球中代謝的敘述，何者錯誤？","o":["glucose代謝最終產物之一為lactic acid","pyruvate可轉化為acetyl-CoA進一步代謝","ATP產量較少","glucose也可以利用pentose phosphate途徑代謝"],"a":[1],"ch":["14"],"sec":"14.1","fbt":""},{"id":"M-100-1_32","t":"M","y":100,"q":"控制血管栓塞藥物warfarin的作用，最主要是透過改變下列何種蛋白修飾(protein modification)的活性？","o":["甲基化(N-methylation)","磷酸化(O-phosphorylation)","乙醯化(N-acetylation)","羧基化(γ-carboxylation)"],"a":[3],"ch":["6"],"sec":"6.5","fbt":""},{"id":"M-100-1_33","t":"M","y":100,"q":"下列那一個胺基酸可以代謝成α-ketoglutarate，然後進入citric acid cycle？","o":["Glycine","Proline","Alanine","Tyrosine"],"a":[1],"ch":["14"],"sec":"14.4","fbt":"Table 14-4"},{"id":"M-100-1_34","t":"M","y":100,"q":"聚合酶鏈鎖反應(PCR)所使用之Taq polymerase與大腸桿菌DNA複製(DNA replication)兩者所使用的DNA聚合酶主要差異性為何？","o":["熱穩定性(thermal stability)","聚合酶活性","3’核酸外切酶(3’exonuclease)活性","反應時，對二價金屬離子的需求"],"a":[0],"ch":["8"],"sec":"8.3","fbt":"","ex":["Taq 來自嗜熱菌 Thermus aquaticus，能耐 95℃ 的變性步驟而不失活；大腸桿菌的聚合酶一加熱就變性，這是兩者最關鍵的差異，也是 PCR 能自動循環的原因。","兩者都有聚合酶活性，不是主要差異。","Taq 反而缺乏 3′→5′ 校對外切酶活性（所以保真度較低），這不是「主要」差異而是副作用。","兩者都需要 Mg2+，沒有本質差異。"]},{"id":"M-100-1_35","t":"M","y":100,"q":"一位新生兒有餵食欠佳、昏睡、呼吸急促症狀，血液檢查發現有輕微的呼吸性鹼中毒(respiratory alkalosis)與高血氨(hyperammonemia)。家族病史分析發現屬於性聯遺傳疾病。下列尿素循環(urea cycle)中何種酵素最可能出現功能異常？","o":["尿黑酸氧化酶(homogentisate oxygenase)","鳥胺酸轉胺基甲醯基酶(ornithine transcarbamoylase)","胱硫醚合成酶(cystathionine β-synthase)","精胺基琥珀酸酶(argininosuccinase)"],"a":[1],"ch":["18"],"sec":"18.2","fbt":"Figure 18-10","ex":["尿黑酸氧化酶缺乏是黑尿症，不在尿素循環上，也不會高血氨。","ornithine transcarbamoylase 缺乏是尿素循環中唯一的 X 性聯遺傳疾病，符合「男嬰＋性聯遺傳＋高血氨」；高血氨刺激呼吸中樞造成過度換氣而呼吸性鹼中毒。（同時 carbamoyl phosphate 外流會使尿中 orotic acid 升高。）","cystathionine β-synthase 缺乏是同半胱胺酸尿症，不在尿素循環上。","argininosuccinase 缺乏雖也造成高血氨，但屬體染色體隱性，不符性聯遺傳。"]},{"id":"M-100-1_36","t":"M","y":100,"q":"常見的glycogen storage disease是因為病人缺乏glucose-6-phosphatase所造成，下列敘述何者正確？","o":["glycogen synthesis增加","glucose-6-phosphate無法轉化成glucose-1-phosphate","病人血中glucose濃度可能偏低","glycolysis異常"],"a":[2],"ch":["15"],"sec":"15.3 15.4","fbt":"Figure 15-13"},{"id":"M-100-1_37","t":"M","y":100,"q":"一位3個月大男嬰的血清中，有兩個化合物的濃度較高，包括苯丙胺酸(phenylalanine)與苯丙酮酸(phenylpyruvate)，懷疑是苯酮尿症(phenylketonuria)，但檢驗測得的苯丙胺酸羥化酶(Phenylalanine hydroxylase)活性卻正常。若下列那個酵素檢驗項目異常，仍可以支持你的苯酮尿症診斷？","o":["酪胺酸酶(tyrosinase)","雙氫喋啶還原酵素(dihydrobiopterin reductase)","黑尿酸氧化酶(homogentisic acid oxidase)","多巴胺羥化酶(dopamine hydroxylase)"],"a":[1],"ch":["18"],"sec":"18.3","fbt":"Figure 18-24","ex":["酪胺酸酶缺乏是白化症，不會造成苯丙胺酸堆積。","phenylalanine hydroxylase 需要 BH4 當輔酶；dihydrobiopterin reductase 缺損使 BH4 無法再生，酵素本身活性正常卻無法運作 —— 這就是「非典型 PKU」，而且因為 BH4 也是 tyrosine／tryptophan hydroxylase 的輔酶，還會合併神經傳導物質缺乏，單純限制飲食無效。","黑尿酸氧化酶異常是黑尿症。","dopamine hydroxylase 異常影響兒茶酚胺合成，不會造成苯丙胺酸堆積。"]},{"id":"M-100-1_38","t":"M","y":100,"q":"下列那種酶同時參與糖解(glycolysis)及葡萄糖新生(gluconeogenesis)之代謝途徑？","o":["3-磷酸甘油酸激酶(3-phosphoglycerate kinase)","六碳糖激酶(hexokinase)","磷酸果糖激酶-1(phosphofructokinase-1)","丙酮酸激酶(pyruvate kinase)"],"a":[0],"ch":["14"],"sec":"14.1","fbt":"Figure 14-2"},{"id":"M-100-1_39","t":"M","y":100,"q":"一位年輕女性臉上有嚴重的痤瘡(青春痘，acne)，若你將要處方維生素A酸(retinoic acid)，下列相關敘述，何者正確？","o":["維生素A酸是維生素K(vitamin K)之衍生物","懷孕時服用有導致胎兒畸形之危險性","只要停止服用維生素A酸一至兩星期後懷孕，便不會有胎兒畸形之危險性","人類細胞核中並無維生素A之受體(receptor)"],"a":[1],"ch":["10"],"sec":"10.3","fbt":"","ex":["維生素 A 酸是維生素 A（retinol）的衍生物，不是維生素 K。","retinoid 是強力致畸胎物，會造成顱顏、心臟與中樞神經畸形；口服 isotretinoin 期間與停藥後一段時間都必須嚴格避孕，是處方前最重要的衛教。","口服 isotretinoin 需停藥至少一個月（部分指引建議更久）並確認未懷孕才可受孕，說一到兩週即安全並不正確。","人類細胞核中有 RAR 與 RXR 兩類維生素 A 酸受體，正是其調控基因表現的機制。"]},{"id":"M-100-1_40","t":"M","y":100,"q":"下列何種修補作用不能修復紫外光所造成的嘧啶二聚體(pyrimidine dimers)傷害？","o":["核苷酸切除修復(nucleotide excision repair)","DNA光解酶(DNA photolyases)","核酸錯誤配對修復(mismatch repair)","鹼基切除修復(base excision repair)"],"a":[2],"ch":["25"],"sec":"25.2","fbt":"Table 25-5"},{"id":"M-100-1_41","t":"M","y":100,"q":"有關真核細胞之蛋白質分解，下列敘述何者錯誤？","o":["均不須ATP之參與","Trypsin可水解lysine後之胜肽鍵","泛素化(Ubiquitination)","參與蛋白質分解機制 Lysosome具proteases可以分解胞內蛋白質"],"a":[0],"ch":["27"],"sec":"27.3","fbt":"Figure 27-49"},{"id":"M-100-1_42","t":"M","y":100,"q":"下列何者是蛋白質轉譯之起始胺基酸？","o":["Leucine","Cysteine","Methionine","Tyrosine"],"a":[2],"ch":["27"],"sec":"27.1","fbt":"Figure 27-7"},{"id":"M-100-1_43","t":"M","y":100,"q":"下列何者是RNA聚合酶Ⅱ(RNA polymerase Ⅱ)的產物？","o":["hnRNA","tRNA","5S RNA","28S rRNA"],"a":[0],"ch":["26"],"sec":"26.1","fbt":""},{"id":"M-100-1_44","t":"M","y":100,"q":"下列何者可有效地抑制老鼠體內mRNA的合成？","o":["Erythromycin","Alpha-amanitin","Tetracycline","Rifampicin"],"a":[1],"ch":["26"],"sec":"26.1","fbt":""},{"id":"M-100-1_46","t":"M","y":100,"q":"下列關於脂肪酸的敘述，何者正確？","o":["血液中荷爾蒙glucagon可以促進細胞中脂肪酸的生合成","細胞中脂肪酸的生合成過程中需要NADPH做為電子攜帶者(electron carrier)","細胞中脂肪酸的生合成中間產物malonyl-CoA會活化粒線體外膜上酵素(carnitine acyltransferase Ⅰ)","胰島素(insulin)可以增加血液中脂肪酸的濃度"],"a":[1],"ch":["21"],"sec":"21.1","fbt":"","ex":["升糖素代表飢餓狀態，會抑制脂肪酸合成、促進分解。","脂肪酸合成的還原力來自 NADPH（由 pentose phosphate pathway 與 malic enzyme 提供），這是合成與 β 氧化用 NAD+／FAD 的重要對照。","malonyl-CoA 是「抑制」carnitine acyltransferase I 而非活化；這正是合成進行時避免剛做好的脂肪酸立刻被送進粒線體氧化的開關。","胰島素促進脂肪儲存、抑制脂解，會「降低」血中游離脂肪酸。"]},{"id":"M-100-1_47","t":"M","y":100,"q":"一名中年流浪漢因腹瀉、神智不清被送至急診室，檢查發現他的臉、前胸、手背都有皮膚粗糙的皮膚炎、舌頭也有發炎，醫師的診斷為：疑似癩皮病(pellagra)。下列有關此病之敘述，何者正確？","o":["此病是缺乏菸鹼酸(niacin)所造成","菸鹼酸是由菸鹼醯胺腺嘌呤二核甘酸鹽(nicotinamide adenine dinucleotide，即NAD+)所合成","以玉米為主食的人不易得此病","神經系統不會受到影響"],"a":[0],"ch":["13"],"sec":"13.4","fbt":""},{"id":"M-100-1_48","t":"M","y":100,"q":"glycerol-3-phosphate shuttle之作用為何？","o":["是肝、腎和心臟細胞運送細胞質中NADH進入電子傳遞鏈之途徑","將細胞質中NADH的還原當量(reducing equivalents)傳送至ubiquinone","glycerol-3-phosphate shuttle比malate aspartate shuttle所產生之ATP量多","主要目的是將ATP送出粒線體外利用"],"a":[1],"ch":["19"],"sec":"19.2","fbt":"Figure 19-32"},{"id":"M-100-1_49","t":"M","y":100,"q":"Rotenone會抑制粒線體電子傳遞鏈的那一個步驟？","o":["NADH→coenzyme Q","Cyt b→Cyt c1","Cyt c1→Cyt c","Cyt c→Cyt (a+a3)"],"a":[0],"ch":["19"],"sec":"19.1","fbt":"Figure 19-6"},{"id":"M-100-1_50","t":"M","y":100,"q":"下列關於protein kinase A的敘述，何者正確？","o":["受cyclic GMP的調控進行活化","受AMP的調控進行活化","受cyclic AMP的調控進行活化","Protein kinase A的活化可促進細胞內脂肪酸的生合成(fatty acid biosynthesis)"],"a":[2],"ch":["12"],"sec":"12.2","fbt":"Figure 12-4","ex":["受 cyclic GMP 調控而活化的是 PKG。","受 AMP 調控而活化的是 AMPK。","cAMP 結合 PKA 的調節次單元，釋出催化次單元而活化。","PKA 活化會磷酸化並抑制 acetyl-CoA carboxylase，使脂肪酸生合成下降而非促進。"]},{"id":"M-100-2_26","t":"M","y":100,"q":"腦組織中出現β澱粉樣胜肽(β-amyloid)堆積，為阿滋海默氏病(Alzheimer's disease)的病理特徵之一。關於β澱粉樣胜肽的敘述，下列何者錯誤？","o":["β澱粉樣胜肽原先是某細胞膜蛋白的一部分","核醣核酸編輯(RNA editing)為產生β澱粉樣胜肽的機制","β澱粉樣胜肽的二級結構與正常狀態時並不相同","β澱粉樣胜肽會在神經元外相互黏合形成沉澱物"],"a":[1],"ch":["4"],"sec":"4.4","fbt":"Box 4-6"},{"id":"M-100-2_27","t":"M","y":100,"q":"最常見於蛋白質之三級結構內部的共價交互作用為：","o":["氫鍵(Hydrogen bond)","凡德瓦爾力(van der Waals interaction)","離子交互作用(Ionic interaction)","雙硫鍵(Disulfide bond)"],"a":[3],"ch":["4"],"sec":"4.1","fbt":""},{"id":"M-100-2_28","t":"M","y":100,"q":"有些蛋白質係由多條獨立的多肽鏈(或稱蛋白次單元)組合而成，這些次單元在三度空間中的排列方式稱為蛋白質的：","o":["二級結構(Secondary structure)","超二級結構(Supersecondary structure)","三級結構(Tertiary structure)","四級結構(Quaternary structure)"],"a":[3],"ch":["4"],"sec":"4.4","fbt":""},{"id":"M-100-2_29","t":"M","y":100,"q":"膽固醇是下列何種維生素(Vitamin)合成的前驅物？","o":["A","D","E","K"],"a":[1],"ch":["10"],"sec":"10.3","fbt":"Figure 10-19","ex":["維生素 A 來自類胡蘿蔔素。","皮膚的 7-dehydrocholesterol 經紫外線照射轉成維生素 D3，再經肝、腎兩次羥化成活性型。","維生素 E 是生育醇，不由膽固醇合成。","維生素 K 是萘醌類，不由膽固醇合成。"]},{"id":"M-100-2_30","t":"M","y":100,"q":"罕見遺傳疾病Medium-chain acyl-CoA dehydrogenase基因突變，可能造成脂肪肝、低血糖、Octanoic acid在血液中堆積、嗜睡、嘔吐及昏迷。下列有關該酶之功能敘述，何者正確？","o":["該酶之作用是將脂肪酸運入粒線體","該酶作用於ω-oxidation","該酶之作用是將脂肪酸逐步轉化為Pyruvate","該酶之作用是將脂肪酸逐步轉化為Acetyl-CoA"],"a":[3],"ch":["17"],"sec":"17.2","fbt":"","ex":["把脂肪酸運入粒線體的是 carnitine 穿梭系統，不是這個脫氫酶。","ω 氧化在內質網由 P450 進行。","β 氧化的產物是 acetyl-CoA 而非丙酮酸。","MCAD 催化中鏈醯基-CoA 的第一步脫氫，逐輪把脂肪酸切成 acetyl-CoA；缺乏時辛酸堆積、禁食後出現低酮性低血糖與腦病變。"]},{"id":"M-100-2_31","t":"M","y":100,"q":"下列關於Lesch-Nyhan syndrome的敘述，何者錯誤？","o":["先天缺乏Hypoxanthine-guanine phosphoribosyltransferase而導致","無法藉由新合成路徑(De novo pathway)合成鳥糞嘌呤","患病兒童通常在2歲前發病，出現肢體不協調與智能障礙","嚴重者會累積過多的尿酸，造成組織的破壞"],"a":[1],"ch":["22"],"sec":"22.4","fbt":"","ex":["Lesch-Nyhan 正是先天缺乏 HGPRT，敘述正確。","缺的是回收路徑；de novo 路徑因 PRPP 累積反而加速，鳥糞嘌呤仍能從頭合成，故此敘述錯誤。","典型在 2 歲前發病，出現肌張力異常、動作不協調、智能障礙與強迫性自殘，敘述正確。","尿酸大量堆積造成痛風石、腎結石與組織破壞，敘述正確。"]},{"id":"M-100-2_32","t":"M","y":100,"q":"下列有關V(D)J Recombination的敘述，何者錯誤？","o":["參與抗體多樣性的生成","其反應機制與同源重組(Homologous recombination)相似","RAG1參與作用","RAG2參與作用"],"a":[1],"ch":["25"],"sec":"25.3","fbt":""},{"id":"M-100-2_33","t":"M","y":100,"q":"下列何者是原核生物“核苷酸去除修復(Nucleotide excision repair)＂的主要成分？","o":["Ruv A, B, C, D","Uvr A, B, C, D","Rec A, Lex A, Rec BCD","Polymerase α, β, γ, δ"],"a":[1],"ch":["25"],"sec":"25.2","fbt":""},{"id":"M-100-2_34","t":"M","y":100,"q":"有關轉譯之敘述，下列何者錯誤？","o":["每一種t-RNA均只能辨認一種codon","ATG是一種起始codon","UAA是一種終止codon","不需透過特定之t-RNA終止轉譯"],"a":[0,1],"ch":["27"],"sec":"27.1","fbt":"Figure 27-7"},{"id":"M-100-2_35","t":"M","y":100,"q":"有關真核細胞之mRNA之轉錄後修飾，下列敘述何者錯誤？","o":["5’-capping of RNA可以保護mRNA避免5’端被分解","3’ poly A的修飾可以影響RNA之穩定度","Splicing需要snRNA之參與","3’ poly A之修飾完成後，mRNA方能進行splicing"],"a":[3],"ch":["26"],"sec":"26.2","fbt":"Figure 26-18"},{"id":"M-100-2_36","t":"M","y":100,"q":"脊椎動物中，由下列那種酶負責合成18S與28S rRNA？","o":["RNA polymerase I","RNA polymerase II","RNA polymerase III","Ribosomal RNase"],"a":[0],"ch":["26"],"sec":"26.1","fbt":""},{"id":"M-100-2_37","t":"M","y":100,"q":"細胞中，下列那種化合物無法直接參與合成ATP之反應？","o":["1,3-Bisphosphoglycerate","3-Phosphoglycerate","Phosphocreatine","Phosphoenolpyruvate"],"a":[1],"ch":["14"],"sec":"14.1","fbt":"Figure 14-2"},{"id":"M-100-2_38","t":"M","y":100,"q":"病人發生缺氧狀態，例如呼吸衰竭或休克時，會改變葡萄糖的代謝，此時病人抽血檢查中，下列何者濃度會上升？","o":["Acetyl-CoA","Ethanol","Lactate","Acetaldehyde"],"a":[2],"ch":["14"],"sec":"14.3","fbt":""},{"id":"M-100-2_39","t":"M","y":100,"q":"體重過重的病患，若要每周減重半公斤，每天平均約須減多少熱量？","o":["100大卡","250大卡","500大卡","1000大卡"],"a":[2],"ch":["23"],"sec":"23.3","fbt":"Table 23-5","ex":["每天 100 大卡的缺口一週僅約減 0.1 公斤。","250 大卡一週約減 0.25 公斤。","1 公斤體脂肪約含 7700 大卡，半公斤約 3500–3900 大卡；分攤到七天即每天約 500 大卡的熱量赤字 —— 這也是臨床建議「每週減 0.5 公斤」的由來。","1000 大卡的缺口對應每週約減 1 公斤，過於激進。"]},{"id":"M-100-2_40","t":"M","y":100,"q":"肝臟粒線體內HMG-CoA synthase合成酶的主要功能為下列何者？","o":["促進膽固醇合成(Cholesterol biosynthesis)","抑制脂肪酸合成(Fatty acid biosynthesis)","促進酮體合成(Ketone body biosynthesis)","促進糖質新生(Gluconeogenesis)"],"a":[2],"ch":["21"],"sec":"21.4","fbt":"","ex":["促進膽固醇合成的是細胞質型的 HMG-CoA synthase 那一條路。","它不抑制脂肪酸合成。","粒線體型 HMG-CoA synthase 把 acetoacetyl-CoA 與 acetyl-CoA 縮合成 HMG-CoA，再由 HMG-CoA lyase 裂解成 acetoacetate，是肝臟酮體生成的限速步驟。","與糖質新生無關。"]},{"id":"M-100-2_41","t":"M","y":100,"q":"肥胖是脂肪過多的疾病，關於脂肪組織之脂肪代謝，下列敘述何者錯誤？","o":["脂肪組織脂肪分解，釋放出來的脂肪酸，可供給其他組織產生能量","脂肪組織脂肪分解，分解出來的脂肪酸，大部分仍在脂肪組織內合成三酸甘油脂","脂肪組織脂肪分解，釋放出來的脂肪酸可送到肝臟內再合成三酸甘油脂，所以肥胖病患易合併脂肪肝","空腹時，釋放出來的脂肪酸送到肝臟內合成三酸甘油脂，包裝成乳糜微粒(Chylomicron)分泌至血液中"],"a":[3],"ch":["21"],"sec":"21.4","fbt":"Figure 21-40","ex":["脂解釋出的脂肪酸經血中與白蛋白結合運往他處氧化供能，敘述正確。","脂肪組織內確實同時進行分解與再酯化，相當比例的脂肪酸會原地重新合成三酸甘油酯，敘述正確。","大量脂肪酸湧入肝臟再酯化成三酸甘油酯，正是肥胖合併脂肪肝的機轉，敘述正確。","乳糜微粒只由「小腸」分泌，裝載食物來源的脂質；肝臟合成的三酸甘油酯是包裝成 VLDL 分泌，故此敘述錯誤。"]},{"id":"M-100-2_42","t":"M","y":100,"q":"下列營養素何者無法直接提供能量？","o":["醣類","蛋白質","維生素","脂肪"],"a":[2],"ch":["13"],"sec":"","fbt":"Figure 3"},{"id":"M-100-2_43","t":"M","y":100,"q":"一種體染色體顯性(Autosomal dominant)遺傳疾病稱為Familial hyper-cholesterolemia乃是因為Low density lipoprotein(LDL)receptor突變所致。下列有關LDL的敘述，何者正確？","o":["LDL receptor只存在肝細胞上","LDL中的膽固醇經由LDL receptor之作用，可提供肝細胞合成Bile salts","LDL所含的脂肪以Triglyceride為主","LDL是直接由肝臟製造分泌"],"a":[1],"ch":["21"],"sec":"21.4","fbt":"","ex":["LDL 受體廣泛分布於肝臟以外的組織（腎上腺皮質、性腺等），不是只在肝細胞。","肝細胞經 LDL 受體攝入的膽固醇是合成膽汁酸的原料，也是人體排除膽固醇的主要途徑。","LDL 所含脂質以膽固醇與膽固醇酯為主，不是三酸甘油酯。","LDL 是 VLDL 在血中被 LPL 水解、經 IDL 代謝而來，不是肝臟直接分泌。"]},{"id":"M-100-2_44","t":"M","y":100,"q":"下列那一個胺基酸可以代謝成Succinyl-CoA？","o":["Histidine","Alanine","Proline","Valine"],"a":[3],"ch":["14"],"sec":"14.4","fbt":"Table 14-4"},{"id":"M-100-2_47","t":"M","y":100,"q":"當缺氧時，細胞為了避免ROS(Reactive oxygen species)的大量產生，下列那種狀況會發生？","o":["Pyruvate dehydrogenase活性上升","Pyruvate dehydrogenase kinase活性上升","HIF-1(Hypoxia-induced factor-1)表現量下降","HIF-1降解量上升"],"a":[1],"ch":["19"],"sec":"19.3","fbt":"Figure 19-34"},{"id":"M-100-2_48","t":"M","y":100,"q":"下列何者是哺乳動物用來產熱的內生性去偶合劑(Endogenous uncoupling agent)？","o":["2,4-Dinitrophenol","Thermogenin","Thioredoxin","Cytochrome c"],"a":[1],"ch":["19"],"sec":"19.4","fbt":""},{"id":"M-100-2_49","t":"M","y":100,"q":"粒線體電子傳遞鏈的Complex III主要是把電子傳遞到：","o":["Cytochrome c","Succinate","NADH","Ubiquinone"],"a":[0],"ch":["19"],"sec":"19.1","fbt":""},{"id":"M-100-2_50","t":"M","y":100,"q":"常見於癌細胞組織中的腫瘤基因(Oncogene)所轉譯之ErbB蛋白，是經由下列那一個受體(Receptor)的訊息傳導路徑而進行作用？","o":["Insulin receptor","PDGF receptor","EGF receptor","G-protein coupling receptor"],"a":[2],"ch":["12"],"sec":"12.11","fbt":"Figure 12-38","ex":["insulin receptor 不屬 ErbB 家族。","PDGF receptor 是另一個 RTK 家族。","ErbB 就是 EGF 受體家族（ErbB1=EGFR、ErbB2=HER2），在多種癌症過度表現。","ErbB 是受體酪胺酸激酶，不走 GPCR 路徑。"]},{"id":"M-99-1_26","t":"M","y":99,"q":"下列何者不能直接提供人體能量?","o":["麵條","蘋果","維生素C","飲料中之酒精"],"a":[2],"ch":["13"],"sec":"","fbt":"Figure 3"},{"id":"M-99-1_27","t":"M","y":99,"q":"下列關於粒線體(mitochondria)的敘述,何者錯誤?","o":["含有自己的genome","電子傳遞鍊(electron transport system)之基因,全位於mitochondrial genome","mitochondrial genome mutation常造成先天神經肌肉或內分泌疾病","mitochondrial genome mutation通常遺傳自母親"],"a":[1],"ch":["24"],"sec":"24.1","fbt":"","ex":["粒線體有自己的環狀基因體，敘述正確。","電子傳遞鏈的次單元絕大多數由「核」基因編碼、在細胞質合成後再輸入粒線體；mtDNA 只編碼 13 個次單元（加上 2 個 rRNA 與 22 個 tRNA），故此敘述錯誤。","mtDNA 突變常表現為神經肌肉病變（MELAS、MERRF、Leber 視神經病變）或內分泌異常，敘述正確。","受精時精子的粒線體幾乎不進入卵子，所以 mtDNA 呈母系遺傳，敘述正確。"]},{"id":"M-99-1_28","t":"M","y":99,"q":"何種維生素所形成的coenzyme不參與酵素pyruvate dehydrogenase complex的作用?","o":["thiamine","biotin","riboflavin","niacin"],"a":[1],"ch":["16"],"sec":"16.1","fbt":""},{"id":"M-99-1_29","t":"M","y":99,"q":"心絞痛緩解藥物nitroglycerin釋出NO(nitric oxide),啟動訊息傳遞途徑,以放鬆心肌,此過程中不包括下列何種分子?","o":["cGMP","G protein-coupled receptor","protein kinase G","guanylyl cyclase"],"a":[1],"ch":["12"],"sec":"12.6","fbt":"","ex":["cGMP 是這條路的二級訊息，有參與。","NO 不經由任何細胞表面受體 —— 它直接擴散進細胞結合可溶型 guanylyl cyclase，整條路不需要 GPCR。（順帶一提，nitroglycerin 放鬆的主要是血管平滑肌。）","cGMP 活化 protein kinase G，使肌凝蛋白輕鏈去磷酸化而放鬆，有參與。","NO 活化的細胞質可溶型 guanylyl cyclase 就是產生 cGMP 的酵素，有參與。"]},{"id":"M-99-1_30","t":"M","y":99,"q":"肺結核病人常以各種不同藥物一併治療,rifampicin為主要的藥物之一。Rifampicin抑制肺結核桿菌的機轉為抑制下列那一種酶?","o":["去氧核糖核酸聚合酶(DNA polymerase)","細菌核糖核酸聚合酶(bacterial RNA polymerase)","粒線體核糖核酸聚合酶(mitochondrial RNA polymerase)","反轉錄酶(reverse transcriptase)"],"a":[1],"ch":["26"],"sec":"26.1","fbt":""},{"id":"M-99-1_31","t":"M","y":99,"q":"一分子棕櫚醯輔酵素A(palmitoyl-CoA)經過beta-oxidation,完全產生acetyl-CoA須加入多少水分子?","o":["6","7","8","9"],"a":[1],"ch":["17"],"sec":"17.2","fbt":"Figure 17-8","ex":["6 次水解不足以把 16 碳完全切完。","棕櫚醯-CoA（16 碳）需要 7 輪 β 氧化產生 8 個 acetyl-CoA；每一輪的水合步驟（enoyl-CoA hydratase）各用一個水分子，所以共需 7 個水分子（同時產生 7 NADH 與 7 FADH2）。","8 是 acetyl-CoA 的數目，不是循環次數。","9 不符合 16 碳的計算。"]},{"id":"M-99-1_32","t":"M","y":99,"q":"下列何種鹼基不存於一般RNA分子?","o":["腺嘌呤(adenine)","尿嘧啶(uracil)","胞嘧啶(cytosine)","胸腺嘧啶(thymine)"],"a":[3],"ch":["8"],"sec":"8.1","fbt":"Figure 8-4","ex":["腺嘌呤同時存在於 DNA 與 RNA。","尿嘧啶是 RNA 特有的鹼基。","胞嘧啶同時存在於 DNA 與 RNA。","胸腺嘧啶是 DNA 特有的（即 5-甲基尿嘧啶），一般 RNA 不含（tRNA 的修飾鹼基屬例外）。"]},{"id":"M-99-1_33","t":"M","y":99,"q":"下列那個維生素是由膽固醇(cholesterol)所衍生?","o":["維生素A(vitamin A)","維生素D(vitamin D)","維生素E(vitamin E)","維生素K(vitamin K)"],"a":[1],"ch":["21"],"sec":"21.4","fbt":"Figure 21-50","ex":["維生素 A 來自 β-胡蘿蔔素等類胡蘿蔔素。","皮膚中的 7-dehydrocholesterol 經紫外線照射開環成維生素 D3，再經肝、腎兩次羥化成活性型 calcitriol —— 四者中唯一由膽固醇衍生者。","維生素 E（生育醇）來自植物，不是膽固醇衍生物。","維生素 K（萘醌類）不是膽固醇衍生物。"]},{"id":"M-99-1_34","t":"M","y":99,"q":"下列有關inositol 1, 4, 5-triphosphate的敘述,何者正確?","o":["可將G protein磷酸化","可由phospholipase A所催化之反應產生","經由活化之phospholipase C分解產生的second messenger","可活化protein kinase A"],"a":[2],"ch":["12"],"sec":"12.2","fbt":"Figure 12-11","ex":["IP3 不是激酶，不會把 G 蛋白磷酸化。","產生 IP3 的是 phospholipase C，不是 phospholipase A。","活化的 PLC 水解 PIP2，產生 IP3（水溶性，擴散至 ER 釋鈣）與 DAG（留在膜上活化 PKC）。","活化 protein kinase A 的是 cAMP。"]},{"id":"M-99-1_35","t":"M","y":99,"q":"在DNA複製中,下列何酵素功能主要是用以增加DNA複製之準確度?","o":["單股DNA結合蛋白","3’→5’外切核酸酶","DNA連接酶","DNA解螺旋酶"],"a":[1],"ch":["25"],"sec":"25.1","fbt":"Figure 25-7"},{"id":"M-99-1_36","t":"M","y":99,"q":"聚合酶鏈鎖反應(polymerase chain reaction, PCR)為二十世紀最偉大的發明之一。PCR反應早已廣泛應用於醫學及生物研究。PCR反應並不需要下列何種物質?","o":["DNA雙股模板(template)","引子(primer)","去氧核糖核酸聚合酶(DNA polymerase)","反轉錄酶(reverse transcriptase)"],"a":[3],"ch":["8"],"sec":"8.3","fbt":"","ex":["PCR 需要 DNA 模板。","PCR 需要一對引子界定放大區間。","PCR 需要耐熱 DNA 聚合酶。","反轉錄酶只在起始材料是 RNA 的 RT-PCR 才需要，一般 PCR 不需要。"]},{"id":"M-99-1_37","t":"M","y":99,"q":"Tm值是描述雙股DNA有一半的鏈結被打開而成單股時的溫度,下列的敘述,何者錯誤?","o":["Tm值和DNA中的GC含量有關","Tm值和溶液中離子的濃度有關","Tm值和溶液中的pH值無關","Tm值和DNA的長度有關"],"a":[2],"ch":["8"],"sec":"8.3","fbt":"Figure 8-27","ex":["GC 之間有三個氫鍵且堆疊較佳，GC 含量越高 Tm 越高，敘述正確。","離子濃度越高越能中和磷酸骨架的負電排斥，Tm 越高，敘述正確。","極端的 pH 會使鹼基離子化而破壞氫鍵配對，Tm 會下降；說 Tm 與 pH 無關是錯的。","很短的寡核苷酸 Tm 明顯較低（末端效應比例高），Tm 與長度有關，敘述正確。"]},{"id":"M-99-1_38","t":"M","y":99,"q":"下列何種胺基酸為合成甲狀腺素T3& T4的前驅物?","o":["arginine","tryptophan","lysine","tyrosine"],"a":[3],"ch":["23"],"sec":"23.1","fbt":"","ex":["精胺酸是 NO 與尿素的前驅物。","色胺酸是血清素與菸鹼酸的前驅物。","離胺酸不衍生荷爾蒙。","甲狀腺球蛋白上的酪胺酸殘基先碘化成 MIT／DIT，再兩兩偶聯成 T3（MIT+DIT）與 T4（DIT+DIT），所以甲狀腺素是酪胺酸的碘化衍生物。"]},{"id":"M-99-1_39","t":"M","y":99,"q":"下列有關脊椎動物脂肪酸的延長之敘述,何者錯誤?","o":["合成的位置在平滑內質網上","利用malonyl-CoA作為受質","把palmitoyl-CoA延長後變成stearoyl-CoA","methyl-CoA亦可作為其受質"],"a":[3],"ch":["21"],"sec":"21.1","fbt":"","ex":["脂肪酸的延長系統位於平滑內質網（粒線體也有另一套），敘述正確。","延長同樣以 malonyl-CoA 作為二碳供體，敘述正確。","內質網延長系統最典型的反應就是 palmitoyl-CoA（16:0）延長成 stearoyl-CoA（18:0），敘述正確。","沒有「methyl-CoA」這種受質；延長一律靠 malonyl-CoA 提供二碳單位，故此敘述錯誤。"]},{"id":"M-99-1_40","t":"M","y":99,"q":"尿素有兩個氮原子。假如第一個氮原子是從氨來的,第二個氮原子是從下列何者來的?","o":["aspartate","histidine","arginine","ornithine"],"a":[0,2],"ch":["18"],"sec":"18.2","fbt":"Figure 18-10","ex":["第二個氮由天門冬胺酸提供：citrulline 與 aspartate 結合成 argininosuccinate，再裂解釋出 fumarate，氮就留在 arginine 上。","組胺酸不參與尿素循環。","精胺酸是尿素被 arginase 切下前的「攜帶者」，兩個氮此時都已在它身上；官方把 C 一併採計，但追本溯源第二個氮的來源是 aspartate。","鳥胺酸是接受 carbamoyl 基的骨架，本身不提供尿素的氮。"]},{"id":"M-99-1_41","t":"M","y":99,"q":"在DNA複製時,原核細胞的primase之功能為:","o":["合成RNA的引子,做為DNA合成的啟始","填補Okazaki片段間的空隙","作用方向是從3'→5'","有校正功能"],"a":[0],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-99-1_42","t":"M","y":99,"q":"關於葡萄糖-6-磷酸酵素(glucose-6-phosphatase)表現的組織和其在細胞內的分布,下列何者正確?","o":["kidney, plasma membrane","small intestine, cytosol","muscle, plasma membrane","liver, endoplasmic reticulum membrane"],"a":[3],"ch":["14"],"sec":"14.4","fbt":""},{"id":"M-99-1_43","t":"M","y":99,"q":"在粒線體懸浮液中,以琥珀酸(succinate)為受質進行氧化磷酸化反應,此時若加入2,4二硝基苯酚(2,4-dinitrophenol),下列何種情況會發生?","o":["氧氣的消耗會下降","氧氣的消耗會增加","ATP的產生可繼續","氫離子的梯度會維持"],"a":[1],"ch":["19"],"sec":"19.2","fbt":"Figure 19-20"},{"id":"M-99-1_44","t":"M","y":99,"q":"在某一細胞內ATP、ADP、AMP的濃度分別為4mM、2mM、0.2mM,則其能荷(energy charge)值為:","o":["0.81","0.84","0.9","0.93"],"a":[0],"ch":["13"],"sec":"","fbt":"(ATP+1/2ADP)/(ATP+ADP+AMP)"},{"id":"M-99-1_45","t":"M","y":99,"q":"下列有關肌肉的肝醣磷酸化酶(glycogen phosphorylase)的敘述,何者正確?","o":["作用於肝醣(glycogen)的還原端移去葡萄糖分子","將肝醣降解直接產成葡萄糖-6-磷酸(glucose-6-phosphate)","將肝醣的(α1→6)糖苷鍵[(α1→6)glycosidic bond]作水解","以活化型(a型)及非活化型(b型)二種型式存在"],"a":[3],"ch":["15"],"sec":"15.4 15.5","fbt":""},{"id":"M-99-1_46","t":"M","y":99,"q":"下表為某一酵素之受質(substrate)濃度與反應速率分析表,已知此酵素依據米凱利斯-門頓動力學(Michaelis-Menten kinetics)運作,此酵素的KM值約為多少mM? (如圖卡-099-1-2-01)","o":["1.5","3","6","1500"],"a":[1],"ch":["6"],"sec":"6.3","fbt":"Box 6-1"},{"id":"M-99-1_47","t":"M","y":99,"q":"關於脂肪吸收代謝,下列敘述何者錯誤?","o":["腸道吸收後,分泌至血液之乳糜微粒(chylomicron),以含三酸甘油酯(triglyceride)為主","血液中乳糜微粒及極低密度脂蛋白(VLDL)之三酸甘油酯,是經由荷爾蒙敏感脂解酶(hormone-sensitive lipase)所分解","荷爾蒙敏感脂解酶受cAMP之調控","三酸甘油酯分解後,脂肪酸在肌細胞被送至粒線體(mitochondria),生產能量"],"a":[1],"ch":["17"],"sec":"17.1","fbt":"","ex":["乳糜微粒的核心以三酸甘油酯為主，敘述正確。","分解血中乳糜微粒與 VLDL 三酸甘油酯的是微血管內皮表面的「lipoprotein lipase」（由 ApoC-II 活化）；hormone-sensitive lipase 作用的是脂肪細胞「內部」儲存的三酸甘油酯，故此敘述錯誤。","HSL 受 cAMP-PKA 磷酸化而活化，敘述正確。","脂肪酸在肌細胞經 carnitine 穿梭進入粒線體 β 氧化供能，敘述正確。"]},{"id":"M-99-1_48","t":"M","y":99,"q":"胰臟癌中有很高的比例可發現有RAS基因的突變。正常RAS蛋白屬於small G protein家族成員,可在一些receptor tyrosine kinases(RTKs)訊號傳導中活化。常見的致癌RAS突變可造成RAS不受RTK調控而有持續性活化(constitutive activation)。下列敘述何者錯誤?","o":["致癌RAS突變常是造成RAS失去GTPase活性","致癌RAS突變常是造成RAS無法與GTP結合","RTK接受生長因子訊號活化後,是透過guanine exchange factor(GEF)來活化RAS","正常RAS與GTPase activating protein(GAP)結合後,其GTPase活性會提高"],"a":[1],"ch":["12"],"sec":"12.4","fbt":"","ex":["致癌 Ras 突變（G12、Q61）破壞 GTP 水解，等於失去 GTPase 活性，是正確敘述。","致癌 Ras 仍然能結合 GTP ——甚至因為水解不掉而一直停在 GTP 型；說它「無法與 GTP 結合」剛好相反，故錯誤。","RTK 活化後經 Grb2 招募 Sos（一種 GEF）來活化 Ras，正確。","GAP 結合 Ras 後提供催化殘基，使其 GTP 水解速率大幅提高，正確。"]},{"id":"M-99-1_50","t":"M","y":99,"q":"50歲的李太太從年輕時就是胖胖的,最近發現自己居然瘦了一圈,慶幸之餘,卻由健檢得知尿中及空腹時血漿中的葡萄糖過高,醫師判斷她可能罹患了第2型糖尿病(type 2 diabetes)。此型糖尿病患者胰臟仍產生胰島素,但體內細胞會「抵抗」胰島素之作用。胰島素正常作用時不會發生下列何項?","o":["胰島素受體蛋白carboxyl部分之tyrosine residues被磷酸化","insulin receptor substrate-1(IRS-1)被磷酸化,進而活化PI-3 kinase","活化的PI-3 kinase促進PIP3產生,接著使protein kinase B(PKB/AKT)被活化","活化的PKB刺激glucose transporter GLUT4由細胞膜上移入細胞內部,使得細胞無法吸收葡萄糖"],"a":[3],"ch":["12"],"sec":"12.4","fbt":"","ex":["胰島素受體 β 次單元 C 端的 tyrosine 被自我磷酸化，正常會發生。","IRS-1 被磷酸化後以磷酸酪胺酸招募 PI3K，正常會發生。","PI3K 產生 PIP3，招募 PDK1 與 PKB／Akt 並使其活化，正常會發生。","方向相反：活化的 PKB 使含 GLUT4 的囊泡「移到細胞膜」融合，細胞才能吸收葡萄糖；GLUT4 被收回細胞內部是胰島素作用停止時的事，故此項不會發生。"]},{"id":"M-99-1_60","t":"M","y":99,"q":"長期使用phenytoin時會產生軟骨症(osteomalacia),係由於下列那一種維生素代謝異常所造成的?","o":["vitamin B6","vitamin D","vitamin B12","vitamin E"],"a":[1],"ch":["10"],"sec":"10.3","fbt":"","ex":["B6 缺乏造成的是周邊神經病變與小球性貧血，不是軟骨症。","phenytoin 誘導肝臟 CYP450，加速維生素 D 的分解代謝，使活性型不足、鈣吸收下降，長期即出現軟骨症（成人）或佝僂症（兒童）。","B12 缺乏造成巨母紅血球性貧血與神經病變。","維生素 E 缺乏造成溶血與神經病變。"]},{"id":"M-99-2_26","t":"M","y":99,"q":"下列那一個胺基酸不會吸收波長為 280 nm 的紫外光，因此對蛋白質的莫耳吸光係數(molar extinction coefficient)貢獻很小？","o":["苯丙胺酸(phenylalanine)","天冬醯胺(asparagine)","酪胺酸(tyrosine)","色胺酸(tryptophan)"],"a":[1],"ch":["3"],"sec":"3.1","fbt":"Figure 3-6"},{"id":"M-99-2_27","t":"M","y":99,"q":"下列調控酵素活性的方式，何者為不可逆的(irreversible)？","o":["異位調節(allosteric regulation)","共價修飾(covalent modification)","酶原(zymogen)的蛋白水解切割(proteolytic clevage)","非競爭型抑制劑(uncompetitive inhibitor)的結合"],"a":[2],"ch":["6"],"sec":"6.5","fbt":""},{"id":"M-99-2_28","t":"M","y":99,"q":"凝血蛋白之麩胺酸基之 γ-羧化(γ-carboxylation)修飾，需要何種維生素參與？","o":["Vitamin A","Vitamin D","Vitamin E","Vitamin K"],"a":[3],"ch":["10"],"sec":"10.4","fbt":"","ex":["維生素 A 與視覺及基因調控有關。","維生素 D 調節鈣磷恆定。","維生素 E 是抗氧化劑。","維生素 K 是 γ-glutamyl carboxylase 的輔因子，把凝血因子 II、VII、IX、X 與蛋白 C、S 的麩胺酸羧化成 γ-carboxyglutamate，才能螯合鈣並附著於磷脂膜；warfarin 就是抑制維生素 K 的循環再生。"]},{"id":"M-99-2_29","t":"M","y":99,"q":"一位 3 個月大的男嬰自出生後便有成長遲緩現象，理學檢查發現有肌無力癥候。血液檢查發現乳酸 (lactate)、丙酮酸(pyruvate)、丙胺酸(alanine)上升，並有代謝性酸中毒(metabolic acidosis) 現象。根據這些病徵，可優先考慮以何種維生素作為治療？","o":["維生素B6(pyridoxine)","菸鹼酸(niacin)","核黃素(riboflavin)","硫胺(thiamine)"],"a":[3],"ch":["14","16"],"sec":"14.3 16.1","fbt":"Figure 14-15"},{"id":"M-99-2_30","t":"M","y":99,"q":"許多藥物的合成乃是結合分子生物學與合成化學而得，抗愛滋病的藥物 3’-Azido-2’,3’-dideoxythymidine (AZT)即為其中一項，下列關於 AZT 的敘述，何者錯誤？","o":["AZT 由易被 HIV 病毒感染的 T 淋巴球所吸收而轉變為三磷酸根 AZT(AZT triphosphate)","HIV 病毒的反轉錄酶對於 AZT triphosphate 有極高的親和力","HIV 病毒的 DNA 進行複製時若 3’端加入 AZT triphosphate 則會終止複製反應","人類 T 淋巴球的 DNA 複製酶對 AZT triphosphate 有高親和力，所以會帶來許多副作用"],"a":[3],"ch":["26"],"sec":"26.3","fbt":"Box 26-2"},{"id":"M-99-2_31","t":"M","y":99,"q":"核酸去嘌呤作用(depurination of nucleotides)是破壞在連接鹼基(base residues)與核糖(ribose)的 化學鍵。這個化學鍵稱為：","o":["氫鍵(hydrogen bond)","糖苷鍵(N-glycosyl bond)","磷酸二酯鍵(phosphodiester bond)","醯胺鍵(amide bond)"],"a":[1],"ch":["8"],"sec":"8.1","fbt":"","ex":["氫鍵是互補鹼基之間的作用力，不是鹼基與糖的連接鍵。","鹼基的氮與糖的 C1′ 以 N-糖苷鍵相連；去嘌呤就是水解此鍵，留下無鹼基位（AP site）。","磷酸二酯鍵連接相鄰核苷酸的糖，斷裂是骨架斷裂而非去除鹼基。","核酸中沒有這種連接鹼基與糖的醯胺鍵。"]},{"id":"M-99-2_32","t":"M","y":99,"q":"飢餓時，下列何者是增加血糖濃度最重要的酵素？","o":["肌細胞之 glycogen phosphorylase","肝臟細胞之 glycogen phosphorylase","肌細胞之 lactate dehydrogenase","肝臟細胞之 pyruvate kinase"],"a":[1],"ch":["15"],"sec":"15.4","fbt":""},{"id":"M-99-2_33","t":"M","y":99,"q":"在下列何種情況下，acetyl-CoA 進入 citric acid cycle 會減少？","o":["[AMP]/[ATP]高","[ATP]/[ADP]高","[NAD+ ]/[NADH]高","[oxaloacetate]高"],"a":[1],"ch":["16"],"sec":"16.3","fbt":"Figure 16-19"},{"id":"M-99-2_34","t":"M","y":99,"q":"血中腎上腺素(epineprine)濃度上升時會抑制肝臟或肌肉的何種代謝作用？","o":["肝臟的糖解作用(glycolysis)","肌肉的糖解作用","肝臟的葡萄糖新生作用(gluconeogenesis)","肌肉的肝糖分解作用(glycogenolysis)"],"a":[0],"ch":["15"],"sec":"15.5","fbt":"Figure 15-44"},{"id":"M-99-2_35","t":"M","y":99,"q":"下列有關 DNA 複製(DNA replication)的敘述，何者錯誤？","o":["DNA 複製以半保留(semiconservative)模式進行","DNA 複製過程中會產生引導股(leading strand)與落後股(lagging strand)","DNA 合成(DNA synthesis)由 3’往 5’端進行","DNA 複製後，原始模版(parental strand)與新合成模版(newly synthesized strand)兩股以反向平 行(antiparallel)形成雙股結構"],"a":[2],"ch":["25"],"sec":"25.1","fbt":""},{"id":"M-99-2_36","t":"M","y":99,"q":"在人類細胞中，DNA 複製(DNA replication)時是以何種物質為引子(primer)？","o":["DNA","RNA","蛋白質","不需引子"],"a":[1],"ch":["25"],"sec":"25.1","fbt":"Figure 25-5"},{"id":"M-99-2_37","t":"M","y":99,"q":"遺傳性非息肉症大腸直腸癌(hereditary nonpolyposis colon cancer, HNPCC)病患是在何種 DNA 修復 功能上產生缺失？","o":["核苷酸切除修復(nucleotide excision repair)","鹼基切除修復(base excision repair)","重組修復(recombinational repair)","核酸錯誤配對修復(mismatch repair)"],"a":[3],"ch":["25"],"sec":"25.2","fbt":"Box 25-1"},{"id":"M-99-2_38","t":"M","y":99,"q":"遺傳密碼(codon)與反密碼(anticodon)的相互作用是經由那一種化學鍵來進行？","o":["氫鍵(hydrogen bond)","離子鍵(ionic bond)","肽鍵(peptide bond)","縮醛鍵(acetal bond)"],"a":[0],"ch":["27"],"sec":"27.1","fbt":"Figure 27-8"},{"id":"M-99-2_39","t":"M","y":99,"q":"下列那一序列會調控真核 mRNA 進行核內 polyadenylation？","o":["UUAUUU","UUUUUAU","UAUUUUU","AAUAAA"],"a":[3],"ch":["26"],"sec":"26.2","fbt":"Figure 26-17"},{"id":"M-99-2_40","t":"M","y":99,"q":"下列那一個激素無法促進脂肪細胞(adipocyte)內脂肪的代謝以產生 ATP？","o":["Insulin","Glucagon","Epinephrine","Glucocorticoids"],"a":[0],"ch":["23"],"sec":"23.3","fbt":"Table 23-4","ex":["胰島素代表飽食狀態，使 hormone-sensitive lipase 去磷酸化而失活，是唯一「抑制」脂解的選項。","升糖素經 cAMP-PKA 活化 HSL。","腎上腺素經 β 受體活化 cAMP-PKA。","糖皮質素提高脂解相關酵素的表現，促進脂肪動員。"]},{"id":"M-99-2_41","t":"M","y":99,"q":"下列有關 eicosanoids 的敘述，何者正確？","o":["Eicosanoids 是屬於 autocrine 的激素","Eicosanoid family 中的前列腺素(prostaglandin)主要作用是促進子宮平滑肌之放鬆","Eicosanoid family 中的 thromboxanes 主要影響血液凝集功能(blood clotting)","Eicosanoids 之半生期(half-life)長達 1 年"],"a":[0,2],"ch":["23"],"sec":"23.1","fbt":"","ex":["eicosanoid 不經血流運送，作用於自己或鄰近細胞，屬自分泌／旁分泌，敘述正確。","前列腺素（PGE2、PGF2α）對子宮平滑肌主要是「收縮」作用，臨床用於引產與產後止血，故此敘述錯誤。","血栓素 TXA2 由血小板產生，促進血小板聚集與血管收縮，主導止血，敘述正確。","eicosanoid 極不穩定，半衰期只有數秒到數分鐘，絕非一年，故此敘述錯誤。"]},{"id":"M-99-2_42","t":"M","y":99,"q":"下列關於脂蛋白(lipoprotein)的敘述，何者錯誤？","o":["脂蛋白含脂質與蛋白質，它負責運送膽固醇(cholesterol)、磷脂質(phospholipid)與三酸甘油脂 (triacylglycerol)到各組織器官","ApoC-II 會促進血液中三酸甘油脂之分解","含蛋白質量最多的脂蛋白是高密度脂蛋白(HDL, high density lipoprotein)","運送肝臟細胞所合成的三酸甘油脂到周邊組織的脂蛋白為乳糜微粒(chylomicrons)"],"a":[3],"ch":["21"],"sec":"21.4","fbt":"","ex":["脂蛋白負責把疏水的脂質在血中運往各組織，敘述正確。","ApoC-II 活化 lipoprotein lipase，促進三酸甘油酯水解，敘述正確。","HDL 蛋白質比例最高、密度最大，敘述正確。","運送肝臟自行合成的三酸甘油酯到周邊的是 VLDL；乳糜微粒運的是小腸吸收的食物脂質，故此敘述錯誤。"]},{"id":"M-99-2_43","t":"M","y":99,"q":"一位工人被送至急診，懷疑不慎接觸到氰化物導致中毒(cyanide poisoning)。下列有關氰化物中毒 之敘述，何者正確？","o":["吸入氰化物氣體不易中毒，因肺組織有大量的解毒系統","氰化物會與細胞色素C氧化酶(cytochrome c oxidase)中之血紅素a3(heme a3)的Fe3+牢牢結合，造 成電子無法傳遞、粒線體呼吸及能量產生因而停止，造成細胞死亡","解毒劑如亞硝酸鈉(sodium nitrite)是將變性血紅素蛋白(methemoglobin)轉化為氧化血紅素蛋 白(oxyhemoglobin)","神經系統不會受到影響"],"a":[1],"ch":["19"],"sec":"19.1","fbt":"Figure 19-6"},{"id":"M-99-2_44","t":"M","y":99,"q":"下列何者為粒線體電子傳遞鏈 Complex II 的 electron donor？","o":["NADH","Succinate","NADPH","Ubiquinone"],"a":[1],"ch":["19"],"sec":"19.1","fbt":"Figure 19-9"},{"id":"M-99-2_45","t":"M","y":99,"q":"有關呼吸鏈之化學滲透理論(chemiosmotic theory)，下列敘述何者正確？","o":["氧化磷酸化在粒線體外膜進行","粒線體內膜之內外側質子(protons)的濃度相同","ATP synthase 在 chemiosmotic theory 沒有重要性","ATP 的合成與質子移動力(proton-motive force)有關"],"a":[3],"ch":["19"],"sec":"19.1","fbt":""},{"id":"M-99-2_46","t":"M","y":99,"q":"下列那一個酵素位於粒線體電子傳遞鏈的 Complex IV？","o":["NADH dehydrogenase","Cytochrome oxidase","Succinate dehydrogenase","Uniquinone:cytochrome c oxidoreductase"],"a":[1],"ch":["19"],"sec":"19.1","fbt":""},{"id":"M-99-2_47","t":"M","y":99,"q":"Amino group 可藉由下列何種方式，由骨骼肌細胞運送到肝細胞代謝？","o":["Krebs cycle","Glucose-alanine cycle","Urea cycle","Citric acid cycle"],"a":[1],"ch":["18"],"sec":"18.1","fbt":"Figure 18-9","ex":["Krebs cycle 是粒線體內的中央代謝，不負責組織間運送胺基。","骨骼肌把胺基轉給丙酮酸生成丙胺酸，隨血流送到肝臟，肝再取回胺基做尿素、把丙酮酸做成葡萄糖送回肌肉。","尿素循環只發生在肝細胞內，不是運送方式。","citric acid cycle 即 Krebs cycle，同樣不是運送途徑。"]},{"id":"M-99-2_48","t":"M","y":99,"q":"下列那個胺基酸的代謝異常，最常導致白化症(Albinism)？","o":["離胺酸(lysine)","精胺酸(arginine)","色胺酸(tryptophan)","酪胺酸(tyrosine)"],"a":[3],"ch":["18"],"sec":"18.3","fbt":"Table 18-2","ex":["離胺酸代謝異常與色素無關。","精胺酸代謝異常影響尿素循環。","色胺酸代謝異常影響血清素與菸鹼酸。","黑色素由酪胺酸經 tyrosinase 合成，此酵素或酪胺酸代謝異常即造成白化症。"]},{"id":"M-99-2_49","t":"M","y":99,"q":"胰島素(insulin)是身體控制血糖最重要的激素，給糖尿病患注射胰島素主要會發生下列何項反應？","o":["使 insulin receptor dimerization","Insulin receptor 磷酸化其受質，如 IRS-1","抑制 protein kinase C","抑制 protein kinase G"],"a":[1],"ch":["12"],"sec":"12.4","fbt":"Figure 12-19","ex":["胰島素受體在未結合配體前就已是以雙硫鍵連接的 α2β2 四聚體，不需要配體誘導二聚化。","胰島素結合後受體自我磷酸化，再磷酸化 IRS-1 等受質，開啟 PI3K-Akt 與 MAPK 下游，這是主要反應。","胰島素的主要作用不是抑制 PKC（某些 PKC 異構物反而與胰島素抗性有關）。","與 protein kinase G 無關。"]},{"id":"M-98-1_19","t":"M","y":98,"q":"甲狀腺素是由那一種胺基酸轉變而成？","o":["白胺酸(leucine)","酪胺酸(tyrosine)","甘胺酸(glycine)","絲胺酸(serine)"],"a":[1],"ch":["23"],"sec":"23.1","fbt":"","ex":["白胺酸不衍生荷爾蒙。","甲狀腺球蛋白上的酪胺酸殘基碘化後偶聯成 T3 與 T4，所以甲狀腺素由酪胺酸轉變而來（同一個胺基酸也衍生兒茶酚胺與黑色素）。","甘胺酸是血基質、嘌呤與肌酸的前驅物。","絲胺酸提供一碳單位，不衍生甲狀腺素。"]},{"id":"M-98-1_26","t":"M","y":98,"q":"下面 E. coli 那一個酵素，其人類同源(homologous)基因是屬於抑癌基因？","o":["DNA 聚合酶Ⅲ","修護酶 Mut S","RNA 聚合酶","解螺旋酶(helicase)"],"a":[1],"ch":["25"],"sec":"25.2","fbt":""},{"id":"M-98-1_28","t":"M","y":98,"q":"葡萄糖進行醣解反應(glycolysis)之終產物為 pyruvate，當病人發生休克(shock)而組織缺氧時(hypoxia)，抽血檢驗下列何種 pyruvate 下游產物濃度會上升？","o":["ethanol","acetyl-CoA","lactate","ATP"],"a":[2],"ch":["14"],"sec":"14.1","fbt":"Figure 14-4"},{"id":"M-98-1_29","t":"M","y":98,"q":"下面那一個真核細胞中蛋白質複合物，同時參與 RNA 轉錄及 DNA 修復功能？","o":["TFIIA","TFIID","TFIIF","TFIIH"],"a":[3],"ch":["26"],"sec":"26.1","fbt":""},{"id":"M-98-1_32","t":"M","y":98,"q":"當一基因的 3’ untranslated region(3’ UTR)的 AATAAA 突變為 AAGAAA 時，其導致的缺陷為影響核糖核酸(RNA)合成後的那一步驟？","o":["端帽步驟(capping)","多聚腺苷化作用(polyadenylation)","剪接作用(splicing)","運輸(transport)"],"a":[1],"ch":["26"],"sec":"26.2","fbt":""},{"id":"M-98-1_34","t":"M","y":98,"q":"競爭型抑制劑(competitive inhibitor)會對酵素催化反應之動力學參數，產生何種影響？","o":["Vmax降低","Km值降低","Vmax／Km值降低","Km值不變"],"a":[2],"ch":["6"],"sec":"6.3","fbt":"Box 6-2"},{"id":"M-98-1_35","t":"M","y":98,"q":"血紅蛋白(Hemoglobin)其構形由 T 轉變成 R 型是由於結合了下列那些物質所引起？","o":["氧氣(O2)","三價鐵(Fe3+)","次單元之結合(subunit association)","次單元之解離(subunit dissociation)"],"a":[0],"ch":["5"],"sec":"5.1","fbt":"Figure 5-11"},{"id":"M-98-1_36","t":"M","y":98,"q":"眼睛視網膜(retina)的細胞吸收光線時會導致：","o":["β 胡蘿蔔素(β-carotene)轉變成視黃醛(retinal)","視黃醛(retinal)轉變成視黃醇(retinol)","順式視黃醛(cis-retinal)轉變成全反式視黃醛(all-trans-retinal)","全反式視黃醛(all-trans-retinal)轉變成順式視黃醛(cis-retinal)"],"a":[2],"ch":["12"],"sec":"12.3","fbt":"Figure 12-14","ex":["β-carotene 裂解成 retinal 發生在腸道的代謝，不是視網膜吸光事件。","retinal 還原成 retinol 是視覺循環中的代謝步驟，不是吸光瞬間的反應。","光使 rhodopsin 上的 11-cis-retinal 異構化成 all-trans-retinal，造成受體構型改變並活化 transducin，這是光傳導的起點。","all-trans 回復成 11-cis 是在暗處由視覺循環的酵素完成（再生），不是吸收光線時發生。"]},{"id":"M-98-1_37","t":"M","y":98,"q":"假設分析某生物體的基因體實驗中發現，核酸中的 adenine 含量約為 20%，則此基因體的 guanine 含量為何？","o":["0.1","0.2","0.3","0.4"],"a":[2],"ch":["8"],"sec":"8.2","fbt":"","ex":["10% 不符 Chargaff 法則的計算。","20% 是腺嘌呤本身的比例，不是鳥糞嘌呤。","A = 20% 則 T = 20%，兩者合計 40%，剩下 60% 由 G 與 C 均分，故 G ≈ 30%。","40% 會使總和超過 100%。"]},{"id":"M-98-1_38","t":"M","y":98,"q":"DNA 複製時常有鹼基錯誤配對發生在新合成股上，細胞中有錯誤配對修復(mismatch repair)的機制，可除去含有錯誤配對的新合成股(newly synthesized DNA strand)，下列何者為此作用的主要酵素？","o":["DNA 聚合酶(polymerase β, γ), DNA 接合酶(ligase)校對系統","Rec A, Rec F, Rec O, Rec R, SSB 複製系統","Umu C, Umu D 強制複製(error-prone replication)系統","Mut H, L, S 複合物辨認系統"],"a":[3],"ch":["25"],"sec":"25.2","fbt":""},{"id":"M-98-1_39","t":"M","y":98,"q":"下列酵素參與由無機物的氮(Inorganic nitrogen)轉變為有機分子(Organic molecule)，何者為非？","o":["Arginase","Glutamate dehydrogenase","Glutamine synthetase","Nitrogenase"],"a":[0],"ch":["22"],"sec":"22.1","fbt":"","ex":["arginase 把 arginine 水解成 ornithine 與尿素，是把氮「排掉」的最後一步，不是把無機氮併入有機分子，故為非。","glutamate dehydrogenase 把 NH3 併入 α-ketoglutarate 生成 glutamate，是氨同化的入口。","glutamine synthetase 把 NH3 接到 glutamate 上生成 glutamine，也是氨同化。","nitrogenase 把大氣 N2 還原成 NH3，是固氮的第一步。"]},{"id":"M-98-1_40","t":"M","y":98,"q":"醣蛋白質(Glycoproteins)分子中，下列何種胺基酸可和糖基的部分(carbohydrate moiety)作共價鍵結合？","o":["天門冬素(asparagine)","天門冬酸(aspartic acid)","麩胺酸(glutamic acid)","半胱胺酸(cysteine)"],"a":[0],"ch":["7"],"sec":"7.3","fbt":"Figure 7-30"},{"id":"M-98-1_41","t":"M","y":98,"q":"Alkaptonuria 與下列何種酵素缺陷有關？","o":["Branched-chain α-keto acid dehydrogenase complex","Homogentisic acid dioxygenase","Alanine transaminase","Glutamine amidotransferase"],"a":[1],"ch":["18"],"sec":"18.3","fbt":"Figure 18-23","ex":["支鏈 α-酮酸脫氫酶複合體缺陷是楓糖尿症。","黑尿症（alkaptonuria）是酪胺酸分解路徑上的 homogentisic acid dioxygenase 缺陷，尿黑酸堆積，尿液放置後氧化變黑，長期沉積軟骨造成褐黃病與關節炎。","丙胺酸轉胺酶缺陷不造成黑尿症。","glutamine amidotransferase 屬核苷酸合成，與此無關。"]},{"id":"M-98-1_42","t":"M","y":98,"q":"下列何者可用於裂解一個蛋白質，決定其內含之胺基酸成分：","o":["6 N HCl","8 N NaOH","8 M urea","6 M guanidine HCl"],"a":[0],"ch":["3"],"sec":"3.4","fbt":"Figure 3-25"},{"id":"M-98-1_44","t":"M","y":98,"q":"過氧化物酵素體(peroxisome)可進行脂肪酸的 beta-oxidation，但分解至下列何者即不再繼續進行？","o":["hexanoyl CoA","octanoyl CoA","decanoyl CoA","dodecanoyl CoA"],"a":[1],"ch":["17"],"sec":"","fbt":"","ex":["六碳的 hexanoyl-CoA 已經比轉送點更短。","過氧化體負責把「極長鏈」脂肪酸先行縮短，一般縮到八碳的 octanoyl-CoA 就停止，再以 carnitine 形式轉送到粒線體完成氧化。Zellweger 症候群因過氧化體缺陷而使極長鏈脂肪酸堆積。","十碳仍在過氧化體的處理範圍內，不是停點。","十二碳仍在處理範圍內。"]},{"id":"M-98-1_45","t":"M","y":98,"q":"下列有關視網膜細胞瘤調控蛋白(retinoblastoma protein)的敘述，何者正確？","o":["可結合 E2F 轉錄因子，影響基因轉錄","可促進 Rhodopsin kinase 之活化","其激酶(Kinase)活性，可經由磷酸後被活化","為一個致癌基因"],"a":[0],"ch":["12"],"sec":"","fbt":"","ex":["pRb 結合 E2F 轉錄因子並把它關住，阻止 S 期基因轉錄；被 CDK 磷酸化後才釋出 E2F。","pRb 與 rhodopsin kinase 無關（別被名字裡的 retino- 誤導）。","pRb 本身沒有激酶活性；它是「被」CDK 磷酸化，而且磷酸化讓它失去抑制功能而非被活化。","Rb 是腫瘤抑制基因，兩個 copy 都失去功能才成瘤。"]},{"id":"M-98-1_46","t":"M","y":98,"q":"訊息傳遞之去敏感化(desensitization)在腎上腺素(epinephrine)的例子是經由？","o":["對腎上腺素受體進行磷酸化","對腎上腺素受體進行去磷酸化","開放鉀離子通道","開放鈉離子通道"],"a":[0],"ch":["12"],"sec":"12.1","fbt":"","ex":["腎上腺素長時間刺激後，β 受體被 β-adrenergic receptor kinase（GRK）磷酸化，進而結合 β-arrestin 阻斷與 Gs 的耦合並促成內噬，這就是去敏化。","去磷酸化是恢復敏感性的過程，方向相反。","鉀離子通道開放與 β 受體去敏化無關。","鈉離子通道開放與 β 受體去敏化無關。"]},{"id":"M-98-1_47","t":"M","y":98,"q":"在呼吸鏈(respiratory chain)中，下列何種 enzyme complex 含有銅離子參與其電子的傳遞？","o":["NADH-Q oxidoreductase","succinate-Q reductase","Q-cytochrome c oxidoreductase","cytochrome c oxidase"],"a":[3],"ch":["19"],"sec":"19.1","fbt":"Figure 19-13"},{"id":"M-98-1_48","t":"M","y":98,"q":"下列有關自由能變化(∆G)的敘述中何者正確？","o":["當 K'eq 大於 1 時，∆G'o小於 0","當 K'eq 小於 1 時，∆G'o小於 0","當 K'eq 等於 1 時，∆G'o等於 1","對任一反應而言，∆G'o為一常數"],"a":[0],"ch":["13"],"sec":"13.1","fbt":"Table 13-3"},{"id":"M-98-1_50","t":"M","y":98,"q":"有關人類肝臟細胞的葡萄糖生成作用(gluconeogenesis)，下列敘述何者正確？","o":["完全由醣解作用(glycolysis)的酵素所催化的逆反應來執行","可幫助在高糖飲食之後使血糖值下降","對於脂肪酸轉變成為葡萄糖為必須的","可利用一些胺基酸將其轉變成為葡萄糖"],"a":[3],"ch":["14"],"sec":"14.4","fbt":"Figure 14-16"},{"id":"M-98-1_88","t":"M","y":98,"q":"58 歲男性，有酒精成癮症及鬱血性心臟衰竭，過去幾個月覺得神智不清、失去方向感、行動困難，就醫時理學檢查有眼球顫動、步態失調、下肢感覺神經變差，實驗檢查血紅素及各血球數大致正常。請問該病人最有可能長期缺乏下列何種營養素所引起？","o":["菸鹼酸","維他命 B6","葉酸","維他命 B1"],"a":[3],"ch":["14"],"sec":"14.3","fbt":"Figure 14-15"},{"id":"M-98-2_2","t":"M","y":98,"q":"精子的生成過程(spermatogenesis)需經過減數分裂(meiosis)。有關減數分裂的敘述，下列何者最
